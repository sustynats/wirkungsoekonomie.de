<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1500" viewBox="0 0 900 1500" role="img" aria-labelledby="title desc">
  <title id="title">Wirkungsorientierte Unternehmensführung mobile</title>
  <desc id="desc">Mobile Modellgrafik der wirkungsorientierten Unternehmensführung mit Maßstabswechsel, Mitarbeitenden, Ressourcen, Kreislauffähigkeit, Change-Prozess und Rückkopplung. ESG ist Nebenprodukt der Wirkungssteuerung.</desc>
  <defs>
    <style>
      .bg{fill:#f7f4ec}.paper{fill:#fbfaf6}.navy{fill:#0b1b36}.green{fill:#2d7f5f}.gold{fill:#c9932e}.coral{fill:#c95749}.muted{fill:#3d4656}.line{stroke:#d7d0c1;stroke-width:2;fill:none}.oline{stroke:#c9932e;stroke-width:2.4;fill:none}.card{fill:rgba(255,255,255,.62);stroke:#d7d0c1;stroke-width:2}.softn{fill:#edf1f7;stroke:#0b1b36;stroke-width:2}.softg{fill:#eaf3ee;stroke:#2d7f5f;stroke-width:2}.softo{fill:#f6edda;stroke:#c9932e;stroke-width:2}.softc{fill:#f6e5e1;stroke:#c95749;stroke-width:2}.title{font-family:Georgia,'Times New Roman',serif;font-size:38px;font-weight:700;letter-spacing:2px}.subtitle{font-family:Georgia,'Times New Roman',serif;font-size:22px}.kicker{font-family:Inter,Arial,sans-serif;font-size:14px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase}.h{font-family:Inter,Arial,sans-serif;font-size:22px;font-weight:800}.body{font-family:Inter,Arial,sans-serif;font-size:17px}.small{font-family:Inter,Arial,sans-serif;font-size:15px}.num{font-family:Georgia,'Times New Roman',serif;font-size:32px;font-weight:700}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#c9932e"/></marker>
  </defs>
  <rect class="bg" width="900" height="1500"/>
  <rect x="24" y="24" width="852" height="1452" rx="22" class="paper" stroke="#d7d0c1" stroke-width="2"/>
  <text x="450" y="78" class="title navy" text-anchor="middle">WIRKUNGSORIENTIERTE</text>
  <text x="450" y="124" class="title navy" text-anchor="middle">UNTERNEHMENSFÜHRUNG</text>
  <text x="450" y="162" class="subtitle gold" text-anchor="middle">Vom Zielmanagement zur Wirkungssteuerung</text>
  <line x1="80" y1="194" x2="820" y2="194" class="line"/>

  <rect x="80" y="235" width="740" height="118" rx="18" class="softc"/>
  <text x="110" y="275" class="kicker coral">Alte Steuerung</text>
  <text x="110" y="313" class="body muted">Umsatz · Marge · KPI · Effizienz · Bericht</text>
  <line x1="450" y1="356" x2="450" y2="400" class="oline" marker-end="url(#arrow)"/>
  <rect x="80" y="410" width="740" height="138" rx="18" class="softg"/>
  <text x="110" y="450" class="kicker green">WÖk-Referenz</text>
  <text x="110" y="488" class="h navy">Wirkung als tatsächliche Zustandsveränderung</text>
  <text x="110" y="522" class="small muted">Mensch · Planet · Demokratie · positive Netto-Wirkung</text>
  <line x1="450" y1="552" x2="450" y2="596" class="oline" marker-end="url(#arrow)"/>
  <rect x="80" y="606" width="740" height="132" rx="18" class="softn"/>
  <text x="110" y="646" class="kicker navy">Neue Führung</text>
  <text x="110" y="684" class="body muted">Mitarbeitende · Ressourcen · C2C · Kapital · Kultur</text>
  <text x="110" y="712" class="small muted">Gewinn bleibt Ergebnis tragfähiger Wirkung.</text>

  <text x="450" y="808" class="kicker navy" text-anchor="middle">Change-Prozess</text>
  <rect x="80" y="840" width="740" height="78" rx="16" class="softn"/><text x="110" y="889" class="num navy">1</text><text x="165" y="888" class="h navy">Maßstab klären</text>
  <rect x="80" y="934" width="740" height="78" rx="16" class="softg"/><text x="110" y="983" class="num green">2</text><text x="165" y="982" class="h navy">Wirkungspfade lesen</text>
  <rect x="80" y="1028" width="740" height="78" rx="16" class="softo"/><text x="110" y="1077" class="num gold">3</text><text x="165" y="1076" class="h navy">Mitarbeitende und Kultur einbeziehen</text>
  <rect x="80" y="1122" width="740" height="78" rx="16" class="softn"/><text x="110" y="1171" class="num navy">4</text><text x="165" y="1170" class="h navy">Ressourcen · C2C · Wertschöpfung</text>
  <rect x="80" y="1216" width="740" height="78" rx="16" class="softc"/><text x="110" y="1265" class="num coral">5</text><text x="165" y="1264" class="h navy">Daten · WÖk-ID · Wirkungslast</text>
  <rect x="80" y="1310" width="740" height="78" rx="16" class="softg"/><text x="110" y="1359" class="num green">6</text><text x="165" y="1358" class="h navy">Führung · Change · Rückkopplung</text>
  <rect x="80" y="1404" width="740" height="58" rx="16" class="card"/>
  <text x="450" y="1440" class="small navy" text-anchor="middle">ESG ist Nebenprodukt von resilienter Wirkungssteuerung.</text>
</svg>
