<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1058" viewBox="0 0 900 1058" role="img" aria-labelledby="title desc">
  <title id="title">REVERSE MERIT ORDER</title>
  <desc id="desc">Das schwächste kritische Feld entscheidet</desc>
  <defs>
    <style>
.bg{fill:#F7F4EC}.navy{fill:#0B1B36}.green{fill:#2D7F5F}.gold{fill:#C9932E}.coral{fill:#C95749}.text{fill:#2E333C}
.line{stroke:#D7D0C1;stroke-width:2;fill:none}.nline{stroke:#0B1B36;stroke-width:2.3;fill:none}.gline{stroke:#2D7F5F;stroke-width:2.3;fill:none}.oline{stroke:#C9932E;stroke-width:2.3;fill:none}.cline{stroke:#C95749;stroke-width:2.3;fill:none}
.card{fill:#fffdfa;stroke:#D7D0C1;stroke-width:2}.softn{fill:#EEF2F7;stroke:#0B1B36;stroke-width:2}.softg{fill:#EAF3EE;stroke:#2D7F5F;stroke-width:2}.softo{fill:#F7EEDC;stroke:#C9932E;stroke-width:2}.softc{fill:#F7E6E2;stroke:#C95749;stroke-width:2}
.title{font-family:Georgia,'Times New Roman',serif;font-size:54px;font-weight:700;letter-spacing:3.2px}.subtitle{font-family:Georgia,'Times New Roman',serif;font-size:28px;letter-spacing:.8px}
.kicker{font-family:Inter,Arial,sans-serif;font-size:15px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase}.h{font-family:Inter,Arial,sans-serif;font-size:23px;font-weight:800}.body{font-family:Inter,Arial,sans-serif;font-size:17px}.small{font-family:Inter,Arial,sans-serif;font-size:14px}.num{font-family:Georgia,'Times New Roman',serif;font-size:32px;font-weight:700}
</style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#C9932E"/></marker>
  </defs>
  <rect class="bg" width="900" height="1058"/>
  <rect x="28" y="28" width="844" height="1002" rx="18" fill="none" stroke="#D7D0C1" stroke-width="2"/>
  <text x="450" y="74" class="title navy" text-anchor="middle">REVERSE MERIT ORDER</text>
<text x="450" y="116" class="subtitle gold" text-anchor="middle">Das schwächste kritische Feld entscheidet</text>
<line x1="70" y1="146" x2="830" y2="146" class="line"/>
<rect x="74" y="190" width="752" height="120" rx="18" class="softg"/>
<text x="108" y="234" class="num green">1</text>
<text x="160" y="234" class="h navy">Mensch</text>
<text x="160" y="268" class="small text">Gesundheit, Arbeit, Würde und Teilhabe dürfen nicht verdeckt</text>
<text x="160" y="288" class="small text">werden.</text>
<rect x="74" y="332" width="752" height="120" rx="18" class="softg"/>
<text x="108" y="376" class="num green">2</text>
<text x="160" y="376" class="h navy">Planet</text>
<text x="160" y="410" class="small text">Klima, Ressourcen, Biodiversität und Regeneration bleiben eigene</text>
<text x="160" y="430" class="small text">Grenzen.</text>
<rect x="74" y="474" width="752" height="120" rx="18" class="softo"/>
<text x="108" y="518" class="num gold">3</text>
<text x="160" y="518" class="h navy">Demokratie</text>
<text x="160" y="552" class="small text">Vertrauen, Rechtsstaat und Diskursfähigkeit sind Schutzräume.</text>
<rect x="74" y="616" width="752" height="120" rx="18" class="softc"/>
<text x="108" y="660" class="num coral">4</text>
<text x="160" y="660" class="h navy">Schutzregel</text>
<text x="160" y="694" class="small text">Gute Einzelwerte dürfen kritische Schäden nicht überdecken.</text>
<rect x="74" y="758" width="752" height="120" rx="18" class="softc"/>
<text x="108" y="802" class="num coral">5</text>
<text x="160" y="802" class="h navy">Keine Kompensation</text>
<text x="160" y="836" class="small text">Kritische Schäden werden nicht durch andere Pluspunkte</text>
<text x="160" y="856" class="small text">ausgeglichen.</text>
<rect x="74" y="916" width="752" height="102" rx="18" class="card"/>
<text x="108" y="958" class="small navy">Die Gesamtbewertung folgt nicht dem Durchschnitt, sondern dem</text>
<text x="108" y="979" class="small navy">schwächsten kritischen Wirkungsfeld.</text>
</svg>
