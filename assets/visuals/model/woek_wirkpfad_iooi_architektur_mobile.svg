<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 2530" width="440" height="2530" role="img" aria-labelledby="title desc" lang="de">
<title id="title">IOOI als Linse im Wirkpfad: WÖk-Wirkungsarchitektur - mobile Schichtenansicht</title>
<desc id="desc">Im Rahmen von Governance und Lernen liegt ein möglicher oder beobachteter Wirkpfad. IOOI ordnet einen Abschnitt als Input, optionale Aktivität, Output, Outcome und Impact. Quer dazu liegen Ex-ante-Hypothesen, Evidenz und Zurechnung, Bewertung und Schutz sowie die System- und Transformationsprüfung. Diese Ebenen sind keine zeitlichen Stationen. Transformationswirkung ist keine automatische Stufe nach Impact. Rückkopplung führt Erkenntnisse in neue Entscheidungen zurück.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2D7F5F"/></marker></defs>
<rect width="440" height="2530" fill="#F7F4EC"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#0B1B36"><rect x="12" y="12" width="416" height="2506" rx="16" fill="#F7F4EC" stroke="#2D7F5F" stroke-width="2"/><text x="30" y="50" font-size="24" font-weight="700"><tspan x="30" dy="0">WÖk-Wirkungsarchitektur</tspan></text><text x="30" y="82" font-size="18"><tspan x="30" dy="0">Governance · Transparenz · Lernen</tspan><tspan x="30" dy="25.2">Versionierung · Audit / Assurance</tspan><tspan x="30" dy="25.2">Rechtsschutz</tspan></text><rect x="32" y="167" width="370" height="200" rx="16" fill="#F6EBD5" stroke="#C9932E" stroke-width="2" stroke-dasharray="6 4"/><text x="48" y="198" font-size="21" font-weight="700"><tspan x="48" dy="0">EX ANTE / HYPOTHESEN</tspan></text><text x="48" y="230" font-size="18"><tspan x="48" dy="0">Was könnte passieren - und warum?</tspan><tspan x="48" dy="25.2">Potenzial · Risiko · Hypothesen</tspan><tspan x="48" dy="25.2">Mechanismen · Bedingungen</tspan><tspan x="48" dy="25.2">Annahmen · Szenarien</tspan><tspan x="48" dy="25.2">Keine Stationen einer Kausalkette.</tspan></text><path d="M100 367v24 M310 367v24" stroke="#997022" stroke-dasharray="6 4" stroke-width="2"/><rect x="32" y="391" width="370" height="654" rx="16" fill="#fff" stroke="#2D7F5F" stroke-width="2"/><text x="48" y="425" font-size="20" font-weight="700"><tspan x="48" dy="0">REALER / MODELLIERTER PFAD</tspan></text><text x="48" y="456" font-size="18"><tspan x="48" dy="0">Plausibel oder beobachtet,</tspan><tspan x="48" dy="25.2">kein Kausalbeweis.</tspan></text><path d="M51 510V818" stroke="#2D7F5F" stroke-width="2" marker-end="url(#arrow)"/><text x="67" y="523" font-size="17"><tspan x="67" dy="0">Ausgangslage &amp; Kontext</tspan></text><text x="67" y="565" font-size="17"><tspan x="67" dy="0">Auslöser / Handlung / Unterlassen</tspan></text><text x="67" y="607" font-size="17"><tspan x="67" dy="0">Wirkmechanismus + Bedingungen</tspan></text><text x="67" y="649" font-size="17"><tspan x="67" dy="0">Aktivität / Intervention</tspan></text><text x="67" y="691" font-size="17"><tspan x="67" dy="0">unmittelbare Leistung</tspan></text><text x="67" y="733" font-size="17"><tspan x="67" dy="0">Zustandsveränderung</tspan></text><text x="67" y="775" font-size="17"><tspan x="67" dy="0">Folge- / Systemwirkungen</tspan></text><text x="67" y="817" font-size="17"><tspan x="67" dy="0">neuer Systemzustand</tspan></text><rect x="48" y="862" width="338" height="166" rx="16" fill="#E7EFFB" stroke="#2860A1" stroke-width="2"/><text x="64" y="893" font-size="21" font-weight="700"><tspan x="64" dy="0">IOOI / RESULTS CHAIN</tspan></text><text x="64" y="925" font-size="19" font-weight="700"><tspan x="64" dy="0">Input → [Aktivität] → Output</tspan><tspan x="64" dy="26.599999999999998">→ Outcome → Impact</tspan></text><text x="64" y="985" font-size="17"><tspan x="64" dy="0">Optionale Linse auf einen Abschnitt.</tspan><tspan x="64" dy="23.799999999999997">Aktivität gehört nicht zum Akronym.</tspan></text><rect x="32" y="1070" width="370" height="208" rx="16" fill="#fff" stroke="#0B1B36" stroke-width="2" stroke-dasharray="6 4"/><text x="48" y="1103" font-size="21" font-weight="700"><tspan x="48" dy="0">EVIDENZ &amp; ZURECHNUNG</tspan></text><text x="48" y="1135" font-size="18"><tspan x="48" dy="0">Was ist beobachtet und zurechenbar?</tspan><tspan x="48" dy="25.2">Baseline · Gegenfaktum</tspan><tspan x="48" dy="25.2">Datenqualität · Zusätzlichkeit</tspan><tspan x="48" dy="25.2">Attribution / Contribution</tspan><tspan x="48" dy="25.2">Unsicherheit · Evidenzstatus</tspan></text><rect x="32" y="1302" width="370" height="257" rx="16" fill="#FBEEEA" stroke="#C95749" stroke-width="2"/><text x="48" y="1335" font-size="21" font-weight="700"><tspan x="48" dy="0">BEWERTUNG &amp; SCHUTZ</tspan></text><text x="48" y="1367" font-size="18"><tspan x="48" dy="0">Wie einordnen, welche Grenzen?</tspan><tspan x="48" dy="25.2">Mensch - Planet - Demokratie</tspan><tspan x="48" dy="25.2">Recht / Grundrechte · Referenzrahmen</tspan><tspan x="48" dy="25.2">Verteilung und Zeit · Netto-Wirkung</tspan><tspan x="48" dy="25.2">Wirkungsgrenzen · Nichtkompensation</tspan><tspan x="48" dy="25.2">Reverse Merit Order</tspan><tspan x="48" dy="25.2">Feststellen ist nicht Bewerten.</tspan></text><rect x="32" y="1583" width="370" height="491" rx="16" fill="#EDF4EF" stroke="#2D7F5F" stroke-width="2" stroke-dasharray="6 4"/><text x="48" y="1617" font-size="19" font-weight="700"><tspan x="48" dy="0">SYSTEMLINSE - QUER ZUM PFAD</tspan></text><text x="48" y="1652" font-size="18"><tspan x="48" dy="0">1. Ordnung: direkte Veränderungen</tspan><tspan x="48" dy="25.2">2. Ordnung: indirekte Folgen,</tspan><tspan x="48" dy="25.2">Rebound, Spillover, Leakage</tspan><tspan x="48" dy="25.2">3. Ordnung: Regeln, Anreize, Routinen,</tspan><tspan x="48" dy="25.2">Standards, Märkte, Institutionen,</tspan><tspan x="48" dy="25.2">künftige Entscheidungswege</tspan></text><text x="48" y="1832" font-size="20" font-weight="700"><tspan x="48" dy="0">Transformationswirkung</tspan></text><text x="48" y="1864" font-size="18"><tspan x="48" dy="0">Strukturelle Veränderung,</tspan><tspan x="48" dy="25.2">evidenzpflichtig; Richtung separat</tspan><tspan x="48" dy="25.2">bewerten. Keine Stufe nach Impact.</tspan><tspan x="48" dy="25.2">Impact kann je nach Rahmen schon</tspan><tspan x="48" dy="25.2">systemische Veränderung umfassen.</tspan><tspan x="48" dy="25.2">Diese Linse prüft den Pfad,</tspan><tspan x="48" dy="25.2">sie setzt ihn nicht zeitlich fort.</tspan></text><text x="48" y="2116" font-size="21" font-weight="700"><tspan x="48" dy="0">RÜCKKOPPLUNG &amp; LERNEN</tspan></text><text x="48" y="2150" font-size="18"><tspan x="48" dy="0">Preise · Steuern · Kapital · Versicherung</tspan><tspan x="48" dy="25.2">Beschaffung · Management</tspan><tspan x="48" dy="25.2">Recht / Politik · Produktdesign</tspan></text><text x="48" y="2250" font-size="18" font-weight="700"><tspan x="48" dy="0">Neue Entscheidung</tspan><tspan x="48" dy="25.2">→ neuer Systemzustand</tspan><tspan x="48" dy="25.2">→ neuer Wirkpfad / neues Monitoring</tspan></text><path d="M410 2095V2365H24V417H30" fill="none" stroke="#2D7F5F" stroke-width="2" marker-end="url(#arrow)"/><text x="38" y="2405" font-size="18" font-weight="700"><tspan x="38" dy="0">IOOI beschreibt eine Ergebniskette.</tspan><tspan x="38" dy="25.2">WÖk organisiert Prüfung, Bewertung,</tspan><tspan x="38" dy="25.2">Schutz und neue Entscheidungen.</tspan><tspan x="38" dy="25.2">Schichten, keine längere IOOI-Kette.</tspan></text></g></svg>

