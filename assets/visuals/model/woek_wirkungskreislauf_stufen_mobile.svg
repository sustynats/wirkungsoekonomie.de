<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1626" viewBox="0 0 900 1626" role="img" aria-labelledby="title desc">
  <title id="title">DER WIRKUNGSKREISLAUF</title>
  <desc id="desc">Wirkung wird lernfähig</desc>
  <defs>
    <style>
.bg{fill:#F7F4EC}.navy{fill:#0B1B36}.green{fill:#2D7F5F}.gold{fill:#C9932E}.coral{fill:#C95749}.text{fill:#2E333C}
.line{stroke:#D7D0C1;stroke-width:2;fill:none}.nline{stroke:#0B1B36;stroke-width:2.3;fill:none}.gline{stroke:#2D7F5F;stroke-width:2.3;fill:none}.oline{stroke:#C9932E;stroke-width:2.3;fill:none}.cline{stroke:#C95749;stroke-width:2.3;fill:none}
.card{fill:#fffdfa;stroke:#D7D0C1;stroke-width:2}.softn{fill:#EEF2F7;stroke:#0B1B36;stroke-width:2}.softg{fill:#EAF3EE;stroke:#2D7F5F;stroke-width:2}.softo{fill:#F7EEDC;stroke:#C9932E;stroke-width:2}.softc{fill:#F7E6E2;stroke:#C95749;stroke-width:2}
.title{font-family:Georgia,'Times New Roman',serif;font-size:54px;font-weight:700;letter-spacing:3.2px}.subtitle{font-family:Georgia,'Times New Roman',serif;font-size:28px;letter-spacing:.8px}
.kicker{font-family:Inter,Arial,sans-serif;font-size:15px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase}.h{font-family:Inter,Arial,sans-serif;font-size:23px;font-weight:800}.body{font-family:Inter,Arial,sans-serif;font-size:17px}.small{font-family:Inter,Arial,sans-serif;font-size:14px}.num{font-family:Georgia,'Times New Roman',serif;font-size:32px;font-weight:700}
</style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#C9932E"/></marker>
  </defs>
  <rect class="bg" width="900" height="1626"/>
  <rect x="28" y="28" width="844" height="1570" rx="18" fill="none" stroke="#D7D0C1" stroke-width="2"/>
  <text x="450" y="74" class="title navy" text-anchor="middle">DER WIRKUNGSKREISLAUF</text>
<text x="450" y="116" class="subtitle gold" text-anchor="middle">Wirkung wird lernfähig</text>
<line x1="70" y1="146" x2="830" y2="146" class="line"/>
<rect x="74" y="190" width="752" height="120" rx="18" class="softn"/>
<text x="108" y="234" class="num navy">1</text>
<text x="160" y="234" class="h navy">Auslöser</text>
<text x="160" y="268" class="small text">Handlung, Produkt, Gesetz, Preis, Narrativ oder Kapitalfluss.</text>
<rect x="74" y="332" width="752" height="120" rx="18" class="softo"/>
<text x="108" y="376" class="num gold">2</text>
<text x="160" y="376" class="h navy">Wirkungspotenzial</text>
<text x="160" y="410" class="small text">Möglichkeit positiver, negativer oder ambivalenter Wirkung.</text>
<rect x="74" y="474" width="752" height="120" rx="18" class="softn"/>
<text x="108" y="518" class="num navy">3</text>
<text x="160" y="518" class="h navy">Wirkmechanismus</text>
<text x="160" y="552" class="small text">Wie aus Möglichkeit tatsächliche Veränderung werden kann.</text>
<rect x="74" y="616" width="752" height="120" rx="18" class="softg"/>
<text x="108" y="660" class="num green">4</text>
<text x="160" y="660" class="h navy">Zustandsveränderung</text>
<text x="160" y="694" class="small text">Was sich bei Mensch, Planet oder Demokratie tatsächlich</text>
<text x="160" y="714" class="small text">verändert.</text>
<rect x="74" y="758" width="752" height="120" rx="18" class="softn"/>
<text x="108" y="802" class="num navy">5</text>
<text x="160" y="802" class="h navy">Wirkungsbewertung</text>
<text x="160" y="836" class="small text">Einordnung am Rahmen SDGs, Agenda 2030 und SDG+.</text>
<rect x="74" y="900" width="752" height="120" rx="18" class="softo"/>
<text x="108" y="944" class="num gold">6</text>
<text x="160" y="944" class="h navy">Netto-Wirkung</text>
<text x="160" y="978" class="small text">Positive und negative Wirkungen werden zusammen gelesen.</text>
<rect x="74" y="1042" width="752" height="120" rx="18" class="softg"/>
<text x="108" y="1086" class="num green">7</text>
<text x="160" y="1086" class="h navy">Wirkungslenkung</text>
<text x="160" y="1120" class="small text">Bewertung wird entscheidungsrelevant.</text>
<rect x="74" y="1184" width="752" height="120" rx="18" class="softg"/>
<text x="108" y="1228" class="num green">8</text>
<text x="160" y="1228" class="h navy">Rückkopplung</text>
<text x="160" y="1262" class="small text">Preise, Steuern, Kapital, Haushalt und Management reagieren.</text>
<rect x="74" y="1326" width="752" height="120" rx="18" class="softn"/>
<text x="108" y="1370" class="num navy">9</text>
<text x="160" y="1370" class="h navy">Lernen</text>
<text x="160" y="1404" class="small text">Daten, Evaluation, Wirkungsrat und Anpassung schließen den Kreis.</text>
<rect x="74" y="1484" width="752" height="102" rx="18" class="card"/>
<text x="108" y="1526" class="small navy">Wirkung ist nicht Absicht, nicht Image und nicht Output. Wirkung ist</text>
<text x="108" y="1547" class="small navy">tatsächliche Zustandsveränderung.</text>
</svg>
