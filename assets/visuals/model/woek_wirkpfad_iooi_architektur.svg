<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120" role="img" aria-labelledby="title desc" lang="de">
<title id="title">IOOI als Linse im Wirkpfad: WÖk-Wirkungsarchitektur</title>
<desc id="desc">Im Rahmen von Governance und Lernen liegt ein möglicher oder beobachteter Wirkpfad. IOOI ordnet einen Abschnitt als Input, optionale Aktivität, Output, Outcome und Impact. Quer dazu liegen Ex-ante-Hypothesen, Evidenz und Zurechnung, Bewertung und Schutz sowie die System- und Transformationsprüfung. Diese Ebenen sind keine zeitlichen Stationen. Transformationswirkung ist keine automatische Stufe nach Impact. Rückkopplung führt Erkenntnisse in neue Entscheidungen zurück.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2D7F5F"/></marker></defs>
<rect width="1600" height="1120" fill="#F7F4EC"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#0B1B36"><rect x="26" y="22" width="1548" height="1076" rx="16" fill="#F7F4EC" stroke="#2D7F5F" stroke-width="2"/><text x="60" y="72" font-size="34" font-weight="700"><tspan x="60" dy="0">WÖk-Wirkungsarchitektur</tspan></text><text x="60" y="110" font-size="23"><tspan x="60" dy="0">Governance · Versionierung · Audit / Assurance · Transparenz · Rechtsschutz · Lernen</tspan></text><rect x="68" y="144" width="1086" height="122" rx="16" fill="#F6EBD5" stroke="#C9932E" stroke-width="2" stroke-dasharray="7 5"/><text x="92" y="180" font-size="24" font-weight="700"><tspan x="92" dy="0">EX ANTE / HYPOTHESEN  |  Was könnte passieren - und warum?</tspan></text><text x="92" y="219" font-size="22"><tspan x="92" dy="0">Potenzial · Risiko · Hypothesen · Mechanismen · Bedingungen / Annahmen</tspan><tspan x="92" dy="30.799999999999997">Szenarien: Aussagen über mögliche Pfade, keine Stationen des Pfads</tspan></text><path d="M200 266V297 M554 266V297 M1020 266V297" fill="none" stroke="#997022" stroke-width="2" stroke-dasharray="6 5"/><rect x="68" y="290" width="1086" height="346" rx="16" fill="#fff" stroke="#2D7F5F" stroke-width="2"/><text x="92" y="326" font-size="25" font-weight="700"><tspan x="92" dy="0">REALER / MODELLIERTER WIRKPFAD</tspan></text><text x="92" y="357" font-size="22"><tspan x="92" dy="0">Plausibler oder beobachteter Wirkpfad - kein Kausalbeweis.</tspan></text><rect x="84" y="385" width="119" height="102" rx="16" fill="#F7F4EC" stroke="#c8cec9" stroke-width="2"/><text x="92" y="416" font-size="15"><tspan x="92" dy="0">Ausgangslage</tspan><tspan x="92" dy="23.799999999999997">&amp; Kontext</tspan></text><path d="M204 436h11" stroke="#2D7F5F" stroke-width="2" marker-end="url(#arrow)"/><rect x="216" y="385" width="119" height="102" rx="16" fill="#F7F4EC" stroke="#c8cec9" stroke-width="2"/><text x="224" y="416" font-size="15"><tspan x="224" dy="0">Auslöser /</tspan><tspan x="224" dy="23.799999999999997">Handlung /</tspan><tspan x="224" dy="23.799999999999997">Unterlassen</tspan></text><path d="M336 436h11" stroke="#2D7F5F" stroke-width="2" marker-end="url(#arrow)"/><rect x="348" y="385" width="119" height="102" rx="16" fill="#F7F4EC" stroke="#c8cec9" stroke-width="2"/><text x="356" y="416" font-size="15"><tspan x="356" dy="0">Mechanismus</tspan><tspan x="356" dy="23.799999999999997">+ Bedingungen</tspan></text><path d="M468 436h11" stroke="#2D7F5F" stroke-width="2" marker-end="url(#arrow)"/><rect x="480" y="385" width="119" height="102" rx="16" fill="#F7F4EC" stroke="#c8cec9" stroke-width="2"/><text x="488" y="416" font-size="15"><tspan x="488" dy="0">Aktivität /</tspan><tspan x="488" dy="23.799999999999997">Intervention</tspan></text><path d="M600 436h11" stroke="#2D7F5F" stroke-width="2" marker-end="url(#arrow)"/><rect x="612" y="385" width="119" height="102" rx="16" fill="#F7F4EC" stroke="#c8cec9" stroke-width="2"/><text x="620" y="416" font-size="15"><tspan x="620" dy="0">unmittelbare</tspan><tspan x="620" dy="23.799999999999997">Leistung</tspan></text><path d="M732 436h11" stroke="#2D7F5F" stroke-width="2" marker-end="url(#arrow)"/><rect x="744" y="385" width="119" height="102" rx="16" fill="#F7F4EC" stroke="#c8cec9" stroke-width="2"/><text x="752" y="416" font-size="15"><tspan x="752" dy="0">Zustands-</tspan><tspan x="752" dy="23.799999999999997">veränderung</tspan></text><path d="M864 436h11" stroke="#2D7F5F" stroke-width="2" marker-end="url(#arrow)"/><rect x="876" y="385" width="119" height="102" rx="16" fill="#F7F4EC" stroke="#c8cec9" stroke-width="2"/><text x="884" y="416" font-size="15"><tspan x="884" dy="0">Folge- /</tspan><tspan x="884" dy="23.799999999999997">Systemwirkung</tspan></text><path d="M996 436h11" stroke="#2D7F5F" stroke-width="2" marker-end="url(#arrow)"/><rect x="1008" y="385" width="119" height="102" rx="16" fill="#F7F4EC" stroke="#c8cec9" stroke-width="2"/><text x="1016" y="416" font-size="15"><tspan x="1016" dy="0">neuer</tspan><tspan x="1016" dy="23.799999999999997">Systemzustand</tspan></text><rect x="220" y="511" width="914" height="67" rx="16" fill="#E7EFFB" stroke="#2860A1" stroke-width="2"/><text x="242" y="541" font-size="25" font-weight="700"><tspan x="242" dy="0">IOOI:  Input → [Aktivität] → Output → Outcome → Impact</tspan></text><text x="242" y="566" font-size="19"><tspan x="242" dy="0">Results Chain: eine optionale Linse auf einen Abschnitt des Pfads</tspan></text><text x="92" y="609" font-size="20"><tspan x="92" dy="0">Impact kann je nach Rahmen auch langfristige oder systemische Wirkung umfassen.</tspan></text><rect x="68" y="660" width="1086" height="120" rx="16" fill="#fff" stroke="#0B1B36" stroke-width="2" stroke-dasharray="7 5"/><text x="92" y="696" font-size="24" font-weight="700"><tspan x="92" dy="0">EVIDENZ &amp; ZURECHNUNG  |  Was ist beobachtet und zurechenbar?</tspan></text><text x="92" y="733" font-size="22"><tspan x="92" dy="0">Baseline · Gegenfaktum · Datenqualität · Zusätzlichkeit</tspan><tspan x="92" dy="30.799999999999997">Attribution / Contribution · Unsicherheit · Evidenzstatus</tspan></text><rect x="68" y="804" width="1086" height="146" rx="16" fill="#FBEEEA" stroke="#C95749" stroke-width="2"/><text x="92" y="840" font-size="24" font-weight="700"><tspan x="92" dy="0">BEWERTUNG &amp; SCHUTZ  |  Wie einordnen, welche Grenzen achten?</tspan></text><text x="92" y="876" font-size="22"><tspan x="92" dy="0">Mensch - Planet - Demokratie · Recht / Grundrechte · Referenzrahmen</tspan><tspan x="92" dy="30.799999999999997">Verteilung und Zeit · Netto-Wirkung · Wirkungsgrenzen</tspan><tspan x="92" dy="30.799999999999997">Nichtkompensation · Reverse Merit Order</tspan></text><rect x="1178" y="144" width="340" height="806" rx="16" fill="#EDF4EF" stroke="#2D7F5F" stroke-width="2" stroke-dasharray="7 5"/><text x="1200" y="185" font-size="25" font-weight="700"><tspan x="1200" dy="0">SYSTEMLINSE</tspan></text><text x="1200" y="222" font-size="22"><tspan x="1200" dy="0">Quer zum Pfad,</tspan><tspan x="1200" dy="30.799999999999997">keine weitere Station</tspan></text><text x="1200" y="306" font-size="24" font-weight="700"><tspan x="1200" dy="0">1. Ordnung</tspan></text><text x="1200" y="340" font-size="22"><tspan x="1200" dy="0">direkte Zustands-</tspan><tspan x="1200" dy="30.799999999999997">veränderungen</tspan></text><text x="1200" y="432" font-size="24" font-weight="700"><tspan x="1200" dy="0">2. Ordnung</tspan></text><text x="1200" y="466" font-size="22"><tspan x="1200" dy="0">indirekte Folgen,</tspan><tspan x="1200" dy="30.799999999999997">Rebound, Spillover,</tspan><tspan x="1200" dy="30.799999999999997">Leakage</tspan></text><text x="1200" y="574" font-size="24" font-weight="700"><tspan x="1200" dy="0">3. Ordnung</tspan></text><text x="1200" y="608" font-size="21"><tspan x="1200" dy="0">Regeln, Anreize, Routinen,</tspan><tspan x="1200" dy="29.4">Standards, Märkte,</tspan><tspan x="1200" dy="29.4">Institutionen, künftige</tspan><tspan x="1200" dy="29.4">Entscheidungswege</tspan></text><text x="1200" y="760" font-size="22" font-weight="700"><tspan x="1200" dy="0">Transformationswirkung</tspan></text><text x="1200" y="795" font-size="21"><tspan x="1200" dy="0">strukturelle Veränderung;</tspan><tspan x="1200" dy="29.4">Evidenz erforderlich,</tspan><tspan x="1200" dy="29.4">Richtung separat bewerten.</tspan><tspan x="1200" dy="29.4">Nicht automatisch</tspan><tspan x="1200" dy="29.4">eine Stufe nach Impact.</tspan></text><path d="M1518 968V1056H48V315H64" fill="none" stroke="#2D7F5F" stroke-width="3" marker-end="url(#arrow)"/><text x="92" y="987" font-size="20" font-weight="700"><tspan x="92" dy="0">RÜCKKOPPLUNG  |  Preise · Steuern · Kapital · Versicherung · Beschaffung · Management · Recht / Politik · Produktdesign</tspan></text><text x="92" y="1023" font-size="24"><tspan x="92" dy="0">Neue Entscheidung → neuer Systemzustand → neuer Wirkpfad / neues Monitoring</tspan></text><text x="70" y="1084" font-size="23" font-weight="700"><tspan x="70" dy="0">IOOI beschreibt eine Ergebniskette. WÖk organisiert Prüfung, Bewertung, Schutz und neue Entscheidungen.</tspan></text></g></svg>
