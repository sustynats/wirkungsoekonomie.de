<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
  <title id="title">WIRKUNG WIRD STEUERBAR</title>
  <desc id="desc">Bewertung · Rückkopplung · Lernen</desc>
  <defs><style>
  .bg{fill:#f7f4ec}.navy{fill:#0b1b36}.green{fill:#2d7f5f}.gold{fill:#c9932e}.coral{fill:#c95749}.muted{fill:#3d4656}
  .line{stroke:#d7d0c1;stroke-width:2;fill:none}.nline{stroke:#0b1b36;stroke-width:2.4;fill:none}.gline{stroke:#2d7f5f;stroke-width:2.4;fill:none}.oline{stroke:#c9932e;stroke-width:2.4;fill:none}.cline{stroke:#c95749;stroke-width:2.4;fill:none}
  .card{fill:rgba(255,255,255,.55);stroke:#d7d0c1;stroke-width:2}.softn{fill:#edf1f7;stroke:#0b1b36;stroke-width:2}.softg{fill:#eaf3ee;stroke:#2d7f5f;stroke-width:2}.softo{fill:#f6edda;stroke:#c9932e;stroke-width:2}.softc{fill:#f6e5e1;stroke:#c95749;stroke-width:2}
  .title{font-family:Georgia,'Times New Roman',serif;font-size:54px;font-weight:700;letter-spacing:4px}.subtitle{font-family:Georgia,'Times New Roman',serif;font-size:28px;letter-spacing:1.1px}
  .kicker{font-family:Inter,Arial,sans-serif;font-size:16px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase}.h{font-family:Inter,Arial,sans-serif;font-size:23px;font-weight:800}.body{font-family:Inter,Arial,sans-serif;font-size:17px}.small{font-family:Inter,Arial,sans-serif;font-size:14px}.num{font-family:Georgia,'Times New Roman',serif;font-size:32px;font-weight:700}
</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#c9932e"/></marker></defs>
  <rect class="bg" width="1800" height="1000"/>
  <rect x="28" y="28" width="1744" height="944" rx="18" fill="none" stroke="#d7d0c1" stroke-width="2"/>
  
  <text x="900" y="88" class="title navy" text-anchor="middle">WIRKUNG WIRD STEUERBAR</text>
  <text x="900" y="128" class="subtitle gold" text-anchor="middle">Bewertung · Rückkopplung · Lernen</text>
  <line x1="160" y1="154" x2="1640" y2="154" class="line"/>

<rect x="150" y="238" width="320" height="178" rx="20" class="softg"/>
<text x="174" y="283" class="num green">1</text>
<text x="222" y="283" class="h navy">Wirkung</text>
<text x="174" y="321" class="body muted">tatsächliche Veränderung von</text>
<text x="174" y="344" class="body muted">Zuständen, nicht Absicht und</text>
<text x="174" y="367" class="body muted">nicht Output.</text>
<line x1="470" y1="327" x2="507" y2="327" class="oline" marker-end="url(#arrow)"/>
<rect x="525" y="238" width="320" height="178" rx="20" class="softn"/>
<text x="549" y="283" class="num navy">2</text>
<text x="597" y="283" class="h navy">Wirkungsbewertung</text>
<text x="549" y="321" class="body muted">Einordnung am Rahmen SDGs,</text>
<text x="549" y="344" class="body muted">Agenda 2030 und SDG+.</text>
<line x1="845" y1="327" x2="882" y2="327" class="oline" marker-end="url(#arrow)"/>
<rect x="900" y="238" width="320" height="178" rx="20" class="softo"/>
<text x="924" y="283" class="num gold">3</text>
<text x="972" y="283" class="h navy">Netto-Wirkung</text>
<text x="924" y="321" class="body muted">positive und negative</text>
<text x="924" y="344" class="body muted">Wirkungen werden zusammen</text>
<text x="924" y="367" class="body muted">gelesen.</text>
<line x1="1220" y1="327" x2="1257" y2="327" class="oline" marker-end="url(#arrow)"/>
<rect x="1275" y="238" width="320" height="178" rx="20" class="softc"/>
<text x="1299" y="283" class="num coral">4</text>
<text x="1347" y="283" class="h navy">Schutzregel</text>
<text x="1299" y="321" class="body muted">negative Wirkung darf nicht</text>
<text x="1299" y="344" class="body muted">durch gute Felder verdeckt</text>
<text x="1299" y="367" class="body muted">werden.</text>
<rect x="150" y="602" width="320" height="178" rx="20" class="softo"/>
<text x="174" y="647" class="num gold">5</text>
<text x="222" y="647" class="h navy">Wirkungslenkung</text>
<text x="174" y="685" class="body muted">Bewertung wird</text>
<text x="174" y="708" class="body muted">entscheidungsrelevant.</text>
<line x1="470" y1="691" x2="507" y2="691" class="oline" marker-end="url(#arrow)"/>
<rect x="525" y="602" width="320" height="178" rx="20" class="softg"/>
<text x="549" y="647" class="num green">6</text>
<text x="597" y="647" class="h navy">Rückkopplung</text>
<text x="549" y="685" class="body muted">Preise, Steuern, Kapital,</text>
<text x="549" y="708" class="body muted">Beschaffung und Haushalt</text>
<text x="549" y="731" class="body muted">reagieren.</text>
<line x1="845" y1="691" x2="882" y2="691" class="oline" marker-end="url(#arrow)"/>
<rect x="900" y="602" width="320" height="178" rx="20" class="softc"/>
<text x="924" y="647" class="num coral">7</text>
<text x="972" y="647" class="h navy">Reverse Merit Order</text>
<text x="924" y="685" class="body muted">das schwächste relevante</text>
<text x="924" y="708" class="body muted">Wirkungsfeld begrenzt die</text>
<text x="924" y="731" class="body muted">Gesamtbewertung.</text>
<line x1="1220" y1="691" x2="1257" y2="691" class="oline" marker-end="url(#arrow)"/>
<rect x="1275" y="602" width="320" height="178" rx="20" class="softn"/>
<text x="1299" y="647" class="num navy">8</text>
<text x="1347" y="647" class="h navy">Lernen</text>
<text x="1299" y="685" class="body muted">Daten, Evaluation und</text>
<text x="1299" y="708" class="body muted">Wirkungsrat passen das System</text>
<text x="1299" y="731" class="body muted">an.</text>
<rect x="132" y="842" width="1536" height="86" rx="18" class="card"/><text x="178" y="892" class="body navy">Die Funktionsweise verbindet Wirkung, Bewertung, Schutzregel und Rückkopplung zu einem lernenden Steuerungssystem.</text>
</svg>
