<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Wirkungsorientierte Unternehmensführung</title>
  <desc id="desc">Kontrollierte Modellgrafik: vom Zielmanagement zur resilienten Wirkungssteuerung mit Mitarbeitenden, Ressourcen, Kreislauffähigkeit, Wertschöpfung, Daten, Führung, Change und Rückkopplung. ESG ist Nebenprodukt dieser Steuerung.</desc>
  <defs>
    <style>
      .bg{fill:#f7f4ec}.paper{fill:#fbfaf6}.navy{fill:#0b1b36}.green{fill:#2d7f5f}.gold{fill:#c9932e}.coral{fill:#c95749}.muted{fill:#3d4656}.line{stroke:#d7d0c1;stroke-width:2;fill:none}.nline{stroke:#0b1b36;stroke-width:2.4;fill:none}.gline{stroke:#2d7f5f;stroke-width:2.4;fill:none}.oline{stroke:#c9932e;stroke-width:2.4;fill:none}.cline{stroke:#c95749;stroke-width:2.4;fill:none}.card{fill:rgba(255,255,255,.62);stroke:#d7d0c1;stroke-width:2}.softn{fill:#edf1f7;stroke:#0b1b36;stroke-width:2}.softg{fill:#eaf3ee;stroke:#2d7f5f;stroke-width:2}.softo{fill:#f6edda;stroke:#c9932e;stroke-width:2}.softc{fill:#f6e5e1;stroke:#c95749;stroke-width:2}.title{font-family:Georgia,'Times New Roman',serif;font-size:50px;font-weight:700;letter-spacing:3.2px}.subtitle{font-family:Georgia,'Times New Roman',serif;font-size:28px;letter-spacing:.8px}.kicker{font-family:Inter,Arial,sans-serif;font-size:15px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase}.h{font-family:Inter,Arial,sans-serif;font-size:22px;font-weight:800}.body{font-family:Inter,Arial,sans-serif;font-size:17px}.small{font-family:Inter,Arial,sans-serif;font-size:14px}.num{font-family:Georgia,'Times New Roman',serif;font-size:34px;font-weight:700}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#c9932e"/></marker>
  </defs>
  <rect class="bg" width="1800" height="1120"/>
  <rect x="30" y="30" width="1740" height="1060" rx="22" class="paper" stroke="#d7d0c1" stroke-width="2"/>

  <text x="900" y="94" class="title navy" text-anchor="middle">WIRKUNGSORIENTIERTE UNTERNEHMENSFÜHRUNG</text>
  <text x="900" y="134" class="subtitle gold" text-anchor="middle">Vom Zielmanagement zur Wirkungssteuerung</text>
  <line x1="140" y1="164" x2="1660" y2="164" class="line"/>

  <rect x="120" y="210" width="430" height="220" rx="20" class="softc"/>
  <text x="150" y="252" class="kicker coral">Alte Steuerung</text>
  <text x="150" y="292" class="h navy">Bewegung ohne Richtung</text>
  <text x="150" y="330" class="body muted">Umsatz · Marge · KPI · Effizienz</text>
  <text x="150" y="357" class="body muted">Wachstum · Bericht · Zielerfüllung</text>
  <text x="150" y="397" class="small muted">misst, ob Ziele erreicht werden -</text>
  <text x="150" y="419" class="small muted">nicht, welche Zustände sich verändern.</text>

  <rect x="685" y="210" width="430" height="220" rx="20" class="softg"/>
  <text x="715" y="252" class="kicker green">WÖk-Referenz</text>
  <text x="715" y="292" class="h navy">Wirkung als Führungsgröße</text>
  <text x="715" y="330" class="body muted">tatsächliche Zustandsveränderung</text>
  <text x="715" y="357" class="body muted">für Mensch · Planet · Demokratie</text>
  <text x="715" y="397" class="small muted">nicht Absicht · nicht Image · nicht Output</text>
  <line x1="715" y1="420" x2="1085" y2="420" class="line"/>

  <rect x="1250" y="210" width="430" height="220" rx="20" class="softn"/>
  <text x="1280" y="252" class="kicker navy">Neue Führung</text>
  <text x="1280" y="292" class="h navy">Tragfähigkeit steuern</text>
  <text x="1280" y="330" class="body muted">Strategie · Produkt · Kapital</text>
  <text x="1280" y="357" class="body muted">Ressourcen · C2C · Mitarbeitende</text>
  <text x="1280" y="397" class="small muted">Gewinn bleibt - aber als Ergebnis</text>
  <text x="1280" y="419" class="small muted">resilienter, positiver Netto-Wirkung.</text>

  <line x1="555" y1="320" x2="670" y2="320" class="oline" marker-end="url(#arrow)"/>
  <line x1="1120" y1="320" x2="1235" y2="320" class="oline" marker-end="url(#arrow)"/>

  <text x="900" y="512" class="kicker navy" text-anchor="middle">Change-Prozess</text>
  <text x="900" y="548" class="h navy" text-anchor="middle">ESG wird nicht gesteuert. Wirkung wird gesteuert - ESG fällt dabei an.</text>

  <rect x="105" y="610" width="285" height="130" rx="18" class="softn"/>
  <text x="132" y="654" class="num navy">1</text>
  <text x="180" y="652" class="h navy">Maßstab klären</text>
  <text x="132" y="690" class="small muted">Was gilt als Erfolg?</text>
  <text x="132" y="712" class="small muted">Welche Wirkung zählt?</text>
  <line x1="390" y1="675" x2="432" y2="675" class="oline" marker-end="url(#arrow)"/>

  <rect x="450" y="610" width="285" height="130" rx="18" class="softg"/>
  <text x="477" y="654" class="num green">2</text>
  <text x="525" y="652" class="h navy">Wirkungspfade</text>
  <text x="477" y="690" class="small muted">Entscheidung → Wirkung</text>
  <text x="477" y="712" class="small muted">erste bis dritte Ordnung</text>
  <line x1="735" y1="675" x2="777" y2="675" class="oline" marker-end="url(#arrow)"/>

  <rect x="795" y="610" width="285" height="130" rx="18" class="softo"/>
  <text x="822" y="654" class="num gold">3</text>
  <text x="870" y="652" class="h navy">Wertschöpfung</text>
  <text x="822" y="690" class="small muted">Produkt · Nutzung · C2C</text>
  <text x="822" y="712" class="small muted">Ressourcen · Lieferkette</text>
  <line x1="1080" y1="675" x2="1122" y2="675" class="oline" marker-end="url(#arrow)"/>

  <rect x="1140" y="610" width="285" height="130" rx="18" class="softn"/>
  <text x="1167" y="654" class="num navy">4</text>
  <text x="1215" y="652" class="h navy">Daten anschließen</text>
  <text x="1167" y="690" class="small muted">WÖk-ID · Scorecard</text>
  <text x="1167" y="712" class="small muted">ESG/CSRD als Folge</text>
  <line x1="1425" y1="675" x2="1467" y2="675" class="oline" marker-end="url(#arrow)"/>

  <rect x="1485" y="610" width="210" height="130" rx="18" class="softc"/>
  <text x="1512" y="654" class="num coral">5</text>
  <text x="1560" y="652" class="h navy">Wirkungslast</text>
  <text x="1512" y="690" class="small muted">Risiken und</text>
  <text x="1512" y="712" class="small muted">Schutzregeln</text>

  <line x1="1590" y1="740" x2="1590" y2="802" class="oline" marker-end="url(#arrow)"/>

  <rect x="1485" y="820" width="210" height="130" rx="18" class="softo"/>
  <text x="1512" y="864" class="num gold">6</text>
  <text x="1560" y="862" class="h navy">Strategie</text>
  <text x="1512" y="900" class="small muted">Portfolio · CAPEX</text>
  <text x="1512" y="922" class="small muted">positive Netto-Wirkung</text>
  <line x1="1485" y1="885" x2="1443" y2="885" class="oline" marker-end="url(#arrow)"/>

  <rect x="1140" y="820" width="285" height="130" rx="18" class="softg"/>
  <text x="1167" y="864" class="num green">7</text>
  <text x="1215" y="862" class="h navy">Führung</text>
  <text x="1167" y="900" class="small muted">Rollen · Zielkonflikte</text>
  <text x="1167" y="922" class="small muted">Verantwortung im System</text>
  <line x1="1140" y1="885" x2="1098" y2="885" class="oline" marker-end="url(#arrow)"/>

  <rect x="795" y="820" width="285" height="130" rx="18" class="softn"/>
  <text x="822" y="864" class="num navy">8</text>
  <text x="870" y="862" class="h navy">Mitarbeitende</text>
  <text x="822" y="900" class="small muted">Kultur · Lernen</text>
  <text x="822" y="922" class="small muted">Anreize · Befähigung</text>
  <line x1="795" y1="885" x2="753" y2="885" class="oline" marker-end="url(#arrow)"/>

  <rect x="450" y="820" width="285" height="130" rx="18" class="softg"/>
  <text x="477" y="864" class="num green">9</text>
  <text x="525" y="862" class="h navy">Pilot und Change</text>
  <text x="477" y="900" class="small muted">90 Tage prüfen</text>
  <text x="477" y="922" class="small muted">lernen statt verkünden</text>
  <line x1="450" y1="885" x2="408" y2="885" class="oline" marker-end="url(#arrow)"/>

  <rect x="105" y="820" width="285" height="130" rx="18" class="softo"/>
  <text x="132" y="864" class="num gold">10</text>
  <text x="195" y="862" class="h navy">Rückkopplung</text>
  <text x="132" y="900" class="small muted">Einkauf · Ressourcen · Kapital</text>
  <text x="132" y="922" class="small muted">Führung · Governance</text>

  <rect x="260" y="1000" width="1280" height="66" rx="18" class="card"/>
  <text x="900" y="1042" class="body navy" text-anchor="middle">Führung heißt: Mitarbeitende, Ressourcen, Kapital und Wertschöpfung so zu organisieren, dass positive Netto-Wirkung wahrscheinlicher wird.</text>
</svg>
