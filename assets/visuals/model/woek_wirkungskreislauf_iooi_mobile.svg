<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1800" viewBox="0 0 900 1800" role="img" aria-labelledby="title desc">
  <title id="title">Der Wirkungskreislauf der Wirkungsökonomie</title>
  <desc id="desc">Von Auslösern, Wirkungspotenzialen und Wirkmechanismen über einen Wirkungspfad mit optionalem IOOI-Abschnitt zu Evidenz, Bewertung, Schutzregeln, Rückkopplung und Lernen.</desc>
  <defs><style>.bg{fill:#F7F4EC}.navy{fill:#0B1B36}.green{fill:#2D7F5F}.gold{fill:#C9932E}.coral{fill:#C95749}.text{fill:#2E333C}.line{stroke:#D7D0C1;stroke-width:2;fill:none}.card{fill:#fffdfa;stroke:#D7D0C1;stroke-width:2}.softn{fill:#EEF2F7;stroke:#0B1B36;stroke-width:2}.softg{fill:#EAF3EE;stroke:#2D7F5F;stroke-width:2}.softo{fill:#F7EEDC;stroke:#C9932E;stroke-width:2}.softc{fill:#F7E6E2;stroke:#C95749;stroke-width:2}.title{font-family:Georgia,'Times New Roman',serif;font-size:42px;font-weight:700;letter-spacing:2px}.subtitle{font-family:Georgia,'Times New Roman',serif;font-size:22px;letter-spacing:.6px}.h{font-family:Inter,Arial,sans-serif;font-size:23px;font-weight:800}.small{font-family:Inter,Arial,sans-serif;font-size:15px}.num{font-family:Georgia,'Times New Roman',serif;font-size:32px;font-weight:700}</style></defs>
  <rect class="bg" width="900" height="1800"/><rect x="28" y="28" width="844" height="1744" rx="18" fill="none" stroke="#D7D0C1" stroke-width="2"/>
  <text x="450" y="78" class="title navy" text-anchor="middle">DER WIRKUNGSKREISLAUF</text><text x="450" y="116" class="subtitle gold" text-anchor="middle">Vom Wirkpfad zur Steuerungsarchitektur</text><line x1="70" y1="146" x2="830" y2="146" class="line"/>
  <rect x="74" y="185" width="752" height="118" rx="18" class="softn"/><text x="108" y="228" class="num navy">1</text><text x="160" y="228" class="h navy">Vor der Wirkung</text><text x="160" y="262" class="small text">Auslöser und Wirkstoff als didaktische Analogie.</text>
  <rect x="74" y="325" width="752" height="118" rx="18" class="softo"/><text x="108" y="368" class="num gold">2</text><text x="160" y="368" class="h navy">Potenzial und Risiko</text><text x="160" y="402" class="small text">Möglichkeit positiver, negativer oder ambivalenter Wirkung.</text>
  <rect x="74" y="465" width="752" height="118" rx="18" class="softn"/><text x="108" y="508" class="num navy">3</text><text x="160" y="508" class="h navy">Wirkmechanismus</text><text x="160" y="542" class="small text">Warum und unter welchen Annahmen Veränderung entsteht.</text>
  <rect x="74" y="605" width="752" height="118" rx="18" class="softg"/><text x="108" y="648" class="num green">4</text><text x="160" y="648" class="h navy">Wirkpfad (optional IOOI)</text><text x="160" y="682" class="small text">Input → [Aktivität] → Output → Outcome → Impact.</text>
  <rect x="74" y="745" width="752" height="118" rx="18" class="softc"/><text x="108" y="788" class="num coral">5</text><text x="160" y="788" class="h navy">Evidenz und Folgen</text><text x="160" y="822" class="small text">Wirkungsnachweis, Attribution, Neben- und Wechselwirkungen.</text>
  <rect x="74" y="885" width="752" height="118" rx="18" class="softn"/><text x="108" y="928" class="num navy">6</text><text x="160" y="928" class="h navy">Wirkungsbewertung</text><text x="160" y="962" class="small text">SDGs, Agenda 2030 und SDG+ als Referenzrahmen.</text>
  <rect x="74" y="1025" width="752" height="118" rx="18" class="softo"/><text x="108" y="1068" class="num gold">7</text><text x="160" y="1068" class="h navy">Netto und Schutz</text><text x="160" y="1102" class="small text">Nichtkompensation, Grenzen, Rechte und Verteilungsfragen.</text>
  <rect x="74" y="1165" width="752" height="118" rx="18" class="softg"/><text x="108" y="1208" class="num green">8</text><text x="160" y="1208" class="h navy">Transformation</text><text x="160" y="1242" class="small text">Wirkungsordnungen, Lernen und tragfähige Systemwechsel.</text>
  <rect x="74" y="1305" width="752" height="118" rx="18" class="softg"/><text x="108" y="1348" class="num green">9</text><text x="160" y="1348" class="h navy">Wirkungslenkung</text><text x="160" y="1382" class="small text">Preise, Steuern, Kapital, Beschaffung, Recht und Management reagieren.</text>
  <rect x="74" y="1445" width="752" height="118" rx="18" class="softn"/><text x="108" y="1488" class="num navy">10</text><text x="177" y="1488" class="h navy">Rückkopplung und Lernen</text><text x="160" y="1522" class="small text">Neue Systemzustände werden beobachtet, korrigiert und gestaltet.</text>
  <rect x="74" y="1605" width="752" height="120" rx="18" class="card"/><text x="108" y="1648" class="small navy">Wirkungspotenzial ist nicht Wirkung. Ein plausibler</text><text x="108" y="1671" class="small navy">Mechanismus ist kein Wirkungsnachweis. IOOI kann einen</text><text x="108" y="1694" class="small navy">Abschnitt strukturieren; die WÖk ist eigenständig.</text>
</svg>
