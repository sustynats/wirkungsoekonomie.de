  <rect class="bg" width="900" height="1342"/>
  <rect x="28" y="28" width="844" height="1286" rx="18" fill="none" stroke="#D7D0C1" stroke-width="2"/>
  <text x="450" y="74" class="title navy" text-anchor="middle">6. KONDRATIEFF: NACHHALTIGKEITSTRANSFORMATION</text>
<text x="450" y="116" class="subtitle gold" text-anchor="middle">Technologie ist Treiber · Agenda 2030 ist Richtung · WÖk ist Steuerung</text>
<line x1="70" y1="146" x2="830" y2="146" class="line"/>
<rect x="74" y="190" width="752" height="120" rx="18" class="softg"/>
<text x="108" y="234" class="num green">1</text>
<text x="160" y="234" class="h navy">Welle</text>
<text x="160" y="268" class="small text">Nachhaltigkeitstransformation im Sinne der Agenda 2030.</text>
<rect x="74" y="332" width="752" height="120" rx="18" class="softn"/>
<text x="108" y="376" class="num navy">2</text>
<text x="160" y="376" class="h navy">Treiber</text>
<text x="160" y="410" class="small text">KI, Robotik, Automatisierung, Datenräume und</text>
<text x="160" y="430" class="small text">Kreislauftechnologien.</text>
<rect x="74" y="474" width="752" height="120" rx="18" class="softo"/>
<text x="108" y="518" class="num gold">3</text>
<text x="160" y="518" class="h navy">Energie</text>
<text x="160" y="552" class="small text">Erneuerbare Energien und biobasierte Innovationen schaffen neue</text>
<text x="160" y="572" class="small text">Produktivität.</text>
<rect x="74" y="616" width="752" height="120" rx="18" class="softg"/>
<text x="108" y="660" class="num green">4</text>
<text x="160" y="660" class="h navy">Gesellschaft</text>
<text x="160" y="694" class="small text">Bildung, Gesundheit und resiliente Wertschöpfung gehören zur</text>
<text x="160" y="714" class="small text">Welle.</text>
<rect x="74" y="758" width="752" height="120" rx="18" class="softn"/>
<text x="108" y="802" class="num navy">5</text>
<text x="160" y="802" class="h navy">Rahmen</text>
<text x="160" y="836" class="small text">Agenda 2030, SDGs, SDG+, Mensch, Planet und Demokratie geben</text>
<text x="160" y="856" class="small text">Richtung.</text>
<rect x="74" y="900" width="752" height="120" rx="18" class="softg"/>
<text x="108" y="944" class="num green">6</text>
<text x="160" y="944" class="h navy">Steuerung</text>
<text x="160" y="978" class="small text">Wirkungsökonomie übersetzt Richtung in Wirkung, WÖk-ID, Scorecard</text>
<text x="160" y="998" class="small text">und Rückkopplung.</text>
<rect x="74" y="1042" width="752" height="120" rx="18" class="softo"/>
<text x="108" y="1086" class="num gold">7</text>
<text x="160" y="1086" class="h navy">Ziel</text>
<text x="160" y="1120" class="small text">positive Netto-Wirkung für Mensch, Planet und Demokratie.</text>
<rect x="74" y="1200" width="752" height="102" rx="18" class="card"/>
<text x="108" y="1242" class="small navy">KI und Robotik treiben Wachstum. Die Agenda 2030 gibt Richtung. Die</text>
<text x="108" y="1263" class="small navy">Wirkungsökonomie übersetzt diese Richtung in Steuerung.</text>
</svg>
