<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1484" viewBox="0 0 900 1484" role="img" aria-labelledby="title desc">
  <title id="title">GESUNDHEIT ALS SYSTEMWIRKUNG</title>
  <desc id="desc">Prävention statt Reparatur</desc>
  <defs>
    <style>
.bg{fill:#F7F4EC}.navy{fill:#0B1B36}.green{fill:#2D7F5F}.gold{fill:#C9932E}.coral{fill:#C95749}.text{fill:#2E333C}
.line{stroke:#D7D0C1;stroke-width:2;fill:none}.nline{stroke:#0B1B36;stroke-width:2.3;fill:none}.gline{stroke:#2D7F5F;stroke-width:2.3;fill:none}.oline{stroke:#C9932E;stroke-width:2.3;fill:none}.cline{stroke:#C95749;stroke-width:2.3;fill:none}
.card{fill:#fffdfa;stroke:#D7D0C1;stroke-width:2}.softn{fill:#EEF2F7;stroke:#0B1B36;stroke-width:2}.softg{fill:#EAF3EE;stroke:#2D7F5F;stroke-width:2}.softo{fill:#F7EEDC;stroke:#C9932E;stroke-width:2}.softc{fill:#F7E6E2;stroke:#C95749;stroke-width:2}
.title{font-family:Georgia,'Times New Roman',serif;font-size:54px;font-weight:700;letter-spacing:3.2px}.subtitle{font-family:Georgia,'Times New Roman',serif;font-size:28px;letter-spacing:.8px}
.kicker{font-family:Inter,Arial,sans-serif;font-size:15px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase}.h{font-family:Inter,Arial,sans-serif;font-size:23px;font-weight:800}.body{font-family:Inter,Arial,sans-serif;font-size:17px}.small{font-family:Inter,Arial,sans-serif;font-size:14px}.num{font-family:Georgia,'Times New Roman',serif;font-size:32px;font-weight:700}
</style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#C9932E"/></marker>
  </defs>
  <rect class="bg" width="900" height="1484"/>
  <rect x="28" y="28" width="844" height="1428" rx="18" fill="none" stroke="#D7D0C1" stroke-width="2"/>
  <text x="450" y="74" class="title navy" text-anchor="middle">GESUNDHEIT ALS SYSTEMWIRKUNG</text>
<text x="450" y="116" class="subtitle gold" text-anchor="middle">Prävention statt Reparatur</text>
<line x1="70" y1="146" x2="830" y2="146" class="line"/>
<rect x="74" y="190" width="752" height="120" rx="18" class="softg"/>
<text x="108" y="234" class="num green">1</text>
<text x="160" y="234" class="h navy">Prävention</text>
<text x="160" y="268" class="small text">Gesundheit entsteht, bevor Krankheit repariert werden muss.</text>
<rect x="74" y="332" width="752" height="120" rx="18" class="softo"/>
<text x="108" y="376" class="num gold">2</text>
<text x="160" y="376" class="h navy">Pflege</text>
<text x="160" y="410" class="small text">Pflege stabilisiert Menschen, Familien, Arbeit und Kommunen.</text>
<rect x="74" y="474" width="752" height="120" rx="18" class="softg"/>
<text x="108" y="518" class="num green">3</text>
<text x="160" y="518" class="h navy">Psychische Gesundheit</text>
<text x="160" y="552" class="small text">Belastung, Sicherheit, Sinn und Beziehungen prägen Zustände.</text>
<rect x="74" y="616" width="752" height="120" rx="18" class="softn"/>
<text x="108" y="660" class="num navy">4</text>
<text x="160" y="660" class="h navy">Wohnumfeld</text>
<text x="160" y="694" class="small text">Luft, Hitze, Lärm, Schimmel und Wege wirken auf Gesundheit.</text>
<rect x="74" y="758" width="752" height="120" rx="18" class="softg"/>
<text x="108" y="802" class="num green">5</text>
<text x="160" y="802" class="h navy">Ernährung</text>
<text x="160" y="836" class="small text">Lebensmittelumfelder beeinflussen Krankheit und Teilhabe.</text>
<rect x="74" y="900" width="752" height="120" rx="18" class="softo"/>
<text x="108" y="944" class="num gold">6</text>
<text x="160" y="944" class="h navy">Arbeit</text>
<text x="160" y="978" class="small text">Führung, Taktung, Sicherheit und Sinn erzeugen</text>
<text x="160" y="998" class="small text">Gesundheitswirkung.</text>
<rect x="74" y="1042" width="752" height="120" rx="18" class="softg"/>
<text x="108" y="1086" class="num green">7</text>
<text x="160" y="1086" class="h navy">Klima</text>
<text x="160" y="1120" class="small text">Hitze, Wasser, Luft und Naturzugang werden Gesundheitsfaktoren.</text>
<rect x="74" y="1184" width="752" height="120" rx="18" class="softn"/>
<text x="108" y="1228" class="num navy">8</text>
<text x="160" y="1228" class="h navy">Soziale Beziehungen</text>
<text x="160" y="1262" class="small text">Einsamkeit und Vertrauen wirken wie Infrastruktur.</text>
<rect x="74" y="1342" width="752" height="102" rx="18" class="card"/>
<text x="108" y="1384" class="small navy">Gesundheit wird nicht nur behandelt. Gesundheit wird erzeugt.</text>
</svg>
