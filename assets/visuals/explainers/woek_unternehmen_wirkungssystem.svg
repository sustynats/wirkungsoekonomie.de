<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
  <title id="title">UNTERNEHMEN ALS WIRKUNGSSYSTEM</title>
  <desc id="desc">Führung · Kultur · Wertschöpfung</desc>
  <defs>
    <style>
.bg{fill:#F7F4EC}.navy{fill:#0B1B36}.green{fill:#2D7F5F}.gold{fill:#C9932E}.coral{fill:#C95749}.text{fill:#2E333C}
.line{stroke:#D7D0C1;stroke-width:2;fill:none}.nline{stroke:#0B1B36;stroke-width:2.3;fill:none}.gline{stroke:#2D7F5F;stroke-width:2.3;fill:none}.oline{stroke:#C9932E;stroke-width:2.3;fill:none}.cline{stroke:#C95749;stroke-width:2.3;fill:none}
.card{fill:#fffdfa;stroke:#D7D0C1;stroke-width:2}.softn{fill:#EEF2F7;stroke:#0B1B36;stroke-width:2}.softg{fill:#EAF3EE;stroke:#2D7F5F;stroke-width:2}.softo{fill:#F7EEDC;stroke:#C9932E;stroke-width:2}.softc{fill:#F7E6E2;stroke:#C95749;stroke-width:2}
.title{font-family:Georgia,'Times New Roman',serif;font-size:54px;font-weight:700;letter-spacing:3.2px}.subtitle{font-family:Georgia,'Times New Roman',serif;font-size:28px;letter-spacing:.8px}
.kicker{font-family:Inter,Arial,sans-serif;font-size:15px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase}.h{font-family:Inter,Arial,sans-serif;font-size:23px;font-weight:800}.body{font-family:Inter,Arial,sans-serif;font-size:17px}.small{font-family:Inter,Arial,sans-serif;font-size:14px}.num{font-family:Georgia,'Times New Roman',serif;font-size:32px;font-weight:700}
</style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#C9932E"/></marker>
  </defs>
  <rect class="bg" width="1800" height="1050"/>
  <rect x="28" y="28" width="1744" height="994" rx="18" fill="none" stroke="#D7D0C1" stroke-width="2"/>

  <text x="900" y="88" class="title navy" text-anchor="middle">UNTERNEHMEN ALS WIRKUNGSSYSTEM</text>
  <text x="900" y="128" class="subtitle gold" text-anchor="middle">Führung · Kultur · Wertschöpfung</text>
  <line x1="150" y1="154" x2="1650" y2="154" class="line"/>

<rect x="145" y="235" width="470" height="150" rx="18" class="softn"/>
<text x="171" y="278" class="num navy">1</text>
<text x="223" y="278" class="h navy">Führung</text>
<text x="171" y="317" class="body text">Führung setzt Richtung, Sicherheit,</text>
<text x="171" y="340" class="body text">Verantwortung und Lernfähigkeit.</text>
<line x1="615" y1="310" x2="654" y2="310" class="oline" marker-end="url(#arrow)"/>
<rect x="670" y="235" width="470" height="150" rx="18" class="softg"/>
<text x="696" y="278" class="num green">2</text>
<text x="748" y="278" class="h navy">Kultur</text>
<text x="696" y="317" class="body text">Kultur entscheidet, ob Risiken sichtbar werden</text>
<text x="696" y="340" class="body text">oder verschwiegen bleiben.</text>
<line x1="1140" y1="310" x2="1179" y2="310" class="oline" marker-end="url(#arrow)"/>
<rect x="1195" y="235" width="470" height="150" rx="18" class="softo"/>
<text x="1221" y="278" class="num gold">3</text>
<text x="1273" y="278" class="h navy">Entscheidungen</text>
<text x="1221" y="317" class="body text">Strategie, Einkauf, CAPEX, OPEX und Vergütung</text>
<text x="1221" y="340" class="body text">erzeugen Wirkung.</text>
<rect x="145" y="445" width="470" height="150" rx="18" class="softg"/>
<text x="171" y="488" class="num green">4</text>
<text x="223" y="488" class="h navy">Produkte</text>
<text x="171" y="527" class="body text">Produkte tragen Wirkung in Märkte, Alltag und</text>
<text x="171" y="550" class="body text">Lieferketten.</text>
<line x1="615" y1="520" x2="654" y2="520" class="oline" marker-end="url(#arrow)"/>
<rect x="670" y="445" width="470" height="150" rx="18" class="softn"/>
<text x="696" y="488" class="num navy">5</text>
<text x="748" y="488" class="h navy">Lieferketten</text>
<text x="696" y="527" class="body text">Wasser, Arbeit, Energie, Material und Risiko</text>
<text x="696" y="550" class="body text">werden Teil der Steuerung.</text>
<line x1="1140" y1="520" x2="1179" y2="520" class="oline" marker-end="url(#arrow)"/>
<rect x="1195" y="445" width="470" height="150" rx="18" class="softo"/>
<text x="1221" y="488" class="num gold">6</text>
<text x="1273" y="488" class="h navy">Kapital</text>
<text x="1221" y="527" class="body text">Kapital bleibt Werkzeug und wird nach Wirkung</text>
<text x="1221" y="550" class="body text">zurückgekoppelt.</text>
<rect x="145" y="655" width="470" height="150" rx="18" class="softn"/>
<text x="171" y="698" class="num navy">7</text>
<text x="223" y="698" class="h navy">Kommunikation</text>
<text x="171" y="737" class="body text">Sprache, Marke und Öffentlichkeit erzeugen</text>
<text x="171" y="760" class="body text">Resonanzräume.</text>
<line x1="615" y1="730" x2="654" y2="730" class="oline" marker-end="url(#arrow)"/>
<rect x="670" y="655" width="470" height="150" rx="18" class="softg"/>
<text x="696" y="698" class="num green">8</text>
<text x="748" y="698" class="h navy">Innovation</text>
<text x="696" y="737" class="body text">Innovation zählt, wenn sie Resilienz und</text>
<text x="696" y="760" class="body text">positive Netto-Wirkung stärkt.</text>
<rect x="145" y="900" width="1510" height="92" rx="18" class="card"/>
<text x="190" y="939" class="body navy">Führung wirkt. Entscheidungen wirken. Wertschöpfung wirkt.</text>
</svg>
