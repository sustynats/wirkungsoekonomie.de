<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
  <title id="title">ALLTAG UND WIRKUNG</title>
  <desc id="desc">Wohnen · Einkommen · Rente · Konsum</desc>
  <defs><style>
  .bg{fill:#f7f4ec}.navy{fill:#0b1b36}.green{fill:#2d7f5f}.gold{fill:#c9932e}.coral{fill:#c95749}.muted{fill:#3d4656}
  .line{stroke:#d7d0c1;stroke-width:2;fill:none}.nline{stroke:#0b1b36;stroke-width:2.4;fill:none}.gline{stroke:#2d7f5f;stroke-width:2.4;fill:none}.oline{stroke:#c9932e;stroke-width:2.4;fill:none}.cline{stroke:#c95749;stroke-width:2.4;fill:none}
  .card{fill:rgba(255,255,255,.55);stroke:#d7d0c1;stroke-width:2}.softn{fill:#edf1f7;stroke:#0b1b36;stroke-width:2}.softg{fill:#eaf3ee;stroke:#2d7f5f;stroke-width:2}.softo{fill:#f6edda;stroke:#c9932e;stroke-width:2}.softc{fill:#f6e5e1;stroke:#c95749;stroke-width:2}
  .title{font-family:Georgia,'Times New Roman',serif;font-size:54px;font-weight:700;letter-spacing:4px}.subtitle{font-family:Georgia,'Times New Roman',serif;font-size:28px;letter-spacing:1.1px}
  .kicker{font-family:Inter,Arial,sans-serif;font-size:16px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase}.h{font-family:Inter,Arial,sans-serif;font-size:23px;font-weight:800}.body{font-family:Inter,Arial,sans-serif;font-size:17px}.small{font-family:Inter,Arial,sans-serif;font-size:14px}.num{font-family:Georgia,'Times New Roman',serif;font-size:32px;font-weight:700}
</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#c9932e"/></marker></defs>
  <rect class="bg" width="1800" height="1000"/>
  <rect x="28" y="28" width="1744" height="944" rx="18" fill="none" stroke="#d7d0c1" stroke-width="2"/>
  
  <text x="900" y="88" class="title navy" text-anchor="middle">ALLTAG UND WIRKUNG</text>
  <text x="900" y="128" class="subtitle gold" text-anchor="middle">Wohnen · Einkommen · Rente · Konsum</text>
  <line x1="160" y1="154" x2="1640" y2="154" class="line"/>

<rect x="150" y="238" width="320" height="178" rx="20" class="softg"/>
<text x="174" y="283" class="num green">1</text>
<text x="222" y="283" class="h navy">Wohnen</text>
<text x="174" y="321" class="body muted">Bezahlbarkeit, Energie,</text>
<text x="174" y="344" class="body muted">Gesundheit und Quartier werden</text>
<text x="174" y="367" class="body muted">zusammen gelesen.</text>
<line x1="470" y1="327" x2="507" y2="327" class="oline" marker-end="url(#arrow)"/>
<rect x="525" y="238" width="320" height="178" rx="20" class="softo"/>
<text x="549" y="283" class="num gold">2</text>
<text x="597" y="283" class="h navy">Konsum</text>
<text x="549" y="321" class="body muted">Preise zeigen mehr</text>
<text x="549" y="344" class="body muted">Wirkungswahrheit statt nur</text>
<text x="549" y="367" class="body muted">Knappheit.</text>
<line x1="845" y1="327" x2="882" y2="327" class="oline" marker-end="url(#arrow)"/>
<rect x="900" y="238" width="320" height="178" rx="20" class="softn"/>
<text x="924" y="283" class="num navy">3</text>
<text x="972" y="283" class="h navy">Wirkungseinkommen</text>
<text x="924" y="321" class="body muted">Sicherheit und Teilhabe werden</text>
<text x="924" y="344" class="body muted">als Konzeptarchitektur</text>
<text x="924" y="367" class="body muted">gedacht.</text>
<line x1="1220" y1="327" x2="1257" y2="327" class="oline" marker-end="url(#arrow)"/>
<rect x="1275" y="238" width="320" height="178" rx="20" class="softg"/>
<text x="1299" y="283" class="num green">4</text>
<text x="1347" y="283" class="h navy">Wirkungsrente</text>
<text x="1299" y="321" class="body muted">Care, Pflege, Bildung und</text>
<text x="1299" y="344" class="body muted">Generationenstabilität werden</text>
<text x="1299" y="367" class="body muted">sichtbar.</text>
<rect x="150" y="602" width="320" height="178" rx="20" class="softn"/>
<text x="174" y="647" class="num navy">5</text>
<text x="222" y="647" class="h navy">Information</text>
<text x="174" y="685" class="body muted">Scanner und Quellenklarheit</text>
<text x="174" y="708" class="body muted">entlasten moralische</text>
<text x="174" y="731" class="body muted">Einzelprüfung.</text>
<line x1="470" y1="691" x2="507" y2="691" class="oline" marker-end="url(#arrow)"/>
<rect x="525" y="602" width="320" height="178" rx="20" class="softo"/>
<text x="549" y="647" class="num gold">6</text>
<text x="597" y="647" class="h navy">Handlungsspielraum</text>
<text x="549" y="685" class="body muted">Bürger:innen gewinnen</text>
<text x="549" y="708" class="body muted">Orientierung statt</text>
<text x="549" y="731" class="body muted">Schuldgefühl.</text>
<line x1="845" y1="691" x2="882" y2="691" class="oline" marker-end="url(#arrow)"/>
<rect x="132" y="842" width="1536" height="86" rx="18" class="card"/><text x="178" y="892" class="body navy">Die WÖk bewertet keine Personen. Sie macht Systemsignale im Alltag lesbarer.</text>
</svg>
