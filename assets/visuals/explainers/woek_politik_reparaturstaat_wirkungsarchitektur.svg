<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
  <title id="title">VOM REPARATURSTAAT ZUR WIRKUNGSARCHITEKTUR</title>
  <desc id="desc">Früher prüfen · besser rückkoppeln</desc>
  <defs>
    <style>
.bg{fill:#F7F4EC}.navy{fill:#0B1B36}.green{fill:#2D7F5F}.gold{fill:#C9932E}.coral{fill:#C95749}.text{fill:#2E333C}
.line{stroke:#D7D0C1;stroke-width:2;fill:none}.nline{stroke:#0B1B36;stroke-width:2.3;fill:none}.gline{stroke:#2D7F5F;stroke-width:2.3;fill:none}.oline{stroke:#C9932E;stroke-width:2.3;fill:none}.cline{stroke:#C95749;stroke-width:2.3;fill:none}
.card{fill:#fffdfa;stroke:#D7D0C1;stroke-width:2}.softn{fill:#EEF2F7;stroke:#0B1B36;stroke-width:2}.softg{fill:#EAF3EE;stroke:#2D7F5F;stroke-width:2}.softo{fill:#F7EEDC;stroke:#C9932E;stroke-width:2}.softc{fill:#F7E6E2;stroke:#C95749;stroke-width:2}
.title{font-family:Georgia,'Times New Roman',serif;font-size:54px;font-weight:700;letter-spacing:3.2px}.subtitle{font-family:Georgia,'Times New Roman',serif;font-size:28px;letter-spacing:.8px}
.kicker{font-family:Inter,Arial,sans-serif;font-size:15px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase}.h{font-family:Inter,Arial,sans-serif;font-size:23px;font-weight:800}.body{font-family:Inter,Arial,sans-serif;font-size:17px}.small{font-family:Inter,Arial,sans-serif;font-size:14px}.num{font-family:Georgia,'Times New Roman',serif;font-size:32px;font-weight:700}
</style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#C9932E"/></marker>
  </defs>
  <rect class="bg" width="1800" height="1050"/>
  <rect x="28" y="28" width="1744" height="994" rx="18" fill="none" stroke="#D7D0C1" stroke-width="2"/>

  <text x="900" y="88" class="title navy" text-anchor="middle">VOM REPARATURSTAAT ZUR WIRKUNGSARCHITEKTUR</text>
  <text x="900" y="128" class="subtitle gold" text-anchor="middle">Früher prüfen · besser rückkoppeln</text>
  <line x1="150" y1="154" x2="1650" y2="154" class="line"/>

<rect x="145" y="235" width="470" height="150" rx="18" class="softc"/>
<text x="171" y="278" class="num coral">1</text>
<text x="223" y="278" class="h navy">Falsche Preise</text>
<text x="171" y="317" class="body text">Wenn Wirkung fehlt, senden Märkte und Steuern</text>
<text x="171" y="340" class="body text">falsche Signale.</text>
<line x1="615" y1="310" x2="654" y2="310" class="oline" marker-end="url(#arrow)"/>
<rect x="670" y="235" width="470" height="150" rx="18" class="softc"/>
<text x="696" y="278" class="num coral">2</text>
<text x="748" y="278" class="h navy">Schäden</text>
<text x="696" y="317" class="body text">Folgekosten werden spät sichtbar: Klima,</text>
<text x="696" y="340" class="body text">Wohnen, Gesundheit, Vertrauen.</text>
<line x1="1140" y1="310" x2="1179" y2="310" class="oline" marker-end="url(#arrow)"/>
<rect x="1195" y="235" width="470" height="150" rx="18" class="softo"/>
<text x="1221" y="278" class="num gold">3</text>
<text x="1273" y="278" class="h navy">Bürokratie</text>
<text x="1221" y="317" class="body text">Förderprogramme, Sonderregeln und Nachweise</text>
<text x="1221" y="340" class="body text">reparieren verspätet.</text>
<rect x="145" y="445" width="470" height="150" rx="18" class="softg"/>
<text x="171" y="488" class="num green">4</text>
<text x="223" y="488" class="h navy">Wirkungsprüfung</text>
<text x="171" y="527" class="body text">Maßnahmen werden vorab nach Wirkpfad und</text>
<text x="171" y="550" class="body text">Zielkonflikt gelesen.</text>
<line x1="615" y1="520" x2="654" y2="520" class="oline" marker-end="url(#arrow)"/>
<rect x="670" y="445" width="470" height="150" rx="18" class="softg"/>
<text x="696" y="488" class="num green">5</text>
<text x="748" y="488" class="h navy">Wirkungshaushalt</text>
<text x="696" y="527" class="body text">Ausgaben werden nach Prävention und Netto-</text>
<text x="696" y="550" class="body text">Wirkung betrachtet.</text>
<line x1="1140" y1="520" x2="1179" y2="520" class="oline" marker-end="url(#arrow)"/>
<rect x="1195" y="445" width="470" height="150" rx="18" class="softn"/>
<text x="1221" y="488" class="num navy">6</text>
<text x="1273" y="488" class="h navy">Wirkungssteuer</text>
<text x="1221" y="527" class="body text">Anreize verändern sich dort, wo Schäden</text>
<text x="1221" y="550" class="body text">entstehen.</text>
<rect x="145" y="655" width="470" height="150" rx="18" class="softg"/>
<text x="171" y="698" class="num green">7</text>
<text x="223" y="698" class="h navy">Rückkopplung</text>
<text x="171" y="737" class="body text">Recht, Haushalt, Beschaffung und Evaluation</text>
<text x="171" y="760" class="body text">lernen gemeinsam.</text>
<line x1="615" y1="730" x2="654" y2="730" class="oline" marker-end="url(#arrow)"/>
<rect x="670" y="655" width="470" height="150" rx="18" class="softo"/>
<text x="696" y="698" class="num gold">8</text>
<text x="748" y="698" class="h navy">Vertrauen</text>
<text x="696" y="737" class="body text">Politik wird nachvollziehbarer, weil Wirkung</text>
<text x="696" y="760" class="body text">sichtbar wird.</text>
<rect x="145" y="900" width="1510" height="92" rx="18" class="card"/>
<text x="190" y="939" class="body navy">Alte Politik repariert Folgen. Wirkungsorientierte Politik verändert die Anreize, die Folgen erzeugen.</text>
</svg>
