<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1140" viewBox="0 0 900 1140" role="img" aria-labelledby="title desc">
  <title id="title">UNTERNEHMEN ALS WIRKUNGSSYSTEM</title>
  <desc id="desc">Lieferketten · Kapital · T-SROI</desc>
  <defs><style>
  .bg{fill:#f7f4ec}.navy{fill:#0b1b36}.green{fill:#2d7f5f}.gold{fill:#c9932e}.coral{fill:#c95749}.muted{fill:#3d4656}
  .line{stroke:#d7d0c1;stroke-width:2;fill:none}.nline{stroke:#0b1b36;stroke-width:2.4;fill:none}.gline{stroke:#2d7f5f;stroke-width:2.4;fill:none}.oline{stroke:#c9932e;stroke-width:2.4;fill:none}.cline{stroke:#c95749;stroke-width:2.4;fill:none}
  .card{fill:rgba(255,255,255,.55);stroke:#d7d0c1;stroke-width:2}.softn{fill:#edf1f7;stroke:#0b1b36;stroke-width:2}.softg{fill:#eaf3ee;stroke:#2d7f5f;stroke-width:2}.softo{fill:#f6edda;stroke:#c9932e;stroke-width:2}.softc{fill:#f6e5e1;stroke:#c95749;stroke-width:2}
  .title{font-family:Georgia,'Times New Roman',serif;font-size:54px;font-weight:700;letter-spacing:4px}.subtitle{font-family:Georgia,'Times New Roman',serif;font-size:28px;letter-spacing:1.1px}
  .kicker{font-family:Inter,Arial,sans-serif;font-size:16px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase}.h{font-family:Inter,Arial,sans-serif;font-size:23px;font-weight:800}.body{font-family:Inter,Arial,sans-serif;font-size:17px}.small{font-family:Inter,Arial,sans-serif;font-size:14px}.num{font-family:Georgia,'Times New Roman',serif;font-size:32px;font-weight:700}
</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#c9932e"/></marker></defs>
  <rect class="bg" width="900" height="1140"/>
  <rect x="28" y="28" width="844" height="1084" rx="18" fill="none" stroke="#d7d0c1" stroke-width="2"/>
  <text x="450" y="74" class="title navy" text-anchor="middle">UNTERNEHMEN ALS WIRKUNGSSYSTEM</text>
<text x="450" y="116" class="subtitle gold" text-anchor="middle">Lieferketten · Kapital · T-SROI</text>
<line x1="70" y1="145" x2="830" y2="145" class="line"/>
<rect x="74" y="190" width="752" height="112" rx="18" class="softg"/>
<text x="108" y="232" class="num green">1</text>
<text x="160" y="232" class="h navy">Lieferkette</text>
<text x="160" y="264" class="small muted">Wasser, Arbeit, Klima und Governance werden als Wirkungsräume</text>
<text x="160" y="284" class="small muted">sichtbar.</text>
<rect x="74" y="324" width="752" height="112" rx="18" class="softn"/>
<text x="108" y="366" class="num navy">2</text>
<text x="160" y="366" class="h navy">WÖk-ID</text>
<text x="160" y="398" class="small muted">Daten werden vergleichbar und anschlussfähig.</text>
<rect x="74" y="458" width="752" height="112" rx="18" class="softo"/>
<text x="108" y="500" class="num gold">3</text>
<text x="160" y="500" class="h navy">Scorecard</text>
<text x="160" y="532" class="small muted">Wirkungsfelder werden strukturiert gelesen.</text>
<rect x="74" y="592" width="752" height="112" rx="18" class="softg"/>
<text x="108" y="634" class="num green">4</text>
<text x="160" y="634" class="h navy">T-SROI</text>
<text x="160" y="666" class="small muted">Transformationswirkung ergänzt klassische Wirtschaftlichkeit.</text>
<rect x="74" y="726" width="752" height="112" rx="18" class="softn"/>
<text x="108" y="768" class="num navy">5</text>
<text x="160" y="768" class="h navy">Kapital</text>
<text x="160" y="800" class="small muted">Finanzierung liest Wirkung als Risiko- und Zukunftsinformation.</text>
<rect x="74" y="860" width="752" height="112" rx="18" class="softg"/>
<text x="108" y="902" class="num green">6</text>
<text x="160" y="902" class="h navy">Management</text>
<text x="160" y="934" class="small muted">Einkauf, CAPEX, Innovation und Strategie werden rückgekoppelt.</text>
<rect x="74" y="1006" width="752" height="96" rx="18" class="card"/><text x="108" y="1048" class="small navy">Von ESG als Berichtspflicht zu Wirkung als Steuerungslogik für</text>
<text x="108" y="1069" class="small navy">resiliente Unternehmen.</text>
