  <text x="450" y="74" class="title navy" text-anchor="middle">WIRKUNG STATT KAPITAL</text>
<text x="450" y="116" class="subtitle gold" text-anchor="middle">Mensch · Planet · Demokratie</text>
<line x1="70" y1="145" x2="830" y2="145" class="line"/>
<rect x="74" y="190" width="752" height="112" rx="18" class="softn"/>
<text x="108" y="232" class="num navy">1</text>
<text x="160" y="232" class="h navy">Alte Logik</text>
<text x="160" y="264" class="small muted">Kapital, Gewinn und Wachstum messen Bewegung, aber nicht</text>
<text x="160" y="284" class="small muted">Richtung.</text>
<rect x="74" y="324" width="752" height="112" rx="18" class="softg"/>
<text x="108" y="366" class="num green">2</text>
<text x="160" y="366" class="h navy">Neuer Kompass</text>
<text x="160" y="398" class="small muted">Wirkung wird an Mensch, Planet und Demokratie gelesen.</text>
<rect x="74" y="458" width="752" height="112" rx="18" class="softo"/>
<text x="108" y="500" class="num gold">3</text>
<text x="160" y="500" class="h navy">Zielgröße</text>
<text x="160" y="532" class="small muted">positive Netto-Wirkung statt blinder Kapitalbewegung.</text>
<rect x="74" y="604" width="752" height="96" rx="18" class="card"/><text x="108" y="646" class="small navy">Kapital bleibt Werkzeug. Wirkung wird Kompass.</text>
