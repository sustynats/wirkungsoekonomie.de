<svg xmlns="http://www.w3.org/2000/svg" width="900" height="738" viewBox="0 0 900 738" role="img" aria-labelledby="title desc">
  <title id="title">WIRKUNG STATT KAPITAL</title>
  <desc id="desc">Mensch · Planet · Demokratie</desc>
  <defs><style>
  .bg{fill:#f7f4ec}.navy{fill:#0b1b36}.green{fill:#2d7f5f}.gold{fill:#c9932e}.coral{fill:#c95749}.muted{fill:#3d4656}
