<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" role="img" aria-labelledby="title desc">
  <title id="title">Header-Logo der Wirkungsökonomie</title>
  <desc id="desc">WÖk-Signet mit drei Kreisen, Kompass und Wortmarke Wirkungsökonomie.</desc>
  <defs>
    <linearGradient id="woek-bg" x1="13" y1="11" x2="107" y2="109" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#071a3a"/>
      <stop offset=".52" stop-color="#031126"/>
      <stop offset="1" stop-color="#08234a"/>
    </linearGradient>
    <radialGradient id="woek-glow" cx="50%" cy="52%" r="58%">
      <stop offset="0" stop-color="#123866" stop-opacity=".82"/>
      <stop offset="1" stop-color="#031126" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="woek-needle-gold" x1="60" y1="50" x2="60" y2="73" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd27b"/>
      <stop offset="1" stop-color="#d69d35"/>
