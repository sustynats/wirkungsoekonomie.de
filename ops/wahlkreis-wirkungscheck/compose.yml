name: ${COMPOSE_PROJECT_NAME:-woek-wahlkreis}

services:
  proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    profiles: [production]
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge

  crm-db:
    image: mysql:8.4
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_DATABASE: ${CRM_DB_NAME}
      MYSQL_USER: ${CRM_DB_USER}
      MYSQL_PASSWORD: ${CRM_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${CRM_DB_ROOT_PASSWORD}
      TZ: ${TZ}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-log-bin
    volumes:
      - crm_db:/var/lib/mysql
      - ./mysql/civicrm.cnf:/etc/mysql/conf.d/99-civicrm.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - data

  crm:
    build:
      context: ./civicrm
      args:
        CIVICRM_VERSION: "6.17.2"
        CIVICRM_SHA256: "8170a3da39817ca63eacd7d855af0ca11ff8805c83525789cb608619c9c5a2e7"
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    depends_on:
      crm-db:
        condition: service_healthy
    volumes:
      - crm_private:/var/www/civicrm/private
      - crm_media:/var/www/civicrm/public/media
      - crm_extensions:/var/www/civicrm/ext
    networks:
      - edge
      - data

  survey-db:
    image: mariadb:11.4
    restart: unless-stopped
    env_file: .env
    environment:
      MARIADB_DATABASE: ${SURVEY_DB_NAME}
      MARIADB_USER: ${SURVEY_DB_USER}
      MARIADB_PASSWORD: ${SURVEY_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${SURVEY_DB_ROOT_PASSWORD}
      TZ: ${TZ}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - survey_db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p\"$$MARIADB_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - data

  survey:
    image: acspri/limesurvey:6.17.14
    restart: unless-stopped
    env_file: .env
    environment:
      LIMESURVEY_DB_HOST: survey-db
      LIMESURVEY_DB_PORT: "3306"
      LIMESURVEY_DB_NAME: ${SURVEY_DB_NAME}
      LIMESURVEY_DB_USER: ${SURVEY_DB_USER}
      LIMESURVEY_DB_PASSWORD: ${SURVEY_DB_PASSWORD}
      LIMESURVEY_TABLE_PREFIX: lime_
      LIMESURVEY_USE_INNODB: "1"
      LIMESURVEY_ADMIN_USER: ${SURVEY_ADMIN_USER}
      LIMESURVEY_ADMIN_PASSWORD: ${SURVEY_ADMIN_PASSWORD}
      LIMESURVEY_ADMIN_NAME: ${SURVEY_ADMIN_NAME}
      LIMESURVEY_ADMIN_EMAIL: ${SURVEY_ADMIN_EMAIL}
      LIMESURVEY_DEBUG: "0"
      TZ: ${TZ}
    depends_on:
      survey-db:
        condition: service_healthy
    volumes:
      - survey_config:/var/www/html/application/config
      - survey_plugins:/var/www/html/plugins
      - survey_uploads:/var/www/html/upload
    networks:
      - edge
      - data

  analytics-db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    profiles: [production, analytics]
    env_file: .env
    environment:
      POSTGRES_DB: ${ANALYTICS_DB_NAME}
      POSTGRES_USER: ${ANALYTICS_DB_USER}
      POSTGRES_PASSWORD: ${ANALYTICS_DB_PASSWORD}
      TZ: ${TZ}
    volumes:
      - analytics_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - data

  analytics-migrate:
    build: ./analytics
    profiles: [production, analytics]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${ANALYTICS_DB_USER}:${ANALYTICS_DB_PASSWORD}@analytics-db:5432/${ANALYTICS_DB_NAME}
    command: ["node", "dist/migrate.js"]
    depends_on:
      analytics-db:
        condition: service_healthy
    networks:
      - data

  analytics:
    build: ./analytics
    restart: unless-stopped
    profiles: [production, analytics]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${ANALYTICS_DB_USER}:${ANALYTICS_DB_PASSWORD}@analytics-db:5432/${ANALYTICS_DB_NAME}
    depends_on:
      analytics-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    networks:
      - edge
      - data

  analytics-jobs:
    build: ./analytics
    restart: unless-stopped
    profiles: [production, analytics]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${ANALYTICS_DB_USER}:${ANALYTICS_DB_PASSWORD}@analytics-db:5432/${ANALYTICS_DB_NAME}
    command:
      - /bin/sh
      - -ec
      - |
        while true; do
          node dist/jobs/purge.js || true
          sleep 3600
        done
    depends_on:
      analytics-migrate:
        condition: service_completed_successfully
    networks:
      - data

  crm-jobs:
    image: curlimages/curl:8.12.1
    restart: unless-stopped
    profiles: [operations]
    env_file: .env
    depends_on:
      crm:
        condition: service_started
    command:
      - /bin/sh
      - -ec
      - |
        test -n "$${CIVICRM_CRON_URL:-}" || { echo "CIVICRM_CRON_URL fehlt" >&2; exit 1; }
        while true; do
          curl --fail --silent --show-error --max-time 120 "$${CIVICRM_CRON_URL}" || true
          sleep 300
        done
    networks:
      - edge

networks:
  edge:
  data:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  crm_db:
  crm_private:
  crm_media:
  crm_extensions:
  survey_db:
  survey_config:
  survey_plugins:
  survey_uploads:
  analytics_db:
