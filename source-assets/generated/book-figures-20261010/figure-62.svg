<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1233" viewBox="0 0 1000 1233">
<title>Das Wirkungssystem Gesundheit</title>
<desc>Behandlung, Prävention und Lebensbedingungen gemeinsam betrachten Modellperspektive: Gesundheitszustände zusätzlich zu Fallzahlen und Abrechnung beurteilen. Bestehende Medizin und Prävention werden ergänzt. Kosteneinsparung, Gesundheitsgewinn und Schutzrechte bleiben getrennte Befunde.</desc>
<rect width="1000" height="1233" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Das Wirkungssystem Gesundheit</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Behandlung, Prävention und Lebensbedingungen gemeinsam betrachten</text>
<rect x="32.0" y="140" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Notwendige Versorgung</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Diagnose, Behandlung, Pflege und</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Rehabilitation bleiben</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">unverzichtbar. Vorhandene</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Prävention und</text>
<text x="52.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gesundheitsförderung gehören zur</text>
<text x="52.0" y="398" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Ausgangsarchitektur.</text>
<rect x="512.0" y="140" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Prävention und Alltag</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Bewegung, Ernährung, Umwelt und</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wohnen mit ihren Bedingungen</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">betrachten. Zusätzlich vermiedene</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Schäden mit Vergleich und</text>
<text x="532.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zurechnung nachweisen.</text>
<rect x="32.0" y="454" width="456.0" height="292" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="494" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Bildung und Arbeit</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wissen, Zugang und</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Arbeitsbedingungen können</text>
<text x="52.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gesundheit beeinflussen. Angebote</text>
<text x="52.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und erreichte Menschen sind noch</text>
<text x="52.0" y="678" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">keine nachgewiesenen</text>
<text x="52.0" y="712" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gesundheitsgewinne.</text>
<rect x="512.0" y="454" width="456.0" height="292" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="494" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Beziehung und psychische</text>
<text x="532.0" y="530" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Gesundheit</text>
<text x="532.0" y="578" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Soziale Beziehungen, Isolation,</text>
<text x="532.0" y="612" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Sicherheit und mentale Gesundheit</text>
<text x="532.0" y="646" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">berücksichtigen. Unterschiede</text>
<text x="532.0" y="680" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">zwischen betroffenen Gruppen</text>
<text x="532.0" y="714" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">sichtbar halten.</text>
<rect x="32.0" y="770" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="810" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Gekoppelte Systeme</text>
<text x="52.0" y="858" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Versorgung, Ressourcen und</text>
<text x="52.0" y="892" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">äußere Einflussfaktoren verbinden.</text>
<text x="52.0" y="926" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wechselwirkungen und</text>
<text x="52.0" y="960" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Rückkopplungen mit Raum,</text>
<text x="52.0" y="994" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zeitraum und Evidenz untersuchen.</text>
<rect x="512.0" y="770" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="810" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Resilienz und Lernen</text>
<text x="532.0" y="858" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Kontinuierlich prüfen, ob</text>
<text x="532.0" y="892" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Lebensqualität, Zugang und</text>
<text x="532.0" y="926" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Belastbarkeit besser werden.</text>
<text x="532.0" y="960" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Sektorübergreifende</text>
<text x="532.0" y="994" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zusammenarbeit unterstützt das</text>
<text x="532.0" y="1028" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Ziel; sie garantiert keine Wirkung.</text>
<text x="32" y="1088" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Modellperspektive: Gesundheitszustände zusätzlich zu Fallzahlen und Abrechnung</text>
<text x="32" y="1119" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">beurteilen. Bestehende Medizin und Prävention werden ergänzt. Kosteneinsparung,</text>
<text x="32" y="1150" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Gesundheitsgewinn und Schutzrechte bleiben getrennte Befunde.</text>
<text x="32" y="1211.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
