<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1513" viewBox="0 0 1000 1513">
<title>Das Wirkungsrad</title>
<desc>Prüfen, entscheiden, beobachten und lernen Modell einer Lernschleife. Wirkung ist nicht erst durch institutionelle Rückkopplung gegeben und schafft nicht automatisch Zukunftsfähigkeit. Lernen braucht tatsächliche Beobachtung und verfügbare Handlungsmöglichkeiten.</desc>
<rect width="1000" height="1513" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Das Wirkungsrad</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Prüfen, entscheiden, beobachten und lernen</text>
<rect x="32.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Handlung oder Unterlassen</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gesetze, Produkte, Investitionen</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und Nicht-Handeln als</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Ausgangspunkt bestimmen. Den</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Vergleichszustand und die</text>
<text x="52.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Systemgrenze offenlegen.</text>
<rect x="512.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Potenzial und Risiko</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Möglichkeiten, Verwundbarkeit und</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Schwellen mit Bedingungen und</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Unsicherheit dokumentieren.</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Erwartete Folge ist kein bereits</text>
<text x="532.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">eingetretener Befund.</text>
<rect x="32.0" y="420" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Tatsächliche Veränderungen</text>
<text x="52.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Emissionen, Gesundheit, Kosten</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">oder Vertrauen mit Beobachtungen,</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Vergleich und Zurechnung</text>
<text x="52.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">untersuchen. Nicht automatisch</text>
<text x="52.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">eine Richtung unterstellen.</text>
<rect x="512.0" y="420" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Wirkungsordnungen</text>
<text x="532.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Direkte Veränderungen, indirekte</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Folgen und strukturelle</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Veränderungen unterscheiden.</text>
<text x="532.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Rückpfade und zeitliche</text>
<text x="532.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Verzögerung sichtbar halten.</text>
<rect x="32.0" y="700" width="456.0" height="326" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="740" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Bewertung und Schutz</text>
<text x="52.0" y="788" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Systemische Bedeutung von</text>
<text x="52.0" y="822" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">normativem Urteil trennen. Mensch,</text>
<text x="52.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Planet, Demokratie,</text>
<text x="52.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Nichtkompensation und Reverse</text>
<text x="52.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Merit Order berücksichtigen.</text>
<rect x="512.0" y="700" width="456.0" height="326" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="740" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Lenkung und neues</text>
<text x="532.0" y="776" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Verhalten</text>
<text x="532.0" y="824" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Preise, Steuern, Kapital,</text>
<text x="532.0" y="858" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Beschaffung und Regeln können</text>
<text x="532.0" y="892" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Anreize verändern. Innovation,</text>
<text x="532.0" y="926" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Kauf- und</text>
<text x="532.0" y="960" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Investitionsentscheidungen später</text>
<text x="532.0" y="994" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">prüfen.</text>
<rect x="32.0" y="1050" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="1090" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Sanierung und Produktpass</text>
<text x="52.0" y="1138" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Energiebedarf und Warmkosten</text>
<text x="52.0" y="1172" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">getrennt prüfen. Ein Datenpass</text>
<text x="52.0" y="1206" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">kann Kaufentscheidungen</text>
<text x="52.0" y="1240" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">unterstützen; Lieferkettenänderung</text>
<text x="52.0" y="1274" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und Markttransformation bleiben</text>
<text x="52.0" y="1308" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">eigene Befunde.</text>
<rect x="512.0" y="1050" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="1090" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Öffentlichkeit und Lernen</text>
<text x="532.0" y="1138" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Moderation kann</text>
<text x="532.0" y="1172" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Diskursbedingungen ändern.</text>
<text x="532.0" y="1206" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Demokratieverbesserung gesondert</text>
<text x="532.0" y="1240" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">nachweisen und Entscheidungen</text>
<text x="532.0" y="1274" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">anpassen; ein Kreisdiagramm</text>
<text x="532.0" y="1308" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">beweist keinen Erfolg.</text>
<text x="32" y="1368" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Modell einer Lernschleife. Wirkung ist nicht erst durch institutionelle Rückkopplung</text>
<text x="32" y="1399" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">gegeben und schafft nicht automatisch Zukunftsfähigkeit. Lernen braucht tatsächliche</text>
<text x="32" y="1430" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Beobachtung und verfügbare Handlungsmöglichkeiten.</text>
<text x="32" y="1491.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
