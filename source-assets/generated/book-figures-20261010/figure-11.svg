<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1202" viewBox="0 0 1000 1202">
<title>Die Entstehung des falschen Kompasses</title>
<desc>Historische Deutung: vom Koordinationsmittel zum alleinigen Erfolgsmaßstab Vereinfachte historische Interpretation, keine abschließende Chronologie. Kapital bleibt Werkzeug; Markt, Wettbewerb und dezentrale Entscheidungen bleiben erhalten.</desc>
<rect width="1000" height="1202" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Die Entstehung des falschen Kompasses</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Historische Deutung: vom Koordinationsmittel zum alleinigen Erfolgsmaßstab</text>
<rect x="32.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Adam Smith</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Arbeitsteilung, Markt und Tausch</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">prägen die historische</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Koordinationsfrage. Die Darstellung</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">verdichtet eine umfangreichere</text>
<text x="52.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Debatte.</text>
<rect x="512.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Industrialisierung</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Maschinen, Produktion, Skalierung</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und Effizienz verändern</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">wirtschaftliche Möglichkeiten.</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Mengenwachstum beantwortet</text>
<text x="532.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">nicht jede Qualitätsfrage.</text>
<rect x="32.0" y="420" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Neoklassik und Wachstum</text>
<text x="52.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Rationale Akteure, formalisierte</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Modelle und BIP als</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Fortschrittsmaß werden zum</text>
<text x="52.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gegenstand der Kritik.</text>
<text x="52.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Ökonomische Schulen bleiben</text>
<text x="52.0" y="678" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">verschieden.</text>
<rect x="512.0" y="420" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Finanzialisierung</text>
<text x="532.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Entkopplung von realer</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wertschöpfung und sozialisierte</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Risiken sind zu prüfende</text>
<text x="532.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Problembeschreibungen, keine</text>
<text x="532.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Eigenschaften jedes Kapitalflusses.</text>
<rect x="32.0" y="734" width="456.0" height="326" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="774" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Grenze des Preismaßstabs</text>
<text x="52.0" y="822" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Preis, kurzfristiger Ertrag und</text>
<text x="52.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">langfristige Folgen sind</text>
<text x="52.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">verschiedene Größen. Ein</text>
<text x="52.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">finanzieller Erfolg kann mit positiven</text>
<text x="52.0" y="958" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">oder negativen Veränderungen</text>
<text x="52.0" y="992" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">einhergehen.</text>
<rect x="512.0" y="734" width="456.0" height="326" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="774" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Wirkungsökonomische</text>
<text x="532.0" y="810" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Leitfrage</text>
<text x="532.0" y="858" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Kapital, Wachstum und Gewinn</text>
<text x="532.0" y="892" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">durch tatsächliche Folgen,</text>
<text x="532.0" y="926" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Stabilität, Verteilung und</text>
<text x="532.0" y="960" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zukunftsfähigkeit ergänzen. Kein</text>
<text x="532.0" y="994" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">einzelner Maßstab ersetzt</text>
<text x="532.0" y="1028" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Schutzrechte.</text>
<text x="32" y="1088" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Vereinfachte historische Interpretation, keine abschließende Chronologie. Kapital bleibt</text>
<text x="32" y="1119" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Werkzeug; Markt, Wettbewerb und dezentrale Entscheidungen bleiben erhalten.</text>
<text x="32" y="1180.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
