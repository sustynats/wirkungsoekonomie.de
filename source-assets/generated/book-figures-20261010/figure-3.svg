<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1129" viewBox="0 0 1000 1129">
<title>Die große Illusion</title>
<desc>Teil I: Kapital als Werkzeug und Grenzen eines allein finanziellen Maßstabs Normative Gegenüberstellung, keine pauschale Tatsachenbeschreibung jeder Wirtschaft. Ziel ist positive Netto-Wirkung unter Schutzbedingungen; die WÖk ist keine zentrale Planwirtschaft.</desc>
<rect width="1000" height="1129" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Die große Illusion</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Teil I: Kapital als Werkzeug und Grenzen eines allein finanziellen Maßstabs</text>
<rect x="32.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Finanzielle Leitgrößen</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Preis, Gewinn und Wachstum</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">beschreiben wirtschaftliche Größen.</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Sie beantworten nicht allein, welche</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zustände sich für Menschen und</text>
<text x="52.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Systeme verändern.</text>
<rect x="512.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Ausgelagerte Folgen</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Soziale Belastung, ökologische</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Schäden und langfristige Kosten</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">können außerhalb der eigenen</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Kalkulation bleiben. Konkrete Fälle</text>
<text x="532.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">brauchen eigene Belege.</text>
<rect x="32.0" y="420" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Mensch</text>
<text x="52.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Würde, Lebensqualität, Potenziale</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und Wohlbefinden betrachten. Nicht</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">jede bezahlte Leistung und nicht</text>
<text x="52.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">jeder Gewinn ist ein</text>
<text x="52.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">gesellschaftlicher Erfolg.</text>
<rect x="512.0" y="420" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Planet</text>
<text x="532.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Ökosysteme, Regeneration und</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Resilienz berücksichtigen.</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Kreisläufe und spätere Folgen</text>
<text x="532.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">zusätzlich zur Produktion und zum</text>
<text x="532.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Konsum untersuchen.</text>
<rect x="32.0" y="700" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="740" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Demokratie</text>
<text x="52.0" y="788" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Teilhabe, Rechtsstaat und</text>
<text x="52.0" y="822" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gemeinwohl sind Schutz- und</text>
<text x="52.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Referenzräume. Entscheidungen</text>
<text x="52.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">werden demokratisch legitimiert</text>
<text x="52.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und bleiben überprüfbar.</text>
<rect x="512.0" y="700" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="740" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Rückkopplung</text>
<text x="532.0" y="788" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Beobachtungen können Lernen,</text>
<text x="532.0" y="822" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Anpassung und neue Regeln</text>
<text x="532.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">ermöglichen. Markt, Wettbewerb</text>
<text x="532.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und dezentrale Entscheidungen</text>
<text x="532.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">bleiben Teil des Modells.</text>
<text x="32" y="984" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Normative Gegenüberstellung, keine pauschale Tatsachenbeschreibung jeder</text>
<text x="32" y="1015" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Wirtschaft. Ziel ist positive Netto-Wirkung unter Schutzbedingungen; die WÖk ist keine</text>
<text x="32" y="1046" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">zentrale Planwirtschaft.</text>
<text x="32" y="1107.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
