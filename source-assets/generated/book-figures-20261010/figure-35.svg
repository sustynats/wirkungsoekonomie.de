<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1233" viewBox="0 0 1000 1233">
<title>Generationenverantwortung</title>
<desc>Künftige Handlungsmöglichkeiten über mehr als Ökologie betrachten Vorgriffswohlstand bezeichnet heutigen Erfolg auf Kosten künftiger Stabilität. Das Ziel ist mehr spätere Handlungsfähigkeit. Keine der dargestellten Folgen tritt aus der bloßen Benennung eines Bereichs automatisch ein.</desc>
<rect width="1000" height="1233" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Generationenverantwortung</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Künftige Handlungsmöglichkeiten über mehr als Ökologie betrachten</text>
<rect x="32.0" y="140" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Ökologische Vorgriffe</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Emissionen, Bodenversiegelung,</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Artenverlust, Wasserübernutzung</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und Ressourcenabbau können</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Lebensgrundlagen verringern und</text>
<text x="52.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Anpassungsaufwand verlagern.</text>
<rect x="512.0" y="140" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Soziale Vorgriffe</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Unterfinanzierte Bildung, belastete</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gesundheits- und Pflegesysteme,</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Ungleichheit, fehlender Wohnraum</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und geringe Teilhabe können</text>
<text x="532.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">spätere Startbedingungen</text>
<text x="532.0" y="398" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">verschlechtern.</text>
<rect x="32.0" y="454" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="494" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Demokratische Vorgriffe</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Desinformation, Vertrauensverlust,</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Rechtsstaatsabbau, Polarisierung</text>
<text x="52.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und geschwächte Streitkultur</text>
<text x="52.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">können öffentliche</text>
<text x="52.0" y="678" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Korrekturfähigkeit beeinträchtigen.</text>
<rect x="512.0" y="454" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="494" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Infrastrukturelle Vorgriffe</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Sanierungsstau bei Straßen,</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Schulen, Kitas, digitalen Netzen,</text>
<text x="532.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wasser, Energie und Pflege kann</text>
<text x="532.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">teure Reparatur oder</text>
<text x="532.0" y="678" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Funktionsverluste nach sich ziehen.</text>
<rect x="32.0" y="734" width="456.0" height="326" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="774" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Kapitalbezogene Vorgriffe</text>
<text x="52.0" y="822" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Überholte Anlagen, Risiko- und</text>
<text x="52.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Schuldenverschiebung, Spekulation</text>
<text x="52.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und Fehlanreize können</text>
<text x="52.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Abschreibung, Rettungsaufwand</text>
<text x="52.0" y="958" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und weniger</text>
<text x="52.0" y="992" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Investitionsmöglichkeiten bewirken.</text>
<rect x="512.0" y="734" width="456.0" height="326" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="774" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Zeit, Verteilung und</text>
<text x="532.0" y="810" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Nachweis</text>
<text x="532.0" y="858" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Heutigen Nutzen von möglicher</text>
<text x="532.0" y="892" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">künftiger Belastung unterscheiden.</text>
<text x="532.0" y="926" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Raum, Zeitverzug, Betroffene und</text>
<text x="532.0" y="960" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Bedingungen dokumentieren;</text>
<text x="532.0" y="994" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">künftiger Schaden ist noch kein</text>
<text x="532.0" y="1028" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">eingetretener Befund.</text>
<text x="32" y="1088" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Vorgriffswohlstand bezeichnet heutigen Erfolg auf Kosten künftiger Stabilität. Das Ziel</text>
<text x="32" y="1119" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">ist mehr spätere Handlungsfähigkeit. Keine der dargestellten Folgen tritt aus der bloßen</text>
<text x="32" y="1150" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Benennung eines Bereichs automatisch ein.</text>
<text x="32" y="1211.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
