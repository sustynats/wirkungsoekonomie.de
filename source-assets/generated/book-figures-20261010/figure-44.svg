<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="818" viewBox="0 0 1000 818">
<title>Recht und Wirkungsprüfung</title>
<desc>WÖk-Zielarchitektur ergänzt bestehende Verfahren Keine Erfindung der Folgen- oder Alternativenprüfung. Öffentlich nicht auffindbare eNAP-Dokumentation beweist keine unterlassene Prüfung.</desc>
<rect width="1000" height="818" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Recht und Wirkungsprüfung</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">WÖk-Zielarchitektur ergänzt bestehende Verfahren</text>
<rect x="32.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Bestehender Rahmen</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Für Bundesregelungsvorhaben:</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">DNS, GGO §§ 43/44,</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Nachhaltigkeitsprüfung und eNAP.</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Finanzwirksame Maßnahmen: § 7</text>
<text x="52.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">BHO und VV-BHO.</text>
<rect x="512.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Zusatzprüfung am Objekt</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Problem und Ziele, Wirkpfad,</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Kaskaden, Verteilung, Resilienz,</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gegenfaktum, Optionen und Reality</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Check untersuchen.</text>
<rect x="32.0" y="420" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Demokratische Legitimation</text>
<text x="52.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Grundrechte, parlamentarische</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zuständigkeit, Verhältnismäßigkeit,</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Begründung, Beteiligung und</text>
<text x="52.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Rechtsschutz wahren.</text>
<rect x="512.0" y="420" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Kein Blankoscheck</text>
<text x="532.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wirkungsurteile ersetzen kein</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gesetz. Bundesverfahren gelten</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">nicht pauschal für Kommunen,</text>
<text x="532.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Unternehmen oder</text>
<text x="532.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">EU-Entscheidungen.</text>
<text x="32" y="704" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Keine Erfindung der Folgen- oder Alternativenprüfung. Öffentlich nicht auffindbare</text>
<text x="32" y="735" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">eNAP-Dokumentation beweist keine unterlassene Prüfung.</text>
<text x="32" y="796.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
