<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1477" viewBox="0 0 1000 1477">
<title>Wirkungsorientierte Unternehmensführung</title>
<desc>Positive Netto-Wirkung, wirtschaftliche Tragfähigkeit und Schutz verbinden Normatives Führungsmodell. Unternehmen sollen positive Netto-Wirkung ermöglichen; ihre Existenz oder ihr Gewinn beweist diese nicht. Keine moralische Personenrangliste und keine automatische Score-zu-Steuer-Folge.</desc>
<rect width="1000" height="1477" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Wirkungsorientierte Unternehmensführung</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Positive Netto-Wirkung, wirtschaftliche Tragfähigkeit und Schutz verbinden</text>
<rect x="32.0" y="140" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Strategie und Zweck</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Einen Zweck über kurzfristigen</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Profit hinaus bestimmen. Mensch,</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Planet und Demokratie bei</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">relevanten Entscheidungen mit</text>
<text x="52.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">ihren konkreten Folgen</text>
<text x="52.0" y="398" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">berücksichtigen.</text>
<rect x="512.0" y="140" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Mitarbeitende und Kultur</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wertschätzung, Entwicklung,</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">sinnvolle Arbeit und Würde fördern.</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Beteiligung und unterschiedliche</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Perspektiven berücksichtigen.</text>
<rect x="32.0" y="454" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="494" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Ressourcen und Lieferkette</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zirkuläre, regionale, faire und</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">resiliente Wege untersuchen. Die</text>
<text x="52.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">jeweilige Bezeichnung ist noch kein</text>
<text x="52.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">tatsächlicher Wirkungsnachweis.</text>
<rect x="512.0" y="454" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="494" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Stakeholder und Teilhabe</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Dialog, Kooperation und</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">gemeinsame Lösungen mit</text>
<text x="532.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zuständigkeit und Rechenschaft</text>
<text x="532.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">verbinden. Betroffene Gruppen und</text>
<text x="532.0" y="678" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Verteilung sichtbar halten.</text>
<rect x="32.0" y="734" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="774" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Wirkungsmanagement</text>
<text x="52.0" y="822" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Daten erheben, Befunde bewerten,</text>
<text x="52.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">entscheiden und lernen. CSRD,</text>
<text x="52.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">ESRS, GRI und Registerangaben</text>
<text x="52.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">liefern Daten; Scorecard und</text>
<text x="52.0" y="958" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Rechtsfolge bleiben getrennt.</text>
<rect x="512.0" y="734" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="774" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Innovation und Zukunft</text>
<text x="532.0" y="822" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Regenerative Lösungen und</text>
<text x="532.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">langfristige Tragfähigkeit prüfen.</text>
<text x="532.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Nutzen, Risiken und Kosten mit</text>
<text x="532.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">einem geeigneten Vergleich und</text>
<text x="532.0" y="958" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zeithorizont bestimmen.</text>
<rect x="32.0" y="1014" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="1054" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Führung und Governance</text>
<text x="52.0" y="1102" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Verantwortung, Transparenz,</text>
<text x="52.0" y="1136" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Integrität und faire Verfahren</text>
<text x="52.0" y="1170" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">sichern. Nichtkompensation und</text>
<text x="52.0" y="1204" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Reverse Merit Order verhindern ein</text>
<text x="52.0" y="1238" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Verdecken kritischer Defizite.</text>
<rect x="512.0" y="1014" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="1054" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Wirkung und Gewinn</text>
<text x="532.0" y="1102" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gewinn ist ein mögliches Ergebnis,</text>
<text x="532.0" y="1136" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">kein vollständiger Wirkungsbeweis.</text>
<text x="532.0" y="1170" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Systemdenken,</text>
<text x="532.0" y="1204" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Menschenorientierung,</text>
<text x="532.0" y="1238" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gerechtigkeit, Regeneration und</text>
<text x="532.0" y="1272" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Lernen sind Gestaltungsziele.</text>
<text x="32" y="1332" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Normatives Führungsmodell. Unternehmen sollen positive Netto-Wirkung ermöglichen;</text>
<text x="32" y="1363" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">ihre Existenz oder ihr Gewinn beweist diese nicht. Keine moralische Personenrangliste</text>
<text x="32" y="1394" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">und keine automatische Score-zu-Steuer-Folge.</text>
<text x="32" y="1455.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
