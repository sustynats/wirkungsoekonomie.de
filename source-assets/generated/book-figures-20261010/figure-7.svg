<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1201" viewBox="0 0 1000 1201">
<title>Vom Markt zur Marktblindheit</title>
<desc>Vereinfachte historische Skizze der Schwerpunktverschiebung Historische Deutung des Manuskripts, keine vollständige Wirtschaftsgeschichte und keine gemessene Entwicklungskurve. Der Markt bleibt; Kritik richtet sich gegen den Preis als einzigen Erfolgsmaßstab.</desc>
<rect width="1000" height="1201" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Vom Markt zur Marktblindheit</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Vereinfachte historische Skizze der Schwerpunktverschiebung</text>
<rect x="32.0" y="140" width="456.0" height="258" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Adam Smith, um 1776</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Markt, Arbeitsteilung und freiwilliger</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Austausch als</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Koordinationsmechanismus für</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wohlstand. Die unsichtbare Hand</text>
<text x="52.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">ist Teil dieser historischen Debatte.</text>
<rect x="512.0" y="140" width="456.0" height="258" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Industrialisierung, etwa</text>
<text x="532.0" y="216" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">1860-1910</text>
<text x="532.0" y="264" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Technologie, Produktion, Arbeit und</text>
<text x="532.0" y="298" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Skalierung prägen die Wirtschaft.</text>
<text x="532.0" y="332" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Marktkoordination bleibt ein Mittel</text>
<text x="532.0" y="366" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">zum wirtschaftlichen Zweck.</text>
<rect x="32.0" y="422" width="456.0" height="326" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="462" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Neoklassik und Wachstum,</text>
<text x="52.0" y="498" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">etwa 1930-1970</text>
<text x="52.0" y="546" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wachstum, Effizienz und</text>
<text x="52.0" y="580" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">formalisierte Modelle gewinnen</text>
<text x="52.0" y="614" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Bedeutung. Unterschiedliche</text>
<text x="52.0" y="648" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Schulen und historische</text>
<text x="52.0" y="682" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Entwicklungen werden hier</text>
<text x="52.0" y="716" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">vereinfacht.</text>
<rect x="512.0" y="422" width="456.0" height="326" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="462" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Finanzialisierung, etwa</text>
<text x="532.0" y="498" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">1980-2008</text>
<text x="532.0" y="546" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Die Kritik fragt nach</text>
<text x="532.0" y="580" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Renditeorientierung und dem</text>
<text x="532.0" y="614" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Verhältnis von Finanzmärkten zu</text>
<text x="532.0" y="648" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">realer Wertschöpfung. Entkopplung</text>
<text x="532.0" y="682" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">braucht konkrete Nachweise.</text>
<rect x="32.0" y="772" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="812" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Plattformen, etwa ab 2008</text>
<text x="52.0" y="860" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Daten, Aufmerksamkeit und</text>
<text x="52.0" y="894" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Marktmacht können neue Anreize</text>
<text x="52.0" y="928" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">schaffen. Zugang, Wettbewerb,</text>
<text x="52.0" y="962" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Verhalten und Folgen fallbezogen</text>
<text x="52.0" y="996" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">untersuchen.</text>
<rect x="512.0" y="772" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="812" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Drei verschiedene Größen</text>
<text x="532.0" y="860" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Kapital bezeichnet Mittel, Besitz</text>
<text x="532.0" y="894" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und Investition; Marktwert den Preis</text>
<text x="532.0" y="928" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">als Signal. Gemeinwohl und</text>
<text x="532.0" y="962" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">tatsächliche Veränderungen sind</text>
<text x="532.0" y="996" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">damit nicht gleichgesetzt.</text>
<text x="32" y="1056" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Historische Deutung des Manuskripts, keine vollständige Wirtschaftsgeschichte und</text>
<text x="32" y="1087" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">keine gemessene Entwicklungskurve. Der Markt bleibt; Kritik richtet sich gegen den</text>
<text x="32" y="1118" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Preis als einzigen Erfolgsmaßstab.</text>
<text x="32" y="1179.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
