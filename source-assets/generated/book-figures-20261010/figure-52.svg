<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1231" viewBox="0 0 1000 1231">
<title>Wirkungsketten im Agri-PV-Beispiel</title>
<desc>Modellhafte Prüffragen über direkte, indirekte und strukturelle Folgen Die Kette zeigt zu untersuchende Zusammenhänge. Wirkung kann auch ohne Systemtransformation eintreten. Ganzheitlich, verknüpft, messbar, lernfähig, resilient und gerecht bleiben Prüfziele; Indikatoren allein sind kein Kausalitätsbeweis.</desc>
<rect width="1000" height="1231" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Wirkungsketten im Agri-PV-Beispiel</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Modellhafte Prüffragen über direkte, indirekte und strukturelle Folgen</text>
<rect x="32.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Aktivität und Ressourcen</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Bau eines Agri-Photovoltaik-Parks:</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Kapital, Material, Energie, Wissen,</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Arbeit und Flächen erfassen. Die</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Aktivität allein belegt keinen</text>
<text x="52.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gesamterfolg.</text>
<rect x="512.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Direkte Veränderungen</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Erzeugten Strom, Beschäftigung</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und landwirtschaftlichen Ertrag</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">beobachten. Vermiedene</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Emissionen nur gegen einen</text>
<text x="532.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">begründeten Vergleich bestimmen.</text>
<rect x="32.0" y="420" width="456.0" height="324" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Indirekte Folgen</text>
<text x="52.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wasserstress, Biodiversität,</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gesundheit und regionale</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wertschöpfung untersuchen.</text>
<text x="52.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Vorteile durch Beschattung oder</text>
<text x="52.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">lokale Einnahmen treten nicht</text>
<text x="52.0" y="678" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">automatisch ein.</text>
<rect x="512.0" y="420" width="456.0" height="324" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Strukturelle Folgen</text>
<text x="532.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Mögliche Folgeprojekte,</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Energieversorgung,</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Anpassungsfähigkeit,</text>
<text x="532.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zusammenhalt und politische</text>
<text x="532.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Regeln prüfen. Erwartete</text>
<text x="532.0" y="678" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Systemänderung gesondert</text>
<text x="532.0" y="712" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">nachweisen.</text>
<rect x="32.0" y="768" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="808" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Messgrößen und Evidenz</text>
<text x="52.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">MWh, t CO2e, Fläche,</text>
<text x="52.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Arbeitsplätze, Wasserverbrauch,</text>
<text x="52.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Artenvielfalt und kommunale</text>
<text x="52.0" y="958" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Einnahmen mit Zeitraum, Vergleich</text>
<text x="52.0" y="992" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und Datenqualität erfassen.</text>
<rect x="512.0" y="768" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="808" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Positive Netto-Wirkung</text>
<text x="532.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Alle materiell relevanten Vorteile,</text>
<text x="532.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Schäden, Verteilungsfolgen und</text>
<text x="532.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Schutzgrenzen prüfen.</text>
<text x="532.0" y="958" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Nichtkompensation und Reverse</text>
<text x="532.0" y="992" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Merit Order verhindern ein</text>
<text x="532.0" y="1026" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Verdecken kritischer Defizite.</text>
<text x="32" y="1086" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Die Kette zeigt zu untersuchende Zusammenhänge. Wirkung kann auch ohne</text>
<text x="32" y="1117" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Systemtransformation eintreten. Ganzheitlich, verknüpft, messbar, lernfähig, resilient</text>
<text x="32" y="1148" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">und gerecht bleiben Prüfziele; Indikatoren allein sind kein Kausalitätsbeweis.</text>
<text x="32" y="1209.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
