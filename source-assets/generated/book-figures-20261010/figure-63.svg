<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1199" viewBox="0 0 1000 1199">
<title>Wohnraum als Wirkungsraum</title>
<desc>Wohnen als soziale, räumliche und wirtschaftliche Infrastruktur Normative Gegenüberstellung, kein Urteil über jede Investition oder jeden Haushalt. Bezahlbarkeit, Gesundheit, Verteilung und Schutzrechte werden nicht durch einen guten Einzelwert kompensiert.</desc>
<rect width="1000" height="1199" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Wohnraum als Wirkungsraum</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Wohnen als soziale, räumliche und wirtschaftliche Infrastruktur</text>
<rect x="32.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Bezahlbarkeit und Nähe</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Rendite und Lagevorteil erfassen</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">den Wohnraum nicht vollständig.</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wohnsicherheit, finanzielle</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Belastung und erreichbarer Alltag</text>
<text x="52.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">sind eigene Prüffragen.</text>
<rect x="512.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Energie und Mobilität</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Energiekosten, Versorgung und</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Erschließung mit Klima,</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zugänglichkeit und Teilhabe</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">verbinden. Verlagerte Belastungen</text>
<text x="532.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">gesondert prüfen.</text>
<rect x="32.0" y="420" width="456.0" height="292" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Gesundheit und</text>
<text x="52.0" y="496" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Nachbarschaft</text>
<text x="52.0" y="544" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Raumqualität, Prävention und</text>
<text x="52.0" y="578" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zusammenleben betrachten.</text>
<text x="52.0" y="612" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Ökonomische Externalität oder</text>
<text x="52.0" y="646" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">vermeintlicher Störfaktor allein</text>
<text x="52.0" y="680" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">beschreibt diese Folgen nicht.</text>
<rect x="512.0" y="420" width="456.0" height="292" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Teilhabe und Lebensqualität</text>
<text x="532.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Exklusivität und Image durch</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Fragen nach Mitgestaltung, Zugang</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und tatsächlicher Lebensqualität</text>
<text x="532.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">ergänzen. Unterschiedliche</text>
<text x="532.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gruppen berücksichtigen.</text>
<rect x="32.0" y="736" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="776" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Fläche und Bestand</text>
<text x="52.0" y="824" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Verwertung, Abriss, Erhalt und</text>
<text x="52.0" y="858" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Nutzung vergleichen. Bestand ist</text>
<text x="52.0" y="892" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">eine Ressource;</text>
<text x="52.0" y="926" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Flächenentscheidungen betreffen</text>
<text x="52.0" y="960" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gemeinwohl und künftige</text>
<text x="52.0" y="994" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Möglichkeiten.</text>
<rect x="512.0" y="736" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="776" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Gekoppelte Perspektiven</text>
<text x="532.0" y="824" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Ökonomie, Ökologie, Gesellschaft</text>
<text x="532.0" y="858" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und Kultur gemeinsam prüfen. Ziel</text>
<text x="532.0" y="892" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">sind Wertschöpfung, Verbindung</text>
<text x="532.0" y="926" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und Resilienz; konkrete</text>
<text x="532.0" y="960" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Veränderungen bleiben</text>
<text x="532.0" y="994" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">nachweispflichtig.</text>
<text x="32" y="1054" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Normative Gegenüberstellung, kein Urteil über jede Investition oder jeden Haushalt.</text>
<text x="32" y="1085" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Bezahlbarkeit, Gesundheit, Verteilung und Schutzrechte werden nicht durch einen</text>
<text x="32" y="1116" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">guten Einzelwert kompensiert.</text>
<text x="32" y="1177.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
