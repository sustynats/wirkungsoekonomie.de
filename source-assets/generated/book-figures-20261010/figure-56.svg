<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1508" viewBox="0 0 1000 1508">
<title>Wohlstand und Wirkungs-BIP</title>
<desc>Wirtschaftliche Aktivität und gesellschaftliche Folgen getrennt beurteilen Konzeptskizze, keine amtliche BIP-Rechenvorschrift. Die Gewichte und die Skala -3 bis +3 sind Beispielkalibrierungen. Für jede Rechnung sind Einheiten, Preisbasis, Periode und Abgrenzung festzulegen. Nichtkompensation und Reverse Merit Order bleiben gesondert.</desc>
<rect width="1000" height="1508" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Wohlstand und Wirkungs-BIP</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Wirtschaftliche Aktivität und gesellschaftliche Folgen getrennt beurteilen</text>
<rect x="32.0" y="140" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Klassisches BIP</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Erfasst wirtschaftliche Produktion in</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Geldwerten. Die Summe zeigt nicht</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">allein Lebensqualität, Verteilung,</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Regeneration oder demokratische</text>
<text x="52.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Schutzrechte.</text>
<rect x="512.0" y="140" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Wirkungsbezogene Prüfung</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zustandsveränderung,</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gegenfaktum, Zurechnung und</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Schutz prüfen. Ein dimensionsloser</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Profilwert ist kein Geldbetrag und</text>
<text x="532.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">darf nicht beliebig zum BIP addiert</text>
<text x="532.0" y="398" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">werden.</text>
<rect x="32.0" y="454" width="456.0" height="222" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="494" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Planetare Resilienz</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Klima, Wasser, Ressourcen,</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Biodiversität und Regeneration.</text>
<text x="52.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Beispielgewicht: 35 Prozent; kein</text>
<text x="52.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">allgemeiner Bewertungsmaßstab.</text>
<rect x="512.0" y="454" width="456.0" height="222" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="494" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Soziale Gerechtigkeit</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Würde, Gesundheit, Bildung und</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">faire Teilhabe. Beispielgewicht: 35</text>
<text x="532.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Prozent; Verteilung und Schutz</text>
<text x="532.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">bleiben eigenständig.</text>
<rect x="32.0" y="700" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="740" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Demokratie und Teilhabe</text>
<text x="52.0" y="788" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Rechtsstaat, Meinungs- und</text>
<text x="52.0" y="822" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Medienfreiheit, Transparenz und</text>
<text x="52.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Beteiligung. Historisches</text>
<text x="52.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Beispielgewicht: 20 Prozent;</text>
<text x="52.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Grundrechte sind nicht</text>
<text x="52.0" y="958" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">verrechenbar.</text>
<rect x="512.0" y="700" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="740" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Innovation und Zukunft</text>
<text x="532.0" y="788" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wissen, Forschung, zirkuläre</text>
<text x="532.0" y="822" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wirtschaft und resiliente</text>
<text x="532.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Infrastruktur. Historisches</text>
<text x="532.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Beispielgewicht: 10 Prozent;</text>
<text x="532.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Innovation allein belegt keine</text>
<text x="532.0" y="958" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">positive Wirkung.</text>
<rect x="32.0" y="1014" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="1054" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Daten und Verfahren</text>
<text x="52.0" y="1102" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">CSRD/ESRS, GRI, amtliche</text>
<text x="52.0" y="1136" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Statistik und Forschung</text>
<text x="52.0" y="1170" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">erschließen. Vergleichbare Werte</text>
<text x="52.0" y="1204" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">zuordnen, Regeln dokumentieren,</text>
<text x="52.0" y="1238" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">unabhängig prüfen und Befunde</text>
<text x="52.0" y="1272" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">veröffentlichen.</text>
<rect x="512.0" y="1014" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="1054" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Bereichsbeispiele</text>
<text x="532.0" y="1102" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Kohle, Gesundheit, erneuerbare</text>
<text x="532.0" y="1136" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Energie, Rüstung und Bildung</text>
<text x="532.0" y="1170" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">fallbezogen untersuchen.</text>
<text x="532.0" y="1204" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Branchenname und</text>
<text x="532.0" y="1238" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Produktionsanstieg erzeugen kein</text>
<text x="532.0" y="1272" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">festes Wirkungsurteil.</text>
<text x="32" y="1332" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Konzeptskizze, keine amtliche BIP-Rechenvorschrift. Die Gewichte und die Skala -3 bis</text>
<text x="32" y="1363" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">+3 sind Beispielkalibrierungen. Für jede Rechnung sind Einheiten, Preisbasis, Periode</text>
<text x="32" y="1394" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">und Abgrenzung festzulegen. Nichtkompensation und Reverse Merit Order bleiben</text>
<text x="32" y="1425" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">gesondert.</text>
<text x="32" y="1486.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
