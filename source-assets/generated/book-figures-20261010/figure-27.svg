<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1199" viewBox="0 0 1000 1199">
<title>Triviale und nichttriviale Systeme</title>
<desc>Feste Zuordnung und inneren Zustand unterscheiden Die Unterscheidung nach Heinz von Foerster betrifft die Eingabe-Ausgabe-Zuordnung und den inneren Zustand. Linearität ist eine andere Eigenschaft. WÖk-Anwendung: Kontext, Evidenz und Unsicherheit sichtbar halten.</desc>
<rect width="1000" height="1199" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Triviale und nichttriviale Systeme</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Feste Zuordnung und inneren Zustand unterscheiden</text>
<rect x="32.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Triviale Maschine</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Unter derselben festen Regel führt</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">derselbe Input zum selben Output.</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Frühere Schritte verändern diese</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zuordnung im beschriebenen</text>
<text x="52.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Modell nicht.</text>
<rect x="512.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Nichttriviale Maschine</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Der Output hängt zusätzlich vom</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">inneren Zustand ab. Frühere</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Schritte können diesen Zustand</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">verändern und damit spätere</text>
<text x="532.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Ergebnisse beeinflussen.</text>
<rect x="32.0" y="420" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Keine Gleichsetzung</text>
<text x="52.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Eine feste Zuordnung kann</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">nichtlinear sein. Nichttrivialität</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">bedeutet weder notwendige</text>
<text x="52.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zufälligkeit noch automatisch</text>
<text x="52.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Selbstorganisation.</text>
<rect x="512.0" y="420" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Technisches Modell</text>
<text x="532.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Eingabe, Regel, Zustand und</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Ausgabe getrennt beschreiben.</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Auch technische Maschinen</text>
<text x="532.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">können Speicher und wechselnde</text>
<text x="532.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zustände besitzen.</text>
<rect x="32.0" y="700" width="456.0" height="326" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="740" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Gesellschaft und</text>
<text x="52.0" y="776" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Ökosysteme</text>
<text x="52.0" y="824" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Geschichte, Lage,</text>
<text x="52.0" y="858" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Rückkopplungen, Schwellen und</text>
<text x="52.0" y="892" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Verzögerungen im konkreten Fall</text>
<text x="52.0" y="926" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">untersuchen. Eine kleine Ursache</text>
<text x="52.0" y="960" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">führt nicht immer zu einer großen</text>
<text x="52.0" y="994" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Folge.</text>
<rect x="512.0" y="700" width="456.0" height="326" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="740" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Lernen und Entscheiden</text>
<text x="532.0" y="788" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Annahmen mit Beobachtungen</text>
<text x="532.0" y="822" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">vergleichen und Entscheidungen</text>
<text x="532.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">korrigieren. Komplexität allein</text>
<text x="532.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">belegt keine bestimmte Wirkung</text>
<text x="532.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">oder Überlegenheit eines Modells.</text>
<text x="32" y="1054" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Die Unterscheidung nach Heinz von Foerster betrifft die Eingabe-Ausgabe-Zuordnung</text>
<text x="32" y="1085" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">und den inneren Zustand. Linearität ist eine andere Eigenschaft. WÖk-Anwendung:</text>
<text x="32" y="1116" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Kontext, Evidenz und Unsicherheit sichtbar halten.</text>
<text x="32" y="1177.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
