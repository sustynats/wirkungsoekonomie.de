<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1549" viewBox="0 0 1000 1549">
<title>Wirkungslenkung</title>
<desc>Von Daten und geprüften Befunden zu Entscheidungen und Lernen Modellhafte Anwendung. Bessere Alternativen sollen tatsächlich bezahlbarer werden; ein vermiedener Zuschlag allein senkt ihren bisherigen Preis nicht. Weder Score noch Bereichsname erzeugen automatisch einen Tarif oder Kreditvorteil.</desc>
<rect width="1000" height="1549" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Wirkungslenkung</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Von Daten und geprüften Befunden zu Entscheidungen und Lernen</text>
<rect x="32.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Daten erschließen</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">CSRD, ESRS, GRI, Produktpass</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und Statistiken können Angaben</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">liefern. Ein Bericht oder ein</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Datenpass beweist allein keine</text>
<text x="52.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">tatsächliche Wirkung.</text>
<rect x="512.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Profil prüfen</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zustandsveränderung, Vergleich,</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zurechnung und Unsicherheit</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">untersuchen. Nichtkompensation</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und Reverse Merit Order schützen</text>
<text x="532.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">kritische Grenzen.</text>
<rect x="32.0" y="420" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Belastung und Entlastung</text>
<text x="52.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Die Steuerfolge braucht einen</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">gesetzlich bestimmten Tatbestand.</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Aktive Fondsentlastung braucht</text>
<text x="52.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">verfügbare Mittel, einen zulässigen</text>
<text x="52.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Anspruch und Preisweitergabe.</text>
<rect x="512.0" y="420" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Kapital und Versicherung</text>
<text x="532.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Risiko, Kreditbedingungen und</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Versicherbarkeit anhand konkreter</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Befunde vergleichen. Fossil oder</text>
<text x="532.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">erneuerbar als Bezeichnung ergibt</text>
<text x="532.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">noch keine feste Risikoprämie.</text>
<rect x="32.0" y="700" width="456.0" height="326" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="740" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Beschaffung und</text>
<text x="52.0" y="776" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Management</text>
<text x="52.0" y="824" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Funktional vergleichbare Angebote,</text>
<text x="52.0" y="858" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Lebenszyklus, Schutz und</text>
<text x="52.0" y="892" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Verteilung prüfen. Preis und</text>
<text x="52.0" y="926" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wirkungsprofil fließen nach</text>
<text x="52.0" y="960" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">begründeten Regeln in</text>
<text x="52.0" y="994" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Entscheidungen ein.</text>
<rect x="512.0" y="700" width="456.0" height="326" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="740" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Bildung und Infrastruktur</text>
<text x="532.0" y="788" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Lernen, Zugang, Versorgung und</text>
<text x="532.0" y="822" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">gesellschaftliche</text>
<text x="532.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Handlungsfähigkeit</text>
<text x="532.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">berücksichtigen. Wirtschaftliche</text>
<text x="532.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Instrumente sind ein Teil des</text>
<text x="532.0" y="958" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gesellschaftsmodells.</text>
<rect x="32.0" y="1050" width="456.0" height="326" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="1090" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Plattformlogik und</text>
<text x="52.0" y="1126" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Öffentlichkeit</text>
<text x="52.0" y="1174" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Anreize, Informationszugang,</text>
<text x="52.0" y="1208" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Verstärkung und demokratische</text>
<text x="52.0" y="1242" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Rechte untersuchen. Reichweite</text>
<text x="52.0" y="1276" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und Resonanz sind kein Nachweis</text>
<text x="52.0" y="1310" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">eingetretener Wirkung.</text>
<rect x="512.0" y="1050" width="456.0" height="326" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="1090" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Rückkopplung und</text>
<text x="532.0" y="1126" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Transformation</text>
<text x="532.0" y="1174" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Tatsächliche Folgen mit Annahmen</text>
<text x="532.0" y="1208" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">vergleichen. Regeln und</text>
<text x="532.0" y="1242" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Entscheidungen anpassen;</text>
<text x="532.0" y="1276" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">veränderte Lieferketten, Städte</text>
<text x="532.0" y="1310" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">oder Institutionen gesondert</text>
<text x="532.0" y="1344" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">belegen.</text>
<text x="32" y="1404" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Modellhafte Anwendung. Bessere Alternativen sollen tatsächlich bezahlbarer werden;</text>
<text x="32" y="1435" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">ein vermiedener Zuschlag allein senkt ihren bisherigen Preis nicht. Weder Score noch</text>
<text x="32" y="1466" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Bereichsname erzeugen automatisch einen Tarif oder Kreditvorteil.</text>
<text x="32" y="1527.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
