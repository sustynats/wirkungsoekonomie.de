<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1134" viewBox="0 0 1000 1134">
<title>Wirkungskompetenz</title>
<desc>Fähigkeiten für verantwortliche Entscheidungen und Lernen Bildungs- und Gestaltungsziele für Mensch, Planet und Demokratie. Sie sind keine moralische Bewertung oder Rangliste von Personen.</desc>
<rect width="1000" height="1134" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Wirkungskompetenz</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Fähigkeiten für verantwortliche Entscheidungen und Lernen</text>
<rect x="32.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Systemdenken</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zusammenhänge, Abhängigkeiten</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und Komplexität verstehen. Den</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">konkreten Gegenstand mit seinen</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Grenzen und Nebenfolgen</text>
<text x="52.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">betrachten.</text>
<rect x="512.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Datenkompetenz</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Daten verstehen,</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">verantwortungsvoll nutzen und</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">interpretieren. Beobachtung,</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Messgröße und</text>
<text x="532.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Kausalitätsnachweis unterscheiden.</text>
<rect x="32.0" y="420" width="456.0" height="292" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Ethische Urteilskraft</text>
<text x="52.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Werte und Schutzrechte</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">reflektieren, Folgen und Verteilung</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">prüfen. Kein numerischer Vergleich</text>
<text x="52.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">ersetzt eine harte</text>
<text x="52.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Schutzbedingung.</text>
<rect x="512.0" y="420" width="456.0" height="292" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Perspektivwechsel und</text>
<text x="532.0" y="496" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Dialog</text>
<text x="532.0" y="544" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Andere Sichtweisen hören,</text>
<text x="532.0" y="578" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Empathie entwickeln und Vorurteile</text>
<text x="532.0" y="612" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">hinterfragen. Verständlich</text>
<text x="532.0" y="646" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">kommunizieren und gemeinsame</text>
<text x="532.0" y="680" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Lösungen suchen.</text>
<rect x="32.0" y="736" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="776" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Zukunft und Resilienz</text>
<text x="52.0" y="824" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Langfristig denken, Szenarien</text>
<text x="52.0" y="858" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">prüfen und mit Unsicherheit</text>
<text x="52.0" y="892" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">umgehen. Anpassungsfähigkeit</text>
<text x="52.0" y="926" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">entwickeln, ohne Erfolg als sicher</text>
<text x="52.0" y="960" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">vorauszusetzen.</text>
<rect x="512.0" y="736" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="776" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Messung und Verantwortung</text>
<text x="532.0" y="824" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wirkpfade definieren,</text>
<text x="532.0" y="858" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Veränderungen untersuchen und</text>
<text x="532.0" y="892" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">aus Ergebnissen lernen.</text>
<text x="532.0" y="926" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Rechenschaft, Transparenz und</text>
<text x="532.0" y="960" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Korrektur ermöglichen.</text>
<text x="32" y="1020" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Bildungs- und Gestaltungsziele für Mensch, Planet und Demokratie. Sie sind keine</text>
<text x="32" y="1051" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">moralische Bewertung oder Rangliste von Personen.</text>
<text x="32" y="1112.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
