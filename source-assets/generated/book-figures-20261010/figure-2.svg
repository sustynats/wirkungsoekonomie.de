<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="784" viewBox="0 0 1000 784">
<title>Wirkungsökonomie auf einen Blick</title>
<desc>Wirtschafts- und Gesellschaftsmodell - Entwurf Nichtkompensation schützt harte Grenzen. Reverse Merit Order begrenzt Bewertungen durch kritische Defizite. Keine Personenrangliste.</desc>
<rect width="1000" height="784" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Wirkungsökonomie auf einen Blick</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Wirtschafts- und Gesellschaftsmodell - Entwurf</text>
<rect x="32.0" y="140" width="456.0" height="222" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Maßstab</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Ziel ist positive Netto-Wirkung für</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Mensch, Planet und Demokratie.</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wirkung selbst ist eine tatsächliche</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zustandsveränderung.</text>
<rect x="512.0" y="140" width="456.0" height="222" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Prüfweg</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Aktivität → Mechanismus →</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zustandsänderung →</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Rückkopplung. Direkte, indirekte</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und zeitverzögerte Folgen prüfen.</text>
<rect x="32.0" y="386" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="426" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Lebensbereiche</text>
<text x="52.0" y="474" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Arbeit, Wohnen, Gesundheit,</text>
<text x="52.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Pflege, Bildung, Medien und</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">demokratische Teilhabe gehören</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">zum Modell.</text>
<rect x="512.0" y="386" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="426" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Lernen und Lenkung</text>
<text x="532.0" y="474" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gesetze, Beschaffung, Kapital,</text>
<text x="532.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Preise und öffentliche Angebote</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">können auf geprüfte Befunde</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">reagieren. Umsetzung und Folgen</text>
<text x="532.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">erneut prüfen.</text>
<text x="32" y="670" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Nichtkompensation schützt harte Grenzen. Reverse Merit Order begrenzt Bewertungen</text>
<text x="32" y="701" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">durch kritische Defizite. Keine Personenrangliste.</text>
<text x="32" y="762.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
