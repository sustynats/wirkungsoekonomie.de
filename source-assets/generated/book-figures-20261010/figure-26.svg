<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1163" viewBox="0 0 1000 1163">
<title>Wirkungsordnungen</title>
<desc>Direkte Veränderungen, Anschlussfolgen und veränderte Strukturen Beispielhafte Pfade, keine garantierte Kaskade. Rückkopplung, Verstärkung und Resonanz sind zu untersuchen; eine unmittelbare Zustandsveränderung bleibt Wirkung auch ohne Transformation.</desc>
<rect width="1000" height="1163" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Wirkungsordnungen</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Direkte Veränderungen, Anschlussfolgen und veränderte Strukturen</text>
<rect x="32.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Erste Ordnung</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Welche Zustände verändern sich</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">unmittelbar? Gesetz, Produkt,</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Investition, Sanierung oder</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Aussage sind zunächst</text>
<text x="52.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gegenstände oder Aktivitäten.</text>
<rect x="512.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Zweite Ordnung</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Welche indirekten Folgen entstehen</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">für Kosten, Gesundheit, Lernen,</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Vertrauen, Lieferketten und</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">regionale Wertschöpfung? Eintritt</text>
<text x="532.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und Zurechnung prüfen.</text>
<rect x="32.0" y="420" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Dritte Ordnung</text>
<text x="52.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Welche Marktregeln, Kapitalflüsse,</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Institutionen,</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wettbewerbsbedingungen,</text>
<text x="52.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">demokratischen Räume oder</text>
<text x="52.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">kulturellen Routinen verändern</text>
<text x="52.0" y="678" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">sich?</text>
<rect x="512.0" y="420" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Beispiel Wirkungssteuer</text>
<text x="532.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Ein rechtlich bestimmter</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Preisimpuls kann Nachfrage und</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Lieferketten beeinflussen.</text>
<text x="532.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Veränderte Wettbewerbslogik</text>
<text x="532.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">braucht einen eigenen Befund.</text>
<rect x="32.0" y="734" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="774" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Beispiel Bildung</text>
<text x="52.0" y="822" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Unterricht ist eine Leistung.</text>
<text x="52.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Kompetenz, Selbstwirksamkeit und</text>
<text x="52.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">mögliche demokratische</text>
<text x="52.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Anschlussfolgen getrennt und mit</text>
<text x="52.0" y="958" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">passenden Zeithorizonten prüfen.</text>
<rect x="512.0" y="734" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="774" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Beispiel Plattformregeln</text>
<text x="532.0" y="822" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Moderation kann die Verbreitung</text>
<text x="532.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">schädlicher Inhalte verändern.</text>
<text x="532.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Weniger Polarisierung oder</text>
<text x="532.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">stabilere Öffentlichkeit folgt daraus</text>
<text x="532.0" y="958" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">nicht automatisch.</text>
<text x="32" y="1018" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Beispielhafte Pfade, keine garantierte Kaskade. Rückkopplung, Verstärkung und</text>
<text x="32" y="1049" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Resonanz sind zu untersuchen; eine unmittelbare Zustandsveränderung bleibt Wirkung</text>
<text x="32" y="1080" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">auch ohne Transformation.</text>
<text x="32" y="1141.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
