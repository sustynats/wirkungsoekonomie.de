<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="784" viewBox="0 0 1000 784">
<title>Wirkungssteuer: Regel und Nachweis</title>
<desc>WStG 3.0 ist ein Entwurf, kein geltendes Recht Die Staffel 0/5/10/15/20/25 % ist nach § 56 nur ein Pilotmodell. Null zusätzliche Abgabe senkt den bisherigen Käuferpreis nicht.</desc>
<rect width="1000" height="784" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Wirkungssteuer: Regel und Nachweis</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">WStG 3.0 ist ein Entwurf, kein geltendes Recht</text>
<rect x="32.0" y="140" width="456.0" height="222" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Geprüftes Wirkungsprofil</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Scorecard und Reverse Merit Order</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">liefern Evidenz. Harte</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Schutzgrenzen können nicht</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">verrechnet werden.</text>
<rect x="512.0" y="140" width="456.0" height="222" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Gesetzliches Modul</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">T_W = T_0 + Z_W - E_W. Zuschlag</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und Entlastung folgen bestimmten</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Tatbeständen, Zuständigkeiten und</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Grenzen.</text>
<rect x="32.0" y="386" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="426" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Tarif und Finanzierung</text>
<text x="52.0" y="474" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Kalibrierung bleibt parlamentarisch</text>
<text x="52.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">bestimmt. Doppelbepreisung,</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Kaufkraftschutz und verfügbares</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Entlastungsbudget prüfen.</text>
<rect x="512.0" y="386" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="426" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Produktbesteuerung</text>
<text x="532.0" y="474" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Keine freie automatische</text>
<text x="532.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Mehrwertsteuerstaffel aus einem</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Score. Zulässige Steuer-,</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Abgaben-, Förderungs- und</text>
<text x="532.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Beschaffungswege unterscheiden.</text>
<text x="32" y="670" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Die Staffel 0/5/10/15/20/25 % ist nach § 56 nur ein Pilotmodell. Null zusätzliche Abgabe</text>
<text x="32" y="701" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">senkt den bisherigen Käuferpreis nicht.</text>
<text x="32" y="762.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
