<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1250" viewBox="0 0 1000 1250">
<title>T-SROI und Wirkungsprofil</title>
<desc>Transformational Social Return on Investment Der Nationale Wohlfahrtsindex ist eine andere Kennzahl. Nichtmonetarisierbare Folgen bleiben im Profil. T-SROI ist weder Gewinn noch eine vollständige Transformationsbewertung.</desc>
<rect width="1000" height="1250" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">T-SROI und Wirkungsprofil</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Transformational Social Return on Investment</text>
<rect x="32.0" y="140" width="456.0" height="222" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Monetäre Rechnung</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">T-SROI = Barwert des direkten und</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">separat belegten transformativen</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Nettonutzens / Barwert des</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Ressourceneinsatzes.</text>
<rect x="512.0" y="140" width="456.0" height="222" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Jahresnettonutzen</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">N_t = (B_direkt,t +</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">B_transformativ,t) × a_t × (1 - d_t) ×</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">(1 - v_t) - S_t. Keine frei gewählten</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Transformationsfaktoren.</text>
<rect x="32.0" y="386" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="426" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Gleiche Bilanzbasis</text>
<text x="52.0" y="474" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Geldwerte in Euro, gleiche</text>
<text x="52.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Preisbasis und Systemgrenze.</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Ressourcen nicht zugleich als</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Schaden abziehen.</text>
<text x="52.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Anfangsinvestition bei t = 0 nicht</text>
<text x="52.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">abzinsen.</text>
<rect x="512.0" y="386" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="426" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Unsicherheit</text>
<text x="532.0" y="474" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Konservative Untergrenze:</text>
<text x="532.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">beanspruchten Nutzen kürzen,</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Schäden erhalten. 100 Euro</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Nutzen, 60 Euro Schaden, 20 %</text>
<text x="532.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Abschlag ergeben 20 Euro.</text>
<rect x="32.0" y="700" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="740" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Schutz-Gate</text>
<text x="52.0" y="788" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Rote Linien, kritische negative</text>
<text x="52.0" y="822" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Felder, unzureichende Evidenz</text>
<text x="52.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">oder fehlende positive</text>
<text x="52.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Ressourcenbasis blockieren eine</text>
<text x="52.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">positive Kennzahl. Blockiert ist nicht</text>
<text x="52.0" y="958" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">0.</text>
<rect x="512.0" y="700" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="740" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Begriffe trennen</text>
<text x="532.0" y="788" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">IOI: direkter monetärer Nettonutzen</text>
<text x="532.0" y="822" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">je Ressourcen. IOOI: externe</text>
<text x="532.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Ergebniskette.</text>
<text x="532.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">WÖk-Netto-Wirkungsindex:</text>
<text x="532.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">nichtmonetäres geprüftes Profil.</text>
<text x="32" y="1105" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Der Nationale Wohlfahrtsindex ist eine andere Kennzahl. Nichtmonetarisierbare Folgen</text>
<text x="32" y="1136" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">bleiben im Profil. T-SROI ist weder Gewinn noch eine vollständige</text>
<text x="32" y="1167" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Transformationsbewertung.</text>
<text x="32" y="1228.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
