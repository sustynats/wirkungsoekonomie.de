<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="750" viewBox="0 0 1000 750">
<title>Reverse Merit Order</title>
<desc>Bewertungslogik für kritische Defizite Nichtkompensation ist das Schutzprinzip; Reverse Merit Order ist die Bewertungslogik. Beide sind nicht automatisch der WÖk-Netto-Wirkungsindex.</desc>
<rect width="1000" height="750" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Reverse Merit Order</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Bewertungslogik für kritische Defizite</text>
<rect x="32.0" y="140" width="456.0" height="222" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Nichtkompensation</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Harte Schutzgrenzen und schwere</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Schäden dürfen nicht durch Vorteile</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">in anderen Feldern verschwinden.</text>
<rect x="512.0" y="140" width="456.0" height="222" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Reverse Merit Order</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Kritische Defizite bestimmen</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Prioritäten und begrenzen die</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gesamtbewertung nach der jeweils</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">festgelegten Regel.</text>
<rect x="32.0" y="386" width="456.0" height="222" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="426" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Kein Durchschnittstrick</text>
<text x="52.0" y="474" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gute Klima- oder Kreislaufwerte</text>
<text x="52.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">heben eine Verletzung von</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Menschenrechten oder roten Linien</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">nicht auf.</text>
<rect x="512.0" y="386" width="456.0" height="222" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="426" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Bedingte Freigabe</text>
<text x="532.0" y="474" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Fehlende Evidenz bleibt offen.</text>
<text x="532.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Schutzprüfung, zulässige</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Verdichtung und Rechtsfolge</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">werden getrennt dokumentiert.</text>
<text x="32" y="636" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Nichtkompensation ist das Schutzprinzip; Reverse Merit Order ist die Bewertungslogik.</text>
<text x="32" y="667" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Beide sind nicht automatisch der WÖk-Netto-Wirkungsindex.</text>
<text x="32" y="728.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
