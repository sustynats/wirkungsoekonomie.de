<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1066" viewBox="0 0 1000 1066">
<title>Grunddividende und Wirkungsfonds</title>
<desc>Vorgeschlagenes Modell für Sicherheit und gesellschaftliche Aufgaben Wirkungssteuer, tatsächlich verfügbare Rückflüsse und weitere Finanzierungsquellen gesondert prüfen. Derselbe Budgeteuro wird nicht mehrfach verplant.</desc>
<rect width="1000" height="1066" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Grunddividende und Wirkungsfonds</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Vorgeschlagenes Modell für Sicherheit und gesellschaftliche Aufgaben</text>
<rect x="32.0" y="140" width="456.0" height="222" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Grunddividende</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Universelle Existenzsicherheit im</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zielmodell. Keine moralische</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Rangliste von Menschen.</text>
<rect x="512.0" y="140" width="456.0" height="222" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Bildung und Zukunft</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Lebenslanges Lernen und</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wirkungskompetenz unterstützen.</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zugang und tatsächliche Folgen</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">getrennt prüfen.</text>
<rect x="32.0" y="386" width="456.0" height="258" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="426" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Care und Gesundheit</text>
<text x="52.0" y="474" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Pflege, psychische Gesundheit und</text>
<text x="52.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">soziale Stabilität als</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">gesellschaftliche Aufgaben</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">berücksichtigen.</text>
<rect x="512.0" y="386" width="456.0" height="258" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="426" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Transformation und</text>
<text x="532.0" y="462" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Innovation</text>
<text x="532.0" y="510" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Regenerative Wirtschaftswege</text>
<text x="532.0" y="544" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">untersuchen. Erwarteter Nutzen ist</text>
<text x="532.0" y="578" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">noch kein eingetretener</text>
<text x="532.0" y="612" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Finanzierungsertrag.</text>
<rect x="32.0" y="668" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="708" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Demokratie und Teilhabe</text>
<text x="52.0" y="756" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Beteiligung und gesellschaftliche</text>
<text x="52.0" y="790" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Resilienz stärken. Wirkpfade und</text>
<text x="52.0" y="824" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Schutzrechte sichtbar halten.</text>
<rect x="512.0" y="668" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="708" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Finanzierung</text>
<text x="532.0" y="756" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Der Fonds braucht tatsächlich</text>
<text x="532.0" y="790" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">verfügbare, rechtlich zugewiesene</text>
<text x="532.0" y="824" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Geldmittel. Geprüfte Wirkung und</text>
<text x="532.0" y="858" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">erwartete Einsparung sind keine</text>
<text x="532.0" y="892" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Einnahmen.</text>
<text x="32" y="952" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Wirkungssteuer, tatsächlich verfügbare Rückflüsse und weitere Finanzierungsquellen</text>
<text x="32" y="983" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">gesondert prüfen. Derselbe Budgeteuro wird nicht mehrfach verplant.</text>
<text x="32" y="1044.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
