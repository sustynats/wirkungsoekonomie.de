<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720">
<title>Modelle mit unterschiedlichen Fragen</title>
<desc>Vergleich von Ansätzen, kein Nachweis empirischer Überlegenheit Andere Ansätze besitzen eigene Anwendungen. WÖk-Regeln, Machbarkeit und tatsächlicher Zusatznutzen sind am konkreten Gegenstand zu belegen.</desc>
<rect width="1000" height="720" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Modelle mit unterschiedlichen Fragen</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Vergleich von Ansätzen, kein Nachweis empirischer Überlegenheit</text>
<rect x="32" y="140" width="290" height="56" rx="8" fill="#102b45" stroke="#b8c4c7"/>
<text x="44" y="174" font-family="Arial" font-size="26" font-weight="bold" fill="#ffffff">Ansatz</text>
<rect x="322" y="140" width="646" height="56" rx="8" fill="#102b45" stroke="#b8c4c7"/>
<text x="334" y="174" font-family="Arial" font-size="26" font-weight="bold" fill="#ffffff">Schwerpunkt</text>
<rect x="32" y="196" width="290" height="90" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="44" y="230" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Soziale</text>
<text x="44" y="264" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Marktwirtschaft</text>
<rect x="322" y="196" width="646" height="90" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="334" y="230" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wettbewerb, Privateigentum und sozialer Ausgleich</text>
<rect x="32" y="286" width="290" height="56" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="44" y="320" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gemeinwohlökonomie</text>
<rect x="322" y="286" width="646" height="56" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="334" y="320" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gemeinwohl-Matrix und Gemeinwohl-Bilanz</text>
<rect x="32" y="342" width="290" height="56" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="44" y="376" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Donut-Ökonomie</text>
<rect x="322" y="342" width="646" height="56" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="334" y="376" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Soziale Grundlagen und ökologische Obergrenzen</text>
<rect x="32" y="398" width="290" height="90" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="44" y="432" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Degrowth</text>
<rect x="322" y="398" width="646" height="90" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="334" y="432" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gerechterer, geringerer Ressourcen-Durchsatz bei</text>
<text x="334" y="466" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">gesichertem Wohlergehen</text>
<rect x="32" y="488" width="290" height="90" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="44" y="522" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wirkungsökonomie</text>
<rect x="322" y="488" width="646" height="90" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="334" y="522" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Entwurf für Prüfung, Bewertung, Rückkopplung und</text>
<text x="334" y="556" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Lernen</text>
<text x="32" y="606" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Andere Ansätze besitzen eigene Anwendungen. WÖk-Regeln, Machbarkeit und</text>
<text x="32" y="637" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">tatsächlicher Zusatznutzen sind am konkreten Gegenstand zu belegen.</text>
<text x="32" y="698.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
