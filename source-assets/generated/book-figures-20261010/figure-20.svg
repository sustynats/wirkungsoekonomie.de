<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1129" viewBox="0 0 1000 1129">
<title>Systemischer und normativer Wert</title>
<desc>Funktionsweise, Ziel und begründetes Wirkungsurteil getrennt prüfen Modellhafte Prüffälle, keine pauschalen Bereichsranglisten. Beschreibung, systemische Einordnung und normative Bewertung bleiben getrennt. Nichtkompensation schützt harte Grenzen; Reverse Merit Order berücksichtigt kritische Defizite.</desc>
<rect width="1000" height="1129" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Systemischer und normativer Wert</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Funktionsweise, Ziel und begründetes Wirkungsurteil getrennt prüfen</text>
<rect x="32.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Systemischer Befund</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Welche Zustände verändern sich?</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Stabilität, Lernfähigkeit, Resilienz</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und Nebenfolgen im konkreten</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">System untersuchen.</text>
<rect x="512.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Normatives Urteil</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Referenz- und Schutzräume,</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wirkpfad, Evidenz und Unsicherheit</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">begründen, ob die tatsächliche</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Veränderung positiv oder negativ</text>
<text x="532.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">ist.</text>
<rect x="32.0" y="420" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Gewollt, aber ungeklärt</text>
<text x="52.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gut gemeinte Bürokratie,</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Förderprogramme oder</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Symbolpolitik können Ziele</text>
<text x="52.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">verfehlen. Gute Absicht belegt noch</text>
<text x="52.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">keine positive Wirkung.</text>
<rect x="512.0" y="420" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Mögliche Verbesserung</text>
<text x="532.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Erneuerbare Energie, Bildung,</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Prävention und faire Lieferketten</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">brauchen konkrete Nachweise. Der</text>
<text x="532.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Name eines Bereichs ist noch kein</text>
<text x="532.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wirkungsurteil.</text>
<rect x="32.0" y="700" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="740" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Stabil, aber schädlich</text>
<text x="52.0" y="788" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Überwachung, manipulative</text>
<text x="52.0" y="822" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Plattformen oder fossile</text>
<text x="52.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Machtstrukturen können stabil</text>
<text x="52.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">funktionieren und dennoch</text>
<text x="52.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Schutzrechte verletzen.</text>
<rect x="512.0" y="700" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="740" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Schwächung und Schaden</text>
<text x="532.0" y="788" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Desinformation, Korruption oder</text>
<text x="532.0" y="822" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Ressourcenzerstörung können</text>
<text x="532.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Systeme schwächen. Folgen,</text>
<text x="532.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Kontext und Zurechnung werden</text>
<text x="532.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">getrennt untersucht.</text>
<text x="32" y="984" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Modellhafte Prüffälle, keine pauschalen Bereichsranglisten. Beschreibung, systemische</text>
<text x="32" y="1015" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Einordnung und normative Bewertung bleiben getrennt. Nichtkompensation schützt</text>
<text x="32" y="1046" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">harte Grenzen; Reverse Merit Order berücksichtigt kritische Defizite.</text>
<text x="32" y="1107.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
