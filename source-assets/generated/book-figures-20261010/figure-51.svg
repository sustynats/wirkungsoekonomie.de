<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1235" viewBox="0 0 1000 1235">
<title>Produkte als Wirkungsträger</title>
<desc>Zwölf Lebenszyklusbereiche und ihre gekoppelten Folgen betrachten Systemisches Modell. Ökologische, soziale und demokratische Folgen, Abhängigkeiten, Rückpfade, Zeitverzug und Hebelpunkte untersuchen. Ein Produkt trägt mögliche und tatsächliche Folgen; es ist nicht mit Wirkung selbst gleichgesetzt.</desc>
<rect width="1000" height="1235" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Produkte als Wirkungsträger</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Zwölf Lebenszyklusbereiche und ihre gekoppelten Folgen betrachten</text>
<rect x="32.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">1-2 Rohstoffe und Energie</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Herkunft, Entnahme, Material und</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Energieeinsatz mit ihren</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Systemgrenzen untersuchen. Die</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Inputs sind nicht selbst eine</text>
<text x="52.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wirkungsbilanz.</text>
<rect x="512.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">3-4 Wasser und Arbeit</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wasserverbrauch und</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wasserstress unterscheiden.</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Arbeitsbedingungen, Gesundheit</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und Betroffene neben monetären</text>
<text x="532.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Kosten berücksichtigen.</text>
<rect x="32.0" y="420" width="456.0" height="292" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">5-6 Lieferkette und</text>
<text x="52.0" y="496" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Produktion</text>
<text x="52.0" y="544" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Vorleistungen, Verarbeitung und</text>
<text x="52.0" y="578" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Herstellungsort verbinden.</text>
<text x="52.0" y="612" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Unternehmensangaben nicht ohne</text>
<text x="52.0" y="646" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">begründete Zuordnung jedem</text>
<text x="52.0" y="680" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Produkt zurechnen.</text>
<rect x="512.0" y="420" width="456.0" height="292" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">7-8 Transport und Nutzung</text>
<text x="532.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wege, Einsatz, Lebensdauer und</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Funktion im jeweiligen Zeitraum</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">erfassen. Direkte und verzögerte</text>
<text x="532.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Folgen getrennt prüfen.</text>
<rect x="32.0" y="736" width="456.0" height="326" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="776" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">9-10 Reparatur und</text>
<text x="52.0" y="812" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Wiederverwendung</text>
<text x="52.0" y="860" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zugang, Aufwand und tatsächliche</text>
<text x="52.0" y="894" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">verlängerte Nutzung betrachten.</text>
<text x="52.0" y="928" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Reparierbarkeit oder</text>
<text x="52.0" y="962" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wiederverwendungsabsicht allein</text>
<text x="52.0" y="996" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">beweist keine vermiedene</text>
<text x="52.0" y="1030" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Belastung.</text>
<rect x="512.0" y="736" width="456.0" height="326" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="776" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">11-12 Recycling und</text>
<text x="532.0" y="812" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Entsorgung</text>
<text x="532.0" y="860" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Reale Rücknahme- und</text>
<text x="532.0" y="894" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Verwertungswege, Restschäden</text>
<text x="532.0" y="928" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und Verlagerungen</text>
<text x="532.0" y="962" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">berücksichtigen. Kreisläufe sind</text>
<text x="532.0" y="996" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">nicht automatisch verlustfrei.</text>
<text x="32" y="1090" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Systemisches Modell. Ökologische, soziale und demokratische Folgen, Abhängigkeiten,</text>
<text x="32" y="1121" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Rückpfade, Zeitverzug und Hebelpunkte untersuchen. Ein Produkt trägt mögliche und</text>
<text x="32" y="1152" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">tatsächliche Folgen; es ist nicht mit Wirkung selbst gleichgesetzt.</text>
<text x="32" y="1213.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
