<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1129" viewBox="0 0 1000 1129">
<title>Demokratie als Wirkungsraum</title>
<desc>Institutionen, öffentliche Prüfung und gesellschaftliche Selbstkorrektur Normativer Referenzraum. Autoritäre Kontrolle oder digitale Verstärkung werden am konkreten Gegenstand geprüft. Keine Sprachpolizei, keine Gesinnungsbewertung und keine moralische Personenrangliste.</desc>
<rect width="1000" height="1129" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Demokratie als Wirkungsraum</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Institutionen, öffentliche Prüfung und gesellschaftliche Selbstkorrektur</text>
<rect x="32.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Fakten und Wissenschaft</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Journalismus, Forschung und</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Transparenz ermöglichen</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">öffentliche Prüfung.</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Tatsachenbeleg, Interpretation und</text>
<text x="52.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Meinung unterscheiden.</text>
<rect x="512.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Vertrauen</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Fairness, Glaubwürdigkeit und</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">verlässliche Institutionen können</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Vertrauen stärken. Zustimmung</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">maximieren ist kein Ersatz für</text>
<text x="532.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">vertrauenswürdige Verfahren.</text>
<rect x="32.0" y="420" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Rechtsstaat</text>
<text x="52.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gerichte, Grundrechte,</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Minderheitenschutz und wirksame</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Kontrolle begrenzen Macht. Ein</text>
<text x="52.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">guter wirtschaftlicher Wert</text>
<text x="52.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">rechtfertigt keine Rechtsverletzung.</text>
<rect x="512.0" y="420" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Öffentlichkeit</text>
<text x="532.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Medien, Plattformen, Debatte und</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Resonanz beeinflussen</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wahrnehmung. Tatsächliche</text>
<text x="532.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Veränderungen und mögliche</text>
<text x="532.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Pfade getrennt untersuchen.</text>
<rect x="32.0" y="700" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="740" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Streitfähigkeit</text>
<text x="52.0" y="788" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Dialog, Widerspruch, Vielfalt und</text>
<text x="52.0" y="822" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">friedliche Konfliktlösung erhalten.</text>
<text x="52.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Legitimer Streit und</text>
<text x="52.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Regierungskritik sind kein</text>
<text x="52.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">pauschaler Demokratieschaden.</text>
<rect x="512.0" y="700" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="740" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Zukunftsfähigkeit</text>
<text x="532.0" y="788" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Klima, Generationen, Bildung und</text>
<text x="532.0" y="822" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Resilienz demokratisch gestalten.</text>
<text x="532.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Entscheidungen müssen</text>
<text x="532.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">überprüfbar und korrigierbar</text>
<text x="532.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">bleiben.</text>
<text x="32" y="984" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Normativer Referenzraum. Autoritäre Kontrolle oder digitale Verstärkung werden am</text>
<text x="32" y="1015" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">konkreten Gegenstand geprüft. Keine Sprachpolizei, keine Gesinnungsbewertung und</text>
<text x="32" y="1046" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">keine moralische Personenrangliste.</text>
<text x="32" y="1107.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
