<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1445" viewBox="0 0 1000 1445">
<title>Wirkungsrente</title>
<desc>Modell eines gesellschaftlichen Kreislaufs über die Lebenszeit Zielmodell, kein geltendes Rentengesetz und keine moralische Lebensbilanz von Personen. Universelle Würde, Rechtsschutz, tatsächliche Finanzierung und Nichtkompensation bleiben Voraussetzungen.</desc>
<rect width="1000" height="1445" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Wirkungsrente</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Modell eines gesellschaftlichen Kreislaufs über die Lebenszeit</text>
<rect x="32.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">1. Erwerbsphase</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Menschen bringen Fähigkeiten und</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Arbeit ein. Ihre Beiträge und</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">tatsächlichen Folgen werden im</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">jeweiligen Zusammenhang</text>
<text x="52.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">betrachtet.</text>
<rect x="512.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">2. Beiträge</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Rechtlich bestimmte Beiträge</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">können einen gemeinsamen</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Haushalt speisen. Beitrag, Nutzen</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und verfügbarer Geldbetrag bleiben</text>
<text x="532.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">getrennt.</text>
<rect x="32.0" y="420" width="456.0" height="292" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">3. Gesellschaftliche</text>
<text x="52.0" y="496" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Aufgaben</text>
<text x="52.0" y="544" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Investitionen können Bildung,</text>
<text x="52.0" y="578" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gesundheit, Klimaschutz und</text>
<text x="52.0" y="612" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Teilhabe unterstützen.</text>
<text x="52.0" y="646" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Verbesserungen werden anhand</text>
<text x="52.0" y="680" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">konkreter Folgen geprüft.</text>
<rect x="512.0" y="420" width="456.0" height="292" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">4. Resilienz</text>
<text x="532.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Untersuchen, ob Risiken sinken</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und Versorgung sowie</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wertschöpfung unter Belastung</text>
<text x="532.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">tragfähig bleiben. Finanzierung</text>
<text x="532.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">allein beweist keine Resilienz.</text>
<rect x="32.0" y="736" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="776" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">5. Generationenvertrag</text>
<text x="52.0" y="824" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Heute Gestaltende und später</text>
<text x="52.0" y="858" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Profitierende verbinden. Ansprüche,</text>
<text x="52.0" y="892" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Mittel, Belastungen und künftige</text>
<text x="52.0" y="926" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Verpflichtungen nachvollziehbar</text>
<text x="52.0" y="960" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">bestimmen.</text>
<rect x="512.0" y="736" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="776" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">6. Gesundheit</text>
<text x="532.0" y="824" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gesundheit und Umweltqualität</text>
<text x="532.0" y="858" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">können Lebensqualität und</text>
<text x="532.0" y="892" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Produktivität unterstützen.</text>
<text x="532.0" y="926" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Tatsächliche Veränderungen</text>
<text x="532.0" y="960" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">brauchen eigene Nachweise.</text>
<rect x="32.0" y="1016" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="1056" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">7. Teilhabe</text>
<text x="52.0" y="1104" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zugang und Beteiligung können</text>
<text x="52.0" y="1138" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Chancen, Vertrauen und</text>
<text x="52.0" y="1172" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zusammenhalt stärken. Verteilung</text>
<text x="52.0" y="1206" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und Ausschlüsse gesondert</text>
<text x="52.0" y="1240" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">untersuchen.</text>
<rect x="512.0" y="1016" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="1056" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">8. Rückkopplung</text>
<text x="532.0" y="1104" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Beobachtungen mit Annahmen</text>
<text x="532.0" y="1138" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">vergleichen, aus Fehlern lernen und</text>
<text x="532.0" y="1172" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Entscheidungen korrigieren. Ziel ist</text>
<text x="532.0" y="1206" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">langfristige Sicherheit und</text>
<text x="532.0" y="1240" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zukunftsfähigkeit.</text>
<text x="32" y="1300" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Zielmodell, kein geltendes Rentengesetz und keine moralische Lebensbilanz von</text>
<text x="32" y="1331" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Personen. Universelle Würde, Rechtsschutz, tatsächliche Finanzierung und</text>
<text x="32" y="1362" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Nichtkompensation bleiben Voraussetzungen.</text>
<text x="32" y="1423.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
