<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1240" viewBox="0 0 1000 1240">
<title>Wirkungskompetenz</title>
<desc>Kapitel 45.3: Zusammenhänge verstehen, Folgen prüfen und verantwortlich handeln Modell einer Kompetenzentwicklung. Es bewertet weder den moralischen Wert von Personen noch automatisch Karriere oder Einkommen.</desc>
<rect width="1000" height="1240" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Wirkungskompetenz</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Kapitel 45.3: Zusammenhänge verstehen, Folgen prüfen und verantwortlich</text>
<text x="32" y="156" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">handeln</text>
<rect x="32.0" y="176" width="456.0" height="292" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="216" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Systemisches Denken</text>
<text x="52.0" y="264" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zusammenhänge in Alltag, Arbeit,</text>
<text x="52.0" y="298" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Konsum, Politik, Bildung und</text>
<text x="52.0" y="332" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wirtschaft erkennen. Isoliertes</text>
<text x="52.0" y="366" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wissen oder ein Abschluss ist noch</text>
<text x="52.0" y="400" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">kein vollständiges</text>
<text x="52.0" y="434" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wirkungsverständnis.</text>
<rect x="512.0" y="176" width="456.0" height="292" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="216" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Daten- und</text>
<text x="532.0" y="252" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Medienkompetenz</text>
<text x="532.0" y="300" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Information, Technologie und</text>
<text x="532.0" y="334" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Quellen verantwortungsvoll nutzen.</text>
<text x="532.0" y="368" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Klimatische und gesellschaftliche</text>
<text x="532.0" y="402" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Bedingungen in ihrer jeweiligen</text>
<text x="532.0" y="436" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Evidenz unterscheiden.</text>
<rect x="32.0" y="492" width="456.0" height="292" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="532" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Empathie und</text>
<text x="52.0" y="568" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Perspektivwechsel</text>
<text x="52.0" y="616" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Andere Sichtweisen und</text>
<text x="52.0" y="650" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Lebenslagen berücksichtigen.</text>
<text x="52.0" y="684" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Demokratie und kulturelle Vielfalt</text>
<text x="52.0" y="718" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">gehören zu den relevanten</text>
<text x="52.0" y="752" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zusammenhängen.</text>
<rect x="512.0" y="492" width="456.0" height="292" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="532" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Folgen und Komplexität</text>
<text x="532.0" y="580" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Kurz- und langfristige Folgen</text>
<text x="532.0" y="614" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">einschätzen. Unsicherheit</text>
<text x="532.0" y="648" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">aushalten und in Entscheidungen</text>
<text x="532.0" y="682" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">einbeziehen, statt sie mit exakten</text>
<text x="532.0" y="716" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zahlen zu verdecken.</text>
<rect x="32.0" y="808" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="848" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Verantwortung übernehmen</text>
<text x="52.0" y="896" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Für eigenes Handeln und seine</text>
<text x="52.0" y="930" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Folgen Rechenschaft ermöglichen.</text>
<text x="52.0" y="964" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Schutzrechte und</text>
<text x="52.0" y="998" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Nichtkompensation begrenzen jede</text>
<text x="52.0" y="1032" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">behauptete Verbesserung.</text>
<rect x="512.0" y="808" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="848" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Lernen und Transformation</text>
<text x="532.0" y="896" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Verstehen, handeln und aus</text>
<text x="532.0" y="930" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">tatsächlichen Befunden lernen.</text>
<text x="532.0" y="964" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gemeinsam Lösungen entwickeln;</text>
<text x="532.0" y="998" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">ein Kompetenzziel ist kein</text>
<text x="532.0" y="1032" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Nachweis erreichter</text>
<text x="532.0" y="1066" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Systemstabilität.</text>
<text x="32" y="1126" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Modell einer Kompetenzentwicklung. Es bewertet weder den moralischen Wert von</text>
<text x="32" y="1157" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Personen noch automatisch Karriere oder Einkommen.</text>
<text x="32" y="1218.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
