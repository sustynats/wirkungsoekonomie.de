<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1298" viewBox="0 0 1000 1298">
<title>SDGs als Referenzrahmen</title>
<desc>Globale Ziele, nationale Konkretisierung, Recht und Wirkungsnachweis unterscheiden Die Ebenen sind keine universelle Rechts-Pyramide und keine automatische Erfolgsfolge. Nichtkompensation und Reverse Merit Order sichern Schutz und Bewertung. Bestehende Folgenprüfungen werden ergänzt, nicht als Neuerfindung ausgegeben.</desc>
<rect width="1000" height="1298" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">SDGs als Referenzrahmen</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Globale Ziele, nationale Konkretisierung, Recht und Wirkungsnachweis</text>
<text x="32" y="156" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">unterscheiden</text>
<rect x="32.0" y="176" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="216" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Agenda 2030 und 17 Ziele</text>
<text x="52.0" y="264" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Der UN-Rahmen verbindet</text>
<text x="52.0" y="298" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">ökologische, soziale und</text>
<text x="52.0" y="332" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">institutionelle Fragen. Erklärung,</text>
<text x="52.0" y="366" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Ziele, Zielvorgaben und statistische</text>
<text x="52.0" y="400" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Indikatoren sind verschiedene</text>
<text x="52.0" y="434" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Ebenen.</text>
<rect x="512.0" y="176" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="216" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Demokratie bereits enthalten</text>
<text x="532.0" y="264" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Agenda 2030 Absatz 9 sowie</text>
<text x="532.0" y="298" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">SDG16 betreffen Rechtsstaat,</text>
<text x="532.0" y="332" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Beteiligung, Rechenschaft und</text>
<text x="532.0" y="366" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Grundfreiheiten. Demokratie wird</text>
<text x="532.0" y="400" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">nicht pauschal erst durch SDG+</text>
<text x="532.0" y="434" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">ergänzt.</text>
<rect x="32.0" y="490" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="530" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">WÖk-eigenes SDG+</text>
<text x="52.0" y="578" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Vorhandene UN-Bezüge pro Aspekt</text>
<text x="52.0" y="612" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">konkretisieren und eigene</text>
<text x="52.0" y="646" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">zusätzliche Modellanforderungen</text>
<text x="52.0" y="680" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">offenlegen. SDG+ ist keine offizielle</text>
<text x="52.0" y="714" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">UN-Kategorie.</text>
<rect x="512.0" y="490" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="530" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Deutschland und Recht</text>
<text x="532.0" y="578" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Bei deutschen öffentlichen und</text>
<text x="532.0" y="612" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">regulatorischen Fällen die DNS und</text>
<text x="532.0" y="646" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">jeweils geltenden staatlichen</text>
<text x="532.0" y="680" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Prüfrahmen berücksichtigen.</text>
<text x="532.0" y="714" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Grundrechte und Recht sind</text>
<text x="532.0" y="748" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">eigenständige Grenzen.</text>
<rect x="32.0" y="804" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="844" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Daten und Wirkpfad</text>
<text x="52.0" y="892" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Indikatoren ordnen Beobachtungen.</text>
<text x="52.0" y="926" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Veränderung, Vergleich,</text>
<text x="52.0" y="960" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wirkmechanismus und Attribution</text>
<text x="52.0" y="994" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">gesondert untersuchen; Zielbezug</text>
<text x="52.0" y="1028" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">allein beweist keine Wirkung.</text>
<rect x="512.0" y="804" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="844" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Entscheidung und Lernen</text>
<text x="532.0" y="892" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Geprüfte Befunde können</text>
<text x="532.0" y="926" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Handlung und Rückkopplung</text>
<text x="532.0" y="960" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">unterstützen. Derselbe Effekt wird</text>
<text x="532.0" y="994" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">nicht wegen mehrerer SDG-,</text>
<text x="532.0" y="1028" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">SDG+- oder Rechtsbezüge</text>
<text x="532.0" y="1062" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">mehrfach gezählt.</text>
<text x="32" y="1122" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Die Ebenen sind keine universelle Rechts-Pyramide und keine automatische</text>
<text x="32" y="1153" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Erfolgsfolge. Nichtkompensation und Reverse Merit Order sichern Schutz und</text>
<text x="32" y="1184" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Bewertung. Bestehende Folgenprüfungen werden ergänzt, nicht als Neuerfindung</text>
<text x="32" y="1215" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">ausgegeben.</text>
<text x="32" y="1276.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
