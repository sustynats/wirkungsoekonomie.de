<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1098" viewBox="0 0 1000 1098">
<title>Die einfache Idee</title>
<desc>Tatsächliche Folgen zusätzlich zu Geldbewegungen beurteilen Wirkung ist die tatsächliche Zustandsveränderung. Ziel ist positive Netto-Wirkung unter Schutzbedingungen; Resilienz und Zukunftsfähigkeit werden zusätzlich untersucht.</desc>
<rect width="1000" height="1098" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Die einfache Idee</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Tatsächliche Folgen zusätzlich zu Geldbewegungen beurteilen</text>
<rect x="32.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Wirtschaftliche Größen</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Kapital, Wachstum, Gewinn und</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Konsum beschreiben wirtschaftliche</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Vorgänge. Sie sind nicht allein ein</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Nachweis gesellschaftlicher</text>
<text x="52.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zukunftsfähigkeit.</text>
<rect x="512.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Mögliche Nebenfolgen</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">CO2-Emissionen, Ungleichheit,</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Ressourcenverbrauch und</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Polarisierung mit ihrem Eintritts-</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und Evidenzstatus gesondert</text>
<text x="532.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">untersuchen.</text>
<rect x="32.0" y="420" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Mensch</text>
<text x="52.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gesundheit, Bildung, Teilhabe und</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Fairness betrachten. Materielle</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Verbesserungen und Schäden mit</text>
<text x="52.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Vergleich und Zurechnung prüfen.</text>
<rect x="512.0" y="420" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Planet</text>
<text x="532.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Klima, Ressourcen, Biodiversität</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und Kreisläufe untersuchen.</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Regeneration und Belastungen</text>
<text x="532.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">anderer Räume oder Generationen</text>
<text x="532.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">berücksichtigen.</text>
<rect x="32.0" y="700" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="740" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Demokratie</text>
<text x="52.0" y="788" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Vertrauen, Rechtsstaat, Diskurs</text>
<text x="52.0" y="822" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und institutionelle Stabilität als</text>
<text x="52.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">eigene Referenz- und Schutzräume</text>
<text x="52.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">betrachten.</text>
<rect x="512.0" y="700" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="740" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Rückkopplung</text>
<text x="532.0" y="788" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Daten erschließen, Befunde prüfen,</text>
<text x="532.0" y="822" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Entscheidungen treffen und spätere</text>
<text x="532.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Folgen beobachten. Verhalten und</text>
<text x="532.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Systemtransformation folgen nicht</text>
<text x="532.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">automatisch aus einer Kennzahl.</text>
<text x="32" y="984" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Wirkung ist die tatsächliche Zustandsveränderung. Ziel ist positive Netto-Wirkung unter</text>
<text x="32" y="1015" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Schutzbedingungen; Resilienz und Zukunftsfähigkeit werden zusätzlich untersucht.</text>
<text x="32" y="1076.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
