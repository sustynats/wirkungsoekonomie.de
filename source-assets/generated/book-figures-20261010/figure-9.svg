<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1231" viewBox="0 0 1000 1231">
<title>Multiple Krisen als gekoppeltes System</title>
<desc>Mögliche Wechselwirkungen zwischen Klima, Versorgung und Gesellschaft Schematische Prüfperspektive. Die Verbindungslinien sind keine Messdaten und kein Nachweis jeder behaupteten Kaskade. Gekoppelte Krisen lassen sich nicht durch bloßes Addieren von Kennzahlen beurteilen.</desc>
<rect width="1000" height="1231" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Multiple Krisen als gekoppeltes System</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Mögliche Wechselwirkungen zwischen Klima, Versorgung und Gesellschaft</text>
<rect x="32.0" y="140" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Klima, Energie, Ressourcen</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Natürliche Grundlagen,</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Energiebedarf und</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Ressourcenverfügbarkeit können</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">sich gegenseitig beeinflussen.</text>
<text x="52.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Raum, Zeit und Mechanismus</text>
<text x="52.0" y="398" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">bestimmen.</text>
<rect x="512.0" y="140" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Lieferketten und Gesundheit</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Versorgung, Arbeitsbedingungen</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und Gesundheitsfolgen verbinden.</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Ein Zusammenhang wird nicht</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">allein durch gleichzeitige</text>
<text x="532.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Veränderungen kausal.</text>
<rect x="32.0" y="454" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="494" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Ungleichheit und Vertrauen</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Verteilung, Belastung und</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">institutionelle Glaubwürdigkeit</text>
<text x="52.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">untersuchen. Ein Durchschnitt kann</text>
<text x="52.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">unterschiedliche Gruppenlagen</text>
<text x="52.0" y="678" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">verdecken.</text>
<rect x="512.0" y="454" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="494" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Demokratie, Migration, Krieg</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Sicherheit, Rechte,</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Lebensbedingungen und Mobilität</text>
<text x="532.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">als verschiedene Gegenstände</text>
<text x="532.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">betrachten. Keine pauschale</text>
<text x="532.0" y="678" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Ursache oder Personenbewertung</text>
<text x="532.0" y="712" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">ableiten.</text>
<rect x="32.0" y="768" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="808" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Beispielhafte Rückpfade</text>
<text x="52.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Energiepreise können soziale</text>
<text x="52.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Belastungen erhöhen.</text>
<text x="52.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Desinformation kann Vertrauen</text>
<text x="52.0" y="958" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">beeinflussen. Klimatische</text>
<text x="52.0" y="992" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Veränderungen können Migration</text>
<text x="52.0" y="1026" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">mitprägen.</text>
<rect x="512.0" y="768" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="808" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Kaskaden und Unsicherheit</text>
<text x="532.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Direkte Veränderungen,</text>
<text x="532.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Anschlussfolgen und strukturelle</text>
<text x="532.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Rückkopplungen getrennt</text>
<text x="532.0" y="958" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">dokumentieren. Befunde, mögliche</text>
<text x="532.0" y="992" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Pfade und Wissensgrenzen</text>
<text x="532.0" y="1026" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">sichtbar halten.</text>
<text x="32" y="1086" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Schematische Prüfperspektive. Die Verbindungslinien sind keine Messdaten und kein</text>
<text x="32" y="1117" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Nachweis jeder behaupteten Kaskade. Gekoppelte Krisen lassen sich nicht durch</text>
<text x="32" y="1148" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">bloßes Addieren von Kennzahlen beurteilen.</text>
<text x="32" y="1209.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
