<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1199" viewBox="0 0 1000 1199">
<title>Handlung, Unterlassen und Rückkopplung</title>
<desc>Tun und Nicht-Handeln als verschiedene Ausgangspunkte prüfen Modellhafte Prüfperspektive. Nicht-Handeln ist nicht automatisch ursächlich für jeden späteren Schaden. Wirkung kann auch ohne institutionell organisierte Lernschleife entstehen.</desc>
<rect width="1000" height="1199" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Handlung, Unterlassen und Rückkopplung</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Tun und Nicht-Handeln als verschiedene Ausgangspunkte prüfen</text>
<rect x="32.0" y="140" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Handlung</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gesetz, Produkt, Investition,</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Kommunikation und Infrastruktur</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">können Bedingungen verändern.</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Der Eingriff allein ist kein Nachweis</text>
<text x="52.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">seiner Folgen.</text>
<rect x="512.0" y="140" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Unterlassen</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Vertagte Klimamaßnahmen, nicht</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">sanierte Infrastruktur, fehlende</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Pflege oder unterlassene Korrektur</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">können Folgen haben. Ein</text>
<text x="532.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">geeigneter Vergleich ist</text>
<text x="532.0" y="398" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">erforderlich.</text>
<rect x="32.0" y="454" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="494" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Wirkungsbefund</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Tatsächliche Zustandsveränderung</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">von Potenzial und Risiko</text>
<text x="52.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">unterscheiden. Raum, Zeitraum,</text>
<text x="52.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Empfänger und kausale</text>
<text x="52.0" y="678" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zurechnung bestimmen.</text>
<rect x="512.0" y="454" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="494" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Wirkungsordnungen</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Direkte Veränderungen,</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Anschlussfolgen und veränderte</text>
<text x="532.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Strukturen untersuchen. Die dritte</text>
<text x="532.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Ordnung ist kein notwendiger</text>
<text x="532.0" y="678" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Endpunkt jeder Wirkung.</text>
<rect x="32.0" y="734" width="456.0" height="292" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="774" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Rückkopplung und</text>
<text x="52.0" y="810" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Resonanz</text>
<text x="52.0" y="858" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Neue Zustände können Reaktionen</text>
<text x="52.0" y="892" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und künftige Bedingungen</text>
<text x="52.0" y="926" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">beeinflussen. Resonanz oder</text>
<text x="52.0" y="960" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Rückmeldung allein beweist keine</text>
<text x="52.0" y="994" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">positive Veränderung.</text>
<rect x="512.0" y="734" width="456.0" height="292" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="774" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Verantwortung und Lernen</text>
<text x="532.0" y="822" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Folgen beobachten, Erkenntnisse</text>
<text x="532.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">nutzen und Entscheidungen</text>
<text x="532.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">anpassen. Vorsorge soll künftige</text>
<text x="532.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Handlungsfähigkeit schützen;</text>
<text x="532.0" y="958" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Ergebnisse bleiben überprüfbar.</text>
<text x="32" y="1054" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Modellhafte Prüfperspektive. Nicht-Handeln ist nicht automatisch ursächlich für jeden</text>
<text x="32" y="1085" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">späteren Schaden. Wirkung kann auch ohne institutionell organisierte Lernschleife</text>
<text x="32" y="1116" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">entstehen.</text>
<text x="32" y="1177.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
