<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1305" viewBox="0 0 1000 1305">
<title>Öffentlichkeit und Plattformlogik</title>
<desc>Kapitel 75: Inhalte, Verstärkung, Resonanzraum und Folgen Modellhafte Wirkpfade. Plattformdaten können neue Regeln und Lernschleifen informieren. Öffentliche Kommunikation ist Infrastruktur; Qualität und Transparenz müssen sich auch in tatsächlichen Folgen bewähren.</desc>
<rect width="1000" height="1305" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Öffentlichkeit und Plattformlogik</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Kapitel 75: Inhalte, Verstärkung, Resonanzraum und Folgen</text>
<rect x="32.0" y="140" width="456.0" height="326" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Inhalte und Menschen</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Information, Meinung, Kunst und</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Bildung treffen auf Wahrnehmung</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und Interpretation. Publikum,</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Kontext und Nutzung</text>
<text x="52.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">unterscheiden.</text>
<rect x="512.0" y="140" width="456.0" height="326" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Algorithmen und</text>
<text x="532.0" y="216" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Geschäftsmodell</text>
<text x="532.0" y="264" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Werbung, Klicks und</text>
<text x="532.0" y="298" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Optimierungsziele können</text>
<text x="532.0" y="332" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Sichtbarkeit und emotionale</text>
<text x="532.0" y="366" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Verstärkung beeinflussen. Daraus</text>
<text x="532.0" y="400" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">folgt nicht automatisch</text>
<text x="532.0" y="434" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Polarisierung.</text>
<rect x="32.0" y="490" width="456.0" height="326" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="530" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Reichweite und Verhalten</text>
<text x="52.0" y="578" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Verbreitung, Entscheidungen und</text>
<text x="52.0" y="612" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Interaktionen getrennt erfassen.</text>
<text x="52.0" y="646" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Reichweite allein belegt weder</text>
<text x="52.0" y="680" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Vertrauen noch gesellschaftliche</text>
<text x="52.0" y="714" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wirkung.</text>
<rect x="512.0" y="490" width="456.0" height="326" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="530" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Mögliche gesellschaftliche</text>
<text x="532.0" y="566" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Folgen</text>
<text x="532.0" y="614" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Demokratie, Vertrauen und</text>
<text x="532.0" y="648" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Polarisierung mit konkreten</text>
<text x="532.0" y="682" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zustandsveränderungen</text>
<text x="532.0" y="716" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">untersuchen. Pfad, Vergleich und</text>
<text x="532.0" y="750" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">kausale Zurechnung gesondert</text>
<text x="532.0" y="784" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">prüfen.</text>
<rect x="32.0" y="840" width="456.0" height="292" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="880" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Transparenz und Qualität</text>
<text x="52.0" y="928" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Entscheidungsregeln, Quellen und</text>
<text x="52.0" y="962" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Kontext nachvollziehbar machen.</text>
<text x="52.0" y="996" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Offenlegung und Prüfbarkeit sind</text>
<text x="52.0" y="1030" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gestaltungsziele, kein pauschal</text>
<text x="52.0" y="1064" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">bereits geltender Rechtsanspruch.</text>
<rect x="512.0" y="840" width="456.0" height="292" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="880" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Diskurs und demokratische</text>
<text x="532.0" y="916" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Resilienz</text>
<text x="532.0" y="964" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Vielfalt, konstruktiven Austausch</text>
<text x="532.0" y="998" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und Schutzrechte unterstützen.</text>
<text x="532.0" y="1032" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Öffentlichkeit online und offline</text>
<text x="532.0" y="1066" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">betrachten; keine automatische</text>
<text x="532.0" y="1100" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gesinnungsbewertung.</text>
<text x="32" y="1160" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Modellhafte Wirkpfade. Plattformdaten können neue Regeln und Lernschleifen</text>
<text x="32" y="1191" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">informieren. Öffentliche Kommunikation ist Infrastruktur; Qualität und Transparenz</text>
<text x="32" y="1222" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">müssen sich auch in tatsächlichen Folgen bewähren.</text>
<text x="32" y="1283.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
