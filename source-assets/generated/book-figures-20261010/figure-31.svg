<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1163" viewBox="0 0 1000 1163">
<title>Der Mensch im System</title>
<desc>Körperliche, soziale und institutionelle Lebensbedingungen verbinden Modellperspektive eines eingebetteten, verletzlichen und lernfähigen Menschen. Kein isolierter Nutzenmaximierer als vollständiges Menschenbild; keine moralische Personenrangliste.</desc>
<rect width="1000" height="1163" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Der Mensch im System</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Körperliche, soziale und institutionelle Lebensbedingungen verbinden</text>
<rect x="32.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Körperlich</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Luft, Wasser, Nahrung, Gesundheit</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und Schlaf sind reale</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Lebensbedingungen. Menschen</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">leben physisch, nicht nur als</text>
<text x="52.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">wirtschaftliche Akteure.</text>
<rect x="512.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Emotional</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Angst, Hoffnung, Anerkennung und</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Vertrauen können Orientierung und</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Handeln beeinflussen. Konkrete</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Veränderungen brauchen passende</text>
<text x="532.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Beobachtungen.</text>
<rect x="32.0" y="420" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Sozial</text>
<text x="52.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Beziehungen, Familie,</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gemeinschaft und Teilhabe</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">betrachten.</text>
<text x="52.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Handlungsmöglichkeiten entstehen</text>
<text x="52.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">auch im Zusammenleben.</text>
<rect x="512.0" y="420" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Sprachlich und kulturell</text>
<text x="532.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Sprache, Medien, Narrative und</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Symbole eröffnen mögliche</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wirkpfade. Sie stellen Wirklichkeit</text>
<text x="532.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">nicht beliebig her; Publikum und</text>
<text x="532.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Kontext bleiben relevant.</text>
<rect x="32.0" y="700" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="740" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Institutionell</text>
<text x="52.0" y="788" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Schule, Recht, Demokratie und</text>
<text x="52.0" y="822" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Arbeit prägen Möglichkeiten.</text>
<text x="52.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Freiheit, Rechtsschutz und Zugang</text>
<text x="52.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">bleiben eigenständige</text>
<text x="52.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Schutzfragen.</text>
<rect x="512.0" y="700" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="740" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Planetarisch</text>
<text x="532.0" y="788" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Natur, Klima, Ressourcen und</text>
<text x="532.0" y="822" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">künftige Bedingungen beeinflussen</text>
<text x="532.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">das Leben. Würde,</text>
<text x="532.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Selbstwirksamkeit, Verantwortung</text>
<text x="532.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und Resilienz zusammen</text>
<text x="532.0" y="958" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">betrachten.</text>
<text x="32" y="1018" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Modellperspektive eines eingebetteten, verletzlichen und lernfähigen Menschen. Kein</text>
<text x="32" y="1049" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">isolierter Nutzenmaximierer als vollständiges Menschenbild; keine moralische</text>
<text x="32" y="1080" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Personenrangliste.</text>
<text x="32" y="1141.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
