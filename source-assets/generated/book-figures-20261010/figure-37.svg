<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="750" viewBox="0 0 1000 750">
<title>Von Beobachtung zu geprüfter Wirkung</title>
<desc>Messbarkeit ohne Reduktion auf eine einzige Zahl Datenqualität ist eine Prüfbedingung. Eine gewichtete Summe verschiedener Einheiten ist keine belastbare Wirkungskennzahl.</desc>
<rect width="1000" height="750" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Von Beobachtung zu geprüfter Wirkung</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Messbarkeit ohne Reduktion auf eine einzige Zahl</text>
<rect x="32.0" y="140" width="456.0" height="222" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Untersuchen</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Objekt, relevante Zustände,</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wirkpfade und direkte, indirekte</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">sowie spätere Folgen bestimmen.</text>
<rect x="512.0" y="140" width="456.0" height="222" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Beobachten</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Indikatoren mit Einheiten,</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Systemgrenzen, Population und</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zeiträumen verknüpfen.</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Datenlücken offen führen.</text>
<rect x="32.0" y="386" width="456.0" height="222" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="426" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Zurechnen und bewerten</text>
<text x="52.0" y="474" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gegenfaktum, Attribution und</text>
<text x="52.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Referenz prüfen.</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Nichtkompensation und Reverse</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Merit Order beachten.</text>
<rect x="512.0" y="386" width="456.0" height="222" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="426" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Entscheiden und lernen</text>
<text x="532.0" y="474" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Folgen von Optionen vergleichen,</text>
<text x="532.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">begründete Entscheidung treffen,</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Realität prüfen und Regeln</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">nachführen.</text>
<text x="32" y="636" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Datenqualität ist eine Prüfbedingung. Eine gewichtete Summe verschiedener Einheiten</text>
<text x="32" y="667" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">ist keine belastbare Wirkungskennzahl.</text>
<text x="32" y="728.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
