<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1235" viewBox="0 0 1000 1235">
<title>Das fünfte P im Marketing: Planet</title>
<desc>WÖk-Perspektive auf Marketing, Vertrieb und Kundennutzen WÖk-eigene Ergänzung des klassischen Marketing-Mix. Die Darstellung ist keine Behauptung, das fünfte P sei allgemein verbindlich definiert. Harte Schutzgrenzen bleiben nicht kompensierbar.</desc>
<rect width="1000" height="1235" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Das fünfte P im Marketing: Planet</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">WÖk-Perspektive auf Marketing, Vertrieb und Kundennutzen</text>
<rect x="32.0" y="140" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">1. Produkt</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Lebenszyklus, Reparierbarkeit und</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Sicherheit berücksichtigen.</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Funktion und beobachtete Folgen</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">bleiben getrennt.</text>
<rect x="512.0" y="140" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">2. Preis</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Tatsächliche Kosten,</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Erschwinglichkeit und</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Verteilungsfolgen untersuchen.</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Belastung, aktive Entlastung und</text>
<text x="532.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">deren Finanzierung gesondert</text>
<text x="532.0" y="398" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">zeigen.</text>
<rect x="32.0" y="454" width="456.0" height="292" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="494" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">3. Place / Vertrieb</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zugang, faire Kanäle und Resilienz</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">im jeweiligen Kontext prüfen. Ein</text>
<text x="52.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">neuer Vertriebsweg allein beweist</text>
<text x="52.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">keine positive Wirkung.</text>
<rect x="512.0" y="454" width="456.0" height="292" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="494" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">4. Promotion /</text>
<text x="532.0" y="530" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Kommunikation</text>
<text x="532.0" y="578" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Quellenklar, wahrheitsgemäß und</text>
<text x="532.0" y="612" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">transparent informieren. Keine</text>
<text x="532.0" y="646" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Manipulation; Reichweite und</text>
<text x="532.0" y="680" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Resonanz sind noch kein</text>
<text x="532.0" y="714" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wirkungsnachweis.</text>
<rect x="32.0" y="770" width="456.0" height="292" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="810" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">5. Planet</text>
<text x="52.0" y="858" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Natürliche Lebensgrundlagen und</text>
<text x="52.0" y="892" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Kreisläufe berücksichtigen. Mensch</text>
<text x="52.0" y="926" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und Demokratie bleiben</text>
<text x="52.0" y="960" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">eigenständige Referenz- und</text>
<text x="52.0" y="994" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Schutzräume.</text>
<rect x="512.0" y="770" width="456.0" height="292" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="810" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Kundennutzen und</text>
<text x="532.0" y="846" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Systemfolgen</text>
<text x="532.0" y="894" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wirkungen sichtbar, verständlich</text>
<text x="532.0" y="928" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und belegbar machen. Persönlicher</text>
<text x="532.0" y="962" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Kundenvorteil und gesellschaftliche</text>
<text x="532.0" y="996" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zustandsveränderung sind nicht</text>
<text x="532.0" y="1030" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">identisch.</text>
<text x="32" y="1090" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">WÖk-eigene Ergänzung des klassischen Marketing-Mix. Die Darstellung ist keine</text>
<text x="32" y="1121" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Behauptung, das fünfte P sei allgemein verbindlich definiert. Harte Schutzgrenzen</text>
<text x="32" y="1152" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">bleiben nicht kompensierbar.</text>
<text x="32" y="1213.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
