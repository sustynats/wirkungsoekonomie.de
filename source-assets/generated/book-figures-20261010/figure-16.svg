<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1237" viewBox="0 0 1000 1237">
<title>Resonanzraum</title>
<desc>Mögliche Pfade zwischen Wissen, Öffentlichkeit, Entscheidungen und Folgen Gestaltungsbedingungen: Transparenz, Teilhabe, Gerechtigkeit, Vertrauen, Kompetenz, Nachhaltigkeit und Demokratie. Eingetretene Wirkung kann positiv oder negativ sein und muss nicht allein im Bericht oder Indikator sichtbar werden.</desc>
<rect width="1000" height="1237" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Resonanzraum</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Mögliche Pfade zwischen Wissen, Öffentlichkeit, Entscheidungen und Folgen</text>
<rect x="32.0" y="140" width="456.0" height="258" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Wissenschaft und</text>
<text x="52.0" y="216" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Forschung</text>
<text x="52.0" y="264" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Erkenntnisse, Daten, Szenarien</text>
<text x="52.0" y="298" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und Innovationen erzeugen Wissen.</text>
<text x="52.0" y="332" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Quellen, Qualität und Unsicherheit</text>
<text x="52.0" y="366" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">werden benannt.</text>
<rect x="512.0" y="140" width="456.0" height="258" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Medien und Öffentlichkeit</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Informationen, Deutungen und</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Debatten können Aufmerksamkeit</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und Handlungsmöglichkeiten</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">beeinflussen. Verbreitung allein</text>
<text x="532.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">beweist keine Wirkung.</text>
<rect x="32.0" y="422" width="456.0" height="292" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="462" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Politik und Verwaltung</text>
<text x="52.0" y="510" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Regeln, Ressourcen und</text>
<text x="52.0" y="544" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Entscheidungen bestimmen</text>
<text x="52.0" y="578" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Bedingungen. Rechtliche</text>
<text x="52.0" y="612" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Legitimation und bestehende</text>
<text x="52.0" y="646" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Folgenprüfungen bleiben</text>
<text x="52.0" y="680" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">eigenständig.</text>
<rect x="512.0" y="422" width="456.0" height="292" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="462" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Wirtschaft und</text>
<text x="532.0" y="498" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Zivilgesellschaft</text>
<text x="532.0" y="546" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Unternehmen investieren und</text>
<text x="532.0" y="580" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">handeln; Bürgerinnen und Bürger</text>
<text x="532.0" y="614" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">bringen Erfahrungen, Werte und</text>
<text x="532.0" y="648" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Beteiligung ein. Keine moralische</text>
<text x="532.0" y="682" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Personenrangliste.</text>
<rect x="32.0" y="738" width="456.0" height="326" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="778" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Potenzial zu tatsächlichen</text>
<text x="52.0" y="814" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Folgen</text>
<text x="52.0" y="862" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Ideen können durch Deutung,</text>
<text x="52.0" y="896" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Entscheidung und Handlung</text>
<text x="52.0" y="930" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Veränderungen ermöglichen. Ob</text>
<text x="52.0" y="964" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und welche Folgen eintreten,</text>
<text x="52.0" y="998" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">braucht Vergleich, Beobachtung</text>
<text x="52.0" y="1032" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und Zurechnung.</text>
<rect x="512.0" y="738" width="456.0" height="326" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="778" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Rückkopplung und</text>
<text x="532.0" y="814" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Kooperation</text>
<text x="532.0" y="862" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Informationsfluss, Einfluss,</text>
<text x="532.0" y="896" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Rückmeldung und Zusammenarbeit</text>
<text x="532.0" y="930" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">unterscheiden. Lernen, prüfen und</text>
<text x="532.0" y="964" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">anpassen; positive Transformation</text>
<text x="532.0" y="998" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">ist kein garantierter Endpunkt.</text>
<text x="32" y="1092" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Gestaltungsbedingungen: Transparenz, Teilhabe, Gerechtigkeit, Vertrauen, Kompetenz,</text>
<text x="32" y="1123" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Nachhaltigkeit und Demokratie. Eingetretene Wirkung kann positiv oder negativ sein</text>
<text x="32" y="1154" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">und muss nicht allein im Bericht oder Indikator sichtbar werden.</text>
<text x="32" y="1215.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
