<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1167" viewBox="0 0 1000 1167">
<title>Die Maßstabskrise</title>
<desc>Aktivitäts- und Geldgrößen mit tatsächlichen Folgen ergänzen Die Kritik betrifft eine Verwechslung von Aktivität mit Fortschritt. Bestehende Wirtschaftsstatistik und Folgenprüfung bleiben nützlich; die WÖk verbindet sie mit Bewertung, Schutz und Rückkopplung.</desc>
<rect width="1000" height="1167" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Die Maßstabskrise</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Aktivitäts- und Geldgrößen mit tatsächlichen Folgen ergänzen</text>
<rect x="32.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Gewinn und Umsatz</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Finanzieller Überschuss für</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Eigentümer und verkaufte</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Leistungen sind wirtschaftliche</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Größen. Sie belegen nicht allein</text>
<text x="52.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">positive Netto-Wirkung.</text>
<rect x="512.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">BIP und Beschäftigung</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Produktion, Erwerbstätigkeit und</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Arbeitsplätze erfassen</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">verschiedene Sachverhalte.</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Qualität, Verteilung und</text>
<text x="532.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Nebenfolgen gesondert betrachten.</text>
<rect x="32.0" y="420" width="456.0" height="292" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Reichweite und Marktwert</text>
<text x="52.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Sichtbarkeit und finanzielle</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Bewertung sind keine</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">nachgewiesene gesellschaftliche</text>
<text x="52.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wirkung. Empfänger, Kontext und</text>
<text x="52.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zustandsveränderungen prüfen.</text>
<rect x="512.0" y="420" width="456.0" height="292" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Netto-Wirkung und</text>
<text x="532.0" y="496" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Folgepfade</text>
<text x="532.0" y="544" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Belegte positive und negative</text>
<text x="532.0" y="578" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Veränderungen unter einer</text>
<text x="532.0" y="612" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">definierten Systemgrenze</text>
<text x="532.0" y="646" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">beurteilen. Direkte, indirekte und</text>
<text x="532.0" y="680" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">verzögerte Folgen sichtbar halten.</text>
<rect x="32.0" y="736" width="456.0" height="258" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="776" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Resilienz und Zukunft</text>
<text x="52.0" y="824" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Belastbarkeit, Anpassung und</text>
<text x="52.0" y="858" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">langfristige Tragfähigkeit</text>
<text x="52.0" y="892" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">untersuchen. Potenziale und</text>
<text x="52.0" y="926" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Risiken bleiben von eingetretener</text>
<text x="52.0" y="960" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wirkung unterschieden.</text>
<rect x="512.0" y="736" width="456.0" height="258" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="776" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Demokratie und</text>
<text x="532.0" y="812" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Regeneration</text>
<text x="532.0" y="860" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Teilhabe, Transparenz, Rechte und</text>
<text x="532.0" y="894" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">natürliche sowie gesellschaftliche</text>
<text x="532.0" y="928" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Erneuerung als eigene Prüffragen</text>
<text x="532.0" y="962" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">berücksichtigen.</text>
<text x="32" y="1022" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Die Kritik betrifft eine Verwechslung von Aktivität mit Fortschritt. Bestehende</text>
<text x="32" y="1053" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Wirtschaftsstatistik und Folgenprüfung bleiben nützlich; die WÖk verbindet sie mit</text>
<text x="32" y="1084" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Bewertung, Schutz und Rückkopplung.</text>
<text x="32" y="1145.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
