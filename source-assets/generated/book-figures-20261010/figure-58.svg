<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1233" viewBox="0 0 1000 1233">
<title>Wirkungseinkommen</title>
<desc>Markteinkommen und gesellschaftliche Beiträge im Zielmodell verbinden Das Modell soll Beiträge sichtbar machen, Wirkungen anerkennen und Wert gerechter verteilen. Daraus folgt ohne Belege, Regeln und verfügbares Budget kein individueller Zahlungsanspruch.</desc>
<rect width="1000" height="1233" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Wirkungseinkommen</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Markteinkommen und gesellschaftliche Beiträge im Zielmodell verbinden</text>
<rect x="32.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Marktlohn</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Lohn wird durch Knappheit und</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Verhandlung beeinflusst. Das</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Modell will den Beitrag zu</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">tatsächlicher Wertschöpfung</text>
<text x="52.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">zusätzlich sichtbar machen.</text>
<rect x="512.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Care und Bildung</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Unbezahlte Sorgearbeit und Lernen</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">können gesellschaftlich bedeutsam</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">sein. Markterlös allein erfasst</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">diesen Beitrag nicht.</text>
<rect x="32.0" y="420" width="456.0" height="326" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Gesundheit und</text>
<text x="52.0" y="496" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Regeneration</text>
<text x="52.0" y="544" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gesundheit und natürliche</text>
<text x="52.0" y="578" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Lebensgrundlagen sind</text>
<text x="52.0" y="612" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Voraussetzungen wirtschaftlichen</text>
<text x="52.0" y="646" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Lebens. Veränderungen und</text>
<text x="52.0" y="680" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Kosten bleiben verschiedene</text>
<text x="52.0" y="714" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Befunde.</text>
<rect x="512.0" y="420" width="456.0" height="326" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Demokratie und Teilhabe</text>
<text x="532.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Rechtsstaat, Vertrauen,</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Mitbestimmung und Zugang</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">berücksichtigen. Institutionelle</text>
<text x="532.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Stabilität ist kein automatisch</text>
<text x="532.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">gesicherter Erfolg.</text>
<rect x="32.0" y="770" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="810" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Soziale Infrastruktur</text>
<text x="52.0" y="858" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Öffentliche Güter nicht allein als</text>
<text x="52.0" y="892" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Kosten betrachten. Prüfen, was</text>
<text x="52.0" y="926" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Versorgung, Begegnung und</text>
<text x="52.0" y="960" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">gemeinsame Infrastruktur</text>
<text x="52.0" y="994" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">tatsächlich ermöglichen.</text>
<rect x="512.0" y="770" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="810" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Verteilung und Sicherheit</text>
<text x="532.0" y="858" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Grunddividende, Markteinkommen</text>
<text x="532.0" y="892" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und Wirkungsbonus verbinden.</text>
<text x="532.0" y="926" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Beiträge, Anspruch und</text>
<text x="532.0" y="960" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Finanzierung getrennt prüfen; keine</text>
<text x="532.0" y="994" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">moralische Bewertung von</text>
<text x="532.0" y="1028" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Menschen.</text>
<text x="32" y="1088" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Das Modell soll Beiträge sichtbar machen, Wirkungen anerkennen und Wert gerechter</text>
<text x="32" y="1119" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">verteilen. Daraus folgt ohne Belege, Regeln und verfügbares Budget kein individueller</text>
<text x="32" y="1150" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Zahlungsanspruch.</text>
<text x="32" y="1211.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
