<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1477" viewBox="0 0 1000 1477">
<title>Umsetzungspfad der Wirkungsökonomie</title>
<desc>Sieben Modellphasen mit Lernen und demokratischer Legitimation Beispielhafte Abfolge, keine Prognose und kein beschlossener Einführungskalender. Transparenz, Beteiligung, Gerechtigkeit, Nachhaltigkeit und Resilienz gelten quer durch alle Phasen. Kosten, Kapazität, Verteilung und Schutz werden geprüft.</desc>
<rect width="1000" height="1477" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Umsetzungspfad der Wirkungsökonomie</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Sieben Modellphasen mit Lernen und demokratischer Legitimation</text>
<rect x="32.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">1. Bewusstsein schaffen</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Probleme verstehen, den</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Maßstabswechsel erklären und</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Dialog in Gesellschaft, Wirtschaft</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und Politik ermöglichen.</text>
<rect x="512.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">2. Grundlagen legen</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Rechtliche Regeln demokratisch</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">entwickeln. Prüfgegenstände mit</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">WÖk-IDs von Indikatoren und</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Messung unterscheiden;</text>
<text x="532.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Institutionen legitimieren.</text>
<rect x="32.0" y="420" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">3. Systeme aufbauen</text>
<text x="52.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Referenzräume, Gesetze und</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Haushalte objektspezifisch</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">verbinden. Dateninfrastruktur und</text>
<text x="52.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Plattformen erproben; Pilotprojekte</text>
<text x="52.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">beginnen.</text>
<rect x="512.0" y="420" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">4. Wirtschaft transformieren</text>
<text x="532.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Unternehmens- und Produktfolgen</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">prüfen, Reverse Merit Order und</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Nichtkompensation anwenden.</text>
<text x="532.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Innovation und Kreislaufwirtschaft</text>
<text x="532.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">ermöglichen.</text>
<rect x="32.0" y="700" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="740" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">5. Gesellschaft stärken</text>
<text x="52.0" y="788" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Bildung, Teilhabe und soziale</text>
<text x="52.0" y="822" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gerechtigkeit fördern. Kein</text>
<text x="52.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Personenscore und keine</text>
<text x="52.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">moralische Rangliste von</text>
<text x="52.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Bürgerinnen und Bürgern.</text>
<rect x="512.0" y="700" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="740" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">6. Politik und Justiz</text>
<text x="532.0" y="788" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Kohärenz, Rechtsschutz,</text>
<text x="532.0" y="822" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Transparenz und Rechenschaft</text>
<text x="532.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">sichern. Bestehende staatliche</text>
<text x="532.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Folgen- und</text>
<text x="532.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Nachhaltigkeitsprüfungen</text>
<text x="532.0" y="958" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">anerkennen.</text>
<rect x="32.0" y="1014" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="1054" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">7. Wirkung verstetigen</text>
<text x="52.0" y="1102" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Evaluation und Rückkopplung</text>
<text x="52.0" y="1136" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">einplanen, Indikatoren und</text>
<text x="52.0" y="1170" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Benchmarks überprüfen. Aus</text>
<text x="52.0" y="1204" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">tatsächlichen Folgen lernen und</text>
<text x="52.0" y="1238" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Regeln anpassen.</text>
<rect x="512.0" y="1014" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="1054" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Zeitliche Orientierung</text>
<text x="532.0" y="1102" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Historisches Szenario: 2025-26</text>
<text x="532.0" y="1136" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Bewusstsein; 2026-27</text>
<text x="532.0" y="1170" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Rechtsrahmen; 2027-29</text>
<text x="532.0" y="1204" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Pilotierung; 2029-31 Skalierung;</text>
<text x="532.0" y="1238" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">2031-33 Integration; 2033-35</text>
<text x="532.0" y="1272" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Lernen; ab 2035 Alltag.</text>
<text x="32" y="1332" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Beispielhafte Abfolge, keine Prognose und kein beschlossener Einführungskalender.</text>
<text x="32" y="1363" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Transparenz, Beteiligung, Gerechtigkeit, Nachhaltigkeit und Resilienz gelten quer durch</text>
<text x="32" y="1394" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">alle Phasen. Kosten, Kapazität, Verteilung und Schutz werden geprüft.</text>
<text x="32" y="1455.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
