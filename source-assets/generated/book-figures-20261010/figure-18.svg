<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1132" viewBox="0 0 1000 1132">
<title>Wirkungsträger, Empfänger und Räume</title>
<desc>Gegenstand, betroffene Zustände und Kontext verbinden Relationale Betrachtung, keine moralische Personenbewertung. Verbindungen sind zu prüfende Zusammenhänge, keine bereits nachgewiesenen Kausalketten.</desc>
<rect width="1000" height="1132" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Wirkungsträger, Empfänger und Räume</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Gegenstand, betroffene Zustände und Kontext verbinden</text>
<rect x="32.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Wirkungsträger</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Handlungen von Menschen und</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Organisationen, Staat, Plattformen,</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Algorithmen, Produkte, Kapital,</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gesetze und Narrative können</text>
<text x="52.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Ausgangspunkte sein.</text>
<rect x="512.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Wirkungsräume</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Soziale, ökologische, digitale,</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">institutionelle, kulturelle, räumliche</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und zeitliche Bedingungen des</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">konkreten Gegenstands</text>
<text x="532.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">bestimmen.</text>
<rect x="32.0" y="420" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Wirkungsempfänger</text>
<text x="52.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Bürgerinnen und Bürger,</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Beschäftigte, Kinder, Regionen,</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Öffentlichkeit und künftige</text>
<text x="52.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Generationen berücksichtigen.</text>
<text x="52.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Auch Ökosysteme und Institutionen</text>
<text x="52.0" y="678" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">können sich verändern.</text>
<rect x="512.0" y="420" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Übertragung und Kontext</text>
<text x="532.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wirkpfade können verstärkt,</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">abgeschwächt, blockiert oder</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">umgedeutet werden.</text>
<text x="532.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Kontextabhängigkeit allein ist kein</text>
<text x="532.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Beleg für eine bestimmte Folge.</text>
<rect x="32.0" y="734" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="774" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Rückwirkungen</text>
<text x="52.0" y="822" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Veränderte Zustände können auf</text>
<text x="52.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Träger und Räume zurückwirken.</text>
<text x="52.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Informationsfluss, Resonanz und</text>
<text x="52.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">systemische Rückkopplung</text>
<text x="52.0" y="958" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">unterscheiden.</text>
<rect x="512.0" y="734" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="774" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Nachvollziehbarkeit</text>
<text x="532.0" y="822" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Verantwortung, Beziehungen und</text>
<text x="532.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Abhängigkeiten sichtbar machen.</text>
<text x="532.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Beobachtung, Vergleich,</text>
<text x="532.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zurechnung und Bewertung</text>
<text x="532.0" y="958" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">getrennt begründen.</text>
<text x="32" y="1018" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Relationale Betrachtung, keine moralische Personenbewertung. Verbindungen sind zu</text>
<text x="32" y="1049" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">prüfende Zusammenhänge, keine bereits nachgewiesenen Kausalketten.</text>
<text x="32" y="1110.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
