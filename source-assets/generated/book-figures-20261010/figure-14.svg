<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="750" viewBox="0 0 1000 750">
<title>Wirkung: tatsächliche Veränderung</title>
<desc>Neutraler Begriff - positive Netto-Wirkung als Ziel IOOI ist eine optionale externe Ergebniskette. Eine modellhafte Skala ist keine universelle Maßeinheit der Wirkung.</desc>
<rect width="1000" height="750" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Wirkung: tatsächliche Veränderung</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Neutraler Begriff - positive Netto-Wirkung als Ziel</text>
<rect x="32.0" y="140" width="456.0" height="222" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Wirkung</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Welche Zustände verändern sich</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">bei wem, wo und wann? Direkte,</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">indirekte, unbeabsichtigte und</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">verzögerte Folgen zählen.</text>
<rect x="512.0" y="140" width="456.0" height="222" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Begründetes Urteil</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Referenz- und Schutzräume,</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wirkmechanismus, Evidenz und</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Unsicherheit begründen positive</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">oder negative Wirkung.</text>
<rect x="32.0" y="386" width="456.0" height="222" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="426" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Keine Abkürzung</text>
<text x="52.0" y="474" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Aktivität, Output, Zielbezug oder ein</text>
<text x="52.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Indikator allein belegen weder</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zustandsveränderung noch kausale</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zurechnung.</text>
<rect x="512.0" y="386" width="456.0" height="222" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="426" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Prüfweg</text>
<text x="532.0" y="474" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Aktivität → Mechanismus →</text>
<text x="532.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zustandsänderung →</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Rückkopplung. Vergleich und</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Reality Check begleiten den Weg.</text>
<text x="32" y="636" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">IOOI ist eine optionale externe Ergebniskette. Eine modellhafte Skala ist keine</text>
<text x="32" y="667" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">universelle Maßeinheit der Wirkung.</text>
<text x="32" y="728.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
