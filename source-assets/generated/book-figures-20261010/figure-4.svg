<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200">
<title>Vom Denken in Objekten zu Wirkungsräumen</title>
<desc>Gegenstand, Wechselwirkungen, Kontext und Rückkopplung verbinden Modellperspektive. Ein Input-Output-Zusammenhang ist keine vollständige Wirkungsprüfung. Kontext und Wirkmechanismus ersetzen keine Evidenz.</desc>
<rect width="1000" height="1200" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Vom Denken in Objekten zu Wirkungsräumen</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Gegenstand, Wechselwirkungen, Kontext und Rückkopplung verbinden</text>
<rect x="32.0" y="140" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Isolierter Blick</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Einzelne Objekte, Ressourcen und</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Outputs können beschrieben</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">werden. Ohne ihren</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zusammenhang bleiben</text>
<text x="52.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Nebenfolgen und Abhängigkeiten</text>
<text x="52.0" y="398" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">leicht unsichtbar.</text>
<rect x="512.0" y="140" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Systemischer Blick</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Menschen, Natur und</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">demokratische Institutionen im</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">gekoppelten System betrachten.</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Nicht jede Verbindung ist für jeden</text>
<text x="532.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gegenstand gleich relevant.</text>
<rect x="32.0" y="454" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="494" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Zeit und Kontext</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Frühere Entscheidungen, Lage und</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zeithorizont können Ergebnisse</text>
<text x="52.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">beeinflussen. Lineare</text>
<text x="52.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zusammenhänge und komplexe</text>
<text x="52.0" y="678" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Verflechtungen fallbezogen</text>
<text x="52.0" y="712" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">bestimmen.</text>
<rect x="512.0" y="454" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="494" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Rückkopplungen</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Veränderte Zustände können neue</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Reaktionen auslösen. Verstärkung,</text>
<text x="532.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Abschwächung, Blockade und</text>
<text x="532.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Resonanz bleiben zu</text>
<text x="532.0" y="678" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">untersuchende Pfade.</text>
<rect x="32.0" y="768" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="808" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Handeln und Lernen</text>
<text x="52.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Annahmen, Beobachtungen und</text>
<text x="52.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">tatsächliche Folgen vergleichen.</text>
<text x="52.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Entscheidungen bei neuen</text>
<text x="52.0" y="958" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Befunden verändern; eine</text>
<text x="52.0" y="992" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">vollständige Beherrschung wird</text>
<text x="52.0" y="1026" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">nicht vorausgesetzt.</text>
<rect x="512.0" y="768" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="808" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Langfristige Prüfung</text>
<text x="532.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Stabilität, Lernfähigkeit, Resilienz</text>
<text x="532.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und Zukunftsfähigkeit untersuchen.</text>
<text x="532.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Kleine Impulse haben nicht</text>
<text x="532.0" y="958" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">automatisch große Folgen.</text>
<text x="32" y="1086" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Modellperspektive. Ein Input-Output-Zusammenhang ist keine vollständige</text>
<text x="32" y="1117" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Wirkungsprüfung. Kontext und Wirkmechanismus ersetzen keine Evidenz.</text>
<text x="32" y="1178.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
