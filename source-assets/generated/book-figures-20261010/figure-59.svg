<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1576" viewBox="0 0 1000 1576">
<title>Wirkungseinkommen und Fonds</title>
<desc>Vorgeschlagene Einkommensarchitektur mit eigenständiger Finanzierung Modell, kein geltender Auszahlungsanspruch. Die historische Staffel 0/5/10/15/20/25 Prozent ist eine Simulation. Belastung und aktive Fondsentlastung folgen getrennten Regeln; aktuelle Entlastung braucht tatsächlich verfügbare Mittel und gesetzliche Legitimation.</desc>
<rect width="1000" height="1576" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Wirkungseinkommen und Fonds</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Vorgeschlagene Einkommensarchitektur mit eigenständiger Finanzierung</text>
<rect x="32.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Wirkungsprofil</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Klima, Ressourcen, Arbeit und</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gesundheit sind relevante Felder.</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Weitere materielle Folgen</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">einschließlich Demokratie und</text>
<text x="52.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Verteilung dürfen nicht fehlen.</text>
<rect x="512.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Bewertung und Schutz</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Belege, kritische Grenzen und</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">offene Daten ausweisen. Reverse</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Merit Order und Nichtkompensation</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">begrenzen das Urteil; fehlende</text>
<text x="532.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Werte sind nicht neutral.</text>
<rect x="32.0" y="420" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Einnahmen</text>
<text x="52.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wirkungssteuern und weitere</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">rechtlich zugewiesene Mittel</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">können den Fonds speisen. Der</text>
<text x="52.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Tarif folgt einem aktivierten Gesetz,</text>
<text x="52.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">keiner automatisch erzeugten</text>
<text x="52.0" y="678" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Score-Staffel.</text>
<rect x="512.0" y="420" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Verfügbares Budget</text>
<text x="532.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zuflüsse, Reserve und Ausgaben</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">getrennt ausweisen. Positive</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wirkung und erwartete Einsparung</text>
<text x="532.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">sind noch keine Einzahlung.</text>
<text x="532.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Derselbe Euro wird nicht mehrfach</text>
<text x="532.0" y="678" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">verplant.</text>
<rect x="32.0" y="734" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="774" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Einkommensarchitektur</text>
<text x="52.0" y="822" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Grunddividende, Markteinkommen</text>
<text x="52.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und Wirkungsbonus bilden das</text>
<text x="52.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zielmodell. Universelle Sicherheit</text>
<text x="52.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">ist keine moralische Belohnung und</text>
<text x="52.0" y="958" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">keine Rangliste von Menschen.</text>
<rect x="512.0" y="734" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="774" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Gesellschaftliche Aufgaben</text>
<text x="532.0" y="822" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Rente, Bildung, Gesundheit, Pflege,</text>
<text x="532.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wohnen, Mobilität, Klimaschutz,</text>
<text x="532.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Kultur und demokratische Teilhabe</text>
<text x="532.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">berücksichtigen. Anspruch und</text>
<text x="532.0" y="958" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Mittelzuweisung gesondert</text>
<text x="532.0" y="992" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">bestimmen.</text>
<rect x="32.0" y="1048" width="456.0" height="324" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="1088" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Verwaltung und Kontrolle</text>
<text x="52.0" y="1136" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Demokratische Legitimation,</text>
<text x="52.0" y="1170" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Rechenschaft, Rechtsschutz und</text>
<text x="52.0" y="1204" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Schutz vor Interessenkonflikten</text>
<text x="52.0" y="1238" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">vorsehen. Einnahmen und</text>
<text x="52.0" y="1272" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Auszahlungen prüfen;</text>
<text x="52.0" y="1306" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">personenbezogene Angaben</text>
<text x="52.0" y="1340" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">schützen.</text>
<rect x="512.0" y="1048" width="456.0" height="324" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="1088" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Rückkopplung und Lernen</text>
<text x="532.0" y="1136" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Prüfen, ob Versorgung, Sicherheit</text>
<text x="532.0" y="1170" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und Teilhabe tatsächlich besser</text>
<text x="532.0" y="1204" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">werden. Automatisierung führt ohne</text>
<text x="532.0" y="1238" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">passende Regeln und Finanzierung</text>
<text x="532.0" y="1272" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">nicht automatisch zu Wohlstand.</text>
<text x="32" y="1400" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Modell, kein geltender Auszahlungsanspruch. Die historische Staffel 0/5/10/15/20/25</text>
<text x="32" y="1431" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Prozent ist eine Simulation. Belastung und aktive Fondsentlastung folgen getrennten</text>
<text x="32" y="1462" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Regeln; aktuelle Entlastung braucht tatsächlich verfügbare Mittel und gesetzliche</text>
<text x="32" y="1493" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Legitimation.</text>
<text x="32" y="1554.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
