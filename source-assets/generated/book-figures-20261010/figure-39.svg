<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="750" viewBox="0 0 1000 750">
<title>SDGs, SDG+ und WÖk-ID</title>
<desc>Zielraum, Kennung und Nachweis sind verschiedene Ebenen Ziel- oder Indikatorbezug allein ist keine Wirkung. Nichtkompensation schützt harte Grenzen; Unsicherheit bleibt sichtbar.</desc>
<rect width="1000" height="750" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">SDGs, SDG+ und WÖk-ID</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Zielraum, Kennung und Nachweis sind verschiedene Ebenen</text>
<rect x="32.0" y="140" width="456.0" height="222" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Referenzraum</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Agenda 2030/SDGs; in geeigneten</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">deutschen staatlichen Fällen</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">zusätzlich DNS. SDG 16 umfasst</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">bereits Institutionen.</text>
<rect x="512.0" y="140" width="456.0" height="222" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">WÖk-Erweiterung SDG+</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Unter anderem Medien-, Macht-,</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Daten- und Demokratiefragen</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">vertiefen. Kein eigener</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">UN-Standard.</text>
<rect x="32.0" y="386" width="456.0" height="222" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="426" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Registerkennung</text>
<text x="52.0" y="474" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">WÖk-ID bezeichnet einen</text>
<text x="52.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Prüfgegenstand. Eine Kennung ist</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">weder Messwert noch validierter</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wirkindikator.</text>
<rect x="512.0" y="386" width="456.0" height="222" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="426" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Nachweispfad</text>
<text x="532.0" y="474" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">MasterItem → StateVariable →</text>
<text x="532.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Indicator → Observation →</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Analysis / Reality Check. Kausalität</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">gesondert prüfen.</text>
<text x="32" y="636" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Ziel- oder Indikatorbezug allein ist keine Wirkung. Nichtkompensation schützt harte</text>
<text x="32" y="667" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Grenzen; Unsicherheit bleibt sichtbar.</text>
<text x="32" y="728.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
