<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1165" viewBox="0 0 1000 1165">
<title>Blindleistung und Reparaturaufwand</title>
<desc>Modell eines möglichen Kreislaufs aus Fehlanreiz und zusätzlichem Aufwand Möglicher Pfad, keine automatische Kette. Verwaltung und bestehende Prüfverfahren erfüllen legitime Aufgaben. Die WÖk ergänzt sie durch objektspezifische Folgenprüfung und Rückkopplung.</desc>
<rect width="1000" height="1165" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Blindleistung und Reparaturaufwand</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Modell eines möglichen Kreislaufs aus Fehlanreiz und zusätzlichem Aufwand</text>
<rect x="32.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">1. Unvollständige Preise</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Nicht eingerechnete Folgen können</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Schäden und spätere Kosten auf</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gesellschaft, Natur oder andere</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gruppen verlagern.</text>
<rect x="512.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">2. Externe Kosten</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Die Auslagerung wird gesondert</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">untersucht. Förderprogramme</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">können Schäden mindern, aber</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">auch bestehende Fehlanreize</text>
<text x="532.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">erhalten.</text>
<rect x="32.0" y="420" width="456.0" height="292" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">3. Förderung und</text>
<text x="52.0" y="496" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Ausnahmen</text>
<text x="52.0" y="544" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Subventionen und Sonderregeln</text>
<text x="52.0" y="578" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">nach ihrem Zweck und ihren Folgen</text>
<text x="52.0" y="612" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">prüfen. Nicht jede Förderung und</text>
<text x="52.0" y="646" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">nicht jede Ausnahme ist</text>
<text x="52.0" y="680" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Fehlsteuerung.</text>
<rect x="512.0" y="420" width="456.0" height="292" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">4. Kontrolle und Bürokratie</text>
<text x="532.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Doppelte Abfragen, zusätzlicher</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Aufwand oder bloße</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Darstellungsprüfung können</text>
<text x="532.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Ressourcen binden. Notwendige</text>
<text x="532.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Kontrolle und Rechtsschutz bleiben</text>
<text x="532.0" y="678" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">erhalten.</text>
<rect x="32.0" y="736" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="776" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">5. Gemeinsame Standards</text>
<text x="52.0" y="824" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Klare Regeln, wiederverwendbare</text>
<text x="52.0" y="858" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Daten und faire Verfahren sollen</text>
<text x="52.0" y="892" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Prüfung vereinfachen. Weniger</text>
<text x="52.0" y="926" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Formulare allein beweist keine</text>
<text x="52.0" y="960" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">bessere Wirkung.</text>
<rect x="512.0" y="736" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="776" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">6. Ursachen und Lernen</text>
<text x="532.0" y="824" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Folgen messen, Mechanismen</text>
<text x="532.0" y="858" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">verstehen und Entscheidungen</text>
<text x="532.0" y="892" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">korrigieren. Vertrauen,</text>
<text x="532.0" y="926" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Vergleichbarkeit und Schutz sind</text>
<text x="532.0" y="960" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">eigene Bedingungen.</text>
<text x="32" y="1020" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Möglicher Pfad, keine automatische Kette. Verwaltung und bestehende Prüfverfahren</text>
<text x="32" y="1051" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">erfüllen legitime Aufgaben. Die WÖk ergänzt sie durch objektspezifische Folgenprüfung</text>
<text x="32" y="1082" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">und Rückkopplung.</text>
<text x="32" y="1143.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
