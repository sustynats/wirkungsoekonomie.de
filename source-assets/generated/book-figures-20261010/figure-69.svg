<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1375" viewBox="0 0 1000 1375">
<title>Zukunftsbilder</title>
<desc>Szenario für einen möglichen Alltag 2035, keine Vorhersage Systemische Ziele: vernetzen, regenerieren, vorsorgen, beteiligen und wahrhaftig informieren. Wirkungen prüfen, Zukunft bedenken, gerecht handeln, transparent kommunizieren und gemeinsam gestalten. Das Bild garantiert keine Zielerreichung.</desc>
<rect width="1000" height="1375" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Zukunftsbilder</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Szenario für einen möglichen Alltag 2035, keine Vorhersage</text>
<rect x="32.0" y="140" width="456.0" height="222" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Mensch, Planet, Demokratie</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Würde, Entfaltung und Teilhabe mit</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Regeneration, Stabilität,</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Mitwirkung, Rechtsstaat und</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Vertrauen verbinden.</text>
<rect x="512.0" y="140" width="456.0" height="222" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Ökologie und Energie</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Natürliche Lebensgrundlagen,</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Klimaschutz und biologische Vielfalt</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">erhalten. Saubere, erneuerbare und</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">resiliente Versorgung entwickeln.</text>
<rect x="32.0" y="386" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="426" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Wirtschaft, Arbeit, Bildung</text>
<text x="52.0" y="474" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Regenerative und faire Wirtschaft</text>
<text x="52.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">ermöglichen. Sinnvolle Arbeit,</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">lebenslanges Lernen und</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">gemeinsame Handlungsfähigkeit</text>
<text x="52.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">unterstützen.</text>
<rect x="512.0" y="386" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="426" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Gesundheit und Technologie</text>
<text x="532.0" y="474" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Prävention, Versorgung und</text>
<text x="532.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zugang verbessern. Technik soll</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">nützlich, sicher und selbstbestimmt</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">nutzbar sein; Vorteile brauchen</text>
<text x="532.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">eigene Nachweise.</text>
<rect x="32.0" y="666" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="706" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Kultur, Mobilität, Ernährung</text>
<text x="52.0" y="754" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Vielfalt und Identität erhalten.</text>
<text x="52.0" y="788" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Klimaverträgliche, inklusive</text>
<text x="52.0" y="822" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Mobilität und gesunde, regenerative</text>
<text x="52.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Ernährung mit ihren Folgen prüfen.</text>
<rect x="512.0" y="666" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="706" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Wohnen und Öffentlichkeit</text>
<text x="532.0" y="754" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Bezahlbare, lebenswerte Räume</text>
<text x="532.0" y="788" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und vielfältige, quellenklare Medien</text>
<text x="532.0" y="822" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">unterstützen. Resonanz,</text>
<text x="532.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Reichweite und tatsächliche</text>
<text x="532.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wirkung auseinanderhalten.</text>
<rect x="32.0" y="946" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="986" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Verantwortung und Grenzen</text>
<text x="52.0" y="1034" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Planetare Grenzen,</text>
<text x="52.0" y="1068" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Ressourcengerechtigkeit, soziale</text>
<text x="52.0" y="1102" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Verbindung und globale Fairness</text>
<text x="52.0" y="1136" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">betrachten. Belastungen späterer</text>
<text x="52.0" y="1170" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Generationen sichtbar halten.</text>
<rect x="512.0" y="946" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="986" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Lernen über Zeit</text>
<text x="532.0" y="1034" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Historische Perspektive: 2025</text>
<text x="532.0" y="1068" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">umbauen, 2030 skalieren, 2035</text>
<text x="532.0" y="1102" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">gestalten, 2050+ regenerativ und</text>
<text x="532.0" y="1136" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">resilient leben. Zeitpunkte sind</text>
<text x="532.0" y="1170" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Szenarioannahmen.</text>
<text x="32" y="1230" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Systemische Ziele: vernetzen, regenerieren, vorsorgen, beteiligen und wahrhaftig</text>
<text x="32" y="1261" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">informieren. Wirkungen prüfen, Zukunft bedenken, gerecht handeln, transparent</text>
<text x="32" y="1292" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">kommunizieren und gemeinsam gestalten. Das Bild garantiert keine Zielerreichung.</text>
<text x="32" y="1353.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
