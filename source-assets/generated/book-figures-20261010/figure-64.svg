<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="818" viewBox="0 0 1000 818">
<title>Medien: Potenzial, Resonanz und Wirkung</title>
<desc>Reichweite ist keine nachgewiesene gesellschaftliche Wirkung Keine Sprachpolizei, keine automatische Gesinnungsbewertung. Potenzial, Resonanzraum und eingetretene Wirkung klar trennen.</desc>
<rect width="1000" height="818" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Medien: Potenzial, Resonanz und Wirkung</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Reichweite ist keine nachgewiesene gesellschaftliche Wirkung</text>
<rect x="32.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Wirkpfad</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Inhalt → Verbreitung →</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wahrnehmung → mögliche</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Veränderung von Wissen,</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Vertrauen, Verhalten und</text>
<text x="52.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Institutionen.</text>
<rect x="512.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Nachweis</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Reichweite und Textanalyse</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">beschreiben einen Teil des Pfades.</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zustandsveränderung, Vergleich</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und kausale Zurechnung gesondert</text>
<text x="532.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">prüfen.</text>
<rect x="32.0" y="420" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Referenz und Schutz</text>
<text x="52.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Vielfalt, Transparenz, Teilhabe,</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Grundrechte, Gesundheit und</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">demokratische Prozesse</text>
<text x="52.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">objektspezifisch betrachten.</text>
<rect x="512.0" y="420" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Rückkopplung</text>
<text x="532.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Redaktion, Plattformregeln,</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Medienbildung und Beteiligung</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">können auf Befunde reagieren.</text>
<text x="532.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Folgen und Unsicherheit erneut</text>
<text x="532.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">prüfen.</text>
<text x="32" y="704" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Keine Sprachpolizei, keine automatische Gesinnungsbewertung. Potenzial,</text>
<text x="32" y="735" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Resonanzraum und eingetretene Wirkung klar trennen.</text>
<text x="32" y="796.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
