<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1445" viewBox="0 0 1000 1445">
<title>Transformationspfade</title>
<desc>Diagnose, Ausrichtung, Gestaltung, Umsetzung und Lernen verbinden Modellhafte Pfade für Mensch, Planet und Demokratie. Ganzheitlich, gerecht, nachhaltig, partizipativ und langfristig handeln. Gesetzliche Einführung braucht demokratische Entscheidung; eine Kennzahl ist kein Gesetz.</desc>
<rect width="1000" height="1445" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Transformationspfade</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Diagnose, Ausrichtung, Gestaltung, Umsetzung und Lernen verbinden</text>
<rect x="32.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">1. Diagnose</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">System verstehen, materielle</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wirkungslücken und Risiken</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">untersuchen, Prioritäten mit</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Nichtkompensation und Reverse</text>
<text x="52.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Merit Order bestimmen.</text>
<rect x="512.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">2. Ausrichtung</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Leitbild und Ziele bestimmen. SDGs</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und WÖk-eigenes SDG+</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">objektspezifisch zuordnen;</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zielbezug ist kein</text>
<text x="532.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Kausalitätsbeweis.</text>
<rect x="32.0" y="420" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">3. Gestaltung</text>
<text x="52.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Instrumente, Indikatoren, Modelle,</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Regeln und Anreize entwickeln.</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Rechenstandard und steuerliche</text>
<text x="52.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Rechtsfolge bleiben verschiedene</text>
<text x="52.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Aufgaben.</text>
<rect x="512.0" y="420" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">4. Umsetzung</text>
<text x="532.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Politik, Wirtschaft und Gesellschaft</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">beteiligen. Projekte und</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Pilotregionen beginnen,</text>
<text x="532.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Kommunikation sichern und</text>
<text x="532.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Übergänge schützen.</text>
<rect x="32.0" y="700" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="740" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">5. Verstetigung</text>
<text x="52.0" y="788" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Tatsächliche Veränderungen</text>
<text x="52.0" y="822" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">prüfen, lernen, anpassen und</text>
<text x="52.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">begründet skalieren. Umsetzung</text>
<text x="52.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">oder Berichterstattung allein</text>
<text x="52.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">beweist keine Transformation.</text>
<rect x="512.0" y="700" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="740" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Recht und Demokratie</text>
<text x="532.0" y="788" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Rechtsrahmen, Transparenz,</text>
<text x="532.0" y="822" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Datenschutz und Beteiligung</text>
<text x="532.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">sichern. Bürgerräte, legitime</text>
<text x="532.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wirkungsräte und digitale</text>
<text x="532.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Beteiligung erproben.</text>
<rect x="32.0" y="980" width="456.0" height="292" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="1020" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Ökologie und Soziales</text>
<text x="52.0" y="1068" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Regenerative Wirtschaft,</text>
<text x="52.0" y="1102" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Ressourcen- und CO2-Kosten</text>
<text x="52.0" y="1136" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">sowie Biodiversität berücksichtigen.</text>
<text x="52.0" y="1170" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Einkommen, Lebensverhältnisse,</text>
<text x="52.0" y="1204" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gesundheit, Pflege und Bildung</text>
<text x="52.0" y="1238" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">verbinden.</text>
<rect x="512.0" y="980" width="456.0" height="292" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="1020" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Kooperation und</text>
<text x="532.0" y="1056" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Instrumente</text>
<text x="532.0" y="1104" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Faire Lieferketten, Wissen und</text>
<text x="532.0" y="1138" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Technologie teilen. Regulierung,</text>
<text x="532.0" y="1172" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">fiskalische Anreize, Bildung, Kultur,</text>
<text x="532.0" y="1206" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Innovation, Partnerschaften, Daten</text>
<text x="532.0" y="1240" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und Monitoring verbinden.</text>
<text x="32" y="1300" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Modellhafte Pfade für Mensch, Planet und Demokratie. Ganzheitlich, gerecht,</text>
<text x="32" y="1331" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">nachhaltig, partizipativ und langfristig handeln. Gesetzliche Einführung braucht</text>
<text x="32" y="1362" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">demokratische Entscheidung; eine Kennzahl ist kein Gesetz.</text>
<text x="32" y="1423.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
