<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="750" viewBox="0 0 1000 750">
<title>Leistung und Wirkung unterscheiden</title>
<desc>Elektrotechnik dient hier nur als Analogie Kein physikalisches Wirkungsgesetz und keine automatische Steuerfolge. Regeln und Rechtsfolgen werden getrennt legitimiert.</desc>
<rect width="1000" height="750" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Leistung und Wirkung unterscheiden</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Elektrotechnik dient hier nur als Analogie</text>
<rect x="32.0" y="140" width="456.0" height="222" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Scheinleistung</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Darstellung oder Aktivität kann eine</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Verbesserung versprechen. Ohne</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Nachweis bleibt tatsächliche</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Verbesserung offen.</text>
<rect x="512.0" y="140" width="456.0" height="222" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Blindleistung</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Aufwand ohne belegten Zielbeitrag.</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Auch Ressourcenverbrauch und</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">unbeabsichtigte Folgen gesondert</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">untersuchen.</text>
<rect x="32.0" y="386" width="456.0" height="222" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="426" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Verlustleistung</text>
<text x="52.0" y="474" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Belegte nachteilige</text>
<text x="52.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zustandsveränderungen. Schäden</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">lassen sich nicht durch Vorteile in</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">anderen Feldern verdecken.</text>
<rect x="512.0" y="386" width="456.0" height="222" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="426" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Wirkleistung</text>
<text x="532.0" y="474" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Begründete positive Netto-Wirkung.</text>
<text x="532.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Nicht schon aus einem Projekttitel,</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">einer Menge oder einem guten Ruf</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">ableiten.</text>
<text x="32" y="636" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Kein physikalisches Wirkungsgesetz und keine automatische Steuerfolge. Regeln und</text>
<text x="32" y="667" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Rechtsfolgen werden getrennt legitimiert.</text>
<text x="32" y="728.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
