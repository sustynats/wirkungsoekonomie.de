<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="818" viewBox="0 0 1000 818">
<title>Unternehmen als Wirkungssysteme</title>
<desc>Ziel: positive Netto-Wirkung bei tragfähigem Ressourceneinsatz Datenqualität ist eine Prüfbedingung, kein Bonusfaktor. Nichtmonetäre Befunde und Verzögerungen bleiben neben der Geldrechnung sichtbar.</desc>
<rect width="1000" height="818" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Unternehmen als Wirkungssysteme</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Ziel: positive Netto-Wirkung bei tragfähigem Ressourceneinsatz</text>
<rect x="32.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Zweck und Strategie</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wirkpfade und</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zustandsveränderungen für</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Mensch, Planet und Demokratie</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">prüfen. Gewinn und wirtschaftliche</text>
<text x="52.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Tragfähigkeit gesondert betrachten.</text>
<rect x="512.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Impact Controlling</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Fragestellung, Messung,</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zurechnung, Bewertung und</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Entscheidung verbinden.</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">IOI/T-SROI sind Teilwerkzeuge,</text>
<text x="532.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">nicht das ganze Modell.</text>
<rect x="32.0" y="420" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Lieferkette und Schutz</text>
<text x="52.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Arbeit, Gesundheit, Klima, Wasser,</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Ressourcen und demokratische</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Risiken über den Lebenszyklus</text>
<text x="52.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">prüfen. Rote Linien nicht saldieren.</text>
<rect x="512.0" y="420" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Organisation und Lernen</text>
<text x="532.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Verantwortung, Beteiligung,</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Transparenz und Korrektur</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">ermöglichen. Beobachtete Folgen</text>
<text x="532.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">wieder in konkrete Entscheidungen</text>
<text x="532.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">zurückführen.</text>
<text x="32" y="704" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Datenqualität ist eine Prüfbedingung, kein Bonusfaktor. Nichtmonetäre Befunde und</text>
<text x="32" y="735" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Verzögerungen bleiben neben der Geldrechnung sichtbar.</text>
<text x="32" y="796.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
