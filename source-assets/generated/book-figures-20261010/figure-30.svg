<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1231" viewBox="0 0 1000 1231">
<title>Wirkungsrisiko und Resilienz</title>
<desc>Mögliche Folgen, eingetretene Veränderungen und Widerstandsfähigkeit trennen Mögliche Pfade, keine pauschalen Tatsachenurteile. Gesundheits-, Lieferketten-, Klima- und Demokratiefolgen brauchen eigene Belege. Schutz und Nichtkompensation gelten auch bei einem wirtschaftlich günstigen Ergebnis.</desc>
<rect width="1000" height="1231" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Wirkungsrisiko und Resilienz</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Mögliche Folgen, eingetretene Veränderungen und Widerstandsfähigkeit trennen</text>
<rect x="32.0" y="140" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Potenzial und Risiko</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gesetze, Produkte, Plattformen,</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Infrastruktur und Investitionen</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">können Bedingungen verändern.</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Erwartete Verbesserungen und</text>
<text x="52.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">mögliche Schäden bleiben eigene</text>
<text x="52.0" y="398" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Befunde.</text>
<rect x="512.0" y="140" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Tatsächliche Wirkung</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Beobachtete Veränderungen mit</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Raum, Zeitraum, Vergleich und</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zurechnung prüfen. Risiko ist kein</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">bereits eingetretener Schaden; ein</text>
<text x="532.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Output ist noch keine Wirkung.</text>
<rect x="32.0" y="454" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="494" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Drei Wirkungsordnungen</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Direkte Veränderungen, indirekte</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Anschlussfolgen und veränderte</text>
<text x="52.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Strukturen getrennt untersuchen.</text>
<text x="52.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Vertrauensverlust oder</text>
<text x="52.0" y="678" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Marktinstabilität sind keine</text>
<text x="52.0" y="712" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">garantierten Kaskaden.</text>
<rect x="512.0" y="454" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="494" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Resilienz prüfen</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Redundanz, Anpassungs- und</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Lernfähigkeit untersuchen. Energie,</text>
<text x="532.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">lokale Versorgung, Bildung,</text>
<text x="532.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gesundheit und demokratische</text>
<text x="532.0" y="678" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Institutionen können dazu</text>
<text x="532.0" y="712" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">beitragen.</text>
<rect x="32.0" y="768" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="808" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Beispielhafte Risikopfade</text>
<text x="52.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Ein günstiger Lieferant kann</text>
<text x="52.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Abhängigkeit erhöhen. Unsanierte</text>
<text x="52.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gebäude können Haushalte</text>
<text x="52.0" y="958" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">belasten. Algorithmische</text>
<text x="52.0" y="992" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Verstärkung kann Polarisierung</text>
<text x="52.0" y="1026" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">begünstigen.</text>
<rect x="512.0" y="768" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="808" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Früh erkennen und lernen</text>
<text x="532.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Eintrittsbedingungen, Schwellen,</text>
<text x="532.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Verwundbarkeit und Unsicherheit</text>
<text x="532.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">offenlegen. Prävention und spätere</text>
<text x="532.0" y="958" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Beobachtung verbinden;</text>
<text x="532.0" y="992" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Informationsgewinn ist noch keine</text>
<text x="532.0" y="1026" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">vermiedene Schädigung.</text>
<text x="32" y="1086" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Mögliche Pfade, keine pauschalen Tatsachenurteile. Gesundheits-, Lieferketten-, Klima-</text>
<text x="32" y="1117" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">und Demokratiefolgen brauchen eigene Belege. Schutz und Nichtkompensation gelten</text>
<text x="32" y="1148" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">auch bei einem wirtschaftlich günstigen Ergebnis.</text>
<text x="32" y="1209.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
