<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="784" viewBox="0 0 1000 784">
<title>Datenarchitektur der Wirkungsökonomie</title>
<desc>Berichtsdaten, Wirkungsnachweis und Rechtsfolge getrennt Berichtswert ist kein Kausalitätsbeweis. Keine freie Score-zu-Mehrwertsteuer-Automatik und kein Vorsteuerbonus allein aus einem Score.</desc>
<rect width="1000" height="784" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Datenarchitektur der Wirkungsökonomie</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Berichtsdaten, Wirkungsnachweis und Rechtsfolge getrennt</text>
<rect x="32.0" y="140" width="456.0" height="222" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Quellen</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">CSRD/ESRS, GRI, Statistik,</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Lieferketten- und Fachdaten mit</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">ihrer jeweiligen Belegfunktion</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">prüfen.</text>
<rect x="512.0" y="140" width="456.0" height="222" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Verknüpfung</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">MasterItem → StateVariable →</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Indicator → Observation →</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Analysis / Reality Check. Die</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">WÖk-ID ist eine Kennung.</text>
<rect x="32.0" y="386" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="426" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Bewertung</text>
<text x="52.0" y="474" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Einheiten, Zeitraum, Population,</text>
<text x="52.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Raum, Vergleich, Zurechnung und</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Unsicherheit festlegen.</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Schutzgrenzen zuerst prüfen.</text>
<rect x="512.0" y="386" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="426" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Rückkopplung</text>
<text x="532.0" y="474" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Ein begründeter Befund kann</text>
<text x="532.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Entscheidungen informieren. Ein</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Tarif folgt aus der zulässigen</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Rechtsnorm, nicht aus dem</text>
<text x="532.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Datenfeld.</text>
<text x="32" y="670" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Berichtswert ist kein Kausalitätsbeweis. Keine freie Score-zu-Mehrwertsteuer-Automatik</text>
<text x="32" y="701" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">und kein Vorsteuerbonus allein aus einem Score.</text>
<text x="32" y="762.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
