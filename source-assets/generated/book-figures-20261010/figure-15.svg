<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="784" viewBox="0 0 1000 784">
<title>Wirkungspotenzial und Wirkungsrisiko</title>
<desc>Mögliche Folgen sind noch keine eingetretene Wirkung Kein pauschaler Score für eine Produktart. Fehlende Daten sind offen; sie bedeuten keine neutrale Wirkung 0.</desc>
<rect width="1000" height="784" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Wirkungspotenzial und Wirkungsrisiko</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Mögliche Folgen sind noch keine eingetretene Wirkung</text>
<rect x="32.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Potenzial</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Welche Veränderungen werden</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">unter beschriebenen Bedingungen</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">möglich? Szenarien und</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Bandbreiten offenlegen.</text>
<rect x="512.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Risiko</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Welche nachteiligen</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Veränderungen sind möglich?</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wahrscheinlichkeit,</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Schadensumfang, Unsicherheit und</text>
<text x="532.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Schutzgrenzen prüfen.</text>
<rect x="32.0" y="420" width="456.0" height="222" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Wirkung</text>
<text x="52.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Was hat sich tatsächlich verändert?</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Beobachtung, Vergleich und</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zurechnung tragen die Aussage.</text>
<rect x="512.0" y="420" width="456.0" height="222" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Beispiele</text>
<text x="532.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Erneuerbare Energie, Textilien,</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Bildung und Medien können je nach</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Umsetzung unterschiedliche</text>
<text x="532.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Chancen und Risiken entfalten.</text>
<text x="32" y="670" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Kein pauschaler Score für eine Produktart. Fehlende Daten sind offen; sie bedeuten</text>
<text x="32" y="701" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">keine neutrale Wirkung 0.</text>
<text x="32" y="762.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
