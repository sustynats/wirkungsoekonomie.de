<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1163" viewBox="0 0 1000 1163">
<title>Planet: Koexistenz und Regeneration</title>
<desc>Natürliche Lebensgrundlagen neben ihrer wirtschaftlichen Nutzung betrachten Normatives Leitbild, kein pauschaler Nachweis aller behaupteten Folgen. Regeneration und ökologische Grenzen werden mit konkreten Befunden und Referenzräumen geprüft.</desc>
<rect width="1000" height="1163" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Planet: Koexistenz und Regeneration</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Natürliche Lebensgrundlagen neben ihrer wirtschaftlichen Nutzung betrachten</text>
<rect x="32.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Entnahme und Verbrauch</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Bergbau, Öl, Rodung,</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Monokulturen, Produktion und</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Abfall mit dem konkreten</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Lebenszyklus untersuchen. Nicht</text>
<text x="52.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">jede Nutzung hat dieselben Folgen.</text>
<rect x="512.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Mögliche Belastungen</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Ressourcenverbrauch, Emissionen,</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Artenverlust, Wasserstress und</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">soziale Konflikte getrennt</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">dokumentieren. Eintritt und kausale</text>
<text x="532.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zurechnung prüfen.</text>
<rect x="32.0" y="420" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Wald, Boden und Wasser</text>
<text x="52.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Nicht allein Holzbestand,</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Produktionsfläche oder Ressource</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">sehen. Klima-, Wasser-, Lebens-</text>
<text x="52.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und Regenerationsfunktionen</text>
<text x="52.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">berücksichtigen.</text>
<rect x="512.0" y="420" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Kreisläufe und Energie</text>
<text x="532.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Biodiversität, Wasserhaushalt,</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Bodenleben, erneuerbare</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Versorgung und Kreislaufwirtschaft</text>
<text x="532.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">im gekoppelten System betrachten.</text>
<rect x="32.0" y="700" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="740" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Koexistenz</text>
<text x="52.0" y="788" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Nutzung soll die eigenen</text>
<text x="52.0" y="822" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Lebensgrundlagen erhalten.</text>
<text x="52.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Konkrete Regeneration, Resilienz</text>
<text x="52.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und Lebensqualität prüfen, statt sie</text>
<text x="52.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">aus einem Bereichsnamen</text>
<text x="52.0" y="958" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">abzuleiten.</text>
<rect x="512.0" y="700" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="740" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Langfristige Entscheidung</text>
<text x="532.0" y="788" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Heute verfügbare Erträge und</text>
<text x="532.0" y="822" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">spätere Belastungen anderer</text>
<text x="532.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Räume oder Generationen</text>
<text x="532.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">unterscheiden. Planetare</text>
<text x="532.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Schutzgrenzen sind nicht beliebig</text>
<text x="532.0" y="958" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">kompensierbar.</text>
<text x="32" y="1018" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Normatives Leitbild, kein pauschaler Nachweis aller behaupteten Folgen. Regeneration</text>
<text x="32" y="1049" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">und ökologische Grenzen werden mit konkreten Befunden und Referenzräumen</text>
<text x="32" y="1080" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">geprüft.</text>
<text x="32" y="1141.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
