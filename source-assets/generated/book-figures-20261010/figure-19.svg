<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1204" viewBox="0 0 1000 1204">
<title>Die Architektur der Begriffe</title>
<desc>Die Sprache der Wirkungsökonomie: verschiedene Aufgaben sauber trennen Das Schema ordnet Begriffe, keine zusätzlichen zeitlichen Pflichtstationen. Nichtkompensation und Reverse Merit Order gelten für Bewertung und Priorisierung.</desc>
<rect width="1000" height="1204" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Die Architektur der Begriffe</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Die Sprache der Wirkungsökonomie: verschiedene Aufgaben sauber trennen</text>
<rect x="32.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Wirkung und Zustand</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wirkung ist die tatsächliche</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Veränderung eines Zustands.</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zustand beschreibt die jeweilige</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Lage, nicht bereits ihre Bewertung.</text>
<rect x="512.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Handlung und Unterlassen</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Tun, Entscheiden und</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Nicht-Handeln können</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Ausgangspunkte sein. Die dadurch</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">beanspruchte Veränderung braucht</text>
<text x="532.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">einen nachvollziehbaren Wirkpfad.</text>
<rect x="32.0" y="420" width="456.0" height="326" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Potenzial und Risiko</text>
<text x="52.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Mögliche Verbesserungen und</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">mögliche Schäden getrennt von</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">bereits eingetretener Wirkung</text>
<text x="52.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">dokumentieren. Offen ist nicht</text>
<text x="52.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">neutral.</text>
<rect x="512.0" y="420" width="456.0" height="326" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Träger, Empfänger und</text>
<text x="532.0" y="496" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Raum</text>
<text x="532.0" y="544" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Produkt, Medium, Kapital oder</text>
<text x="532.0" y="578" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">öffentliche Maßnahme als</text>
<text x="532.0" y="612" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gegenstand bestimmen. Betroffene</text>
<text x="532.0" y="646" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Menschen, Ökosysteme und</text>
<text x="532.0" y="680" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Institutionen im konkreten Kontext</text>
<text x="532.0" y="714" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">betrachten.</text>
<rect x="32.0" y="770" width="456.0" height="292" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="810" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Systemischer und</text>
<text x="52.0" y="846" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">normativer Wert</text>
<text x="52.0" y="894" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Bedeutung für Funktionsweise,</text>
<text x="52.0" y="928" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Stabilität und Resilienz von der</text>
<text x="52.0" y="962" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">begründeten Bewertung anhand</text>
<text x="52.0" y="996" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">von Mensch, Planet, Demokratie</text>
<text x="52.0" y="1030" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und Schutzrechten unterscheiden.</text>
<rect x="512.0" y="770" width="456.0" height="292" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="810" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Lenkung und Rückkopplung</text>
<text x="532.0" y="858" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Geprüfte Befunde können</text>
<text x="532.0" y="892" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Entscheidungen, Anreize und</text>
<text x="532.0" y="926" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Preise beeinflussen. Spätere</text>
<text x="532.0" y="960" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Beobachtungen ermöglichen</text>
<text x="532.0" y="994" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Lernen; Wirkung ist nicht mit</text>
<text x="532.0" y="1028" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Lenkung gleichgesetzt.</text>
<text x="32" y="1090" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Das Schema ordnet Begriffe, keine zusätzlichen zeitlichen Pflichtstationen.</text>
<text x="32" y="1121" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Nichtkompensation und Reverse Merit Order gelten für Bewertung und Priorisierung.</text>
<text x="32" y="1182.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
