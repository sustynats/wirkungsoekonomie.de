<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1197" viewBox="0 0 1000 1197">
<title>Wohlstand als Systemzustand</title>
<desc>Lebensqualität und Zukunftsfähigkeit für Mensch, Planet und Demokratie Normatives Leitbild. Das Zusammenspiel ist zu untersuchen, keine Garantie gelungener Steuerung. Nichtkompensation und Reverse Merit Order begrenzen Verrechnung und Priorisierung.</desc>
<rect width="1000" height="1197" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Wohlstand als Systemzustand</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Lebensqualität und Zukunftsfähigkeit für Mensch, Planet und Demokratie</text>
<rect x="32.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Stabiler Planet</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Ökologische Grenzen respektieren,</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Klima und biologische Vielfalt</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">schützen. Ressourcen im Kreislauf</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">halten und Wasser für Menschen</text>
<text x="52.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und Natur sichern.</text>
<rect x="512.0" y="140" width="456.0" height="256" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Starke Demokratie</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Freiheit, Rechtsschutz,</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gerechtigkeit und Teilhabe sichern.</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Transparenz und verlässliche</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Verfahren stärken demokratische</text>
<text x="532.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Korrekturfähigkeit.</text>
<rect x="32.0" y="420" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Regenerative Wirtschaft</text>
<text x="52.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wertschöpfung innerhalb planetarer</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Grenzen ermöglichen. Nachhaltig</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">wirtschaften, Probleme lösen und</text>
<text x="52.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">sinnvolle, faire Arbeit unterstützen.</text>
<rect x="512.0" y="420" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="460" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Gekoppelte Grundlagen</text>
<text x="532.0" y="508" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Lebensgrundlagen tragen Freiheit</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">und Sicherheit. Ressourcen</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">ermöglichen Versorgung und</text>
<text x="532.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Innovation. Vertrauen und Teilhabe</text>
<text x="532.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">beeinflussen wirtschaftliche</text>
<text x="532.0" y="678" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Zukunftsfähigkeit.</text>
<rect x="32.0" y="734" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="774" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Kein einzelner Ersatzwert</text>
<text x="52.0" y="822" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Geldbestand, Konsum oder ein</text>
<text x="52.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Produktionsanstieg allein belegen</text>
<text x="52.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">keinen Wohlstand. Schäden,</text>
<text x="52.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Verteilung und Rechte dürfen nicht</text>
<text x="52.0" y="958" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">hinter einem Gesamtwert</text>
<text x="52.0" y="992" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">verschwinden.</text>
<rect x="512.0" y="734" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="774" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Begründet gestalten</text>
<text x="532.0" y="822" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Wirkpfade und tatsächliche</text>
<text x="532.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Veränderungen untersuchen. Ziel</text>
<text x="532.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">ist Lebensqualität heute und für</text>
<text x="532.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">kommende Generationen;</text>
<text x="532.0" y="958" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Fortschritt wird nicht allein am</text>
<text x="532.0" y="992" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Kapital gemessen.</text>
<text x="32" y="1052" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Normatives Leitbild. Das Zusammenspiel ist zu untersuchen, keine Garantie gelungener</text>
<text x="32" y="1083" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Steuerung. Nichtkompensation und Reverse Merit Order begrenzen Verrechnung und</text>
<text x="32" y="1114" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Priorisierung.</text>
<text x="32" y="1175.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
