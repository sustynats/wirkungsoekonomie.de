<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1231" viewBox="0 0 1000 1231">
<title>Machtkonzentration und Kooperation</title>
<desc>Kapitel 43.4: Führungsstrukturen, Verantwortung und Lernfähigkeit prüfen Modellhafte Gegenüberstellung der patriarchalen Kontrollillusion und systemischer Kooperation. Ein Organisationslabel allein belegt weder Verlust noch Entfaltung von Wirkung.</desc>
<rect width="1000" height="1231" fill="#fbfaf6"/>
<text x="32" y="72" font-family="Arial" font-size="40" font-weight="bold" fill="#102b45">Machtkonzentration und Kooperation</text>
<text x="32" y="120" font-family="Arial" font-size="26" font-weight="normal" fill="#28644e">Kapitel 43.4: Führungsstrukturen, Verantwortung und Lernfähigkeit prüfen</text>
<rect x="32.0" y="140" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Zentrale Kontrolle</text>
<text x="52.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Top-down-Autorität, konzentrierte</text>
<text x="52.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Entscheidungen und einseitige</text>
<text x="52.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Ressourcenflüsse können</text>
<text x="52.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Beteiligung und Rückmeldung</text>
<text x="52.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">begrenzen.</text>
<rect x="512.0" y="140" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="180" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Starre Strukturen</text>
<text x="532.0" y="228" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Geringe Anpassung und</text>
<text x="532.0" y="262" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Ausschluss können Wissen und</text>
<text x="532.0" y="296" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Handlungsmöglichkeiten</text>
<text x="532.0" y="330" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">einschränken. Die tatsächlichen</text>
<text x="532.0" y="364" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Folgen werden am Gegenstand</text>
<text x="532.0" y="398" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">geprüft.</text>
<rect x="32.0" y="454" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="494" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Gemeinsame Ausrichtung</text>
<text x="52.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Sinn, Werte und Ziele verbinden,</text>
<text x="52.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">ohne individuelle Perspektiven und</text>
<text x="52.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">legitimen Widerspruch zu</text>
<text x="52.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">unterdrücken.</text>
<rect x="512.0" y="454" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="494" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Verteilte Verantwortung</text>
<text x="532.0" y="542" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Rollen, Zuständigkeit und</text>
<text x="532.0" y="576" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Rechenschaft offenlegen.</text>
<text x="532.0" y="610" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Gemeinsame Gestaltung und</text>
<text x="532.0" y="644" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">wechselseitige Beziehungen</text>
<text x="532.0" y="678" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">können neue Möglichkeiten</text>
<text x="532.0" y="712" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">eröffnen.</text>
<rect x="32.0" y="768" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="52.0" y="808" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Adaptive Zusammenarbeit</text>
<text x="52.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Lernen, Flexibilität, Vielfalt und</text>
<text x="52.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Inklusion fördern. Vertrauen und</text>
<text x="52.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Resonanz sind Bedingungen, keine</text>
<text x="52.0" y="958" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Garantie einer Verbesserung.</text>
<rect x="512.0" y="768" width="456.0" height="290" rx="8" fill="#ffffff" stroke="#b8c4c7"/>
<text x="532.0" y="808" font-family="Arial" font-size="30" font-weight="bold" fill="#28644e">Folgen und Schutz</text>
<text x="532.0" y="856" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Prüfen, ob Zusammenarbeit</text>
<text x="532.0" y="890" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">tatsächlich Zugang,</text>
<text x="532.0" y="924" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Handlungsfähigkeit und Ergebnisse</text>
<text x="532.0" y="958" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">verbessert. Strukturen bewerten,</text>
<text x="532.0" y="992" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">nicht den moralischen Wert von</text>
<text x="532.0" y="1026" font-family="Arial" font-size="26" font-weight="normal" fill="#233648">Menschen.</text>
<text x="32" y="1086" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Modellhafte Gegenüberstellung der patriarchalen Kontrollillusion und systemischer</text>
<text x="32" y="1117" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Kooperation. Ein Organisationslabel allein belegt weder Verlust noch Entfaltung von</text>
<text x="32" y="1148" font-family="Arial" font-size="24" font-weight="normal" fill="#233648">Wirkung.</text>
<text x="32" y="1209.0" font-family="Arial" font-size="24" font-weight="normal" fill="#28644e">Natalie Weber · Bereinigter Modellstand 10. Oktober 2026</text>
</svg>
