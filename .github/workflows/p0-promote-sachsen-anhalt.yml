name: P0 promote Sachsen-Anhalt Wahlprogramme

on:
  push:
    branches:
      - p0/promote-sachsen-anhalt-20260819

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN_PRIMARY: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TOKEN_ALT1: ${{ secrets.VERCEL_ACCESS_TOKEN }}
      VERCEL_TOKEN_ALT2: ${{ secrets.VERCEL_API_TOKEN }}
    steps:
      - name: Promote exact approved Vercel deployment
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="${VERCEL_TOKEN_PRIMARY:-}"
          if [ -z "$TOKEN" ]; then TOKEN="${VERCEL_TOKEN_ALT1:-}"; fi
          if [ -z "$TOKEN" ]; then TOKEN="${VERCEL_TOKEN_ALT2:-}"; fi
          if [ -z "$TOKEN" ]; then
            echo "WOEK_P0_VERCEL_TOKEN_NOT_CONFIGURED"
            exit 2
          fi
          PROJECT_ID="prj_h1X7GuXOVo1bdnOfoYXzTfP8ygBK"
          TEAM_ID="team_sOR1voJPyc1jY5VsMdQRyFWz"
          DEPLOYMENT_ID="dpl_97u3zvKqcswrtowjLjAicoEmHqX1"
          URL="https://api.vercel.com/v10/projects/${PROJECT_ID}/promote/${DEPLOYMENT_ID}?teamId=${TEAM_ID}"
          HTTP=$(curl --silent --show-error --output /tmp/vercel-promote-response.json --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${TOKEN}" \
            --header 'Content-Type: application/json' \
            "$URL")
          echo "WOEK_P0_PROMOTE_HTTP=${HTTP}"
          if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
            python - <<'PY'
import json
try:
    data=json.load(open('/tmp/vercel-promote-response.json'))
    safe={k:v for k,v in data.items() if k.lower() not in {'token','access_token','authorization'}}
    print('WOEK_P0_PROMOTE_RESPONSE', json.dumps(safe, ensure_ascii=True)[:1500])
except Exception:
    print('WOEK_P0_PROMOTE_RESPONSE_UNREADABLE')
PY
            exit 3
          fi
          echo "WOEK_P0_PROMOTE_ACCEPTED=${DEPLOYMENT_ID}"

      - name: Wait for production and smoke Sachsen-Anhalt routes
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://parlament.wirkungsoekonomie.de"
          routes=(
            "/laender/sachsen-anhalt"
            "/laender/sachsen-anhalt/quellen"
            "/laender/sachsen-anhalt/ziele"
            "/laender/sachsen-anhalt/wahlprogramme/ltw-2026-st-cdu"
            "/laender/sachsen-anhalt/wahlprogramme/ltw-2026-st-spd"
            "/laender/sachsen-anhalt/wahlprogramme/ltw-2026-st-gruene"
            "/laender/sachsen-anhalt/wahlprogramme/ltw-2026-st-linke"
            "/laender/sachsen-anhalt/wahlprogramme/ltw-2026-st-bsw"
            "/laender/sachsen-anhalt/wahlprogramme/ltw-2026-st-afd"
          )
          for attempt in $(seq 1 30); do
            code=$(curl -L -sS -o /tmp/afd.html -w '%{http_code}' "$BASE/laender/sachsen-anhalt/wahlprogramme/ltw-2026-st-afd")
            if [ "$code" = "200" ] && grep -q 'vollstaendige-wirkungsakte' /tmp/afd.html && grep -q 'vollstaendiges-zusageregister' /tmp/afd.html; then
              echo "WOEK_P0_PRODUCTION_SWITCH_VISIBLE_ATTEMPT=${attempt}"
              break
            fi
            if [ "$attempt" = "30" ]; then
              echo "WOEK_P0_PRODUCTION_SWITCH_TIMEOUT code=${code}"
              exit 4
            fi
            sleep 10
          done
          for route in "${routes[@]}"; do
            code=$(curl -L -sS -o /tmp/page.html -w '%{http_code}' "$BASE$route")
            echo "WOEK_P0_ROUTE ${route} ${code}"
            test "$code" = "200"
            case "$route" in
              */wahlprogramme/*)
                grep -q 'vollstaendige-wirkungsakte' /tmp/page.html
                grep -q 'vollstaendiges-zusageregister' /tmp/page.html
                ;;
            esac
          done
          unknown=$(curl -L -sS -o /dev/null -w '%{http_code}' "$BASE/laender/sachsen-anhalt/wahlprogramme/not-a-real-programme")
          echo "WOEK_P0_UNKNOWN_ROUTE=${unknown}"
          test "$unknown" = "404"
          echo "SACHSEN_ANHALT_WAHLPROGRAMME_HOTFIX_COMPLETED_LIVE"
