name: Publish WÖk high-resolution graphics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-woek-graphics.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SOURCE_URL: 'https://uc454c5bf1b903a2e91da925df65.dl.dropboxusercontent.com/cd/0/get/DIMEP4fTwafQ6cXoveILA8yMFClPgEklzINDVsjiCLxAdWANUDCyr5v4oGcPF9btcjFvMEPa9E3_oBJO81p5nkzgOUT237MvYLVnDyqEBLqlC7z_755UgJf_EAUKA1aF4CWA3Wj73y-0xU1VegYT4x8W/file?c_luid=e8079953'
      TAG: 'grafiken-hochaufloesend-2026-09-15'
      FILE: 'Wirkungsoekonomie_Grafiken_Hochaufloesend_2026-09-15.zip'
    steps:
      - uses: actions/checkout@v4
      - name: Download graphics archive
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$SOURCE_URL" -o "$FILE"
          test "$(stat -c%s "$FILE")" -gt 80000000
          unzip -t "$FILE" >/dev/null
      - name: Publish GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" \
              --title "Wirkungsökonomie – Grafiken hochauflösend" \
              --notes "Hochauflösende Fachgrafiken aus Die neue Ordnung des Wohlstands, Band I und II. Enthält Das Modell auf einen Blick sowie die Detailgrafiken, druckoptimiert (3×, 300-dpi-Metadaten), inklusive Index."
          fi
