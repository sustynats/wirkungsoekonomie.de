name: PR quality gate

env:
  SOURCE_DATE_EPOCH: '1787270400'

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: pr-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website-gates:
    name: Website build, search, privacy and URL gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize CDU convergence outputs on PR 257 only
        if: github.event.pull_request.number == 257
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/materialize_st_cdu_review_snapshots.py
          python tools/normalize_st_cdu_convergence_shards.py
          python tools/build_st_cdu_global_convergence.py
          python tools/validate_st_cdu_global_convergence.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- woek-parlament-app/data/fachakten/source-manifests/sachsen-anhalt
          if git diff --cached --quiet; then
            echo 'CDU convergence outputs already committed.'
          else
            git commit -m 'data(cdu): materialize canonical convergence state [skip ci]'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Install Python build dependencies
        run: python -m pip install --upgrade pip openpyxl pymupdf pypdf reportlab python-docx

      - name: Build search index
        run: npm run build:search

      - name: Ensure generated search artifacts are committed
        run: git diff --exit-code -- assets/search/search-index.json public/data/woek-search-meta.json

      - name: Build content taxonomy
        run: npm run taxonomy:build

      - name: Ensure generated taxonomy is committed
        run: git diff --exit-code -- content/taxonomy/site-map.json

      - name: Build complete site before artifact checks
        run: WOEK_PDF_BUILD_MODE=verify npm run build

      - name: Build public deploy artifact
        run: npm run build:artifact

      - name: Check public artifact privacy
        run: npm run check:privacy

      - name: Check URL baseline
        run: npm run check:url-baseline

      - name: Report internal link integrity
        run: npm run check:site-links

      - name: Check site size
        run: npm run check:size
