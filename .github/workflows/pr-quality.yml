name: PR quality gate

env:
  SOURCE_DATE_EPOCH: '1787270400'

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  title-image-raster:
    name: Real Linux title-image rasterization
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
        id: chrome
        with:
          chrome-version: "152.0.7977.82"
      - name: Exercise real title-image output repeatedly without paid generation
        env:
          WT_CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          WT_CHROME_NO_SANDBOX: "true"
        run: node scripts/news/title-image/smoke.mjs
  website-gates:
    name: Website build, search, privacy and URL gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build dependencies
        run: python -m pip install --upgrade pip openpyxl pymupdf pypdf reportlab python-docx

      - name: Check Sachsen-Anhalt public count semantics
        run: node scripts/quality/check-sachsen-anhalt-public-count-semantics.mjs

      - name: Keep rejected Parliament reference-scene candidates fail-closed (no generation)
        run: |
          node --test tests/news/parliament-reference-scene.test.mjs tests/news/parliament-reference-scene-qa.test.mjs
          node scripts/parliament/impact-visuals/check-reference-scene-candidates.mjs --expect-rejected

      - name: Build search index
        run: npm run build:search

      - name: Ensure generated search artifacts are committed
        run: git diff --exit-code -- assets/search/search-index.json public/data/woek-search-meta.json

      - name: Build content taxonomy
        run: npm run taxonomy:build

      - name: Ensure generated taxonomy is committed
        run: git diff --exit-code -- content/taxonomy/site-map.json

      - name: Build complete site before artifact checks
        run: WOEK_PDF_BUILD_MODE=verify npm run build

      - name: Build public deploy artifact
        run: npm run build:artifact

      - name: Check public artifact privacy
        run: npm run check:privacy

      - name: Check URL baseline
        run: npm run check:url-baseline

      - name: Report internal link integrity
        run: npm run check:site-links

      - name: Check site size
        run: npm run check:size
