name: Read-only editorial lane verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    name: Read bridge lane without taking it
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read bridge monitor only
        env:
          WOEK_NEWS_BRIDGE_URL: https://130.162.217.58.sslip.io/api/news-bridge
          WOEK_NEWS_BRIDGE_TOKEN: ${{ secrets.WOEK_NEWS_BRIDGE_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import {bridgeSession} from './scripts/news/bridge/remote.mjs';
          const status=await bridgeSession().monitor();
          const lane=status?.run_lock;
          if(!lane || typeof lane.process_holds_lock!=='boolean')throw Error('MONITOR_LANE_UNAVAILABLE');
          const owner=lane.owner;
          const owner_state=owner==='41436498548:1'?'previous_ticker_run':owner?'other_owner':'none';
          console.log(JSON.stringify({checked_at:new Date().toISOString(),lane:lane.lane,
            process_holds_lock:lane.process_holds_lock,owner_state,acquired_at:lane.acquired_at||null,
            monitor_read_only:true,provider_called:false}));
          NODE
