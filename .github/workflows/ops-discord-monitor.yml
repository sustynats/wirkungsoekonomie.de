name: WÖk Betriebsmonitor und Discord-Tagesbericht

on:
  workflow_run:
    workflows: [Wirkungsticker, 'Deploy static site.']
    types: [completed]
  schedule:
    - cron: '0,15,30,45 * * * *'
  push:
    branches: [codex/wirkungsticker-clock, codex/ops-monitor-clock]
  workflow_dispatch:
    inputs:
      report_now:
        description: 'Heutigen Tagesbericht jetzt senden (höchstens einmal je Berliner Datum)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: woek-ops-discord-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: github.event_name != 'workflow_run' || contains(fromJSON('["failure","timed_out","action_required"]'), github.event.workflow_run.conclusion)
    # The legacy health endpoint also reads the complete private queue.
    concurrency:
      group: ${{ vars.WIRKUNGSTICKER_PROCESSING_MODE == 'dropbox_chatgpt_bridge' && 'wirkungsticker-oracle-bridge-access' || 'woek-ops-monitor-api-access' }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            .github/workflows/ops-discord-monitor.yml
            .github/workflows/wirkungsticker.yml
            scripts/ops/discord-monitor.mjs
            scripts/ops/news-recovery.mjs
            scripts/ops/betriebsstatus.mjs
            scripts/news/bridge/observation-keys.mjs
            scripts/news/feed-order.mjs
            scripts/news/bridge/remote.mjs
            scripts/news/case-files.mjs
            scripts/news/publication-update.mjs
            scripts/news/reader-copy.mjs
            scripts/news/living-files.mjs
            scripts/news/newsroom.mjs
            scripts/news/court-case-identity.mjs
            scripts/news/event-identity.mjs
            scripts/news/projection-cache.mjs
            scripts/news/numeric-evidence.mjs
            scripts/news/access-policy.mjs
            scripts/news/request-deadline.mjs
            scripts/news/check-run-health.mjs
            scripts/news/source-funnel.mjs
            scripts/news/operating-cost.mjs
            tests/ops/discord-monitor.test.mjs
            tests/ops/news-recovery.test.mjs
            reports/wirkungsticker-latest-run.json
            data/news/stories.json
            data/news/lagen.json
            data/news/usage.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Am 17./18.09.2026 schwieg der Monitor 30 Stunden: der Selbsttest las eine
      # Datei, die im Checkout fehlte, und der Lauf brach vor jeder Meldung ab.
      # Seither laufen die Pruefungen trotzdem, melden den gescheiterten
      # Selbsttest selbst, und der Lauf wird am Ende dennoch rot.
      - name: Test monitor invariants
        id: selbsttest
        continue-on-error: true
        run: node --test tests/ops/discord-monitor.test.mjs tests/ops/news-recovery.test.mjs
      - name: Record the checked-out main revision
        run: echo "WOEK_MONITOR_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Check live services and deliver private Discord messages
        env:
          GH_TOKEN: ${{ github.token }}
          WOEK_MONITOR_DISCORD_BOT_TOKEN: ${{ secrets.WOEK_MONITOR_DISCORD_BOT_TOKEN }}
          WOEK_MONITOR_DISCORD_USER_ID: ${{ secrets.WOEK_MONITOR_DISCORD_USER_ID }}
          REPORT_NOW: ${{ inputs.report_now }}
          WIRKUNGSTICKER_PROCESSING_MODE: ${{ vars.WIRKUNGSTICKER_PROCESSING_MODE || 'api' }}
          WOEK_NEWS_BRIDGE_DISCOVERY_ENABLED: ${{ vars.WOEK_NEWS_BRIDGE_DISCOVERY_ENABLED || 'true' }}
          WOEK_NEWS_BRIDGE_URL: https://130.162.217.58.sslip.io/api/news-bridge
          WOEK_NEWS_BRIDGE_TOKEN: ${{ secrets.WOEK_NEWS_BRIDGE_TOKEN }}
          WOEK_MONITOR_SELFTEST: ${{ steps.selbsttest.outcome }}
        run: |
          args=()
          if [ "$REPORT_NOW" = "true" ]; then args+=(--report-now); fi
          node scripts/ops/discord-monitor.mjs "${args[@]}"
      - name: Fail the run when the self-test failed
        if: steps.selbsttest.outcome == 'failure'
        run: |
          echo "::error::Selbsttest des Betriebsmonitors gescheitert; die Pruefungen liefen trotzdem und haben es gemeldet."
          exit 1
