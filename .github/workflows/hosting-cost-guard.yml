name: Hosting cost guard

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "ops/hosting-cost-policy.json"
      - "scripts/ops/check-hosting-cost-guard.mjs"
      - "woek-parlament-app/vercel.json"
      - ".github/workflows/hosting-cost-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:hosting-cost
