name: ST six-party terminal release

on:
  pull_request:
    paths:
      - "audit-manifests/sachsen-anhalt/**"
      - "content/audits/sachsen-anhalt/**"
      - "tools/validate_*final*.py"
      - "tools/finalize_st_cdu_convergence.py"
      - "tools/validate_st_six_party_terminal_release.py"
      - "woek-parlament-app/app/components/SaxonyAnhaltProgrammeAnalysisV3.tsx"
      - "woek-parlament-app/app/laender/sachsen-anhalt/**"
      - "woek-parlament-app/data/fachakten/source-manifests/sachsen-anhalt/**"
      - "woek-parlament-app/data/presentation/sachsen-anhalt-terminal-release.ts"
      - "woek-parlament-app/scripts/quality/check-sachsen-anhalt-programme-publication.ts"
      - "woek-parlament-app/scripts/quality/check-programme-state-integrity.ts"
      - ".github/workflows/st-six-party-terminal-release.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: st-six-party-terminal-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-union:
    name: Six frozen unions and combined descriptor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate AfD final union
        run: python3 tools/validate_afd_final_union_a43.py
      - name: Validate BSW final union
        run: python3 tools/validate_bsw_final_union_r22.py
      - name: Validate CDU final union and pinned GitHub source records
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/finalize_st_cdu_convergence.py --check-github
      - name: Validate GRÜNE final union and pinned GitHub source records
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/validate_st_gruene_final_union.py --check-github
      - name: Validate LINKE final union
        run: python3 tools/validate_linke_final_union_c26.py
      - name: Validate SPD final union
        run: python3 tools/validate_spd_final_active_leaf_c01i.py
      - name: Validate combined terminal release
        run: python3 tools/validate_st_six_party_terminal_release.py
      - name: Assert deterministic artifacts
        run: git diff --exit-code

  public-projection:
    name: Terminal public projection
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: woek-parlament-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: woek-parlament-app/package-lock.json
      - run: npm ci
      - run: npm run check:sachsen-anhalt-publication
      - run: npm run check:state-publication
      - run: npm run check:same-page-navigation
      - run: npm run typecheck
