name: Publish Website Updates to Discord

on:
  schedule:
    - cron: "9,39 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore publication state
        id: state
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = ".github/discord-site-updates-state.json";
            const branch = "discord-site-updates-state";
            try {
              const response = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: branch
              });
              fs.writeFileSync(path, Buffer.from(response.data.content, "base64"));
              core.setOutput("bootstrap", "false");
            } catch (error) {
              if (error.status !== 404) throw error;
              fs.writeFileSync(path, JSON.stringify({ seen: [] }));
              core.setOutput("bootstrap", "true");
            }
      - name: Publish new website updates
        env:
          DISCORD_WEBSITE_UPDATES_WEBHOOK_URL: ${{ secrets.DISCORD_WEBSITE_UPDATES_WEBHOOK_URL }}
          SITE_UPDATES_DISCORD_STATE_PATH: .github/discord-site-updates-state.json
          SITE_UPDATES_DISCORD_BOOTSTRAP: ${{ steps.state.outputs.bootstrap == 'true' && '1' || '0' }}
          SITE_UPDATES_DISCORD_PUBLISH_LATEST_ON_BOOTSTRAP: "1"
        run: node scripts/discord/publish-site-updates-rss.mjs
      - name: Save publication state
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = ".github/discord-site-updates-state.json";
            const branch = "discord-site-updates-state";
            const content = fs.readFileSync(path).toString("base64");
            let sha;
            try {
              const response = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path, ref: branch });
              sha = response.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
              try {
                await github.rest.git.getRef({ owner: context.repo.owner, repo: context.repo.repo, ref: `heads/${branch}` });
              } catch (refError) {
                if (refError.status !== 404) throw refError;
                await github.rest.git.createRef({ owner: context.repo.owner, repo: context.repo.repo, ref: `refs/heads/${branch}`, sha: context.sha });
              }
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner, repo: context.repo.repo, path,
              message: "chore: update Discord website updates RSS state",
              content, branch, ...(sha ? { sha } : {})
            });
