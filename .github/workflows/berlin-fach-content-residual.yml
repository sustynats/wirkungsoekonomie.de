name: Berlin Fach content residual

on:
  pull_request:
    paths:
      - "tools/validate_berlin_fach_content_residual.py"
      - "tools/validate_parliament_issue_241_residual.py"
      - "docs/audits/parliament-241-current-residual-2026-08-24.json"
      - "ops/releases/parliament-current-golden-readiness-2026-08-28.json"
      - "tools/validate_parliament_current_golden_readiness.py"
      - "woek-parlament-app/data/state-programmes/fach-content-residuals/berlin-2026-v1.json"
      - "woek-parlament-app/data/state-programmes/fach-content-residuals/berlin-2026-v2.json"
      - "woek-parlament-app/data/state-programmes/fach-content-residuals/berlin-2026-v3.json"
      - "woek-parlament-app/data/state-programmes/current-source-registers/berlin-2026-v2.json"
      - "woek-parlament-app/data/state-programmes/fach-reviews/berlin-2026-bsw-v1.json"
      - "woek-parlament-app/data/state-programmes/fach-reviews/berlin-2026-bsw-p14-explicit-v1.json"
      - "woek-parlament-app/data/state-programmes/fach-reviews/berlin-2026-bsw-p15-p19-explicit-v1.json"
      - "woek-parlament-app/data/state-programmes/fach-reviews/berlin-2026-bsw-p15-p19-authoritative-handoff.md"
      - "woek-parlament-app/data/states/berlin/approved-review-2026-08-18.md"
      - "woek-parlament-app/scripts/quality/check-berlin-fach-truth-residual.mjs"
      - "woek-parlament-app/scripts/quality/materialize-berlin-fach-truth-residual.mjs"
      - "woek-parlament-app/scripts/quality/check-berlin-combined-terminal-matrix.mjs"
      - "woek-parlament-app/scripts/quality/materialize-berlin-combined-terminal-matrix.mjs"
      - "woek-parlament-app/scripts/quality/check-berlin-bsw-full-programme.mjs"
      - "woek-parlament-app/tests/berlin-fach-truth-residual.test.mjs"
      - "woek-parlament-app/tests/berlin-combined-terminal-matrix.test.mjs"
      - "woek-parlament-app/tests/berlin-bsw-full-programme.test.ts"
      - "woek-parlament-app/package.json"
      - ".github/workflows/berlin-fach-content-residual.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: berlin-fach-content-residual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finite-residual:
    name: Exact programme objects and immutable Fach pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate deterministic Berlin Fach residual
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/validate_berlin_fach_content_residual.py --check-github
      - name: Assert deterministic Berlin Fach-truth materialization
        working-directory: woek-parlament-app
        run: node scripts/quality/materialize-berlin-fach-truth-residual.mjs --check
      - name: Run Berlin Fach-truth regression tests
        working-directory: woek-parlament-app
        run: node --test tests/berlin-fach-truth-residual.test.mjs tests/berlin-combined-terminal-matrix.test.mjs
      - name: Validate BSW protected stock and exact residual
        working-directory: woek-parlament-app
        run: node scripts/quality/check-berlin-bsw-full-programme.mjs
      - name: Validate reconciled issue 241 residual
        run: python3 tools/validate_parliament_issue_241_residual.py
      - name: Validate current fail-closed Golden readiness
        run: python3 tools/validate_parliament_current_golden_readiness.py
      - name: Assert immutable validation
        run: git diff --exit-code
