  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: berlin-fach-content-residual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finite-residual:
    name: Exact programme objects and immutable Fach pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate deterministic Berlin Fach residual
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/validate_berlin_fach_content_residual.py --check-github
      - name: Assert deterministic Berlin Fach-truth materialization
        working-directory: woek-parlament-app
        run: node scripts/quality/materialize-berlin-fach-truth-residual.mjs --check
      - name: Assert deterministic BSW P50-P53 handoff
        run: node tools/build-berlin-bsw-p50-p53-handoff.mjs --check
      - name: Assert deterministic BSW P54-P57 handoff
        run: node tools/build-berlin-bsw-p54-p57-handoff.mjs --check
      - name: Assert deterministic BSW P58-P59 handoff
        run: node tools/build-berlin-bsw-p58-p59-handoff.mjs --check
      - name: Assert deterministic BSW P60-P63 handoff
        run: node tools/build-berlin-bsw-p60-p63-handoff.mjs --check
      - name: Assert deterministic BSW P64-P66 handoff
        run: node tools/build-berlin-bsw-p64-p66-handoff.mjs --check
      - name: Verify canonical-final Berlin SPD ledger parity
        run: |
          python3 -m pip install --disable-pip-version-check --quiet PyMuPDF==1.28.0
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/SPD_Berlin_Wahlprogramm_20260521-v4-1.pdf" \
            https://spd.berlin/media/2026/08/SPD_Berlin_Wahlprogramm_20260521-v4-1.pdf
          node woek-parlament-app/scripts/quality/materialize-berlin-spd-canonical-parity.mjs \
            --artifact "${RUNNER_TEMP}/SPD_Berlin_Wahlprogramm_20260521-v4-1.pdf" \
            --check
      - name: Assert deterministic BSW P34-P43 child closure handoff
        working-directory: woek-parlament-app
        run: node tools/build-berlin-bsw-p34-p43-child-closure.mjs --check
      - name: Run Berlin Fach-truth regression tests
        working-directory: woek-parlament-app
        run: node --test tests/berlin-fach-truth-residual.test.mjs tests/berlin-combined-terminal-matrix.test.mjs tests/berlin-spd-canonical-parity.test.mjs tests/berlin-spd-p22-materialization.test.mjs
      - name: Validate BSW protected stock and exact residual
        working-directory: woek-parlament-app
        run: node scripts/quality/check-berlin-bsw-full-programme.mjs
      - name: Validate reconciled issue 241 residual
        run: python3 tools/validate_parliament_issue_241_residual.py
      - name: Validate current fail-closed Golden readiness
        run: python3 tools/validate_parliament_current_golden_readiness.py
      - name: Validate lossless MV SPD P1-P54 authority archive
        run: node tools/build_mv_spd_p1_p54_authority_archive.mjs
      - name: Assert immutable validation
        run: git diff --exit-code
