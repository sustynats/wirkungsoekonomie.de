name: WÖk Political Daily Digest

on:
  schedule:
    # One run at the configured Berlin end-of-day window. Adjacent UTC hours
    # cover daylight-saving time; the server route rejects non-matching slots.
    - cron: "0 20,21,22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: woek-political-daily-digest
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Send the verified end-of-day newsletter
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --max-time 600 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://parlament.wirkungsoekonomie.de/api/cron/political-daily-digest

