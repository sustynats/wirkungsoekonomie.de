name: WÖk Political Daily Digest

on:
  schedule:
    # One run at the configured Berlin end-of-day window. Adjacent UTC hours
    # cover daylight-saving time; the server route rejects non-matching slots.
    - cron: "0 20,21,22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: woek-political-daily-digest
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: woek-parlament-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: woek-parlament-app/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Send the verified end-of-day newsletter outside Vercel
        env:
          WOEK_AUTOPILOT_RUNTIME_MODE: ${{ vars.WOEK_AUTOPILOT_RUNTIME_MODE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          NEXT_PUBLIC_PORTAL_URL: https://parlament.wirkungsoekonomie.de
          WIRKUNGSRADAR_DAILY_DIGEST_ENABLED: ${{ vars.WIRKUNGSRADAR_DAILY_DIGEST_ENABLED }}
          WIRKUNGSRADAR_EMAIL_SEND_MODE: ${{ vars.WIRKUNGSRADAR_EMAIL_SEND_MODE }}
          WIRKUNGSRADAR_DELIVERY_PROVIDER: ${{ vars.WIRKUNGSRADAR_DELIVERY_PROVIDER }}
          WIRKUNGSRADAR_DAILY_DIGEST_BATCH_SIZE: "50"
          WIRKUNGSRADAR_UNSUBSCRIBE_SIGNING_SECRET: ${{ secrets.WIRKUNGSRADAR_UNSUBSCRIBE_SIGNING_SECRET }}
          WIRKUNGSRADAR_SMTP_HOST: smtp.ionos.de
          WIRKUNGSRADAR_SMTP_PORT: "587"
          WIRKUNGSRADAR_SMTP_USER: ${{ secrets.WIRKUNGSRADAR_SMTP_USER }}
          WIRKUNGSRADAR_SMTP_PASSWORD: ${{ secrets.WIRKUNGSRADAR_SMTP_PASSWORD }}
          WIRKUNGSRADAR_SMTP_FROM: ${{ secrets.WIRKUNGSRADAR_SMTP_FROM }}
          WIRKUNGSRADAR_SMTP_REPLY_TO: ${{ secrets.WIRKUNGSRADAR_SMTP_REPLY_TO }}
        run: npm run autopilot:digest
