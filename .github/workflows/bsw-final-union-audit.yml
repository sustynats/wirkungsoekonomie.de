name: BSW final union audit

on:
  push:
    branches:
      - 'fach/st-bsw-source-manifest-r05-20260821'
    paths:
      - 'content/audits/sachsen-anhalt/bsw-source-unit-*.json'
      - 'content/audits/sachsen-anhalt/bsw-final-union-*.json'
      - 'woek-parlament-app/data/fachakten/release-1/sachsen-anhalt/ltw-2026-st-bsw-zusagen.md'
      - 'tools/audit_bsw_final_union.py'
      - 'tools/materialize_bsw_final_union_manifest.py'
      - '.github/workflows/bsw-final-union-audit.yml'
  pull_request:
    paths:
      - 'content/audits/sachsen-anhalt/bsw-source-unit-*.json'
      - 'content/audits/sachsen-anhalt/bsw-final-union-*.json'
      - 'woek-parlament-app/data/fachakten/release-1/sachsen-anhalt/ltw-2026-st-bsw-zusagen.md'
      - 'tools/audit_bsw_final_union.py'
      - 'tools/materialize_bsw_final_union_manifest.py'
      - '.github/workflows/bsw-final-union-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  source-role-collision-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit exact BSW union and pending historical-role collisions
        run: python tools/audit_bsw_final_union.py --output tmp/bsw-final-union-collision-report.json
      - name: Materialize fail-closed final-union candidate
        if: always()
        run: |
          set +e
          python tools/materialize_bsw_final_union_manifest.py \
            --collision-report tmp/bsw-final-union-collision-report.json \
            --relations content/audits/sachsen-anhalt/bsw-final-union-relation-registry-r15.json \
            --output tmp/bsw-final-union-manifest-r15.json \
            --allow-default-pend-keep-atomic
          echo "materializer_exit=$?"
          exit 0
      - name: Build machine audit summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('tmp/bsw-final-union-collision-report.json').read_text())
          m=json.loads(Path('tmp/bsw-final-union-manifest-r15.json').read_text())
          scan=c['pending_collision_scan']
          summary={
            'marker':'ST_BSW_PR270_FINAL_UNION_MACHINE_AUDIT',
            'head':'${{ github.sha }}',
            'hard_errors':c.get('hard_errors',[]),
            'pending_total':scan.get('pending_total'),
            'lexically_clear_no_candidate':scan.get('lexically_clear_no_candidate'),
            'review_candidate_count':scan.get('review_candidate_count'),
            'review_candidate_ordinals':scan.get('review_candidate_ordinals'),
            'manifest_counts':m.get('counts'),
            'manifest_blockers':m.get('blockers'),
            'unresolved_source_relations':m.get('unresolved_source_relations'),
            'graph_acyclic':m.get('relation_graph',{}).get('acyclic'),
            'graph_errors':m.get('relation_graph',{}).get('errors'),
            'resolved_gap_counts':m.get('resolved_gap_counts'),
            'terminal_fach_set_check':m.get('active_leaf_terminal_fach_set_check'),
            'layer_241_set_check':m.get('active_leaf_241_layer_set_check'),
            'completion':m.get('completion'),
            'collision_candidates':[
              {'ordinal':r['historical_ordinal'],'page':r.get('page'),'title':r.get('title'),'top_candidates':r.get('top_candidates',[])[:3]}
              for r in scan.get('rows',[]) if r.get('candidate_status','').startswith('REVIEW')
            ],
          }
          Path('tmp/pr270-machine-audit-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n')
          body='### ST BSW final-union machine audit\n\n```json\n'+json.dumps(summary,ensure_ascii=False,indent=2)+'\n```\n'
          Path('tmp/pr270-comment.md').write_text(body)
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - name: Publish machine audit summary to PR270
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 270 --body-file tmp/pr270-comment.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bsw-final-union-audit-artifacts
          path: |
            tmp/bsw-final-union-collision-report.json
            tmp/bsw-final-union-manifest-r15.json
            tmp/pr270-machine-audit-summary.json

# deterministic convergence trigger 2026-08-22T02:11+02:00
