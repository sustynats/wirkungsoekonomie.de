name: Wirkungsticker Processor Configuration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wirkungsticker-processor-configuration
  cancel-in-progress: false

jobs:
  configuration:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Write immutable processor contract and verify Dropbox readback
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: node scripts/news/bridge/write-native-output-config.mjs
