name: Prepare reviewed glossary evidence release
on:
  push:
    branches: [chatgpt/glossar-finanzierung-evidenz-20260915]
    paths: [.github/workflows/glossary-evidence-prepare.yml]
permissions:
  contents: write
concurrency:
  group: glossary-evidence-prepare
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_DATE_EPOCH: '1787270400'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve cost protections and capture canonical baseline
        run: |
          npm run check:hosting-cost
          node scripts/glossary/build-glossary-registry.mjs
          cp public/data/glossary.terms.json /tmp/glossary-before.json
      - name: Compile and generate reviewed glossary content
        run: |
          node scripts/glossary/compile-financing-evidence.mjs
          python scripts/glossary/integrate-financing-evidence.py
          node scripts/glossary/build-glossary-registry.mjs
          GLOSSARY_BASELINE=/tmp/glossary-before.json node scripts/glossary/check-financing-evidence.mjs
          node scripts/export/export-glossary.mjs
          node scripts/glossary/build-term-links.mjs
          node scripts/glossary/build-glossary-candidates.mjs
          node scripts/glossary/build-glossary-reference-index.mjs
          node scripts/glossary/build-glossary-pages.mjs
          node scripts/glossary/check-legacy-detail-definitions.mjs
          node scripts/glossary/check-wirkungsgrad-differentiation.mjs
          node scripts/glossary/check-detail-page-composition.mjs
          node scripts/glossary/check-impact-controlling-rechenlogiken.mjs
          node scripts/glossary/build-glossary-lookup.mjs
          node scripts/quellenarchiv/build-quellenarchiv-pages.mjs
          node scripts/quellenarchiv/check-quellenarchiv-quality.mjs
          node scripts/glossary/check-legal-source-coverage.mjs
          node scripts/sources/check-evidence-source-archive-links.mjs
          node scripts/glossary/build-glossary-relations.mjs
          GLOSSARY_BASELINE=/tmp/glossary-before.json GLOSSARY_CHECK_PAGES=1 node scripts/glossary/check-financing-evidence.mjs
          npm run check:glossary-publication
          node scripts/site/normalize-site-header.mjs
          npm run normalize:footer
          npm run build:search
          npm run taxonomy:build
      - name: Retain exact source and public-page review snapshot
        if: always()
        run: |
          mkdir -p /tmp/glossary-release-review
          git diff --stat > /tmp/glossary-release-review/diff-stat.txt
          python - <<'PY'
          import json,pathlib,shutil,subprocess
          r=pathlib.Path.cwd();o=pathlib.Path('/tmp/glossary-release-review')
          paths=['public/data/glossary.terms.json','assets/data/glossary-lookup.json','reports/glossary-publication-quality.json','reports/glossary-financing-evidence-audit.json','reports/glossary-relation-curation.json','content/glossary/imports/finanzierung-evidenz-2026-09-15.json','scripts/glossary/build-glossary-registry.mjs','package.json']
          ds=json.loads((r/'content/glossary/editorial/finanzierung-evidenz-20260915/decisions.json').read_text())
          paths += [f"begriffe/{d['target']}/index.html" for d in ds['decisions']]
          for p in paths:
              s=r/p
              if s.is_file():
                  d=o/p;d.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(s,d)
          (o/'status.txt').write_text(subprocess.check_output(['git','status','--short'],text=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glossary-release-review-${{ github.sha }}
          path: /tmp/glossary-release-review/
          retention-days: 3
          if-no-files-found: error
      - name: Commit only glossary outputs to the isolated branch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == 'chatgpt/glossar-finanzierung-evidenz-20260915' ]] || exit 1
          [[ "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" == "$GITHUB_SHA" ]] || { echo 'Concurrent branch change; refusing push.'; exit 1; }
          python - <<'PY'
          import subprocess
          names=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())|set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          prefixes=('begriffe/','glossar/','quellenarchiv/','assets/data/glossary','public/data/glossary','assets/search/','public/data/woek-search-','reports/glossary')
          exact={'scripts/glossary/build-glossary-registry.mjs','package.json','content/glossary/imports/finanzierung-evidenz-2026-09-15.json','content/quellenarchiv/glossary-source-records.json','content/taxonomy/site-map.json','assets/js/glossaryTerms.js','public/downloads/exports/glossar.md','glossar.html','sitemap.xml'}
          selected=sorted(p for p in names if p in exact or p.startswith(prefixes))
          print('Scoped commit files:',len(selected));print('Unrelated generated files left unstaged:',sorted(names-set(selected)))
          if not selected:raise SystemExit('No generated release changes')
          for i in range(0,len(selected),200):subprocess.run(['git','add','--',*selected[i:i+200]],check=True)
          PY
          git config user.name 'sustynats'
          git config user.email '226931777+sustynats@users.noreply.github.com'
          git commit -m 'Finalize bilingual glossary explanations and search integration'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo "Verified glossary source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
