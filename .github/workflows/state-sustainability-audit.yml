name: State sustainability architecture audit

on:
  pull_request:
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: codex-release-payload-transfer
  cancel-in-progress: false

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transfer bootstrap
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Verify and apply release payload
        env:
          EXPECTED_REMOTE_PARENT: a1a7eeaa3f3004796fb11f79888f33f9222d5409
          EXPECTED_PAYLOAD_BASE: cdd29f99dc32199caa9762b32508364099ea0b0b
          PAYLOAD_REF: refs/codex/state-release-payload
          PAYLOAD_SHA256: 67431a6f15e972b06b94807f4ac7f7e7785aed02c5fc5fca85b376720225c9d0
          TARGET_BRANCH: codex/state-sustainability-architecture-sitewide-20260821
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_REMOTE_PARENT"
          cat .codex-transfer/part-* > "$RUNNER_TEMP/woek-state-release.bundle"
          echo "$PAYLOAD_SHA256  $RUNNER_TEMP/woek-state-release.bundle" | sha256sum -c -
          git bundle verify "$RUNNER_TEMP/woek-state-release.bundle"
          git fetch "$RUNNER_TEMP/woek-state-release.bundle" "$PAYLOAD_REF:refs/remotes/codex/state-release-payload"
          test "$(git rev-parse refs/remotes/codex/state-release-payload^)" = "$EXPECTED_PAYLOAD_BASE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git cherry-pick refs/remotes/codex/state-release-payload; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
            mapfile -t expected < <(printf '%s\n'               assets/data/glossary-lookup.json               assets/data/glossary-model.json               content/quellenarchiv/glossary-source-records.json               public/data/glossary-version-history.json               public/data/glossary.terms.json               reports/content-reference-report.md               reports/glossary-relation-curation.json | sort)
            test "${conflicts[*]}" = "${expected[*]}"
            git checkout --theirs -- "${conflicts[@]}"
            git add -- "${conflicts[@]}"
            GIT_EDITOR=true git cherry-pick --continue
          fi
          git rm -r .codex-transfer .github/workflows/codex-release-transfer.yml
          git commit --amend --no-edit
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD^)"
          git push origin "HEAD:$TARGET_BRANCH"
