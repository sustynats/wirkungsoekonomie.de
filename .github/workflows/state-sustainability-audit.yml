name: State sustainability architecture audit

on:
  pull_request:
    paths:
      - '**/*.html'
      - 'content/**'
      - 'tools/apply_state_sustainability_architecture.py'
      - 'tools/apply_state_sustainability_sources.py'
      - 'tools/apply_state_sustainability_precision.py'
      - 'tools/audit_state_sustainability_architecture.py'
      - 'tools/audit_state_sustainability_architecture_fast.py'
      - 'sitemap.xml'
      - 'assets/search/**'
      - 'public/data/woek-search-meta.json'
      - 'llms.txt'
      - '.github/workflows/state-sustainability-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply approved #253 deterministic projections
        run: |
          python tools/apply_state_sustainability_architecture.py
          python tools/apply_state_sustainability_sources.py
          python tools/apply_state_sustainability_precision.py
          npm run build:search
          npm run taxonomy:build
      - name: Commit deterministic projection outputs when needed
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'All approved #253 projections are already committed.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'fix: materialize approved #253 state architecture projections'
            git pull --rebase origin ${{ github.event.pull_request.head.ref }}
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Verify projections are idempotent after materialization
        run: |
          python tools/apply_state_sustainability_architecture.py
          python tools/apply_state_sustainability_sources.py
          python tools/apply_state_sustainability_precision.py
          npm run build:search
          npm run taxonomy:build
          git diff --exit-code
      - name: Generate exhaustive #253 URL/file matrix
        run: python tools/audit_state_sustainability_architecture_fast.py --root . --output artifacts/state-sustainability-architecture-url-matrix.json --markdown artifacts/state-sustainability-architecture-url-matrix.md
      - name: Upload #253 audit matrix
        uses: actions/upload-artifact@v4
        with:
          name: state-sustainability-architecture-audit
          path: |
            artifacts/state-sustainability-architecture-url-matrix.json
            artifacts/state-sustainability-architecture-url-matrix.md
