name: Parliament structure preview

on:
  pull_request:
    paths:
      - "woek-parlament-app/**"
      - "docs/parlament/CODEX_AUFTRAG_2026-09-03_STRUKTURNEUBAU.md"
      - ".github/workflows/parliament-structure-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parliament-structure-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Structure, preservation and browser preview (no Vercel)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: woek-parlament-app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: woek-parlament-app/package-lock.json
      - run: npm ci
      - run: npm run check:portal-structure
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Install isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/portal-browser-tools" --no-save --package-lock=false playwright@1.62.1
          "$RUNNER_TEMP/portal-browser-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Capture tested preview (375 and 1440 px)
        run: |
          npm run start -- -p 3024 -H 127.0.0.1 > "$RUNNER_TEMP/portal-server.log" 2>&1 &
          PORTAL_SERVER_PID=$!
          trap 'kill "$PORTAL_SERVER_PID"' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:3024/api/health >/dev/null && break
            sleep 1
          done
          PORTAL_PLAYWRIGHT_MODULE="$RUNNER_TEMP/portal-browser-tools/node_modules/playwright" PORTAL_BROWSER_REPORT_DIR="$RUNNER_TEMP/portal-preview" node scripts/quality/check-portal-browser.mjs
          PORTAL_TEXT_REPORT="$RUNNER_TEMP/portal-preview/text-inventory.json" npm run check:portal-structure
          git rev-parse HEAD > "$RUNNER_TEMP/portal-preview/commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parliament-structure-preview-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/portal-preview
            ${{ runner.temp }}/portal-server.log
          if-no-files-found: error
          retention-days: 30
