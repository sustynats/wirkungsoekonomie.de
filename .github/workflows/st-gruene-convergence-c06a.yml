name: ST GRUENE convergence C06A

on:
  pull_request:
    paths:
      - "audit-manifests/sachsen-anhalt/gruene-convergence-c06a.json"
      - "tools/validate_st_gruene_convergence_c06a.py"
      - ".github/workflows/st-gruene-convergence-c06a.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: st-gruene-convergence-c06a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  convergence-c06a:
    name: Exact R10A role, edge and dedupe ledger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate committed ledger and pinned issue facts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/validate_st_gruene_convergence_c06a.py --check-github
