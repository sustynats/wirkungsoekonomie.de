name: Glossary evidence inventory

on:
  push:
    branches: [chatgpt/glossar-finanzierung-evidenz-20260915]
    paths: [.github/workflows/glossary-evidence-audit.yml]

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_DATE_EPOCH: '1787270400'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify existing hosting cost protections
        run: npm run check:hosting-cost
      - name: Build canonical glossary without paid services
        run: node scripts/glossary/build-glossary-registry.mjs
      - name: Package glossary sources for semantic review
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/glossary-review
          python3 - <<'PY'
          import json, pathlib, shutil, subprocess
          root = pathlib.Path.cwd()
          out = pathlib.Path('/tmp/glossary-review')
          prefixes = ('scripts/glossary/', 'scripts/lib/', 'scripts/export/', 'scripts/search/', 'scripts/quellenarchiv/', 'templates/', 'content/glossary/', 'content/quellenarchiv/', 'content/sources/', 'content/site/', 'assets/css/', 'assets/js/', 'docs/glossary/')
          exact = {'AGENTS.md', 'package.json', 'assets/data/term-registry.json', 'assets/data/glossary-model.json', 'public/data/glossary.terms.json', 'public/data/glossary-version-history.json', 'public/data/woek-search-meta.json', 'content/taxonomy/site-map.json', 'glossar/index.html', 'scripts/ops/check-hosting-cost-guard.mjs', '.github/workflows/deploy.yml', '.github/workflows/pr-quality.yml'}
          paths = sorted(set(subprocess.check_output(['git','ls-files'], text=True).splitlines()) | exact)
          for path in paths:
              if path in exact or path.startswith(prefixes):
                  src = root / path
                  if src.is_file() and src.stat().st_size < 15000000:
                      dst = out / path
                      dst.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(src, dst)
          registry = json.loads((root / 'public/data/glossary.terms.json').read_text())
          terms = registry if isinstance(registry, list) else registry.get('terms', [])
          compact = [{k: t.get(k) for k in ('termId','id','slug','canonicalLabel','aliases','synonyms','shortDefinition','status')} for t in terms]
          (out / 'inventory.json').write_text(json.dumps(compact, ensure_ascii=False, indent=2))
          (out / 'COMMIT.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'], text=True))
          assert (out / 'public/data/glossary.terms.json').is_file()
          print('Canonical terms:', len(terms))
          print('Files:', sum(p.is_file() for p in out.rglob('*')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: glossary-review-${{ github.sha }}
          path: /tmp/glossary-review/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
