name: ST CDU global convergence materialization

on:
  push:
    branches:
      - woek/st-cdu-source-manifest-p89-20260821
    paths:
      - tools/materialize_st_cdu_review_snapshots.py
      - tools/normalize_st_cdu_convergence_shards.py
      - tools/build_st_cdu_global_convergence.py
      - tools/validate_st_cdu_global_convergence.py
      - woek-parlament-app/data/fachakten/source-manifests/sachsen-anhalt/ltw-2026-st-cdu-global-leaf-reconciliation-plan-v1.json
      - .github/workflows/st-cdu-convergence-snapshot.yml
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - tools/materialize_st_cdu_review_snapshots.py
      - tools/normalize_st_cdu_convergence_shards.py
      - tools/build_st_cdu_global_convergence.py
      - tools/validate_st_cdu_global_convergence.py
      - woek-parlament-app/data/fachakten/source-manifests/sachsen-anhalt/ltw-2026-st-cdu-global-leaf-reconciliation-plan-v1.json
      - .github/workflows/st-cdu-convergence-snapshot.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: st-cdu-global-convergence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: woek/st-cdu-source-manifest-p89-20260821
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Snapshot exact canonical source-bound #234 reviews
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/materialize_st_cdu_review_snapshots.py
      - name: Normalize legacy parity shard schema mechanically
        run: python tools/normalize_st_cdu_convergence_shards.py
      - name: Materialize missing canonical shards and global explicit-role union
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/build_st_cdu_global_convergence.py
      - name: Validate relation graph and exactly-one-count invariants
        run: python tools/validate_st_cdu_global_convergence.py
      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path('woek-parlament-app/data/fachakten/source-manifests/sachsen-anhalt')
          for p in root.glob('ltw-2026-st-cdu-*.json'):
              json.loads(p.read_text(encoding='utf-8'))
          print('JSON validation PASS')
          PY
      - name: Commit deterministic convergence outputs when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- woek-parlament-app/data/fachakten/source-manifests/sachsen-anhalt
          if git diff --cached --quiet; then
            echo 'No convergence output changes.'
          else
            git commit -m 'data(cdu): materialize canonical convergence state [skip ci]'
            git push origin HEAD:woek/st-cdu-source-manifest-p89-20260821
          fi
