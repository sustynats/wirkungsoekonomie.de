name: Codex release payload transfer

on:
  push:
    branches:
      - codex/state-sustainability-architecture-sitewide-20260821
    paths:
      - '.codex-transfer/**'
      - '.github/workflows/codex-release-transfer.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codex-release-payload-transfer
  cancel-in-progress: false

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transfer bootstrap
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply release payload
        env:
          EXPECTED_REMOTE_HEAD: 60ab036dd9a07bb364cc24b63963892cd0150cc7
          EXPECTED_PAYLOAD_BASE: cdd29f99dc32199caa9762b32508364099ea0b0b
          PAYLOAD_REF: refs/codex/state-release-payload
          PAYLOAD_SHA256: 67431a6f15e972b06b94807f4ac7f7e7785aed02c5fc5fca85b376720225c9d0
          TARGET_BRANCH: codex/state-sustainability-architecture-sitewide-20260821
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_REMOTE_HEAD"
          cat .codex-transfer/part-* > "$RUNNER_TEMP/woek-state-release.bundle"
          echo "$PAYLOAD_SHA256  $RUNNER_TEMP/woek-state-release.bundle" | sha256sum -c -
          git bundle verify "$RUNNER_TEMP/woek-state-release.bundle"
          git fetch "$RUNNER_TEMP/woek-state-release.bundle" "$PAYLOAD_REF:refs/remotes/codex/state-release-payload"
          test "$(git rev-parse refs/remotes/codex/state-release-payload^)" = "$EXPECTED_PAYLOAD_BASE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git cherry-pick refs/remotes/codex/state-release-payload
          git rm -r .codex-transfer .github/workflows/codex-release-transfer.yml
          git commit --amend --no-edit
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin "HEAD:$TARGET_BRANCH"
