name: Wirkungsticker
run-name: ${{ inputs.request_id || 'Wirkungsticker' }}

# Direktbetrieb seit 15.09.2026: ein Workflow, eine gerade Linie.
# Quellen einsammeln → lokal bewerten (LIFO) → genau ein OpenAI-Aufruf je
# Meldung → deterministisches Gate → Build → Commit → Pages. Keine Bridge,
# kein Dropbox, keine ChatGPT-Worker, keine bezahlte Zweitprüfung.
# Doku: docs/ops/WIRKUNGSTICKER-DIREKTBETRIEB.md

on:
  schedule:
    # Versetzte Minuten: GitHub lässt Zeitpläne auf :00/:15/:30/:45 häufig aus.
    - cron: "4,19,34,49 * * * *"
  push:
    # Oracle-Takt als Ausfallreserve: der systemd-Timer auf Oracle legt alle 15
    # Minuten einen leeren Commit mit dem aktuellen main-Baum auf diesen Branch.
    # Am 15.09.2026 feuerte der GitHub-Cron nur alle vier bis fünf Stunden.
    branches:
      - codex/wirkungsticker-clock
  workflow_dispatch:
    inputs:
      request_id:
        description: "Interne Zuordnung eines manuellen Laufs"
        type: string
        default: ""
      max_ai_stories:
        description: "Höchstzahl bezahlter Meldungen in diesem Lauf (leer = Standard)"
        type: string
        default: ""
      reassess_limit:
        description: "Jüngste veröffentlichte Meldungen ohne vollständiges Wirkungspotenzial zur Neubewertung einreihen (0 = keine)"
        type: number
        default: 0
      dry_run:
        description: "Nur Import und lokale Bewertung, kein Aufruf, kein Commit"
        type: boolean
        default: false

permissions:
  actions: write
  contents: write

concurrency:
  group: wirkungsticker-main
  cancel-in-progress: false

jobs:
  update:
    if: vars.WIRKUNGSTICKER_PROCESSING_MODE == 'api' || vars.WIRKUNGSTICKER_PROCESSING_MODE == ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      WIRKUNGSTICKER_PROCESSING_MODE: api
      VISUAL_GENERATION_PROVIDER: higgsfield
      GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Select run slot
        id: slot
        run: node scripts/news/schedule.mjs
      - name: Set up pinned title-image rasterizer
        continue-on-error: true
        if: steps.slot.outputs.should_run == 'true'
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
        with:
          chrome-version: "152.0.7977.82"
      - name: Record expected run start
        if: steps.slot.outputs.should_run == 'true'
        run: echo "WOEK_NEWS_EXPECTED_AFTER=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Unit and security tests
        if: steps.slot.outputs.should_run == 'true'
        run: npm run news:test
      - name: Queue potential reassessments for the newest online stories
        # Fester Bestandteil jedes Laufs (seit 16.09.): die jüngsten Online-Meldungen
        # ohne vollständiges freigegebenes Profil bleiben eingereiht, bis die Neufassung
        # das Gate passiert; ein Platz je Lauf ist dafür reserviert (partitionAiQueue).
        if: steps.slot.outputs.should_run == 'true'
        env:
          REASSESS_LIMIT: ${{ inputs.reassess_limit || vars.WOEK_NEWS_REASSESS_LIMIT || '30' }}
        run: node scripts/news/queue-reassessment.mjs --limit="$REASSESS_LIMIT"
      - name: Import, analyze (one call per story) and build
        if: steps.slot.outputs.should_run == 'true'
        env:
          # Der Schlüssel liegt ausschließlich im Repository-Secret WIRKUNGSTICKER.
          OPENAI_API_KEY: ${{ secrets.WIRKUNGSTICKER }}
          WOEK_NEWS_MODEL: ${{ vars.WOEK_NEWS_MODEL || 'gpt-5.4-mini' }}
          # medium seit 15.09. abends: gpt-5.6-luna entgleiste bei low in 2 von 4 Antworten
          # im hinteren Teil (Planet/Demokratie als Fragmente, Kennungen verkürzt).
          WOEK_NEWS_REASONING_EFFORT: ${{ vars.WOEK_NEWS_REASONING_EFFORT || 'medium' }}
          # Private Diagnosekopie der bezahlten Antworten (nur Laufartefakt, nie im Repo).
          WOEK_NEWS_RAW_OUTPUT_DIR: ${{ runner.temp }}/ai-raw-output
          # Bild-Uploads (Wirkungskarten) nutzen weiterhin den vorhandenen Release-Speicher.
          WOEK_NEWS_ANALYSIS_TOKEN: ${{ secrets.WOEK_NEWS_PUSH_ADMIN_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          WT_CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          WT_CHROME_NO_SANDBOX: "true"
          # Durchsatz: Natalie am 16.09. „vier der relevantesten Meldungen pro
          # Stunde". Die Stundengrenze zählt Meldungen, nicht Aufrufe; das Geld
          # begrenzt zusätzlich die Taktung aus der Monatsfreigabe.
          WOEK_NEWS_MAX_AI_STORIES_PER_RUN: ${{ inputs.max_ai_stories || vars.WOEK_NEWS_MAX_AI_STORIES_PER_RUN || '4' }}
          WOEK_NEWS_MAX_AI_STORIES_PER_HOUR: ${{ vars.WOEK_NEWS_MAX_AI_STORIES_PER_HOUR || '4' }}
          # Tagesprofil: tagsueber das volle Kontingent, nachts gedrosselt.
          # Drei veroeffentlichte Meldungen je Stunde brauchen rund sechs
          # Aufrufe; rund um die Uhr waere das ausserhalb des Monatsrahmens.
          WOEK_NEWS_NIGHT_STORIES_PER_HOUR: ${{ vars.WOEK_NEWS_NIGHT_STORIES_PER_HOUR || '' }}
          WOEK_NEWS_DAY_FROM_HOUR: ${{ vars.WOEK_NEWS_DAY_FROM_HOUR || '7' }}
          WOEK_NEWS_DAY_UNTIL_HOUR: ${{ vars.WOEK_NEWS_DAY_UNTIL_HOUR || '23' }}
          WOEK_NEWS_MAX_AI_CALLS_PER_HOUR: ${{ vars.WOEK_NEWS_MAX_AI_CALLS_PER_HOUR || '4' }}
          # LIFO ab heute: unveröffentlichte Kandidaten älter als der Horizont werden ohne Aufruf geschlossen.
          WOEK_NEWS_MAX_SOURCE_AGE_HOURS: ${{ vars.WOEK_NEWS_MAX_SOURCE_AGE_HOURS || '24' }}
          # Höchstens zwei bezahlte Versuche je Eingabestand, der zweite nur nach
          # strukturellem Gate-Fehler mit Backoff; inhaltliche Ablehnungen nie erneut.
          WOEK_NEWS_MAX_PAID_ATTEMPTS_PER_INPUT: "2"
          WOEK_NEWS_AI_ATTEMPTS_PER_STORY: "1"
          WOEK_NEWS_AI_BATCH_SIZE: "1"
          WOEK_NEWS_AI_BATCH_DELAY_MS: "1500"
          # Lauf 6: zwei luna-Aufrufe liefen über 240 s. Sechs Minuten je Aufruf; die
          # Ausgabe ist zusätzlich auf 24k Token begrenzt.
          WOEK_NEWS_AI_TIMEOUT_MS: "360000"
          # 32k seit 16.09.: bei mittlerem Denkaufwand zählen Reasoning-Token mit; zwei
          # Antworten der Nacht brachen bei 24k ab (incomplete, bezahlt, unbrauchbar).
          WOEK_NEWS_MAX_OUTPUT_TOKENS: ${{ vars.WOEK_NEWS_MAX_OUTPUT_TOKENS || '32000' }}
          WOEK_NEWS_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$WOEK_NEWS_DRY_RUN" = "true" ]; then node scripts/news/run-api.mjs --dry-run; else node scripts/news/run-api.mjs; fi
      - name: Take over editions approved in the private editorial desk
        id: approved
        if: steps.slot.outputs.should_run == 'true' && inputs.dry_run != true
        continue-on-error: true
        env:
          WOEK_NEWS_BRIDGE_URL: "https://130.162.217.58.sslip.io/api/news-bridge"
          WOEK_NEWS_BRIDGE_TOKEN: ${{ secrets.WOEK_NEWS_BRIDGE_TOKEN }}
        run: node scripts/news/import-approved-editorials.mjs --claim
      - name: Read public ticker outcome
        id: outcome
        if: steps.slot.outputs.should_run == 'true' && inputs.dry_run != true
        run: node -e 'const fs=require("node:fs"); const report=require("./reports/wirkungsticker-latest-run.json"); fs.appendFileSync(process.env.GITHUB_OUTPUT, "public_changed=" + Boolean(report.public_changed) + "\n");'
      # Die redaktionelle Lage ist eine Ableitung aus den bereits
      # veroeffentlichten Wirkungsakten: kein Modellaufruf, keine Kosten.
      # Derselbe Lauf zweimal ergibt dieselbe Lage (upsertLage), ein
      # wiederholter Lauf erzeugt also keine Doppelausgabe. Geschrieben wird
      # die Lage des laufenden Fensters; vor 06:00 Berliner Zeit ist keine
      # faellig und der Schritt schreibt nichts. Danach werden die Seiten
      # erneuert, damit die Lage-Seite im selben Commit liegt.
      - name: Redaktionelle Lage schreiben und Seiten erneuern
        if: steps.slot.outputs.should_run == 'true' && inputs.dry_run != true
        run: |
          set -euo pipefail
          node scripts/news/lage-schreiben.mjs
          npm run news:build
      - name: Synchronize public survey pages from Oracle
        id: polls
        if: steps.slot.outputs.should_run == 'true' && inputs.dry_run != true
        continue-on-error: true
        run: npm run polls:sync
      - name: Build search index, taxonomy and validate output
        if: steps.slot.outputs.should_run == 'true' && inputs.dry_run != true
        env:
          SOURCE_DATE_EPOCH: "1787270400"
        run: |
          npm run build:search
          npm run taxonomy:build
          npm run news:source-integrity:audit -- --strict
          npm run news:source-portfolio:audit -- --strict
          npm run news:validate
      - name: Commit one atomic update
        id: commit
        if: steps.slot.outputs.should_run == 'true' && inputs.dry_run != true
        env:
          SLOT_NAME: ${{ steps.slot.outputs.slot }}
        run: |
          set -euo pipefail
          git config user.name "wirkungsticker-bot"
          git config user.email "wirkungsticker-bot@users.noreply.github.com"
          git add -- data/news data/wirkungsticker/source-audit-2026-09-05.json news wirkungsticker reports/wirkungsticker-latest-run.json reports/wirkungsticker-source-integrity.json reports/wirkungsticker-source-portfolio.json sitemap.xml assets/search/search-index.json public/data/woek-search-meta.json content/taxonomy/site-map.json content/polls/public-catalog.json umfragen admin/umfragen
          if git diff --cached --quiet; then
            echo "Keine neue oder geänderte Wirkungsnachricht."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "[wirkungsticker] ${SLOT_NAME} $(date -u +%Y-%m-%dT%H:%MZ)"
          node scripts/news/publish-git.mjs
          RELEASE_COMMIT="$(git rev-parse HEAD)"
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid published commit." >&2; exit 1; }
          echo "commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Acknowledge approved editions after the durable push
        if: steps.commit.outputs.changed == 'true' && steps.approved.outputs.changed == 'true'
        continue-on-error: true
        env:
          WOEK_NEWS_BRIDGE_URL: "https://130.162.217.58.sslip.io/api/news-bridge"
          WOEK_NEWS_BRIDGE_TOKEN: ${{ secrets.WOEK_NEWS_BRIDGE_TOKEN }}
        run: node scripts/news/import-approved-editorials.mjs --finalize
      - name: Publish the committed ticker automatically
        if: steps.commit.outputs.changed == 'true' && (steps.outcome.outputs.public_changed == 'true' || steps.polls.outputs.changed == 'true' || steps.approved.outputs.changed == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          TICKER_COMMIT: ${{ steps.commit.outputs.commit }}
        run: |
          set -euo pipefail
          [[ "$TICKER_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "Missing exact published commit; refusing an unbound release." >&2; exit 1; }
          gh workflow run deploy.yml --ref main -f ticker_only=true -f "ticker_commit=$TICKER_COMMIT"
      - name: Verify ticker run health
        if: always() && steps.slot.outputs.should_run == 'true' && inputs.dry_run != true
        run: npm run news:health -- --started-after="$WOEK_NEWS_EXPECTED_AFTER"
      - name: Preserve paid model answers for gate diagnosis
        if: always() && steps.slot.outputs.should_run == 'true' && inputs.dry_run != true
        uses: actions/upload-artifact@v4
        with:
          name: ai-raw-output-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: ignore
          path: ${{ runner.temp }}/ai-raw-output
      - name: Preserve failed-run work and usage for recovery
        if: failure() && steps.slot.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: news-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          compression-level: 6
          if-no-files-found: warn
          path: |
            data/news/stories.json
            data/news/state.json
            data/news/newsroom.json
            data/news/usage.json
            data/news/editorial-analyses.json
            reports/wirkungsticker-latest-run.json
