name: Wirkungsticker

on:
  push:
    # Oracle-Ausfallreserve: eigener repo-begrenzter Deploy-Key, kein PAT.
    branches:
      - codex/wirkungsticker-clock
  schedule:
    # Kontinuierliche Erkennung, keine vier Veröffentlichungssperrzeiten.
    # Quellenintervalle, Euro-Budget und rollende KI-Kapazität liegen im Worker.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: wirkungsticker-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Select Europe/Berlin slot
        id: slot
        run: node scripts/news/schedule.mjs
      - name: Record expected run start
        if: steps.slot.outputs.should_run == 'true'
        run: echo "WOEK_NEWS_EXPECTED_AFTER=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Unit and security tests
        if: steps.slot.outputs.should_run == 'true'
        run: npm run news:test
      - name: Import, analyze and build
        if: steps.slot.outputs.should_run == 'true'
        env:
          WOEK_NEWS_MONTHLY_AI_BUDGET_EUR: "25"
          WOEK_NEWS_API_URL: "https://130.162.217.58.sslip.io/api/news-analysis"
          WOEK_NEWS_ANALYSIS_TOKEN: ${{ secrets.WOEK_NEWS_PUSH_ADMIN_TOKEN }}
          # Eigene authentifizierte Nachrichten-Lane; öffentliche KI-Limits unverändert.
          WOEK_NEWS_MAX_AI_STORIES_PER_RUN: "6"
          WOEK_NEWS_MAX_AI_CALLS_PER_HOUR: "24"
          # Technische Wiederholungen bleiben in der dauerhaften Stunden-Queue. So
          # verbraucht ein 503 nicht mehrere der vier reservierten Worker-Slots.
          WOEK_NEWS_AI_ATTEMPTS_PER_STORY: "1"
          # Längere Detailfassungen bleiben pro Anfrage unter dem Upstream-Zeitfenster.
          WOEK_NEWS_AI_BATCH_SIZE: "1"
          WOEK_NEWS_AI_BATCH_DELAY_MS: "2500"
          WOEK_NEWS_AI_TIMEOUT_MS: "120000"
        run: npm run news:run
      - name: Read public ticker outcome
        id: outcome
        if: steps.slot.outputs.should_run == 'true'
        run: node -e 'const fs=require("node:fs"); const report=require("./reports/wirkungsticker-latest-run.json"); fs.appendFileSync(process.env.GITHUB_OUTPUT, "public_changed=" + Boolean(report.public_changed) + "\n");'
      - name: Build search index and validate output
        if: steps.slot.outputs.should_run == 'true'
        env:
          SOURCE_DATE_EPOCH: "1787270400"
        run: |
          npm run build:search
          npm run news:validate
      - name: Commit one atomic update
        id: commit
        if: steps.slot.outputs.should_run == 'true'
        env:
          SLOT_NAME: ${{ steps.slot.outputs.slot }}
        run: |
          set -euo pipefail
          git config user.name "wirkungsticker-bot"
          git config user.email "wirkungsticker-bot@users.noreply.github.com"
          git add -- data/news news wirkungsticker reports/wirkungsticker-latest-run.json sitemap.xml assets/search/search-index.json public/data/woek-search-meta.json
          if git diff --cached --quiet; then
            echo "Keine neue oder geänderte Wirkungsnachricht."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "[wirkungsticker] ${SLOT_NAME} $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Publish the committed ticker automatically
        if: steps.commit.outputs.changed == 'true' && steps.outcome.outputs.public_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main -f ticker_only=true
      - name: Verify ticker run health
        if: always() && steps.slot.outputs.should_run == 'true'
        run: npm run news:health -- --started-after="$WOEK_NEWS_EXPECTED_AFTER"
