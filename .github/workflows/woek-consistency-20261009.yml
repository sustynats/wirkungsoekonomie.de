name: WÖk consistency review 2026-10-09
on:
  push:
    branches: [review/woek-consistency-20261009]
    paths:
      - '.github/workflows/woek-consistency-20261009.yml'
      - 'scripts/review/consistency-20261009/**'
      - 'content/grundlagen/woek-kern-20261009.*'
      - 'tests/site/woek-consistency-20261009.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: woek-consistency-20261009
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/assets/
            /assets/js/
            /assets/data/
            /assets/visuals/
            /assets/css/
            !/source-assets/
            /source-assets/originals/*.md
            /source-assets/generated/*.md
            !/public/
            /public/data/
            !/node_modules/
            !/tmp/
            !/_internal/
            !/_site/
            !/backups/
            !/archive/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export additional primary text sources
        run: |
          mkdir -p review-artifacts
          python - <<'PY'
          import hashlib, json, pathlib, subprocess, tarfile
          root = pathlib.Path.cwd()
          paths = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          rows = []
          with tarfile.open('review-artifacts/woek-extra-source.tar.gz','w:gz') as out:
              for name in paths:
                  p = root / name
                  if not name or not p.is_file() or p.is_symlink(): continue
                  if not (p.suffix in {'.inc','.svg'} or name.startswith('source-assets/generated/') or name in {'assets/data/term-registry.json','public/data/glossary.terms.json'}): continue
                  if p.stat().st_size > 80_000_000: raise ValueError('Unexpectedly large text source: '+name)
                  data = p.read_bytes()
                  data.decode('utf-8')
                  out.add(p,arcname=name,recursive=False)
                  rows.append({'path':name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          pathlib.Path('review-artifacts/source-manifest.json').write_text(json.dumps({'commit':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),'files':rows},ensure_ascii=False,indent=2))
          print('Exported',len(rows),'additional source files.')
          PY
      - name: Run consistency tests when present
        run: |
          if test -f tests/site/woek-consistency-20261009.test.mjs; then
            node --test tests/site/woek-consistency-20261009.test.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: woek-consistency-source-${{ github.sha }}
          path: review-artifacts/
          retention-days: 7
          if-no-files-found: error
