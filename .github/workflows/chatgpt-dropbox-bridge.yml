name: ChatGPT Dropbox Bridge

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: chatgpt-dropbox-bridge-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  deliver:
    if: startsWith(github.event.issue.title, '[CHATGPT-BRIDGE] ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
      DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ACTION_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      # Issue events resolve GITHUB_SHA on the default branch. Pinning ref=main
      # makes the trust boundary explicit: issue text is data, never executable code.
      - name: Checkout trusted bridge code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate, deliver, and verify
        id: bridge
        shell: bash
        run: |
          set -euo pipefail
          python scripts/chatgpt_dropbox_bridge.py | tee bridge-result.log

      - name: Confirm successful delivery
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          RESULT="$(tail -n 1 bridge-result.log)"
          gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body "BRIDGE_DELIVERED ✅\n\nRead-after-write verification passed.\n\nResult: \`$RESULT\`\n\nRun: $ACTION_RUN_URL"
          gh issue close "$ISSUE_NUMBER" --repo "$GH_REPO" --reason completed

      - name: Record failed delivery
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body "BRIDGE_FAILED ❌\n\nNo successful read-after-write verification was recorded. The issue remains open for retry.\n\nRun: $ACTION_RUN_URL"
