name: Publish Journal to Discord

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore publication state
        id: state
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = ".github/discord-journal-state.json";
            try {
              const response = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: "discord-rss-state"
              });
              fs.writeFileSync(path, Buffer.from(response.data.content, "base64"));
              core.setOutput("bootstrap", "false");
            } catch (error) {
              if (error.status !== 404) throw error;
              fs.writeFileSync(path, JSON.stringify({ seen: [] }));
              core.setOutput("bootstrap", "true");
            }
      - name: Publish new Journal entries
        env:
          DISCORD_JOURNAL_WEBHOOK_URL: ${{ secrets.DISCORD_JOURNAL_WEBHOOK_URL }}
          JOURNAL_DISCORD_STATE_PATH: .github/discord-journal-state.json
          JOURNAL_DISCORD_BOOTSTRAP: ${{ steps.state.outputs.bootstrap == 'true' && '1' || '0' }}
        run: node scripts/discord/publish-journal-rss.mjs
      - name: Save publication state
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = ".github/discord-journal-state.json";
            const content = fs.readFileSync(path).toString("base64");
            let sha;
            try {
              const response = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: "discord-rss-state"
              });
              sha = response.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: "refs/heads/discord-rss-state",
                sha: context.sha
              });
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: "chore: update Discord journal RSS state",
              content,
              branch: "discord-rss-state",
              ...(sha ? { sha } : {})
            });
