name: Project #253 state source functions

on:
  push:
    branches:
      - codex/state-sustainability-architecture-sitewide-20260821
    paths:
      - '.github/workflows/state-sustainability-source-projection.yml'
      - 'tools/apply_state_sustainability_sources.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/state-sustainability-architecture-sitewide-20260821
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source-function projection
        run: python tools/apply_state_sustainability_sources.py
      - name: Refresh search artifacts
        run: npm run build:search
      - name: Commit projection outputs
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Source-function projection already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add methodik/datenbasis.html methodik/externe-quellen.html content/glossary/imports/staatliche-nachhaltigkeitsarchitektur.json assets/search/search-index.json public/data/woek-search-meta.json
          git commit -m 'fix: project state source functions into method pages'
          git push origin HEAD:codex/state-sustainability-architecture-sitewide-20260821
