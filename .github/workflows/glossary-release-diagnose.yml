name: Diagnose glossary release publication gate
on:
  push:
    branches: [chatgpt/glossar-finanzierung-evidenz-20260915]
    paths: [.github/workflows/glossary-release-diagnose.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact source and committed publication hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/publication-diagnosis
          python3 - <<'PY'
          import pathlib,json,hashlib,subprocess,shutil
          root=pathlib.Path.cwd();out=pathlib.Path('/tmp/publication-diagnosis')
          files=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          report=[]
          for name in files:
              p=root/name
              if p.suffix in ['.py','.mjs','.json','.md'] and p.is_file() and p.stat().st_size<1000000:
                  try:s=p.read_text()
                  except UnicodeError:continue
                  if 'public PDF hash mismatch' in s or 'WOeK_Zusatzpapier_Wirkungssteuer_WStG_Logik_Steuerungsfaktoren_v3.0.pdf' in s:
                      report.append({'path':name,'matches':[{'line':i+1,'text':l[:700]} for i,l in enumerate(s.splitlines()) if 'hash mismatch' in l or 'Wirkungssteuer_WStG_Logik_Steuerungsfaktoren' in l]})
                      if p.suffix in ['.py','.mjs'] or 'metadata' in name or 'manifest' in name:
                          dst=out/name;dst.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(p,dst)
          for name in ['scripts/publications/build-wirkungssteuer-wstg-v3.py','scripts/publications/build-nachhaltigkeit-systemarchitektur-v1.1.py','scripts/publications/build-begriffsleitfaden-v1.3.py','package.json']:
              p=root/name;dst=out/name;dst.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(p,dst)
          hashes=[]
          for name in files:
              if ('Wirkungssteuer_WStG' in name or 'wirkungssteuer-wstg' in name) and (name.endswith('.pdf') or name.endswith('metadata.json')):
                  p=root/name
                  if not p.is_file():continue
                  hashes.append({'path':name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          (out/'diagnosis.json').write_text(json.dumps({'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'matches':report,'files':hashes},ensure_ascii=False,indent=2))
          print(json.dumps({'matches':report,'files':hashes},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: glossary-publication-diagnosis
          path: /tmp/publication-diagnosis/
          retention-days: 3
          if-no-files-found: error
