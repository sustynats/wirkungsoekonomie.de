  - termId: folgencheck
    canonicalLabel: "Folgencheck"
    slug: "folgencheck"
    status: "führender-begriff"
    version: "1.0"
    source: "Folgencheck/Faktencheck v1.1"
    sourceDocument: "WOeK_Folgencheck_und_Faktencheck_Paper_v1.1"
    sourceSection: "Medien, Öffentlichkeit und Prüfung"
    shortDefinition: "Ein Folgencheck prüft, welche Wirkungen oder Wirkungspotenziale eine Aussage, Entscheidung, Maßnahme, Technologie, ein Produkt oder ein Kapitalfluss auslösen kann."
    hoverDefinition: "Folgencheck fragt: Was kann das auslösen? Er prüft Wirkungspotenziale, Wirkungspfade, Betroffene, Datenlücken und Schutzgrenzen."
    longDefinition: "Der Folgencheck ist ein wirkungsökonomisches Prüfverfahren. Er fragt nicht nur, ob etwas stimmt, erlaubt oder profitabel ist, sondern welche Folgen daraus entstehen können: für Menschen, Ökosysteme, Institutionen, Märkte, Vertrauen, Demokratie und zukünftige Generationen."
    usageNote: "Folgencheck vorsorgend als Ex-ante-Prüfung erklären; keine Zensur, keine Personenbewertung, kein Wahrheitsmonopol."
    doNotConfuseWith: ["Faktencheck", "Personenbewertung", "Zensur", "Wahrheitsmonopol"]
    synonyms: ["WÖk-Folgencheck", "Wirkungsfolgencheck", "Wirkungsfolgenprüfung", "Folgenprüfung"]
    relatedTerms: ["faktencheck", "wirkungspotenzial", "wirkungsrisiko", "wirkungsbewertung", "wirkungsrueckkopplung", "medienwirkung", "resonanzraum", "sdg-plus"]
    relatedDocuments: ["folgencheck-faktencheck"]
    examples: ["Eine faktisch richtige Aussage wird darauf geprüft, welche Gruppen sichtbar oder unsichtbar werden und welche Wirkungspfade entstehen können."]
    preferredUsage: "Folgencheck prüft mögliche Wirkungen, Risiken, Nebenwirkungen, Datenlücken und Schutzgrenzen."
    deprecatedUsage: ["Folgencheck als Zensur", "Folgencheck als Personenbewertung", "Folgencheck als Wahrheitsmonopol"]
    reviewStatus: "approved"
    glossaryOrderKey: "folgencheck"
