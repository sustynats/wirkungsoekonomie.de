  - termId: faktencheck
    canonicalLabel: "Faktencheck"
    slug: "faktencheck"
    status: "anschlussbegriff"
    version: "1.0"
    source: "Folgencheck/Faktencheck v1.1"
    sourceDocument: "WOeK_Folgencheck_und_Faktencheck_Paper_v1.1"
    sourceSection: "Medien, Öffentlichkeit und Prüfung"
    shortDefinition: "Ein Faktencheck prüft, ob eine Aussage sachlich stimmt, belegbar ist oder irreführend dargestellt wird."
    hoverDefinition: "Faktencheck fragt: Stimmt das? Er prüft Quellen, Daten, Belege und Kontext, aber nicht automatisch gesellschaftliche Folgen."
    longDefinition: "Faktenchecks vergleichen Behauptungen mit überprüfbaren Quellen, Daten, Dokumenten oder Expert:innenwissen. Sie fragen, ob eine Aussage wahr, falsch, unbelegt, verkürzt oder aus dem Zusammenhang gerissen ist."
    usageNote: "Faktencheck als notwendige Grundlage verwenden, aber klar vom Folgencheck unterscheiden."
    doNotConfuseWith: ["Folgencheck", "Wirkungsbewertung", "Wahrheitsmonopol"]
    synonyms: ["Fact-Checking", "Faktenprüfung", "Quellenprüfung"]
    relatedTerms: ["folgencheck", "medienwirkung", "wirkungspotenzial", "wirkungsrisiko", "resonanzraum", "wirkungsbewertung"]
    relatedDocuments: ["folgencheck-faktencheck"]
    examples: ["Eine politische Zahl wird mit Primärquellen, Statistik und Kontext geprüft."]
    preferredUsage: "Faktencheck prüft die sachliche Richtigkeit einer Aussage."
    deprecatedUsage: ["Faktencheck als vollständige Folgenbewertung"]
    reviewStatus: "approved"
    glossaryOrderKey: "faktencheck"
