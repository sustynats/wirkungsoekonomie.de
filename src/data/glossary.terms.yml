    shortDefinition: "Nachbarschaftsstrom ist ein alltagsnaher Begriff für lokal oder regional erzeugten erneuerbaren Strom, der von einem benachbarten Erzeuger oder einer lokalen Gemeinschaft bezogen wird."
    hoverDefinition: "Nachbarschaftsstrom meint rechtlich, technisch und bilanziell organisierten lokalen erneuerbaren Strom - nicht formlosen Stromhandel über den Gartenzaun."
    longDefinition: "Der Begriff sollte verständlich, aber präzise verwendet werden. Gemeint ist in der Regel rechtlich, technisch und bilanziell organisiertes Energy Sharing oder ein anderes zulässiges dezentrales Versorgungsmodell. Strom vom Nachbarn bedeutet nicht, dass Strom formlos, ohne Vertrag, ohne Messung oder ohne Netzregeln verkauft wird. Beim Energy Sharing erfolgt die Lieferung über das öffentliche Netz und benötigt unter anderem Verträge, Messwerte und Reststromversorgung."
    usageNote: "Als bürgernahen Erklärbegriff nutzen und immer mit Netz-, Mess-, Vertrags- und Reststromhinweis absichern."
