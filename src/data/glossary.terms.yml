    sourceSection: "Executive Summary und Teil A"
    shortDefinition: "Wirkungssteuer bezeichnet eine modulare fiskalische Rückkopplungsarchitektur, die nachgewiesene oder gesetzlich modellierte Wirkung über klar bestimmte Module an bestehende Steuerarten anbindet."
    hoverDefinition: "Wirkungssteuer 3.0 ergänzt bestehende Steuerarten um gesetzliche Wirkungsmodule; Scorecards liefern Evidenz, der Gesetzgeber bestimmt Tarife und Rechtsfolgen."
    longDefinition: "Wirkungssteuer 3.0 ist keine universelle Supersteuer. Ausgangspunkt bleibt jede bestehende Steuer mit eigenem Steuergegenstand, eigener Bemessungsgrundlage und Kompetenzordnung. Ein Wirkungsmodul kann nur durch Gesetz aktiviert werden und muss Datengrundlage, Schutzgrenzen, Tariffolge, Übergang, Rechtsschutz und Evaluation bestimmen. Nichtkompensation und Reverse Merit Order schützen vor dem Wegmitteln schwerer Schäden; Personen werden nicht bewertet."
    usageNote: "Immer modular, rechtsgebunden und als Entwurfsarchitektur beschreiben. Scorecards setzen keine Steuersätze."
    doNotConfuseWith: ["CO2-Steuer", "Pigou-Steuer", "universelle Supersteuer", "automatische Score-Steuer"]
