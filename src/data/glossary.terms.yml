  - termId: mensch-planet-demokratie
    canonicalLabel: "Mensch, Planet und Demokratie"
    slug: "mensch-planet-demokratie"
    status: "führender-begriff"
    version: "1.0"
    source: "WOeK_Begriffsleitfaden_fuehrend_v1.0.md"
    sourceDocument: "WOeK_Begriffsleitfaden_fuehrend_v1.0.md"
    sourceSection: "Bewertungsrahmen"
    shortDefinition: "Mensch, Planet und Demokratie sind die drei Oberbegriffe, unter denen die Wirkungsökonomie die SDGs, die Agenda 2030 und SDG+ zusammenfasst."
    hoverDefinition: "Mensch, Planet und Demokratie übersetzt SDGs, Agenda 2030 und SDG+ in drei verständliche Wirkungsdimensionen."
    longDefinition: "Der Begriff bezeichnet die drei übergeordneten Wirkungsdimensionen der Wirkungsökonomie. Mensch steht für soziale Gerechtigkeit, Gesundheit, Bildung, Teilhabe, Würde und Sicherheit. Planet steht für Klima, Ressourcen, Wasser, Boden, Biodiversität, Energie und Regeneration. Demokratie steht für Rechtsstaatlichkeit, Medienqualität, Diskursfähigkeit, institutionelles Vertrauen, gesellschaftlichen Zusammenhalt und digitale Selbstbestimmung. Damit sind Mensch, Planet und Demokratie keine zusätzlichen UN-Ziele, sondern die kommunikative Ordnung, mit der die Wirkungsökonomie die SDGs, die Agenda 2030 und SDG+ verständlich zusammenführt."
    usageNote: "Als kommunikative Übersetzung von SDGs, Agenda 2030 und SDG+ verwenden, nicht als zusätzliche UN-Ziele."
    doNotConfuseWith: ["zusätzliche UN-Ziele", "SDG+ als UN-Kategorie", "positive Netto-Wirkung als Ergebnisgröße"]
    synonyms: ["MPD"]
    relatedTerms: ["sdgs", "agenda-2030", "sdg-plus", "wirkung", "positive-netto-wirkung", "wirkungsbewertung"]
    relatedDocuments: []
    examples: []
    preferredUsage: "Mensch, Planet und Demokratie als öffentliche Sprache für den fachlichen Referenzrahmen aus SDGs, Agenda 2030 und SDG+ nutzen."
    deprecatedUsage: []
    reviewStatus: "approved"
    glossaryOrderKey: "mensch planet demokratie"
