  - termId: faktencheck
    canonicalLabel: "Faktencheck"
    slug: "faktencheck"
    status: "führender-begriff"
    version: "1.1"
    source: "Faktencheck und Folgencheck v1.1"
    sourceDocument: "Faktencheck und Folgencheck v1.1"
    sourceSection: "Kernunterscheidung"
    shortDefinition: "Ein Faktencheck prüft, ob eine Aussage, Zahl, Quelle oder Behauptung stimmt."
    hoverDefinition: "Faktencheck fragt: Stimmt das? Er prüft Belege, Quellen, Kontext und Nachvollziehbarkeit."
    longDefinition: "Der Faktencheck ist die Prüfung von Aussagen, Zahlen, Quellen und Kontexten auf Richtigkeit. Er ist notwendig, beantwortet aber noch nicht, welche Folgen eine Aussage, Entscheidung oder Maßnahme auslösen kann."
    usageNote: "Immer vom Folgencheck unterscheiden: Faktencheck prüft Richtigkeit, Folgencheck prüft mögliche Wirkungen."
    doNotConfuseWith: ["Folgencheck", "Wirkungsbewertung", "Meinungsprüfung"]
    synonyms: ["Fact Check", "Richtigkeitsprüfung"]
    relatedTerms: ["folgencheck", "wirkstoff", "wirkungspotenzial", "wirkungspfad"]
    relatedDocuments: ["faktencheck-folgencheck-v1-1"]
    examples: ["Stimmt die zitierte Zahl?", "Ist die Quelle echt?", "Ist der Kontext vollständig?"]
