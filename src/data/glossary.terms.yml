    sourceSection: "Anschlussräume; Sustainable Finance & Social Taxonomy"
    shortDefinition: "Die EU-Taxonomie klassifiziert wirtschaftliche Tätigkeiten nach definierten Nachhaltigkeitskriterien."
    hoverDefinition: "Die EU-Taxonomie ist ein Umwelt-Klassifikationsrahmen; sie ersetzt weder Social Taxonomy noch vollständige WÖk-Netto-Wirkungsbewertung."
    longDefinition: "Die EU-Taxonomie ordnet Tätigkeiten anhand von Umweltzielen, DNSH, Mindestschutz und technischen Bewertungskriterien ein. In der Wirkungsökonomie ist sie ein wichtiger Anschlussstandard für Sustainable Finance, aber keine vollständige Bewertung sozialer Wirkung oder positiver Netto-Wirkung."
    usageNote: "Taxonomiekonformität nicht als vollständige Nachhaltigkeit im WÖk-Sinn darstellen und klar von einer Social Taxonomy unterscheiden."
    doNotConfuseWith: ["Social Taxonomy", "Taxonomiefähigkeit", "Wirkungsbewertung"]
