  - termId: folgencheck
    canonicalLabel: "Folgencheck"
    slug: "folgencheck"
    status: "führender-begriff"
    version: "1.1"
    source: "Faktencheck und Folgencheck v1.1"
    sourceDocument: "Faktencheck und Folgencheck v1.1"
    sourceSection: "Ex-ante-Prüfung"
    shortDefinition: "Ein Folgencheck prüft vorsorgend, was eine Aussage, Entscheidung oder Maßnahme auslösen kann."
    hoverDefinition: "Folgencheck fragt: Was kann das auslösen? Er prüft Auslöser mit Wirkungspotenzial, Wirkungspfade und Wirkungsräume ex ante."
    longDefinition: "Der Folgencheck ist eine vorsorgende Ex-ante-Prüfung möglicher Wirkungen. Er untersucht Auslöser mit Wirkungspotenzial, Wirkungspfade, Wirkungsräume, Nebenwirkungen, Datenqualität, Unsicherheit und Schutzgrenzen, bevor Schäden oder Systemfolgen vollständig eingetreten sind."
    usageNote: "Nicht als nachträgliche Schadensanalyse verkürzen. Folgencheck ist vorsorgende Prüfung möglicher Auslösung."
    doNotConfuseWith: ["Faktencheck", "Schadensbilanz", "Zensur", "Meinungsprüfung"]
    synonyms: ["Folgenprüfung", "Ex-ante-Folgenprüfung", "Wirkungsfolgencheck"]
    relatedTerms: ["faktencheck", "wirkstoff", "wirkungsraum", "wirkungspfad", "wirkungspotenzial"]
    relatedDocuments: ["faktencheck-folgencheck-v1-1"]
    examples: ["Kann ein Narrativ Panik, Polarisierung oder Schutzverhalten auslösen?", "Welche Nebenwirkungen hat eine Regel, bevor sie breit eingeführt wird?"]
    preferredUsage: "Folgencheck als vorsorgende Prüfung von Wirkungspotenzialen verwenden."
    deprecatedUsage: ["Folgencheck als reine Nachschau"]
    reviewStatus: "approved"
    glossaryOrderKey: "folgencheck"
    firstApprovedIn: "2026.1"
    lastUpdated: "2026-05-26"
