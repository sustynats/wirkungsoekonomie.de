    longDefinition: "ESG hilft, Risiken und Nachhaltigkeitsaspekte zu strukturieren. Die Wirkungsökonomie nutzt ESG als Daten- und Anschlussraum, bewertet aber Wirkung als Zustandsveränderung und koppelt sie zurück."
    usageNote: "ESG nicht als Grundlage oder Zielgröße der WÖk formulieren."
