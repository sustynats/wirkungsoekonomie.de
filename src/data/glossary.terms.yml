    longDefinition: "Das Wirkungsnachweiskonto speichert für einen steuerlich bestimmten Gegenstand nachvollziehbar, welche Wirkungsdaten, Quellen, Benchmarks, Versionen, Prüfungen und Rechtsfolgen verwendet wurden. Es dient Nachweis, Korrektur, Rechtsschutz und Evaluation. Es bildet weder einen steuerartenübergreifenden Saldo guter und schlechter Wirkung noch ein Personenrating und ermöglicht keine freie Verrechnung zwischen unterschiedlichen Steuerzwecken oder Wirkungsfeldern."
