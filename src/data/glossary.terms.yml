    sourceDocument: "WOeK_Begriffsleitfaden_fuehrend_v1.1_Energy_Sharing.md"
    sourceSection: "Nachtrag Energy Sharing"
    shortDefinition: "Energy Sharing ist die gemeinschaftliche Nutzung von Strom aus erneuerbaren Energien durch mehrere Beteiligte, in Deutschland seit § 42c EnWG auch über das öffentliche Netz."
    hoverDefinition: "Energy Sharing teilt lokal oder regional erzeugten erneuerbaren Strom bilanziell über ein Netz. Es ist kein informeller Stromhandel und kein kostenloses Schattennetz."
    longDefinition: "Der Begriff bezeichnet nicht bloß Eigenverbrauch und nicht bloß Mieterstrom. Beim Energy Sharing wird lokal oder regional erzeugter erneuerbarer Strom bilanziell geteilt. Die Teilnehmenden bleiben in der Regel zusätzlich auf Reststrom angewiesen. Wirkungsökonomisch ist Energy Sharing ein Wirkungsmechanismus mit Wirkungspotenzial für Klima, regionale Resilienz, demokratische Teilhabe, Energiearmutsprävention und Netzintelligenz. Positive Netto-Wirkung entsteht nur, wenn Erzeugung, Messung, Abrechnung, soziale Zugänglichkeit, Netzdienlichkeit und Governance tragfähig gestaltet sind."
    usageNote: "Als rechtlich, technisch und bilanziell organisiertes Teilen erneuerbarer Energie verwenden; Stand 1. Juni 2026 als Public-Interest- und Journal-Einordnung kennzeichnen."
    doNotConfuseWith: ["Eigenverbrauch", "Mieterstrom", "informeller Stromhandel", "kostenloses Schattennetz"]
    synonyms: ["Gemeinsame Nutzung elektrischer Energie", "Strom teilen", "Shared Energy", "§ 42c EnWG"]
    relatedTerms: ["energiegemeinschaft", "energiegenossenschaft", "buergerenergie", "nachbarschaftsstrom", "reststrom", "mieterstrom", "erneuerbare-energien", "energiearmut", "netzentgelt", "smart-meter", "lokale-energie-als-wirkungsinfrastruktur", "positive-netto-wirkung"]
    relatedDocuments: ["die-neue-ordnung-des-wohlstands"]
    examples: ["Strom vom Nachbarn über das öffentliche Netz", "quartiersbezogene PV-Nutzung mit Reststromvertrag", "kommunal eingebundene Bürgerenergie"]
    preferredUsage: "Energy Sharing als Wirkungsmechanismus mit Schutzlinien, Datenqualität und Governance darstellen."
    deprecatedUsage: ["kostenloser Strom vom Nachbarn", "formloser Nachbarschaftsstrom", "Stromumgehung"]
