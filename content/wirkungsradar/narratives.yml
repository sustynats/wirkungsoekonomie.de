      ten_seconds: "Das andere Thema kann wichtig sein. Aber es beantwortet die ursprüngliche Frage nicht."
      thirty_seconds: "Der wahre Kern ist: Es gibt oft mehrere relevante Probleme. Der Denkfehler ist, ein anderes Problem zu nutzen, um die erste Frage zu vermeiden. Bleiben wir kurz bei der Wirkung dieser Aussage."
      two_minutes: "Ich ordne das kurz ein. Vergleiche können sinnvoll sein, und oft gibt es tatsächlich weitere Probleme. Aber Whataboutism verschiebt den Fokus, bevor die Ausgangsfrage geklärt ist. Dann wird aus Analyse ein Themenkarussell: China, USA, Migration, früher, die anderen. Wirkungsökonomisch gilt: Mehrere Probleme können gleichzeitig wahr sein. Die Existenz eines zweiten Problems hebt die Wirkung des ersten nicht auf. Die bessere Gesprächsregel lautet: Wir notieren das zweite Thema - und beantworten zuerst die konkrete Frage, die gerade im Raum steht."
      dont_do:
        - "Nicht dem nächsten Thema sofort hinterherlaufen."
