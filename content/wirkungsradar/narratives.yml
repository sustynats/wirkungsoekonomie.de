      abstract: "Wissenschaftsdelegitimierung greift nicht nur einzelne Studien an, sondern das öffentliche Vertrauen in wissenschaftliche Korrekturprozesse. Der wahre Kern ist: Wissenschaft kann Fehler machen, Interessenkonflikte kennen und muss kritisiert werden dürfen. Irreführend wird es, wenn daraus folgt, Wissenschaft sei grundsätzlich korrupt oder beliebig. Als gesellschaftlicher Wirkstoff schwächt dieses Narrativ eine zentrale Infrastruktur demokratischer Entscheidungen: überprüfbares Wissen. Wirkungsökonomisch geht es nicht um blinden Wissenschaftsglauben, sondern um Quellenklarheit, Methodenprüfung und transparente Unsicherheit."
