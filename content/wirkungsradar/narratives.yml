      two_minutes: "Ich ordne das kurz ein. Wer Demokratie schützen will, muss Macht kritisieren können: Lobbyismus, Kapitalinteressen, Drehtüren, Intransparenz und ungleiche Einflusschancen sind reale Themen. Aber Verschwörungslogik macht daraus ein geschlossenes Weltbild. Dann gilt jede Quelle als Teil des Plans, jeder Widerspruch als Beweis und jede Institution als gesteuert. Wirkungsökonomisch zerstört das die Möglichkeit demokratischer Korrektur. Die bessere Antwort ist: Machtkritik präzisieren. Wer hat entschieden? Wer profitiert? Welche Daten gibt es? Welche Kontrolle greift? So bleibt Kritik überprüfbar und handlungsfähig."
      dont_do:
        - "Nicht reale Machtfragen abtun."
