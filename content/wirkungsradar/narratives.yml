    hero:
      eyebrow: "Narrativfamilie"
      title: "Verbotsnarrativ"
      subtitle: "„Die wollen uns alles verbieten.“"
      abstract: "Das Verbotsnarrativ rahmt politische Steuerung als Angriff auf persönliche Freiheit. Es übersetzt Standards, Preissignale, Sicherheitsregeln oder Transformationspolitik in ein Gefühl von Verlust: Auto, Fleisch, Heizung, Meinung, Eigentum oder Lebensstil würden angeblich weggenommen. Als gesellschaftlicher Wirkstoff aktiviert es Trotz, Abwehr und Identitätsschutz. Wirkungsökonomisch ist wichtig, zwischen echten Verboten, Preissignalen, Transparenzpflichten, Schutzregeln und demokratisch legitimierter Lenkung zu unterscheiden."
