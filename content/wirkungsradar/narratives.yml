      subtitle: "„Das ist alles von Eliten geplant.“"
      abstract: "Die Elitenverschwörung verwandelt reale Machtfragen in ein geschlossenes Weltbild. Der wahre Kern ist: Macht, Lobbyismus, Kapitalinteressen und Intransparenz existieren tatsächlich. Irreführend und gefährlich wird es, wenn daraus eine allumfassende geheime Steuerung konstruiert wird, gegen die Fakten, Institutionen und demokratische Verfahren angeblich machtlos seien. Als gesellschaftlicher Wirkstoff zerstört dieses Narrativ Vertrauen in überprüfbare Quellen und demokratische Korrektur. Wirkungsökonomisch braucht es deshalb doppelte Klarheit: Machtkritik ja, Verschwörungslogik nein."
