      ten_seconds: "Wissenschaft ist nicht unfehlbar. Aber sie hat Methoden, Fehler zu finden und Wissen zu korrigieren."
      thirty_seconds: "Der wahre Kern ist: Wissenschaft kann Fehler machen und Interessenkonflikte haben. Der Denkfehler ist, daraus pauschal Korruption oder Beliebigkeit abzuleiten. Kritik braucht Belege: Methode, Daten, Finanzierung, Peer Review und Korrektur."
      two_minutes: "Ich ordne das kurz ein. Wissenschaft ist kein Glaubenssystem und keine unfehlbare Autorität. Sie ist ein Verfahren, mit dem Aussagen überprüft, Fehler gefunden und Unsicherheit sichtbar gemacht werden. Natürlich gibt es schlechte Studien, Interessenkonflikte und politische Deutungen. Genau deshalb sind Methode, Daten, Replikation, Peer Review und transparente Kritik so wichtig. Das Narrativ „alles gekauft“ zerstört diesen Unterschied. Dann zählt nicht mehr, was belegt ist, sondern nur noch, ob eine Quelle ins eigene Misstrauen passt. Wirkungsökonomisch ist überprüfbares Wissen eine Infrastruktur der Demokratie. Die bessere Frage lautet: Welche konkrete Studie, welche Methode und welcher Interessenkonflikt sind gemeint?"
