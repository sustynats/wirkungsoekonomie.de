      risk: "Fokus und Verantwortungszuordnung zerfallen."
      host_principle: "Zur Ausgangsfrage zurückführen."
    narrative:
      definition: "Whataboutism kann relevante Vergleichsfragen enthalten, dient aber oft dazu, eine konkrete Verantwortung nicht beantworten zu müssen."
