      abstract: "Der Scheiternsframe bewertet komplexe Transformationen pauschal als Misserfolg. Er nutzt einzelne Probleme, Verzögerungen oder Kostensteigerungen, um eine ganze Richtung zu delegitimieren. Der wahre Kern ist: Transformationen haben reale Probleme, Zielkonflikte und Fehlsteuerungen. Irreführend wird es, wenn aus einzelnen Schwierigkeiten ein vollständiges Scheitern konstruiert wird. Als gesellschaftlicher Wirkstoff kann der Scheiternsframe Lernfähigkeit zerstören. Wirkungsökonomisch ist entscheidend: Scheitert eine Lösung wirklich - oder zeigt sich ein Engpass, der korrigiert werden muss?"
