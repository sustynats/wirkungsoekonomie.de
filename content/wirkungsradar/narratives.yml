    answers:
      ten_seconds: "Das ist ein Ohnmachtsnarrativ. Niemand löst alles allein - aber daraus folgt nicht, dass Handeln wirkungslos ist."
      thirty_seconds: "Der wahre Kern ist: Ein einzelner Akteur löst komplexe Probleme nicht allein. Der Denkfehler ist: Aus begrenzter Wirkung wird Wirkungslosigkeit gemacht. Die wirkungsökonomische Frage lautet: Welche Hebel haben wir trotzdem - politisch, technologisch, wirtschaftlich und gesellschaftlich?"
      two_minutes: "Ich ordne das kurz ein. Der wahre Kern ist: Natürlich kann niemand allein das Klima, die Demokratie oder soziale Ungleichheit retten. Aber das heißt nicht, dass Handeln keine Wirkung hat. Wirkung entsteht in vernetzten Systemen: durch Standards, Märkte, Infrastruktur, Vorbilder, politische Mehrheiten, Investitionen und Institutionen. Wenn alle sagen „ich bin zu klein“, handelt niemand. Wirkungsökonomisch fragen wir deshalb nicht: Können wir allein alles lösen? Sondern: Welche Wirkung können unsere Hebel auslösen - und welche Folgekosten entstehen, wenn wir nichts tun?"
      dont_do:
