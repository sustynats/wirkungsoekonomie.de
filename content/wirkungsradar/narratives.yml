      ten_seconds: "Nicht jede Regel ist ein Verbot. Entscheidend ist, ob es um Zwang, Schutz, faire Preise oder bessere Alternativen geht."
      thirty_seconds: "Der wahre Kern ist: Freiheit muss bei jeder Maßnahme geprüft werden. Der Denkfehler ist: Standards, Preise, Schutzregeln und echte Verbote in einen Topf zu werfen. Die bessere Frage lautet: Welche Wirkung soll die Regel erzeugen, und ist sie verhältnismäßig?"
      two_minutes: "Ich ordne das kurz ein. Freiheit ist ein wichtiger Maßstab, gerade in Transformationen. Aber das Verbotsnarrativ macht aus jeder Form von Steuerung sofort Bevormundung. Wirkungsökonomisch müssen wir genauer sein: Ein Verbot ist etwas anderes als ein Preissignal, eine Kennzeichnungspflicht, ein Sicherheitsstandard, ein Förderprogramm oder der Ausbau einer Alternative. Dann kann man fair prüfen: Ist der Eingriff demokratisch beschlossen, verhältnismäßig, sozial abgefedert und wirksam? So schützen wir Freiheit besser als mit dem pauschalen Satz „die wollen alles verbieten“."
      dont_do:
        - "Nicht mit „Stell dich nicht so an“ reagieren."
        - "Nicht echte Freiheitseingriffe kleinreden."
      redirect_question: "Ist das ein echtes Verbot - oder eine Regel, ein Preis, ein Schutzstandard oder eine Alternative?"
