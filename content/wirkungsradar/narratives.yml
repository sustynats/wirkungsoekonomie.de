      abstract: "Das Ohnmachtsnarrativ verwandelt begrenzte Einzelwirkung in allgemeine Wirkungslosigkeit. Es enthält oft einen wahren Kern: Kein Mensch, keine Kommune und kein Land löst komplexe Probleme allein. Irreführend wird es, wenn daraus folgt, dass Handeln sinnlos sei. Als gesellschaftlicher Wirkstoff senkt dieses Narrativ Selbstwirksamkeit, Vertrauen und politische Handlungsbereitschaft. Wirkungsökonomisch ist die bessere Frage nicht: Können wir allein alles lösen? Sondern: Welche Hebel haben wir, welche Wirkung können sie auslösen, und welche Folgen hätte Unterlassen?"
