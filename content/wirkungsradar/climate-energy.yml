  - title: "„CO₂ ist nur ein Spurengas“"
    slug: "co2-ist-nur-ein-spurengas"
    shortJudgement: "Irreführend."
    narrativeFamilies:
      - "Scheinfakt"
      - "Wissenschaftsdelegitimierung"
    riskLevel: "hoch"
    themes:
