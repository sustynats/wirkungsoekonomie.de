    summary:
      judgement: "Territorial teilweise richtig, als Verantwortungsargument irreführend."
      true_core: "Deutschland ist nicht der größte territoriale Jahresemittent."
      problem: "Die Aussage verwechselt territoriale Bilanz mit Gesamtverantwortung."
      narrative: "Ohnmachtsnarrativ / Verantwortungsverkürzung / Verzögerungsframe."
      risk: "Konsum, Lieferketten, Produktnutzung, Historie und Transformationshebel werden unsichtbar."
      host_answer: "Die 2-%-Zahl misst höchstens einen engen Inlandsausschnitt. Verantwortung misst sie nicht."
    answers:
      ten_seconds: "Die 2-%-Zahl misst höchstens Inlandsemissionen. Verantwortung misst sie nicht. Konsum, Lieferketten, exportierte Produkte, Scope 3 und historische Emissionen fehlen."
      thirty_seconds: "Der Denkfehler ist: Territoriale Emissionen werden mit Verantwortung verwechselt. Deutschland hat nicht nur Emissionen innerhalb seiner Grenzen, sondern auch Konsumemissionen, importierte Produktionswirkung, exportierte Fahrzeuge und Maschinen, Scope-3-Wirkung, historische Verantwortung und starke Technologie- und Standardhebel. Die bessere Frage lautet: Welche Wirkung lösen wir aus - und wie verändern wir sie?"
      two_minutes: "Ich ordne das sauber ein. Die 2-%-Behauptung kann nur dann halbwegs stimmen, wenn man sehr eng auf territoriale Jahresemissionen schaut. Aber Verantwortung ist mehr als das. Wenn wir Produkte importieren, deren Emissionen im Ausland entstehen, verschwindet diese Wirkung nicht. Wenn deutsche Unternehmen Verbrenner, Maschinen oder Technologien exportieren, die weltweit über Jahre Emissionen verursachen, ist das Teil der Produkt- und Scope-3-Verantwortung. Wenn wir historisch über Jahrzehnte emittiert haben, ist das nicht durch den Blick auf ein einzelnes Jahr erledigt. Wirkungsökonomisch zählen Wirkungsketten: Rohstoffe, Produktion, Transport, Nutzung, Entsorgung, Kapital, Standards und politische Hebel. Deshalb ist die richtige Frage nicht: Sind wir nur 2 %? Sondern: Wo erzeugen wir Wirkung - und wie drehen wir sie Richtung Mensch, Planet und Demokratie?"
    effect_path:
