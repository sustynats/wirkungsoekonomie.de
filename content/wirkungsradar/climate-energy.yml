    summary:
      judgement: "Forschung wichtig, aber kein Ersatz für heutige Emissionsminderung."
      true_core: "Fusion kann langfristig eine bedeutende Technologie werden."
      problem: "Ungewisse Zukunftstechnik wird als Aufschubargument genutzt."
      narrative: "Technikwunder-Aufschub / Verzögerung."
      risk: "Heute verfügbare Lösungen werden langsamer umgesetzt."
      host_answer: "Fusion erforschen: ja. Aber sie ersetzt keine Emissionsminderung in diesem Jahrzehnt."
    answers:
      ten_seconds: "Fusion erforschen: ja. Aber sie ersetzt keine Emissionsminderung in diesem Jahrzehnt."
      thirty_seconds: "Der wahre Kern ist: Fusion ist wissenschaftlich spannend und langfristig relevant. Der Denkfehler ist, sie als heutige Lösung zu verkaufen. Wirkungsökonomisch zählt der Zeithorizont: Was senkt Emissionen rechtzeitig, skalierbar und bezahlbar? Deshalb muss man Zeithorizonte trennen: Forschung kann langfristige Optionen schaffen. Klimaschutz braucht aber Wirkung in den nächsten Jahren, nicht erst nach möglicher Industrialisierung. Zukunftsforschung ist Ergänzung, keine Ausrede für heutigen Aufschub."
      two_minutes: "Ich ordne das ein. Fusion ist kein Grund, Forschung kleinzureden - im Gegenteil. Aber Forschung und heutige Klimapolitik haben unterschiedliche Zeithorizonte. Wenn wir eine künftige Technologie als Argument gegen heutige Maßnahmen benutzen, wird sie zum Verzögerungsnarrativ. Die WÖk bewertet Technik nach Wirkung, Zeithorizont, Skalierbarkeit, Kosten, Risiken und Alternativen. Also: Fusion weiterentwickeln, aber Netze, Speicher, Erneuerbare, Effizienz und Industrieumbau jetzt umsetzen. Fusion ist ein gutes Beispiel dafür, wie Hoffnung und Aufschub ineinander rutschen können. Hoffnung ist berechtigt: Forschung an neuen Energiequellen kann langfristig sehr wertvoll sein. Aber daraus folgt nicht, dass heutige Emissionen warten können. Für Klimarisiken zählt der kumulierte Ausstoß. Jede Tonne, die heute zusätzlich in der Atmosphäre landet, erhöht den späteren Druck auf Anpassung, Infrastruktur und Ökosysteme. Wenn Fusion als Ergänzung zu Netzen, Speichern, Erneuerbaren, Effizienz und Industrieumbau diskutiert wird, ist sie Teil einer Zukunftsstrategie. Wenn sie als Ersatz für heutige Maßnahmen verwendet wird, wird sie zum Verzögerungsnarrativ. Die WÖk trennt deshalb Forschungspfad und Wirkungspfad: Was ist wissenschaftlich sinnvoll? Was ist netzrelevant, skalierbar und bezahlbar? Und was senkt in diesem Jahrzehnt real Schäden für Mensch, Planet und Demokratie?"
    effect_path:
      - label: "Aussage"
        description: "Fusion löst das Problem."
      - label: "Wirkstoff"
