      true_core: "Deutschland ist nicht der größte aktuelle Emittent."
      problem: "Aus kleinerem Anteil wird Wirkungslosigkeit abgeleitet."
      narrative: "Ohnmacht / Verzögerung / Whataboutism."
      risk: "Klimaschutz erscheint nutzlos, Investitionen und Infrastruktur werden verzögert."
      host_answer: "Wirkung entsteht nicht nur durch Größe, sondern durch Hebel."
    answers:
      ten_seconds: "Der Zahlenkern kann stimmen, aber die Schlussfolgerung ist falsch: Wirkung entsteht nicht nur durch Größe, sondern durch Hebel."
      thirty_seconds: "Ja, Deutschland ist nicht der größte Emittent. Aber daraus folgt nicht, dass Handeln wirkungslos ist. Wir wirken über Technologie, Märkte, Standards, Lieferketten, EU-Politik und Investitionen. Wenn jedes Land sagt, es sei zu klein, handelt am Ende niemand. Zusätzlich zählt die Vorbild- und Standardwirkung: Maschinenbau, Chemie, Automobilindustrie, EU-Regeln, Beschaffung und Kapitalmärkte können Wirkung weit über die nationale Emissionsmenge hinaus auslösen."
      two_minutes: "Der Satz vermischt einen Zahlenkern mit einer falschen politischen Folgerung. Klimawirkung entsteht nicht nur proportional zum nationalen Anteil. Ein Industrieland wirkt über Technologieentwicklung, Regulierung, Märkte, Standards, Kapital, Lieferketten und internationale Glaubwürdigkeit. Die wirkungsökonomische Frage lautet daher nicht: Sind wir allein verantwortlich? Sondern: Welche Hebelwirkung können wir erzeugen, und welche Folgen hat es, wenn wir nicht handeln? Außerdem steckt in dem Satz eine gefährliche Kopierlogik. Sehr viele Länder können einzeln sagen: Unser Anteil ist nicht groß genug, um allein das Klima zu retten. Wenn alle diese Schlussfolgerung ziehen, entsteht kollektive Untätigkeit. Genau deshalb unterscheidet die WÖk zwischen Anteil und Wirkungspfad. Deutschland hat direkte Emissionen, aber auch indirekte Hebel: Technologieentwicklung, Netze, Industrieprozesse, Normen, Finanzierungsbedingungen, EU-Gesetzgebung, Lieferketten und internationale Glaubwürdigkeit. Wenn ein Industrieland zeigt, dass klimaneutrale Produktion, sichere Energieversorgung und soziale Abfederung zusammen funktionieren, senkt das Risiko und Kosten für andere. Wenn es scheitert oder abwartet, stärkt es Verzögerungsargumente. Die bessere Frage lautet also nicht, ob Deutschland allein die Welt rettet. Die Frage lautet: Welche Hebel sind real, wie stark wirken sie, und welche Folgeschäden entstehen, wenn wir sie nicht nutzen?"
    effect_path:
