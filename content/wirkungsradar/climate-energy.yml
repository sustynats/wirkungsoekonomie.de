    summary:
      judgement: "Meist irreführend."
      true_core: "Batterien haben relevante Rohstoff- und Herstellungswirkungen."
      problem: "Herstellung wird isoliert, Nutzungsemissionen des Verbrenners und Fortschritte bei Batteriechemie, Laden, Produktion und Recycling werden ausgeblendet."
      narrative: "Rohstoffangst / Verzögerung / falscher Lebenszyklusvergleich."
      risk: "Fossile Mobilität bleibt länger bestehen."
      host_answer: "Batterien haben Wirkung - aber der Vergleich muss über den gesamten Lebenszyklus und die reale Batterieentwicklung gehen."
    answers:
      ten_seconds: "Batterien haben Wirkung. Aber fair ist nur der Lebenszyklusvergleich: Herstellung, Strom, Nutzung, Recycling - und fossiler Kraftstoff."
      thirty_seconds: "Der wahre Kern ist: Batterieproduktion braucht Energie und Rohstoffe. Der Denkfehler ist: alte Durchschnittsdaten, falsche Stromannahmen und sichtbare Akkuprobleme gegen unsichtbar gemachte fossile Nutzungsemissionen zu stellen. Wirkungsökonomisch zählen Batteriechemie, Produktionsstrom, Ladequelle, Lebensdauer, Recycling, Fahrzeuggröße, Lieferkette und der verbrannte Kraftstoff des Verbrenners zusammen. Dazu kommt: Der Akku ist kein einmal verbrannter Energieträger. Er altert, kann oft lange genutzt, teilweise zweitgenutzt und anschließend recycelt werden. Benzin und Diesel dagegen werden verbrannt und sind weg. Wer nur den Akku-Rucksack zeigt, aber die fortlaufende fossile Verbrennung ausblendet, macht keinen fairen Vergleich."
      two_minutes: "Ich ordne das kurz ein. Ein E-Auto ist nicht automatisch perfekt. Batterie, Rohstoffe, Arbeitsbedingungen, Produktionsenergie, Sicherheit und Recycling müssen bewertet werden. Aber ein Verbrenner emittiert während seiner gesamten Nutzung fossiles CO₂ und Luftschadstoffe, und Benzin oder Diesel ist nach dem Verbrennen weg. Eine Batterie bleibt dagegen ein Materiallager: Sie kann länger genutzt, in Second-Life-Anwendungen überführt und recycelt werden. Außerdem verändert sich die Batterie selbst: LFP-Chemien kommen ohne Kobalt und Nickel in der Kathode aus, viele neue Zellwerke arbeiten mit deutlich saubererem Strom als alte Studien annehmen, und geförderte öffentliche Ladeinfrastruktur ist in Deutschland an erneuerbaren Strom gebunden. Deshalb braucht es einen aktuellen Lebenszyklusvergleich statt eines alten Akku-Schreckbilds. Der Satz funktioniert, weil er ein reales Problem anspricht: Batterien brauchen Rohstoffe, Energie und gute Lieferkettenkontrolle. Das muss in jede seriöse Bewertung hinein. Irreführend wird es, wenn nur dieser Teil gezeigt wird und der Verbrenner so behandelt wird, als sei nach der Herstellung kaum noch Wirkung vorhanden. Tatsächlich entstehen beim Verbrenner über die Nutzung fortlaufend fossile CO₂-Emissionen und Luftschadstoffe. Beim E-Auto verlagert sich ein größerer Teil der Wirkung in Herstellung, Batterie und Stromerzeugung - und genau deshalb verbessern erneuerbarer Strom, bessere Zellchemien, LFP ohne Kobalt und Nickel, Recycling, Fahrzeuggröße und Nutzungsdauer die Bilanz. Auch Brand- und Haltbarkeitsfragen gehören in die Prüfung, aber als Datenfrage, nicht als Angstbild. Wirkungsökonomisch ist die Lösung keine Werbung für jedes einzelne E-Auto. Ein schweres Fahrzeug mit schlechter Nutzung bleibt problematisch. Die Lösung ist eine Mobilitätsscorecard: CO₂, Ressourcen, Gesundheit, Arbeit, Lieferketten, Brandrisiko, Recycling und tatsächlicher Mobilitätsbedarf. Dann gewinnt nicht das Lager, sondern die bessere Netto-Wirkung."
    effect_path:
