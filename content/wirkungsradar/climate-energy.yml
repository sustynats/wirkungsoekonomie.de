      ten_seconds: "Der CO₂-Preis ist nicht die eigentliche Rechnung. Die eigentliche Rechnung sind Klimaschäden, Krankheitskosten, fossile Importe und Krisenrisiken."
      thirty_seconds: "Ja, der CO₂-Preis macht fossile Energie sichtbar teurer. Aber ohne CO₂-Preis zahlen wir trotzdem: über Klimaschäden, Luftverschmutzung, Krankheit, fossile Importrechnungen und Preisschocks. Der Unterschied ist: Der CO₂-Preis kann lenken und zurückverteilt werden. Fossile Schäden sind echte Verluste."
      two_minutes: "Ich ordne das sauber ein. Der CO₂-Preis ist nicht einfach eine zusätzliche Rechnung, die vorher nicht existierte. Fossile Energie verursacht bereits Kosten: Klimaschäden, zerstörte Infrastruktur, Ernteausfälle, Luftschadstoffe, Gesundheitskosten, fossile Importabhängigkeit und geopolitische Risiken. Diese Kosten tauchen nur nicht vollständig im Preis auf. Der CO₂-Preis ist der Versuch, einen Teil dieser Wirkung sichtbar zu machen und in Entscheidungen zurückzuführen. Wichtig ist: Dieses Geld ist nicht automatisch verloren. Es kann für Klimageld, Gebäudesanierung, erneuerbare Energien, ÖPNV, Industrieumbau und soziale Entlastung genutzt werden. Wirkungsökonomisch ist die Frage deshalb nicht: CO₂-Preis ja oder nein? Sondern: Wie gestalten wir ihn so, dass er Emissionen senkt, Menschen entlastet und fossile Systemkosten reduziert?"
