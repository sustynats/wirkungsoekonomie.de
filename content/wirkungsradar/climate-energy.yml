      - label: "Folge falschen Handelns"
        description: "Zeitfenster schließen sich und Folgekosten steigen."
    woek_solution:
      - "Forschung weiterführen und gleichzeitig heute skalierbare Lösungen umsetzen."
      - "Technik nach Zeithorizont, Skalierbarkeit, Kosten und Alternativen bewerten."
      - "Opportunitätskosten in Investitionsentscheidungen sichtbar machen."
