    summary:
      judgement: "Wahrer Kern, falsche Ursache."
      true_core: "Klima hat sich historisch immer wieder verändert."
      problem: "Daraus folgt nicht, dass die heutige Erwärmung natürlich verursacht ist."
      narrative: "Ursachenumdeutung / Verharmlosung."
      risk: "Verantwortung und Handlungsdruck werden abgeschwächt."
      host_answer: "Ja, Klima verändert sich. Die Frage ist: Was treibt die heutige Veränderung an?"
    answers:
      ten_seconds: "Ja, Klima hat sich immer verändert. Die entscheidende Frage ist aber: Was verursacht die heutige schnelle Erwärmung?"
      thirty_seconds: "Der wahre Kern ist: Klima war nie statisch. Der Denkfehler ist: Daraus folgt nicht, dass die heutige Erwärmung natürlich ist. Wir wissen, dass menschliche Treibhausgase der Haupttreiber sind. Also geht es nicht um „ob Klima sich ändert“, sondern um Ursache, Geschwindigkeit und Folgen. Dazu kommt: Natürliche Veränderung erklärt noch nicht den heutigen Zeitraum. Für eine gute Einordnung brauchen wir Ursache, Tempo, Messdaten und Folgen. Erst dann wird aus einem richtigen Allgemeinsatz eine brauchbare politische Schlussfolgerung."
      two_minutes: "Ich ordne das kurz ein. Natürlich hat sich Klima in der Erdgeschichte verändert. Aber das ist kein Gegenargument zur heutigen menschengemachten Erwärmung. Auch Feuer gab es schon immer - trotzdem kann ein bestimmter Brand eine bestimmte Ursache haben. Die wirkungsökonomische Frage lautet: Welche Ursache wirkt heute, welche Schäden entstehen, wenn wir sie ignorieren, und welche Maßnahmen reduzieren die negative Wirkung für Mensch, Planet und Demokratie? Der entscheidende Unterschied ist der Nachweis des Treibers. In der Erdgeschichte gab es Vulkane, Sonnenzyklen, Umlaufbahnen und andere Faktoren. Heute sehen wir aber ein Muster, das sehr gut zu zusätzlichen Treibhausgasen passt: steigende Konzentrationen, veränderter Strahlungshaushalt, Erwärmung von Ozeanen und Atmosphäre, schmelzendes Eis und zunehmende Extremrisiken. Wer nur sagt, Klima habe sich immer verändert, springt an der entscheidenden Stelle aus der Analyse heraus. Wirkungsökonomisch zählt nicht die Beruhigung durch einen historischen Allgemeinsatz, sondern die Zustandsveränderung, die heute entsteht: Gesundheit, Infrastruktur, Landwirtschaft, Wasser, Versicherbarkeit, öffentliche Haushalte und demokratische Stabilität. Die bessere Debatte fragt deshalb: Was ist die Ursache im aktuellen System, welche Schäden entstehen bei weiterer Verzögerung, und welche Maßnahmen senken die Risiken mit der besten Netto-Wirkung?"
    effect_path:
      - label: "Aussage"
        description: "Klima hat sich schon immer verändert."
      - label: "Wirkstoff"
        description: "Historischer Allgemeinsatz als Verantwortungsverschiebung."
      - label: "Resonanz"
        description: "Entlastung, Verharmlosung, Zweifel."
      - label: "Wirkungspotenzial"
        description: "Die heutige Ursache wird unscharf."
      - label: "Wirkungsrisiko"
        description: "Emissionsminderung und Anpassung verlieren Dringlichkeit."
      - label: "Folge falschen Handelns"
        description: "Klimarisiken, Kosten und Anpassungsdruck steigen."
    woek_solution:
      - "CO₂- und Methanwirkung in Produkt-, Energie- und Lieferkettenscorecards erfassen."
      - "Fossile Wirkung in Preisen und Steuern abbilden."
      - "Klimafolgekosten in T-SROI und öffentliche Investitionsentscheidungen integrieren."
      - "Anpassung als Wirkungsinvestition bewerten, nicht als Reparaturkosten."
