      ten_seconds: "Batterien sind nicht „nicht recyclebar“. Entscheidend sind Chemie, Rücknahme, Verfahren, Rückgewinnungsquote und sauberer Prozessstrom."
      thirty_seconds: "Der wahre Kern ist: Recycling braucht Standards, Rücknahme und Skalierung. Der Denkfehler ist, daraus Nicht-Recyclebarkeit zu machen. EU-Batterierecht, Batteriepass, Rezyklatvorgaben und industrielle Recyclingkapazitäten verschieben die Frage: Welche Chemie, welches Design, welches Verfahren, welche Rückgewinnungsquote und welche Nutzung vor dem Recycling sind gemeint? Die sinnvolle Frage lautet also nicht ja oder nein, sondern: Welche Batteriechemie, welches Sammelsystem, welches Verfahren, welche Rückgewinnungsquote, welcher Rezyklatanteil und welche Designstandards sind gemeint? Aus einer schwierigen Skalierung folgt keine grundsätzliche Unmöglichkeit."
      two_minutes: "Ich ordne das ein. Batterien sind kein wirkungsfreies Produkt: Rohstoffe, Herstellung, Nutzung, Sicherheit und Recycling müssen geprüft werden. Aber der Satz „nicht recyclebar“ ist zu pauschal und oft veraltet. Moderne Recyclingverfahren gewinnen wertvolle Metalle zurück; EU-Regeln setzen Mindestziele für Rückgewinnung, Rezyklatanteile, CO₂-Fußabdruck, Sorgfaltspflichten und Batteriepass. LFP-Batterien verändern außerdem die Rohstoffdebatte, weil sie in der Kathode ohne Kobalt und Nickel auskommen, auch wenn Lithium, Graphit, Energie und gute Lieferketten weiter relevant bleiben. Wirkungsökonomisch lautet die richtige Frage nicht: Akku gut oder böse? Sondern: Welche Batterie wird wie gebaut, wie lange genutzt, wie geladen, wie sicher betrieben, wie demontiert, wie hochwertig recycelt und wie transparent dokumentiert? Der Satz klingt endgültig, aber Batterierecycling ist kein statischer Zustand. Es hängt von Chemie, Bauform, Rücknahme, Sortierung, Prozess, Energiequelle, Regulierung und Marktgröße ab. Es gibt Materialien, die technisch leichter zurückgewonnen werden, andere sind schwieriger oder wirtschaftlich weniger attraktiv. Daraus folgt aber nicht, dass Batterien grundsätzlich nicht recyclebar sind. Wirkungsökonomisch wäre die falsche Reaktion, Rohstoffprobleme als Totschlagargument gegen jede Elektrifizierung zu nutzen. Die richtige Reaktion ist eine Kreislaufstrategie: kleinere und langlebigere Batterien, besseres Design, Reparierbarkeit, Second-Life-Nutzung, verpflichtende Rücknahme, transparente Materialdaten, hohe Recyclingstandards, Lithiumrückgewinnung, LFP-spezifische Verfahren und saubere Energie im Prozess. Gleichzeitig bleiben soziale und ökologische Lieferkettenfragen relevant. Nichtkompensation heißt: Gute Klimawerte dürfen schlechte Arbeitsbedingungen oder Rohstoffschäden nicht verdecken. Genau darum braucht es Produktdaten statt Pauschalsätze."
    effect_path:
