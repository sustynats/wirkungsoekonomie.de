      judgement: "Einseitiger Verlustframe."
      true_core: "Transformation verändert Industrie, Kosten und Arbeitsmärkte."
      problem: "Klimaschutz wird pauschal als Wohlstandsfeind gerahmt."
      narrative: "Statusverlust / Angstframe / Verzögerung."
      risk: "Zukunftsinvestitionen werden blockiert, alte Abhängigkeiten bleiben bestehen."
      host_answer: "Die Frage ist nicht Industrie oder Klimaschutz. Die Frage ist: Welche Industrie ist in einer klimaneutralen Welt zukunftsfähig?"
    answers:
      ten_seconds: "Die Frage ist nicht Industrie oder Klimaschutz. Die Frage ist: Welche Industrie ist in einer klimaneutralen Welt zukunftsfähig?"
      thirty_seconds: "Der wahre Kern ist: Transformation verändert Arbeitsplätze und Kosten. Der Denkfehler ist, Klimaschutz pauschal als Deindustrialisierung zu framen. Fossile Abhängigkeit ist selbst ein Standort- und Kostenrisiko. Wirkungsökonomisch brauchen wir Industriepolitik nach Zukunftswirkung. Dazu gehört auch: Nicht-Transformation ist keine kostenlose Stabilität. CO₂-Kosten, Importabhängigkeit, fossile Preisschocks und veraltete Anlagen können selbst Wettbewerbsfähigkeit zerstören. Die strategische Frage lautet: Welche Investitionen sichern Zukunftsmärkte?"
      two_minutes: "Ich ordne das ein. Natürlich kann schlecht gemachte Transformation Industrie belasten. Aber Nicht-Transformation ist auch keine neutrale Option: fossile Abhängigkeit, CO₂-Kosten, Importabhängigkeit, alte Anlagen und verpasste Innovation können ebenfalls deindustrialisieren. Die WÖk-Frage lautet: Welche Investitionen erhalten Wertschöpfung, gute Arbeit, Versorgungssicherheit und Klimastabilität zugleich? Dazu gehören Netze, günstiger sauberer Strom, Kreislaufwirtschaft, grüne Grundstoffe, Qualifizierung und faire Übergänge. Der Satz trifft einen echten Nerv, weil Industriepolitik über Arbeitsplätze, Regionen, Einkommen und Sicherheit entscheidet. Schlechte Transformation kann Schaden anrichten: zu hohe Kosten, unklare Regeln, langsame Netze, fehlende Fachkräfte, unsichere Förderung oder soziale Härten. Aber daraus folgt nicht, dass Klimaschutz der Gegner von Industrie ist. Eine klimaneutrale Welt verändert Märkte. Wer zu spät investiert, kann ebenso Wertschöpfung verlieren: durch CO₂-Preise, fossile Importabhängigkeit, veraltete Anlagen, technologische Rückstände oder verlorene Exportchancen. Wirkungsökonomisch fragen wir deshalb nach Zukunftswirkung: Welche Industriepfade sichern gute Arbeit, regionale Stabilität, Versorgungssicherheit, Ressourcenproduktivität und Klimastabilität zugleich? Dafür braucht es günstigen sauberen Strom, Netze, Speicher, grüne Grundstoffe, Kreislaufwirtschaft, Qualifizierung und faire Übergänge. Die Alternative ist nicht alter Wohlstand ohne Risiko, sondern ein anderer Risikomix."
    effect_path:
