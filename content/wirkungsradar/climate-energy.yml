      host_answer: "Batterien haben Wirkung - aber der Vergleich muss über den gesamten Lebenszyklus gehen."
    answers:
      ten_seconds: "Batterien haben Wirkung. Aber der Vergleich muss über den gesamten Lebenszyklus gehen - nicht nur über die Herstellung."
      thirty_seconds: "Der wahre Kern ist: Batterieproduktion ist ressourcenintensiv. Der Denkfehler ist: Verbrenneremissionen während der Nutzung auszublenden. Wirkungsökonomisch zählen Produktion, Energiequelle, Nutzung, Recycling, Fahrzeuggröße und Lieferkette zusammen. Fair wird der Vergleich erst, wenn beide Seiten vollständig gerechnet werden: Herstellung, Batterie, Strommix, Nutzung, Wartung, Lebensdauer, Recycling, Fahrzeuggröße und die fossilen Emissionen des Verbrenners. Sonst vergleicht man einen sichtbaren Batterieeffekt mit unsichtbar gemachten Auspuffemissionen."
      two_minutes: "Ich ordne das kurz ein. Ein E-Auto ist nicht automatisch perfekt. Batterie, Rohstoffe, Arbeitsbedingungen und Recycling müssen bewertet werden. Aber ein Verbrenner emittiert während seiner gesamten Nutzung fossiles CO₂ und Luftschadstoffe. Deshalb braucht es einen Lebenszyklusvergleich. Die WÖk-Lösung wäre eine Produktscorecard: CO₂, Ressourcen, Arbeit, Gesundheit, Recycling und Energiequelle. Dann gewinnt nicht das ideologische Lager, sondern die Mobilitätslösung mit der besten Netto-Wirkung. Der Satz funktioniert, weil er ein reales Problem anspricht: Batterien brauchen Rohstoffe, Energie und gute Lieferkettenkontrolle. Das muss in jede seriöse Bewertung hinein. Irreführend wird es, wenn nur dieser Teil gezeigt wird und der Verbrenner so behandelt wird, als sei nach der Herstellung kaum noch Wirkung vorhanden. Tatsächlich entstehen beim Verbrenner über die Nutzung fortlaufend fossile CO₂-Emissionen und Luftschadstoffe. Beim E-Auto verlagert sich ein größerer Teil der Wirkung in Herstellung, Batterie und Stromerzeugung - und genau deshalb verbessern Strommix, Batteriedesign, Recycling, Fahrzeuggröße und Nutzungsdauer die Bilanz. Wirkungsökonomisch ist die Lösung keine Werbung für jedes einzelne E-Auto. Ein schweres Fahrzeug mit schlechter Nutzung bleibt problematisch. Die Lösung ist eine Mobilitätsscorecard: CO₂, Ressourcen, Gesundheit, Arbeit, Lieferketten, Recycling und tatsächlicher Mobilitätsbedarf. Dann gewinnt nicht das Lager, sondern die bessere Netto-Wirkung."
