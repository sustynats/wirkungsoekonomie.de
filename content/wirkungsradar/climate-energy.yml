  - title: "„Klimaschutz deindustrialisiert Deutschland“"
    slug: "klimaschutz-deindustrialisiert-deutschland"
    shortJudgement: "Einseitiger Verlustframe."
    narrativeFamilies:
      - "Angstframe"
      - "Scheiternsframe"
