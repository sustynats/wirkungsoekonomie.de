glossary_hover:
  wirkung:
    label: "Wirkung"
    hover: "Tatsaechliche Veraenderung von Zustaenden. Wirkung kann positiv, negativ oder neutral sein."
  wirkungspotenzial:
    label: "Wirkungspotenzial"
    hover: "Moeglichkeit, dass Wirkung eintreten kann. Noch keine eingetretene Wirkung."
  wirkstoff:
    label: "Wirkstoff"
    hover: "Didaktische Analogie fuer einen Ausloeser mit Wirkungspotenzial, etwa Aussage, Narrativ, Gesetz, Preis, Produkt oder Algorithmus."
  wirkungsrisiko:
    label: "Wirkungsrisiko"
    hover: "Moeglichkeit negativer oder destabilisierender Wirkung. Noch kein eingetretener Schaden."
  wirkmechanismus:
    label: "Wirkmechanismus"
    hover: "Erklaerung, wie eine Wirkung entstehen kann."
  wirkungspfad:
    label: "Wirkungspfad"
    hover: "Plausibler Weg von Ausloeser ueber Mechanismus zu moeglicher oder tatsaechlicher Wirkung."
  resonanzraum:
    label: "Resonanzraum"
    hover: "Sozialer, medialer oder emotionaler Raum, in dem Sprache, Bilder, Narrative oder Ereignisse Anschluss finden."
  sdg_plus:
    label: "SDG+"
    hover: "WOek-Erweiterung der SDGs um Demokratie, Medienqualitaet, Rechtsstaatlichkeit, Diskursfaehigkeit, institutionelles Vertrauen und digitale Selbstbestimmung."
  positive_netto_wirkung:
    label: "Positive Netto-Wirkung"
    hover: "Zielgroesse der WOek: systemisch tragfaehige Wirkung fuer Mensch, Planet und Demokratie unter Beruecksichtigung negativer Wirkungen und roter Linien."
  reverse_merit_order:
    label: "Reverse Merit Order"
    hover: "Das schwaechste zentrale Wirkungsfeld begrenzt die Gesamtbewertung. Schwere negative Wirkung darf nicht durch positive Werte an anderer Stelle verdeckt werden."
  wirkungslenkung:
    label: "Wirkungslenkung"
    hover: "Rueckfuehrung bewerteter Wirkung in Anreize, Preise, Steuern, Kapital, Foerderung, Beschaffung oder Entscheidungen."
  wirkungsblindheit:
    label: "Wirkungsblindheit"
