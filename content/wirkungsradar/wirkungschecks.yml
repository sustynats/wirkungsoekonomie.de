        - "institutionelles Vertrauen"
        - "Schutz vor Manipulation"
    answers:
      ten_seconds: "Das ist ein Ohnmachtsnarrativ. Der Zahlenkern kann stimmen, aber die Schlussfolgerung ist falsch: Wirkung entsteht nicht nur durch Groesse, sondern durch Hebel."
      thirty_seconds: "Ja, Deutschland ist nicht der groesste Emittent. Aber daraus folgt nicht, dass Handeln wirkungslos ist. Wir wirken ueber Technologie, Maerkte, Standards, Lieferketten, EU-Politik und Investitionen."
      two_minutes: "Der Satz vermischt einen Zahlenkern mit einer falschen politischen Folgerung. Klimawirkung entsteht nicht nur proportional zum nationalen Anteil, sondern auch ueber Hebelwirkung."
