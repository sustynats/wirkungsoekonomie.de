    hero:
      eyebrow: "Wirkungsradar Live"
      title: "'SDGs / Agenda 2030 sind Weltregierung'"
      subtitle: "Verschwoerungsframe gegen globale Kooperation"
      abstract: "Die Aussage 'SDGs oder Agenda 2030 sind Weltregierung' deutet einen globalen Zielrahmen in ein Herrschaftsnarrativ um. Der wahre Kern ist: Die SDGs sind international vereinbarte Ziele, und globale Kooperation kann berechtigte Fragen nach demokratischer Kontrolle, Transparenz und nationaler Umsetzung ausloesen. Irrefuehrend wird die Aussage, wenn Kooperation mit Fremdherrschaft gleichgesetzt wird. Die wirkungsoekonomische Antwort lautet: Globale Ziele sind keine Weltregierung. Entscheidend ist demokratische, transparente und ueberpruefbare Umsetzung."
      confidence: "hoch"
    summary:
      judgement: "Irrefuehrend / Verschwoerungsframe."
      true_core: "Die SDGs sind ein internationaler Zielrahmen und brauchen demokratische Umsetzung."
      problem: "Kooperation wird als Herrschaft umgedeutet."
