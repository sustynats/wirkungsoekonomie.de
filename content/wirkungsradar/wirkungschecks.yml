    answers:
      ten_seconds: "Globale Ziele sind keine Weltregierung. Die SDGs sind ein Zielrahmen - entscheidend ist, wie demokratisch, transparent und ueberpruefbar sie umgesetzt werden."
      thirty_seconds: "Der wahre Kern ist: Die SDGs sind global vereinbarte Ziele, und globale Ziele muessen demokratisch kontrolliert werden. Der Denkfehler ist: Ein Zielrahmen ist keine Regierung. Die Agenda 2030 ersetzt keine Parlamente, keine Gerichte, keine Verfassungen und keine nationale Gesetzgebung. Entscheidend ist die konkrete Umsetzung: Wer beschliesst was, auf welcher Rechtsgrundlage, mit welcher Kontrolle, welchen Kosten und welchen Wirkungen fuer Mensch, Planet und Demokratie?"
      two_minutes: "Ich nehme die Sorge vor Fremdbestimmung ernst, weil internationale Politik oft abstrakt wirkt und viele Menschen nicht sehen, wo sie mitentscheiden koennen. Aber genau deshalb muss man sauber trennen. Die SDGs sind kein Parlament, keine Regierung und keine Behoerde. Sie sind ein Zielrahmen, den Staaten 2015 politisch vereinbart haben: Armut verringern, Bildung staerken, Gesundheit verbessern, Klima und Ressourcen schuetzen, Institutionen stabilisieren. Daraus entsteht nicht automatisch ein Gesetz in Deutschland. Verbindlich wird etwas erst, wenn demokratische Institutionen konkrete Massnahmen beschliessen: Bundestag, Landesparlamente, Kommunen, Verwaltungen, Gerichte und Oeffentlichkeit. Dort muss Kritik ansetzen. Man kann sehr wohl fragen: Ist eine Massnahme wirksam? Ist sie verhaeltnismaessig? Wer traegt Kosten, wer profitiert, wer kontrolliert Daten und Macht? Gibt es Nebenwirkungen fuer Freiheit, Eigentum, Beschaeftigung oder kommunale Selbstverwaltung? Das sind starke demokratische Fragen. Der problematische Frame beginnt dort, wo aus jedem gemeinsamen Ziel sofort geheime Herrschaft gemacht wird. Dann reden wir nicht mehr ueber Zustaendigkeiten, Evidenz und Wirkung, sondern ueber ein Feindbild. Die bessere Antwort ist: globale Kooperation anerkennen, konkrete Entscheidungen demokratisch pruefen und transparent machen, wo Verbindlichkeit entsteht. So bleibt die Debatte ueberpruefbar: Mandat, Verfahren, Kontrolle, Rueckholbarkeit und Wirkung statt Angst vor einem unsichtbaren Machtzentrum. Wer Demokratie schuetzen will, sollte nicht pauschal alles Internationale verdaechtigen, sondern zeigen lassen, welche konkrete Entscheidung wo getroffen wird und wie sie korrigiert werden kann. Diese Pruefung ist unbequemer als ein Schlagwort, aber sie ist politisch hilfreicher. Genau dafuer ergaenzt die Wirkungsoekonomie die SDGs um SDG+: Demokratie, Medienqualitaet, Rechtsstaatlichkeit, Diskursfaehigkeit, institutionelles Vertrauen und digitale Selbstbestimmung."
    links:
      page: "/wirkungsradar/live/sdgs-weltregierung/"
      detail: "/wirkungsradar/detail/sdgs-sind-weltregierung/"
