  - title: "SDGs / Agenda 2030 sind Weltregierung"
    slug: "sdgs-sind-weltregierung"
    status: "published"
    type: "detail"
    claim:
      original: "Die SDGs und die Agenda 2030 sind eine Weltregierung."
      claim_type:
        - "Verschwoerungsframe"
        - "falsche Schlussfolgerung"
        - "Kooperationsdelegitimierung"
    classification:
      short_judgement: "Falsche Schlussfolgerung aus einem realen internationalen Kooperationsrahmen."
      narrative_family:
        - "Herrschaftsnarrativ"
        - "Verschwoerungsframe"
      resonance_profile:
        - "Kontrollverlust"
        - "Misstrauen gegen Institutionen"
        - "Souveraenitaetsangst"
      manipulation_patterns:
        - "Kooperation als Zwang deuten"
        - "Zielrahmen mit Regierungsmacht verwechseln"
        - "selektive Evidenz"
    wirkung:
      wirkstoff: "Kooperationsrahmen als Bedrohungsimpuls"
      wirkungspotenzial:
        - "Misstrauen gegen demokratische und internationale Prozesse steigt"
        - "Nachhaltigkeitsdaten werden als Kontrollinstrument gerahmt"
      wirkungsrisiko:
        level: "hoch"
        description: "Wenn legitime Kritik durch pauschale Institutionenfeindlichkeit ersetzt wird."
      mechanism: "Aus gemeinsamen Zielen wird eine angebliche geheime Herrschaft abgeleitet."
      wirkungspfad:
        - "Aussage"
        - "Bedrohungsgefuehl"
        - "Institutionenmisstrauen"
        - "Ablehnung von Kooperation"
        - "geschwaechte Problemloesung"
    mpd:
      mensch: "weniger Vertrauen in Gesundheits-, Bildungs- und Armutsziele"
      planet: "Klimaschutz, Biodiversitaet und Ressourcenschutz werden diskursiv blockiert"
      demokratie: "Institutionenvertrauen und faktenbasierte Deliberation sinken"
    sdg:
      sdgs:
        - "SDG 16"
        - "SDG 17"
      sdg_plus:
        - "Diskursfaehigkeit"
        - "institutionelles Vertrauen"
        - "Schutz vor Manipulation"
    answers:
      ten_seconds: "Die SDGs sind keine Weltregierung. Sie sind ein Zielrahmen, den Staaten politisch vereinbart haben. Entscheiden muessen weiterhin demokratische Institutionen."
      thirty_seconds: "Der wahre Kern ist: Es gibt internationale Zusammenarbeit. Der Denkfehler ist: Zusammenarbeit ist nicht automatisch Herrschaft. Die Agenda 2030 setzt Ziele, ersetzt aber keine Parlamente."
      two_minutes: "Die SDGs sind ein globaler Referenzrahmen fuer Entwicklung, Umwelt und Institutionen. Man kann einzelne Ziele politisch kritisieren. Aber aus Kooperation eine geheime Weltregierung zu machen, verschiebt die Debatte weg von Wirkung, Evidenz und demokratischer Entscheidung."
    links:
      page: "/wirkungsradar/detail/sdgs-sind-weltregierung/"
