moves:
  - id: "gefuehl-fakt-folgerung-trennen"
    title: "Gefühl, Fakt und Folgerung trennen"
    useWhen: "Wenn eine Aussage emotional stark aufgeladen ist."
    howItWorks: "Das Gefühl wird anerkannt, der Fakt geprüft und die politische Folgerung separat bewertet."
    exampleSentence: "Ich verstehe die Sorge. Der Fakt ist aber ein anderer Punkt. Und die Schlussfolgerung daraus müssen wir sauber prüfen."
    dontDo:
      - "Gefühl lächerlich machen"
      - "nur mit Zahlen antworten"
      - "die Folgerung ungeprüft übernehmen"
  - id: "frame-markieren"
    title: "Frame markieren"
    useWhen: "Wenn eine Aussage eine falsche Voraussetzung setzt."
    howItWorks: "Der Deutungsrahmen wird sichtbar gemacht, bevor man inhaltlich antwortet."
    exampleSentence: "Ich beantworte das, aber ich übernehme nicht den Frame."
    dontDo:
      - "im Frame weiterdiskutieren"
      - "nur verneinen"
      - "den Kampfbegriff wiederholen"
  - id: "wahren-kern-anerkennen"
    title: "Wahren Kern anerkennen"
    useWhen: "Wenn eine Aussage einen echten Problemanteil enthält."
    howItWorks: "Der echte Punkt wird anerkannt, aber von der falschen Verallgemeinerung getrennt."
    exampleSentence: "Der reale Punkt ist: Es gibt Überforderung. Der Denkfehler ist: Daraus eine ganze Gruppe verantwortlich zu machen."
    dontDo:
      - "Problem wegreden"
      - "überheblich wirken"
      - "pauschal moralisieren"
  - id: "systemgrenze-oeffnen"
    title: "Systemgrenze öffnen"
    useWhen: "Bei Teilfakten, verkürzten Bilanzen und falschen Lebenszyklusvergleichen."
    howItWorks: "Die Debatte wird vom isolierten Einzelpunkt auf Lebenszyklus, Bilanzgrenze und Alternativenvergleich erweitert."
    exampleSentence: "Das ist ein echter Teilaspekt. Aber für das Gesamturteil brauchen wir den Lebenszyklus und den Vergleich mit Alternativen."
    dontDo:
      - "Teilaspekt kleinreden"
      - "Durchschnittswerte ohne Kontext nutzen"
      - "Alternativen ausblenden"
  - id: "beweislast-zurueckgeben"
    title: "Beweislast zurückgeben"
    useWhen: "Bei unbelegten Unterstellungen, Verschwörungsframes oder Social-Credit-Vorwürfen."
    howItWorks: "Starke Behauptungen müssen zuerst belegt werden."
    exampleSentence: "Welche konkrete Quelle belegt diese Behauptung?"
    dontDo:
      - "unbelegte Behauptung wie bewiesen behandeln"
      - "endlos Gegenbeweise liefern"
      - "in Verdachtslogik einsteigen"
  - id: "engpass-statt-totalurteil"
    title: "Engpass statt Totalurteil"
    useWhen: "Bei Scheiternsframes."
    howItWorks: "Probleme werden nicht geleugnet, sondern als lösbare Engpässe analysiert."
    exampleSentence: "Probleme sind nicht automatisch Scheitern. Welcher Engpass begrenzt gerade die Wirkung?"
    dontDo:
      - "alles schönreden"
      - "Totalurteil spiegeln"
      - "Komplexität vermeiden"
  - id: "wirkungsfrage-stellen"
    title: "Wirkungsfrage stellen"
    useWhen: "Immer dann, wenn ein Gespräch in Schuld, Lagerkampf oder Ohnmacht kippt."
    howItWorks: "Die Debatte wird von Identität und Schuld auf messbare Verbesserung zurückgeführt."
    exampleSentence: "Welche Maßnahme verbessert den Zustand messbar - ohne Nebenfolgen zu verdrängen?"
    dontDo:
      - "nur moralisch argumentieren"
      - "keine Lösung anbieten"
      - "Menschen beschämen"
  - id: "wertebruecke-bauen"
    title: "Wertebrücke bauen"
    useWhen: "Wenn Fakten als Angriff auf Identität, Freiheit oder Lebensweise erlebt werden."
    howItWorks: "Ein geteilter Wert wird sichtbar gemacht, bevor der Denkfehler erklärt wird."
    exampleSentence: "Freiheit ist wichtig. Genau deshalb müssen Preise, Regeln und Schäden ehrlich sein."
    dontDo:
      - "Wert des Gegenübers lächerlich machen"
      - "Sorge pathologisieren"
      - "nur technokratisch antworten"
  - id: "nicht-amplifizieren"
    title: "Nicht amplifizieren"
    useWhen: "Bei provokativen Kampfbegriffen und Triggerwörtern."
    howItWorks: "Der Trigger wird nicht unnötig wiederholt; stattdessen wird der Mechanismus benannt."
    exampleSentence: "Das ist ein Bedrohungsframe. Die sachliche Frage ist: Welche konkrete Aufgabe lösen wir?"
    dontDo:
      - "Trigger in Überschriften setzen"
      - "Kampfbegriff mehrfach wiederholen"
      - "Empörung als Hauptreaktion nutzen"
