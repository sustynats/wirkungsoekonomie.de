patterns:
  - id: "falsche-voraussetzung"
    title: "Falsche Voraussetzung"
    definition: "Eine Frage oder Aussage enthält bereits eine unbelegte Annahme."
    example: "Warum wollt ihr uns alles verbieten?"
    risk: "Wer antwortet, übernimmt unbewusst den Verbotsframe."
    counterMove: "Voraussetzung prüfen, bevor man antwortet."
    hostSentence: "Ich beantworte das, aber zuerst prüfe ich die Voraussetzung: Wer verbietet was genau?"
  - id: "beweislastumkehr"
    title: "Beweislastumkehr"
    definition: "Eine unbelegte Behauptung wird aufgestellt, und die Gegenseite soll beweisen, dass sie falsch ist."
    example: "Beweis doch, dass die SDGs keine Weltregierung sind."
    risk: "Unbelegte Verdachtslogik wird zur Gesprächsgrundlage."
    counterMove: "Belege für die Ausgangsbehauptung verlangen."
    hostSentence: "Wer eine starke Behauptung aufstellt, muss sie zuerst belegen."
  - id: "gish-gallop"
    title: "Gish Gallop"
    definition: "Viele Behauptungen werden schnell hintereinander aufgestellt, sodass eine saubere Prüfung kaum möglich ist."
    example: "Klima, Migration, Medien, Gender, EU - alles hängt zusammen und ist gesteuert."
    risk: "Überforderung ersetzt Klärung."
    counterMove: "Auf einen prüfbaren Punkt begrenzen."
    hostSentence: "Ich nehme einen Punkt nach dem anderen. Welche Behauptung soll zuerst geprüft werden?"
  - id: "moving-goalposts"
    title: "Moving Goalposts"
    definition: "Sobald ein Punkt geklärt ist, wird der Maßstab verschoben."
    example: "Okay, aber was ist mit China? Okay, aber was ist mit Batterien?"
    risk: "Klärung wird endlos verschoben."
    counterMove: "Kriterium vorab festlegen."
    hostSentence: "Was wäre für dich eine geklärte Antwort auf genau diese Frage?"
  - id: "frame-uebernahme"
    title: "Frame-Übernahme"
    definition: "Man argumentiert innerhalb des gegnerischen Deutungsrahmens und verstärkt ihn dadurch."
    example: "Wir leben nicht in einer Klimadiktatur."
    risk: "Der problematische Begriff bleibt hängen."
    counterMove: "Frame markieren und ersetzen."
    hostSentence: "Ich übernehme den Diktaturframe nicht. Die sachliche Frage ist demokratische Kontrolle und soziale Fairness."
  - id: "opferinszenierung"
    title: "Opferinszenierung"
    definition: "Kritik wird als Unterdrückung oder Verfolgung der sprechenden Person dargestellt."
    example: "Man darf ja nichts mehr sagen."
    risk: "Die Wirkung der Aussage verschwindet hinter dem Opfergefühl."
    counterMove: "Meinungsfreiheit und Widerspruchsfreiheit trennen."
    hostSentence: "Du darfst das sagen. Andere dürfen widersprechen. Widerspruch ist keine Zensur."
  - id: "suedenbocklogik"
    title: "Sündenbocklogik"
    definition: "Komplexe Probleme werden auf eine Gruppe reduziert."
    example: "Migration ist schuld an Wohnungsnot, Kriminalität und Sozialkosten."
    risk: "Feindbilder ersetzen Ursachenanalyse."
    counterMove: "Problem anerkennen, Gruppenschuld trennen."
    hostSentence: "Das Problem ist real. Aber eine ganze Gruppe zur Ursache zu machen, verhindert Lösungen."
  - id: "quellenzerstoerung"
    title: "Quellenzerstörung"
    definition: "Alle etablierten Korrekturinstanzen werden pauschal delegitimiert."
    example: "Medien lügen alle. Wissenschaft ist gekauft."
    risk: "Gemeinsame Faktenbasis zerfällt."
    counterMove: "Konkrete Quelle, konkrete Aussage, konkrete Belege prüfen."
    hostSentence: "Medienkritik ja. Pauschale Quellenzerstörung nein."
  - id: "falsches-dilemma"
    title: "Falsches Dilemma"
    definition: "Es werden nur zwei extreme Optionen dargestellt, obwohl es Zwischenlösungen gibt."
    example: "Entweder Freiheit oder Klimaschutz."
    risk: "Kompromiss- und Gestaltungsräume verschwinden."
    counterMove: "Dritte Optionen sichtbar machen."
    hostSentence: "Die Frage ist nicht Freiheit oder Klimaschutz, sondern welche Klimapolitik Freiheit, Gesundheit und Zukunft schützt."
  - id: "teilfakt-als-totalurteil"
    title: "Teilfakt als Totalurteil"
    definition: "Ein echter Einzelaspekt wird zum Gesamturteil über ein ganzes System gemacht."
    example: "Batterien brauchen Rohstoffe, also sind E-Autos schlimmer."
    risk: "Lebenszyklus und Alternativenvergleich verschwinden."
    counterMove: "Systemgrenze öffnen."
    hostSentence: "Der Punkt ist real. Aber er ist ein Teil des Lebenszyklus, nicht das Gesamturteil."
  - id: "emotion-vor-klaerung"
    title: "Emotion vor Klärung"
    definition: "Eine Aussage ist so formuliert, dass Empörung oder Abwehr schneller kommt als Analyse."
    example: "Die wollen unsere Kinder umerziehen."
    risk: "Die Debatte springt sofort in Schutz- und Kampfmodus."
    counterMove: "Emotion anerkennen, Sachfrage präzisieren."
    hostSentence: "Ich sehe, dass das emotional ist. Was genau ist die konkrete Maßnahme, über die wir sprechen?"
  - id: "heilsversprechen"
    title: "Heilsversprechen"
    definition: "Eine einfache, perfekte Lösung wird versprochen, die komplexe Nebenfolgen ausblendet."
    example: "Fusion löst das Energieproblem. Kernkraft wäre die einfache Lösung."
    risk: "Heute verfügbare Maßnahmen verlieren Dringlichkeit."
    counterMove: "Zeithorizont, Skalierung und Opportunitätskosten prüfen."
    hostSentence: "Forschung ja. Aber was wirkt rechtzeitig und skalierbar?"
